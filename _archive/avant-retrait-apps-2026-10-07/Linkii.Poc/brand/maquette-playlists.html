<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maquette playlists</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --nuit: #0B1F3A; --acier: #5A6B80; --brume: #DDE3EA; --fond: #F5F7FA;
    --blanc: #FFFFFF; --signal: #3B82C4; --bord2: #C5CED9;
    --ok-dot: #1E8E5A; --ok-bg: #E1F0E8; --ok-tx: #155A38;
    --maj-dot: #B7791F; --maj-bg: #FBF0DC; --maj-tx: #7A4F12;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 15px; color: var(--nuit); background: var(--fond); }
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

  /* Barre latérale */
  .sidebar { background: var(--blanc); border-right: 1px solid var(--brume); padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; }
  .logo { padding: 4px 10px 24px; }
  .wm { display: inline-flex; align-items: baseline; font-size: 26px; font-weight: 500; letter-spacing: -.03em; line-height: 1; }
  .wm .i { display: inline-block; width: .095em; height: .5em; background: currentColor; margin-left: .07em; position: relative; }
  .wm .i + .i { margin-left: .1em; }
  .wm .i::before { content: ""; position: absolute; left: 0; top: -.2em; width: .095em; height: .095em; background: currentColor; }
  .wm .i.s::before { background: var(--signal); }
  .nav { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 4px; color: var(--acier); text-decoration: none; }
  .nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .nav.active { color: var(--nuit); background: #EAF2FA; font-weight: 500; box-shadow: inset 2px 0 0 var(--signal); border-radius: 0 4px 4px 0; }
  .nav.active svg { color: var(--signal); }
  .spacer { flex: 1; }
  .sep { height: 1px; background: var(--brume); margin: 8px 10px; }

  /* Contenu */
  main { padding: 36px 44px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  .eyebrow { font-size: 13px; color: var(--acier); margin-bottom: 4px; }
  h1 { font-size: 28px; font-weight: 500; }
  .btn { font: inherit; font-weight: 500; border-radius: 4px; padding: 11px 18px; border: 1px solid var(--nuit); background: var(--nuit); color: var(--blanc); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; }
  .tools { display: flex; gap: 8px; margin-bottom: 20px; font-size: 13px; color: var(--acier); align-items: center; }
  .tools select { font: inherit; color: var(--nuit); border: 1px solid var(--brume); background: var(--blanc); border-radius: 4px; padding: 6px 10px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
  .card { background: var(--blanc); border: 1px solid var(--brume); border-radius: 4px; overflow: hidden; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: border-color .15s; }
  .card:hover { border-color: var(--signal); }
  .cover { aspect-ratio: 16 / 9; position: relative; background: var(--nuit); display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 2px; overflow: hidden; }
  .cover img { width: 100%; height: 100%; min-height: 0; object-fit: cover; display: block; }
  .cover.single img { position: absolute; inset: 0; }
  .cover img:first-child { grid-row: span 2; }
  .cover.single { display: block; }
  .count { position: absolute; left: 10px; top: 10px; font-family: "JetBrains Mono", monospace; font-size: 12px; background: rgba(11,31,58,.85); color: var(--blanc); padding: 3px 8px; border-radius: 4px; }
  .app-tile { display: grid; place-items: center; background: #23395A; color: var(--blanc); }
  .app-tile svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 1.5; }
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; }
  .name { font-size: 20px; font-weight: 500; }
  .meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--acier); }
  .meta .mono { font-family: "JetBrains Mono", monospace; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 4px; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: var(--ok-bg); color: var(--ok-tx); }
  .pill.ok::before { background: var(--ok-dot); }
  .pill.draft { background: var(--maj-bg); color: var(--maj-tx); }
  .pill.draft::before { background: var(--maj-dot); }

  .add { border: 1px dashed var(--bord2); background: transparent; align-items: center; justify-content: center; gap: 14px; min-height: 260px; color: var(--acier); }
  .add:hover { border-color: var(--signal); color: var(--nuit); background: var(--blanc); }
  .plus { width: 72px; height: 72px; border-radius: 4px; border: 1px solid var(--brume); background: var(--blanc); display: grid; place-items: center; color: var(--nuit); }
  .plus svg { width: 32px; height: 32px; stroke: currentColor; stroke-width: 1.5; fill: none; }
  .add:hover .plus { border-color: var(--signal); color: var(--signal); }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    main { padding: 24px 16px; }
    .head { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
