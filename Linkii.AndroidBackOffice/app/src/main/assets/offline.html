<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkivi</title>
<style>
  html,body{margin:0;height:100%;background:#F5F7FA;color:#0B1F3A;font-family:"IBM Plex Sans","Segoe UI",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;box-sizing:border-box}
  .wm{display:inline-flex;align-items:baseline;line-height:1;font-size:34px;font-weight:500;letter-spacing:-.03em}
  .wm .i{display:inline-block;width:.095em;height:.5em;background:currentColor;margin-left:.07em;position:relative}
  .wm .i+.i{margin-left:.1em}
  .wm .i::before{content:"";position:absolute;left:0;top:-.2em;width:.095em;height:.095em;background:currentColor}
  .wm .i.s::before{background:#CC8400}
  p{margin:0;font-size:16px;color:#5A6B80;max-width:320px}
  button{font:inherit;font-size:16px;border-radius:4px;padding:12px 22px;min-width:220px;cursor:pointer}
  .pri{background:#0B1F3A;color:#fff;border:0}
  .sec{background:transparent;color:#3B82C4;border:1px solid #C5CED9}
  small{color:#5A6B80;word-break:break-all}
</style>
</head>
<body>
  <div class="wm" aria-label="Linkivi">link<span class="i"></span>v<span class="i s"></span></div>
  <p>Connexion au serveur impossible. Vérifiez votre réseau.</p>
  <button class="pri" onclick="LinkiiAdmin.retry()">Réessayer</button>
  <button class="sec" onclick="LinkiiAdmin.changeServer()">Changer de serveur</button>
  <small id="u"></small>
  <script>document.getElementById('u').textContent = LinkiiAdmin.serverUrl();</script>
</body>
</html>
