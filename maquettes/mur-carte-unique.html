<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Mur en une seule carte</title>
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--row:#EDF1F5;--brand:#0B1F3A;--brand-tint:#EBEDF0;--signal:#3B82C4;--ok:#1E8E5A;--ok-bg:#E1F0E8;--ok-ink:#155A38;--warn:#B7791F;--warn-bg:#FBF0DC;--warn-ink:#7A4F12;--danger:#C8372D;--danger-bg:#FBE4E2;--danger-ink:#8A231C;--radius:4px;--card-radius:10px;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3,p{margin:0;font-weight:500}p{font-weight:400}b{font-weight:500}button,select{font:inherit;color:inherit}
.mock{background:#fff;border-bottom:1px dashed var(--line-2);padding:10px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.mock span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 4px 0 12px}
.mock span:first-child{margin-left:0}
.mock button{border:1px solid var(--line-2);background:#fff;padding:4px 11px;border-radius:var(--radius);cursor:pointer;font-size:14px}
.mock button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.shell{display:flex;min-height:calc(100vh - 51px)}
.sidebar{width:230px;background:#fff;border-right:1px solid var(--line);padding:24px 14px;flex:none}
.sidebar .wm{font-size:30px;font-weight:500;letter-spacing:-.03em;padding:0 12px 26px}
.nav{display:flex;gap:12px;align-items:center;padding:10px 12px;color:var(--muted);font-size:16px}
.nav.active{background:var(--brand-tint);color:var(--ink);font-weight:500;box-shadow:inset 3px 0 0 var(--brand);border-radius:0 4px 4px 0}
.nav svg{width:20px;height:20px}
.sidebar hr{border:0;border-top:1px solid var(--line);margin:10px 12px}
main{flex:1;padding:36px 44px 60px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:32px;line-height:1.2}.sub{color:var(--muted);margin-top:6px;font-size:16px}
.btn{font-weight:500;cursor:pointer;border:1px solid var(--brand);border-radius:var(--radius);padding:10px 18px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}
.btn.sm{padding:5px 11px;font-size:13px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.dd{border:1px solid var(--line-2);background:#fff;border-radius:var(--radius);padding:9px 14px;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.dd .k{color:var(--muted)}.dd.act{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dd small{font-family:var(--mono);font-size:11px;background:var(--row);padding:0 5px;border-radius:3px;color:var(--muted)}
.search{flex:1;min-width:200px;border:1px solid var(--line-2);background:#fff;border-radius:var(--radius);padding:9px 14px;color:#8a97a8}
.chk{width:18px;height:18px;accent-color:var(--brand);margin:0;flex:none;cursor:pointer}
.annot{background:#FFF8E1;border:1px dashed #E0B84A;border-radius:var(--radius);padding:9px 13px;font-size:13.5px;color:#6B5200;margin-bottom:18px;max-width:1100px}
.annot ul{margin:4px 0 0;padding-left:18px}

/* ---- grille ---- */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;align-items:start}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);display:flex;flex-direction:column;align-self:stretch}
.card:hover{border-color:var(--signal)}
.head{padding:14px 16px 4px}
.title{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}.dot.off{background:var(--danger)}
.name{font-size:18px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kebab{width:28px;height:28px;border:0;background:none;border-radius:4px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.kebab:hover{background:var(--row)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:var(--radius);font-size:12px;font-weight:500;white-space:nowrap}
.badge.ok{color:var(--ok-ink);background:var(--ok-bg)}.badge.ok::before,.badge.ko::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ko{color:var(--danger-ink);background:var(--danger-bg)}.badge.warn{color:var(--warn-ink);background:var(--warn-bg)}
.badge.sync{color:#1F5C93;background:#E4EEF8}
.visual{display:flex;flex-direction:column;align-items:center;padding:14px 16px 18px}
.mon{width:78%;aspect-ratio:16/9;border:4px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--ink)}
.stand{width:34%;height:14px;position:relative}
.stand::before{content:"";position:absolute;left:50%;top:0;width:4px;height:9px;margin-left:-2px;background:var(--line-2)}
.stand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;background:var(--line-2)}
.foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:14px;min-height:50px}
.lbl{color:var(--muted);font-size:13px;flex:none}
.sel{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:var(--radius);padding:8px 10px;background:#fff;font-weight:500}
.add{border:1px dashed var(--line-2);background:transparent;display:grid;place-items:center;align-content:center;gap:14px;color:var(--muted);min-height:300px;cursor:pointer}
.add i{width:64px;height:64px;border:1px solid var(--line);background:#fff;border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:30px;color:var(--ink)}

/* images de démonstration */
.sky{background:linear-gradient(180deg,#9DB4CF 0%,#C9D6E3 45%,#E7ECF1 62%,#7E8F6A 63%,#5F7350 100%)}
.cafe{background:linear-gradient(135deg,#7A4F2B,#D7A86E)}
.affiche{background:linear-gradient(135deg,#3B82C4,#0B1F3A)}

/* ---- carte « mur » ---- */
.card.wall{
  border-color:#B9CDE3;
  /* effet « pile de cartes » : on comprend qu'elle en contient plusieurs */
  box-shadow:5px 5px 0 -1px #fff,5px 5px 0 0 #B9CDE3,10px 10px 0 -1px #fff,10px 10px 0 0 #D6E2EF;
  margin:0 10px 10px 0;
}
.card.wall:hover{border-color:var(--signal)}
.wall .name{display:flex;align-items:center;gap:8px}
.wall-ico{width:22px;height:22px;flex:none;color:var(--signal)}
.wall .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 0 28px;font-size:13px;color:var(--muted)}
.wv{padding:16px 24px 6px;display:flex;flex-direction:column;align-items:center}
.wframe{display:grid;gap:3px;background:var(--ink);padding:3px;border-radius:6px;box-shadow:0 6px 14px -8px rgba(11,31,58,.45)}
.tile{position:relative;aspect-ratio:16/9;border:0;padding:0;cursor:pointer;border-radius:2px;background-repeat:no-repeat;outline:0}
.tile .n{position:absolute;top:5px;left:5px;min-width:20px;height:20px;padding:0 5px;border-radius:3px;background:rgba(11,31,58,.78);color:#fff;font:500 12px/20px var(--mono);text-align:center}
.tile .n::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#5BD08F;margin-left:5px;vertical-align:1px}
.tile.off{filter:grayscale(1) brightness(.55)}
.tile.off .n::after{background:#FF7A70}
.tile.off .offlbl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:500;filter:none}
.tile:hover,.tile.hl{box-shadow:inset 0 0 0 3px #FFD166}
.stands{display:flex;justify-content:space-around;width:100%}
.stands .stand{width:22%}
.members{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 14px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px 3px 4px;font-size:13.5px;cursor:pointer}
.chip .n{font:500 11px/18px var(--mono);min-width:18px;height:18px;border-radius:50%;background:var(--row);text-align:center;color:var(--ink)}
.chip:hover,.chip.hl{border-color:var(--signal);background:#F6FAFE}
.chip .dot{width:8px;height:8px}
.wall .foot .pub{margin-left:auto}

/* menu du mur */
.menu{position:absolute;right:12px;top:46px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px -10px rgba(11,31,58,.35);padding:6px;min-width:240px;z-index:5;display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:4px;cursor:pointer;text-align:left;font-size:14px}
.menu button:hover{background:var(--row)}.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.menu .danger{color:var(--danger-ink)}
.menu .h{display:block;padding:4px 10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ---- vue liste ---- */
.list{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden}
.lr{display:grid;grid-template-columns:28px 140px 1fr 200px 230px 34px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.lr:first-child{border-top:0}
.lr.th{background:var(--row);font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 16px}
.lr.grp{background:#F3F7FC;border-left:3px solid var(--signal);padding-left:13px}
.lr.sub{padding-top:8px;padding-bottom:8px}
.lr.sub .nm{padding-left:22px;position:relative;color:var(--ink)}
.lr.sub .nm::before{content:"";position:absolute;left:6px;top:-12px;bottom:50%;width:10px;border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2);border-bottom-left-radius:4px}
.lthumb{display:block;width:120px;aspect-ratio:16/9;border:3px solid var(--ink);border-radius:4px}
.lthumb.wf{border:0;padding:2px;display:grid;gap:2px;background:var(--ink);border-radius:4px;aspect-ratio:auto}
.lthumb.wf i{display:block;min-width:0;background-repeat:no-repeat;aspect-ratio:16/9}
.lthumb.sm{width:70px;border-width:2px;margin-left:30px}
.muted{color:var(--muted);font-size:13.5px}
.hidden{display:none!important}
@media (max-width:1300px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.sidebar{display:none}main{padding:20px 16px}.grid{grid-template-columns:1fr 1fr}.card.wall{grid-column:1/-1!important}.lr{grid-template-columns:28px 1fr 34px}.lr>:nth-child(2),.lr>:nth-child(4),.lr>:nth-child(5){display:none}}
</style>
</head>
<body>
<div class="mock">
  <span>Vue</span>
  <button data-g="view" data-v="all" class="on">Toutes les zones</button>
  <button data-g="view" data-v="wall">Zone du mur choisie</button>
  <button data-g="view" data-v="list">Affichage liste</button>
  <span>Forme</span>
  <button data-g="shape" data-v="3x1" class="on">3 × 1</button>
  <button data-g="shape" data-v="2x2">2 × 2</button>
  <button data-g="shape" data-v="4x1">4 × 1</button>
  <span>État</span>
  <button data-g="state" data-v="ok" class="on">Complet</button>
  <button data-g="state" data-v="ko">1 écran hors ligne</button>
</div>

<div class="shell">
  <aside class="sidebar">
    <div class="wm">linkii</div>
    <a class="nav active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M9 20h6M12 16v4"/></svg>Écrans</a>
    <a class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/></svg>Listes de lecture</a>
    <a class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Médiathèque</a>
    <hr>
    <a class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>Statistiques</a>
    <hr>
    <a class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Widgets</a>
    <a class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Réglages</a>
  </aside>

  <main>
    <div class="page-head">
      <div><h1>Vos écrans</h1><p class="sub">Choisissez la liste de lecture et les widgets de chaque écran, puis publiez : chaque écran se met à jour indépendamment.</p></div>
      <button class="btn">＋ Ajouter ▾</button>
    </div>

    <div class="bar">
      <label class="dd" style="border:0;background:none;padding-left:0"><input type="checkbox" class="chk"> Tout sélectionner</label>
      <span class="dd" id="zoneDd"><span class="k">Zone</span> <b id="zoneLbl">Toutes</b> <small id="zoneCnt">6</small> ▾</span>
      <span class="dd"><span class="k">État</span> <b>Tous</b> ▾</span>
      <span class="search">🔍 Rechercher des écrans</span>
      <span class="dd"><span class="k">Tri</span> <b>Nom</b> ▾</span>
    </div>

    <div class="annot" id="note"></div>
    <div id="out"></div>
  </main>
</div>

<script>
const S={view:'all',shape:'3x1',state:'ok'};
document.querySelectorAll('.mock button').forEach(b=>b.onclick=()=>{S[b.dataset.g]=b.dataset.v;
  document.querySelectorAll('.mock button[data-g="'+b.dataset.g+'"]').forEach(x=>x.classList.toggle('on',x===b));render();});

const NAMES={'3x1':['Ecran gauche','Ecran central','Ecran droite'],
  '2x2':['Haut gauche','Haut droite','Bas gauche','Bas droite'],
  '4x1':['Écran 1','Écran 2','Écran 3','Écran 4']};
const solos=[{n:'Accueil',img:'affiche',pl:'Affiches du semestre',on:true},{n:'Cafétéria',img:'cafe',pl:'Menu du jour',on:true},{n:'Salle de pause',img:'affiche',pl:'Affiches du semestre',on:false}];
const WALLICO='<svg class="wall-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="5" width="6.3" height="5" rx=".6"/><rect x="8.85" y="5" width="6.3" height="5" rx=".6"/><rect x="15.7" y="5" width="6.3" height="5" rx=".6"/><rect x="2" y="11" width="6.3" height="5" rx=".6" opacity=".35"/><rect x="8.85" y="11" width="6.3" height="5" rx=".6" opacity=".35"/><rect x="15.7" y="11" width="6.3" height="5" rx=".6" opacity=".35"/><path d="M9 20h6M12 16.5V20"/></svg>';

function wall(){const [c,r]=S.shape.split('x').map(Number);const names=NAMES[S.shape];
  const off=S.state==='ko'?names.length-1:-1;
  return {c,r,names,off,online:names.length-(off>=0?1:0)};}

/* une portion de la même image, découpée à la place de chaque écran */
function tileBg(i,c,r){const x=i%c,y=Math.floor(i/c);
  return 'background-size:'+(c*100)+'% '+(r*100)+'%;background-position:'+(c>1?x/(c-1)*100:0)+'% '+(r>1?y/(r-1)*100:0)+'%';}

function wallCard(big){const w=wall();
  const span=big?'1/-1':(w.c>=4?'span 3':'span 2');
  const frameW=big?Math.min(900,w.c*300):w.c*(w.c>=4?150:170)*(w.r>1?.75:1);
  let tiles='';w.names.forEach((n,i)=>{tiles+='<button class="tile sky'+(i===w.off?' off':'')+'" data-i="'+i+'" title="'+(i+1)+' · '+n+(i===w.off?' — hors ligne':'')+' : ouvrir l\'écran" style="'+tileBg(i,w.c,w.r)+'"><span class="n">'+(i+1)+'</span>'+(i===w.off?'<span class="offlbl">Hors ligne</span>':'')+'</button>';});
  let stands='';for(let i=0;i<w.c;i++)stands+='<span class="stand"></span>';
  let chips='';w.names.forEach((n,i)=>{chips+='<span class="chip" data-i="'+i+'" title="Ouvrir l\'écran « '+n+' »"><span class="n">'+(i+1)+'</span><span class="dot'+(i===w.off?' off':'')+'"></span>'+n+'</span>';});
  const state=w.off<0?'<span class="badge ok">'+w.online+' sur '+w.online+' en ligne</span>':'<span class="badge ko">Mur incomplet · '+w.online+' sur '+w.names.length+'</span>';
  return '<div class="card wall" style="grid-column:'+span+'">'
   +'<div class="head"><div class="title"><input type="checkbox" class="chk" title="Sélectionner les '+w.names.length+' écrans du mur"><span class="name">'+WALLICO+'Mur '+w.c+' × '+w.r+'</span>'+state+'<button class="kebab" id="wk" aria-label="Actions du mur">⋮</button></div>'
   +'<div class="meta">Mur d\'écrans · '+w.names.length+' écrans jouent ensemble une seule image</div></div>'
   +'<div class="menu" id="wm"><span class="h">Mur</span><button>⤒ Publier le mur</button><button>▦ Réorganiser…</button><button>🖵 Identifier sur les écrans</button><button>✎ Renommer le mur</button><hr><button class="danger">🗑 Dissoudre le mur…</button></div>'
   +'<div class="wv"><div class="wframe" style="grid-template-columns:repeat('+w.c+',1fr);width:'+frameW+'px;max-width:100%">'+tiles+'</div><div class="stands" style="width:'+frameW+'px;max-width:100%">'+stands+'</div></div>'
   +'<div class="members">'+chips+'</div>'
   +'<div class="foot"><span class="lbl">Liste du mur</span><select class="sel" style="max-width:340px"><option>Nana au cheval</option><option>Affiches du semestre</option></select><button class="btn ghost sm pub">⤒ Publier le mur</button></div>'
   +'</div>';}

function soloCard(s){return '<div class="card"><div class="head"><div class="title"><input type="checkbox" class="chk"><span class="dot'+(s.on?'':' off')+'"></span><span class="name">'+s.n+'</span><button class="kebab">⋮</button></div></div>'
  +'<div class="visual"><div class="mon '+s.img+'"></div><span class="stand"></span></div>'
  +'<div class="foot"><span class="lbl">Défaut</span><select class="sel"><option>'+s.pl+'</option></select></div></div>';}
const ADD='<div class="card add"><i>＋</i><span>Connecter un écran</span></div>';

function listView(){const w=wall();
  let thumb='<div class="lthumb wf" style="grid-template-columns:repeat('+w.c+',1fr)">';w.names.forEach((n,i)=>thumb+='<i class="sky" style="'+tileBg(i,w.c,w.r)+(i===w.off?';filter:grayscale(1) brightness(.55)':'')+'"></i>');thumb+='</div>';
  let h='<div class="list"><div class="lr th"><span></span><span>Aperçu</span><span>Nom</span><span>État</span><span>Liste de lecture</span><span></span></div>';
  h+='<div class="lr grp"><input type="checkbox" class="chk">'+thumb+'<span style="display:flex;align-items:center;gap:8px"><b style="display:flex;gap:8px;align-items:center">'+WALLICO+'Mur '+w.c+' × '+w.r+'</b><span class="muted">· '+w.names.length+' écrans</span></span>'
   +(w.off<0?'<span><span class="badge ok">'+w.online+' sur '+w.online+' en ligne</span></span>':'<span><span class="badge ko">Mur incomplet</span></span>')
   +'<select class="sel"><option>Nana au cheval</option></select><button class="kebab">⋮</button></div>';
  w.names.forEach((n,i)=>{h+='<div class="lr sub"><span></span><i class="lthumb sm sky" style="'+tileBg(i,w.c,w.r)+(i===w.off?';filter:grayscale(1) brightness(.55)':'')+'"></i><span class="nm"><span class="muted" style="font-family:var(--mono)">'+(i+1)+'</span> &nbsp;'+n+'</span><span class="muted"><span class="dot'+(i===w.off?' off':'')+'" style="display:inline-block;width:8px;height:8px;margin-right:6px"></span>'+(i===w.off?'Hors ligne':'En ligne')+'</span><span class="muted">— liste du mur</span><button class="kebab">⋮</button></div>';});
  solos.forEach(s=>{h+='<div class="lr"><input type="checkbox" class="chk"><i class="lthumb '+s.img+'"></i><b>'+s.n+'</b><span class="muted"><span class="dot'+(s.on?'':' off')+'" style="display:inline-block;width:8px;height:8px;margin-right:6px"></span>'+(s.on?'En ligne':'Hors ligne')+'</span><select class="sel"><option>'+s.pl+'</option></select><button class="kebab">⋮</button></div>';});
  return h+'</div>';}

const NOTES={
 all:'<b>Toutes les zones</b> : le mur devient <b>une seule carte large</b> (2 colonnes, 3 pour un mur de 4 de large), avec un <b>effet de pile</b> et l\'image <b>répartie sur ses écrans collés</b>. On le repère d\'un coup d\'œil au milieu des écrans seuls.<ul><li>Clic sur une case ou sur une pastille numérotée : ouvre l\'écran (survolez pour voir le lien entre les deux).</li><li>La case à cocher sélectionne <b>tous</b> les écrans du mur ; le ⋮ porte les actions du mur (celles du bandeau actuel).</li><li>Le pied de carte remplace les 3 sélecteurs « Mur » identiques par <b>un seul</b> choix de liste.</li></ul>',
 wall:'<b>Zone du mur choisie</b> : la même carte, sur toute la largeur. Le bandeau « Mur d\'écrans 3 × 1 · Actions du mur » disparaît : tout est dans la carte, plus de doublon.',
 list:'<b>Affichage liste</b> : une ligne de groupe pour le mur (aperçu assemblé, état, liste), puis ses écrans en retrait, sans sélecteur de liste propre.'};

function render(){
  const w=wall();
  document.getElementById('note').innerHTML=NOTES[S.view];
  document.getElementById('zoneLbl').textContent=S.view==='wall'?'Mur '+w.c+' × '+w.r:'Toutes';
  document.getElementById('zoneCnt').textContent=S.view==='wall'?w.names.length:w.names.length+solos.length;
  document.getElementById('zoneDd').classList.toggle('act',S.view==='wall');
  const out=document.getElementById('out');
  if(S.view==='list'){out.innerHTML=listView();return;}
  out.innerHTML='<div class="grid">'+(S.view==='wall'?wallCard(true)+ADD:wallCard(false)+solos.map(soloCard).join('')+ADD)+'</div>';
  // survol case ↔ pastille
  out.querySelectorAll('[data-i]').forEach(el=>{const i=el.dataset.i;
    el.onmouseenter=()=>out.querySelectorAll('[data-i="'+i+'"]').forEach(x=>x.classList.add('hl'));
    el.onmouseleave=()=>out.querySelectorAll('[data-i="'+i+'"]').forEach(x=>x.classList.remove('hl'));});
  const k=document.getElementById('wk'),m=document.getElementById('wm');
  k.onclick=e=>{e.stopPropagation();m.classList.toggle('open');};
  document.onclick=()=>m.classList.remove('open');
}
render();
</script>
</body>
</html>
