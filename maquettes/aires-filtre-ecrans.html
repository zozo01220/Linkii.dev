<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aires en filtre des écrans (maquette)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--row:#EDF1F5;--brand:#0B1F3A;--signal:#3B82C4;--sig-bg:#E6F0F9;--ok:#1E8E5A;--ok-bg:#E1F0E8;--ok-ink:#155A38;--warn-bg:#FBF0DC;--warn-ink:#7A4F12;--radius:4px;--cr:10px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.note{background:var(--warn-bg);color:var(--warn-ink);padding:9px 20px;font-size:13px}
.steps{display:flex;gap:8px;padding:14px 20px 0;flex-wrap:wrap}
.steps button{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 14px;display:inline-flex;gap:8px;align-items:center;font-size:13px}
.steps button i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--row);font-size:12px}
.steps button.on{background:var(--brand);color:#fff;border-color:var(--brand)}.steps button.on i{background:#fff;color:var(--brand)}
.wrap{padding:14px 20px 40px;max-width:1200px}
.cap h2{margin:6px 0 4px;font-size:18px;font-weight:600}.cap p{margin:0 0 12px;color:var(--muted);max-width:920px}
.ctl{display:flex;gap:10px;align-items:center;margin:0 0 10px;color:var(--muted);font-size:13px;min-height:30px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 12px;color:var(--muted)}.seg button+button{border-left:1px solid var(--line-2)}.seg button.on{background:var(--brand);color:#fff}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);border:1px solid var(--line-2);border-radius:var(--cr);overflow:hidden;background:var(--bg);min-height:600px;position:relative}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.side .logo{font-weight:600;font-size:20px;padding:0 8px 12px}.side .logo small{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.side .nv{padding:8px 10px;border-radius:var(--radius);font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center}.side .nv.on{background:var(--row);color:var(--ink);font-weight:500}
.side .sep{height:1px;background:var(--line);margin:8px 6px}.side .sp{flex:1}
.apick{border:1px solid var(--line-2);border-radius:var(--radius);padding:8px 10px;display:flex;gap:8px;align-items:center;margin-bottom:12px;position:relative}
.apick b{display:block;font-weight:600;font-size:13.5px}.apick small{color:var(--muted);font-size:12px}
.apick.gone{opacity:.35;text-decoration:line-through}
.strike{position:absolute;inset:0;display:grid;place-items:center}.strike span{background:#C8372D;color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;text-decoration:none}
.main{padding:18px 24px 26px;min-width:0;position:relative}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}.ph h1{margin:0;font-size:22px;font-weight:600}.grow{flex:1}
.sub{color:var(--muted);margin:0 0 14px}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--radius);padding:7px 13px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}.btn.sm{padding:3px 10px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--row);color:var(--muted);white-space:nowrap}
.pill.blue{background:var(--sig-bg);color:#1F5C93}.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:var(--cr)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line-2);border-radius:var(--radius);padding:0 10px;height:34px;min-width:220px}.search input{border:0;outline:0;flex:1;background:none}
.dd{position:relative}
.ddb{height:34px;background:#fff;border:1px solid var(--line-2);border-radius:var(--radius);padding:0 10px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.ddb .k{color:var(--muted)}.ddb.act{border-color:var(--signal);background:#E6F0F9}
.menu{position:absolute;top:38px;left:0;z-index:20;min-width:230px;background:#fff;border:1px solid var(--line-2);border-radius:var(--cr);box-shadow:0 8px 24px rgba(11,31,58,.16);padding:6px;display:grid}
.menu button{display:flex;gap:9px;align-items:center;padding:7px 9px;border:0;background:none;border-radius:var(--radius);text-align:left}
.menu button:hover{background:var(--bg)}.menu button.on{font-weight:500}.menu .grow{flex:1}.menu small{color:var(--muted)}
.menu .msep{height:1px;background:var(--line);margin:4px 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:1px 6px 1px 10px;font-size:12.5px}.chip b{font-weight:500}.chip button{border:0;background:none;color:var(--muted);padding:2px;display:inline-grid}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.kpis .card{padding:10px 14px}.kpis b{display:block;font-size:22px;font-weight:500}.kpis span{font-size:12.5px;color:var(--muted)}
.ah{display:flex;gap:10px;align-items:center;margin:16px 0 8px}.ah b{font-size:15px;font-weight:600}.ah .zh{font-size:13px;color:var(--muted)}
.zl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--muted);margin:10px 0 6px}
.screens{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.scr .th{height:92px;background:#1B2E4A;border-radius:10px 10px 0 0;position:relative}.scr .dot{position:absolute;right:10px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--ok)}.scr .dot.off{background:#9AA7B6}
.scr .bd{padding:10px 13px 12px}.scr .bd b{display:block;font-weight:500}.scr .bd small{color:var(--muted);font-size:12.5px}
.hint{background:var(--sig-bg);border-radius:var(--radius);padding:9px 13px;font-size:13px;color:#1F5C93;margin:14px 0 0}
.modal{position:absolute;inset:0;background:rgba(11,31,58,.28);display:grid;place-items:end center;z-index:30}
.sheet{background:#fff;border-radius:14px 14px 0 0;width:min(620px,100%);padding:18px 22px;box-shadow:0 -10px 30px rgba(11,31,58,.16)}
.sheet h3{margin:0 0 4px;font-size:17px}.sheet label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}.sheet input,.sheet select{width:100%;height:34px;border:1px solid var(--line-2);border-radius:var(--radius);padding:0 9px;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.tabs{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;background:#fff;margin:4px 0 12px}.tabs button{border:0;background:none;padding:6px 12px;color:var(--muted)}.tabs button+button{border-left:1px solid var(--line-2)}.tabs button.on{background:var(--brand);color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.md .t{height:90px;background:var(--sig-bg);border-radius:10px 10px 0 0}.md .bd{padding:8px 12px}.md b{font-weight:500;display:block}
.doc{display:grid;gap:14px}.doc .card{padding:16px 20px}.doc h3{margin:0 0 10px;font-size:15.5px;font-weight:600}.doc ul,.doc ol{margin:0;padding-left:18px}.doc li{margin:5px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}table.t td{padding:8px 10px;border-top:1px solid var(--row)}
.hide{display:none!important}
@media (max-width:900px){.app,.two,.grid2{grid-template-columns:1fr}.side{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px 16px 40px}}
</style></head><body>
<div class="note"><b>Maquette — rien n'est codé.</b> Plus de sélecteur d'aire dans le menu : l'aire devient un simple filtre de la page Écrans. Données inventées, tout est cliquable.</div>
<div class="steps" id="steps">
 <button class="on" data-s="1"><i>1</i>Le menu, avant / après</button>
 <button data-s="2"><i>2</i>Écrans : filtre « Aire »</button>
 <button data-s="3"><i>3</i>Connecter un écran</button>
 <button data-s="4"><i>4</i>Médiathèque et listes</button>
 <button data-s="5"><i>5</i>Ce qui change</button>
</div>
<div class="wrap">
 <div class="cap"><h2 id="capT"></h2><p id="capP"></p></div>
 <div class="ctl" id="ctl"></div>
 <div class="app" id="app">
  <aside class="side" id="side"></aside>
  <div class="main" id="main"></div>
 </div>
 <div class="doc hide" id="doc"></div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const I={screen:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>',list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',img:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>',grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',pin:'<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',chev:'<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',team:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c1-3.5 4-5.5 7-5.5s6 2 7 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2 .7 3.4 2.5 4 5.5"/></svg>',check:'<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>'};

// ---------- données inventées ----------
const AREAS=[
 {n:'Geopolis',zones:{'Accueil':['Accueil 1','Accueil 2'],'Cafétéria':['Cafétéria'],'Défaut':['Salle 210']}},
 {n:'Principale',zones:{'Hall':['Hall nord','Hall sud'],'Auditoire':['Auditoire A'],'Défaut':[]}},
 {n:'Internef',zones:{'Bibliothèque':['Biblio entrée'],'Défaut':['Couloir 2']}}];
const OFF=new Set(['Salle 210','Couloir 2']);
const S={step:1,side:'after',area:'',zone:'',menu:null,role:'admin',pair:false,pairArea:'Geopolis',tab:'mine'};

const CAP={
1:['Le menu : plus de sélecteur d\'aire','Aujourd\'hui, l\'aire choisie en haut du menu filtre tout le back-office (écrans, listes, médias). Avec le modèle par propriétaire, ce filtre n\'a plus de sens : on le retire. Le menu redevient le même pour tout le monde.'],
2:['Écrans : un filtre « Aire », comme les autres filtres','L\'aire n\'est plus qu\'un critère de tri des écrans, à côté de la zone, de l\'état et de la recherche. Par défaut : toutes les aires, groupées. Le choix est retenu d\'une visite à l\'autre.'],
3:['Connecter un écran : on choisit son aire et sa zone','L\'aire n\'est plus « l\'aire ouverte » : elle se choisit dans la fenêtre, pré-remplie avec le filtre en cours (ou la seule aire s\'il n\'y en a qu\'une).'],
4:['Médiathèque et listes : aucune notion d\'aire','On voit ses médias et ses listes, et ceux qu\'on vous partage, où qu\'ils aient été créés. Pas de filtre d\'aire ici : seul le propriétaire et le partage comptent.'],
5:['Ce qui change, et les questions à trancher','']};

function render(){
 const s=S.step;$$('#steps button').forEach(b=>b.classList.toggle('on',+b.dataset.s===s));
 $('#capT').textContent=CAP[s][0];$('#capP').textContent=CAP[s][1];
 $('#app').classList.toggle('hide',s===5);$('#doc').classList.toggle('hide',s!==5);
 let ctl='';
 if(s===1)ctl=`<span>Menu :</span><div class="seg" id="sd"><button data-v="before" class="${S.side==='before'?'on':''}">Avant</button><button data-v="after" class="${S.side==='after'?'on':''}">Après</button></div>`;
 if(s===2)ctl=`<span>Vu par :</span><div class="seg" id="rl"><button data-v="admin" class="${S.role==='admin'?'on':''}">Administrateur</button><button data-v="ines" class="${S.role==='ines'?'on':''}">Inès (Accueil de Geopolis + Biblio)</button></div>`;
 $('#ctl').innerHTML=ctl;
 $('#side').innerHTML=side(s===1&&S.side==='before');
 if(s===5){$('#doc').innerHTML=v5();bind();return}
 $('#main').innerHTML=s===1?v1():s===2?v2():s===3?v3():v4();
 bind();
}

function side(before){
 const nav=n=>`<div class="nv ${n[2]?'on':''}">${n[0]} ${n[1]}</div>`;
 const page=S.step===4?'med':'scr';
 return `<div class="logo">linkii<small>v1.153</small></div>
 ${before?`<div class="apick">${I.pin}<div><b>Geopolis</b><small>Aire de gestion</small></div><span class="grow"></span>${I.chev}</div>`:''}
 ${nav([I.screen,'Écrans',page==='scr'])}${nav([I.list,'Listes de lecture'])}${nav([I.cal,'Planning'])}<div class="sep"></div>${nav([I.img,'Médiathèque',page==='med'])}${nav([I.grid,'Compositions'])}
 <div class="sp"></div>${S.role==='admin'?nav([I.team,'Membres']):''}`;
}

/* 1 — menu avant / après */
function v1(){
 if(S.side==='before')return `<div class="ph"><h1>Vos écrans</h1><span class="pill blue">${I.pin} Geopolis</span></div>
  <p class="sub">Tout ce que vous voyez dépend de l'aire choisie en haut du menu : écrans, listes de lecture, médias.</p>
  <div class="card" style="padding:16px 18px"><b>Ce que ça provoquait</b><ul style="margin:8px 0 0;padding-left:18px">
  <li>Une liste créée « dans Geopolis » disparaît quand on ouvre « Principale ».</li>
  <li>Un média partagé ne se voit que dans l'aire où il a été créé.</li>
  <li>Il faut changer d'aire pour retrouver ses propres éléments.</li></ul></div>`;
 return `<div class="ph"><h1>Vos écrans</h1><span class="grow"></span><button class="btn">${I.plus} Connecter un écran</button></div>
  <p class="sub">Le haut du menu est vide de tout sélecteur. Les écrans de toutes les aires sont sur cette page ; on filtre si besoin.</p>
  <div class="hint">Le menu est identique partout. Seule la page Écrans parle d'aires, sous forme de filtre (étape 2). Les aires se gèrent toujours dans <b>Membres › Aires</b> (zones, veille, luminosité).</div>`;
}

/* 2 — Écrans */
function visibleAreas(){
 if(S.role==='admin')return AREAS;
 // Inès : zone Accueil de Geopolis + Bibliothèque d'Internef
 return [{n:'Geopolis',zones:{'Accueil':AREAS[0].zones['Accueil']}},{n:'Internef',zones:{'Bibliothèque':AREAS[2].zones['Bibliothèque']}}];
}
function v2(){
 const areas=visibleAreas();
 if(S.area&&!areas.some(a=>a.n===S.area)){S.area='';S.zone=''}
 const shown=areas.filter(a=>!S.area||a.n===S.area);
 const all=shown.flatMap(a=>Object.entries(a.zones).filter(([z])=>!S.zone||z===S.zone).flatMap(([z,l])=>l.map(n=>({n,z,a:a.n}))));
 const total=areas.flatMap(a=>Object.values(a.zones).flat()).length;
 const areaMenu=S.menu==='area'?`<div class="menu"><button class="${!S.area?'on':''}" data-area=""><span class="grow">Toutes les aires</span><small>${total}</small>${!S.area?I.check:''}</button><div class="msep"></div>
  ${areas.map(a=>`<button class="${S.area===a.n?'on':''}" data-area="${a.n}">${I.pin}<span class="grow">${a.n}</span><small>${Object.values(a.zones).flat().length}</small>${S.area===a.n?I.check:''}</button>`).join('')}</div>`:'';
 const zones=S.area?Object.keys(areas.find(a=>a.n===S.area).zones):[];
 const zoneMenu=S.menu==='zone'&&S.area?`<div class="menu"><button data-zone="" class="${!S.zone?'on':''}"><span class="grow">Toutes les zones</span></button><div class="msep"></div>${zones.map(z=>`<button data-zone="${z}" class="${S.zone===z?'on':''}"><span class="grow">${z}</span>${S.zone===z?I.check:''}</button>`).join('')}</div>`:'';
 const on=all.filter(x=>!OFF.has(x.n)).length;
 return `<div class="ph"><h1>Vos écrans</h1><span class="grow"></span><button class="btn" id="pairBtn">${I.plus} Connecter un écran</button></div>
 <p class="sub">${S.role==='admin'?'Tous les écrans de l\'organisation.':'Les écrans qui vous sont attribués, dans toutes les aires.'}</p>
 <div class="tools">
  <label class="search">${I.search}<input placeholder="Rechercher un écran"></label>
  ${areas.length>1?`<div class="dd"><button class="ddb ${S.area?'act':''}" id="ddArea"><span class="k">Aire</span> ${S.area||'Toutes'} ${I.chev}</button>${areaMenu}</div>`:''}
  <div class="dd"><button class="ddb ${S.zone?'act':''}" id="ddZone" ${S.area?'':'disabled style="opacity:.5" title="Choisissez d\'abord une aire"'}><span class="k">Zone</span> ${S.zone||'Toutes'} ${I.chev}</button>${zoneMenu}</div>
  <button class="ddb"><span class="k">État</span> Tous ${I.chev}</button>
  <span class="grow"></span><span class="muted" style="font-size:13px">${all.length} écran${all.length>1?'s':''}</span>
 </div>
 ${S.area?`<div class="chips"><span class="chip">Aire <b>${S.area}</b><button data-area="" aria-label="Retirer">${I.x}</button></span>${S.zone?`<span class="chip">Zone <b>${S.zone}</b><button data-zone="" aria-label="Retirer">${I.x}</button></span>`:''}</div>`:''}
 <div class="kpis"><div class="card"><b>${all.length}</b><span>Écrans</span></div><div class="card"><b>${on}</b><span>En ligne</span></div><div class="card"><b>${all.length-on}</b><span>Hors ligne</span></div><div class="card"><b>0</b><span>À publier</span></div></div>
 ${shown.map(a=>{const zs=Object.entries(a.zones).filter(([z,l])=>(!S.zone||z===S.zone)&&l.length);if(!zs.length)return'';
  return `${shown.length>1||!S.area?`<div class="ah">${I.pin}<b>${a.n}</b><span class="zh">${zs.reduce((n,[,l])=>n+l.length,0)} écrans</span></div>`:''}
  ${zs.map(([z,l])=>`<div class="zl">${z}</div><div class="screens">${l.map(n=>`<div class="card scr"><div class="th"><span class="dot ${OFF.has(n)?'off':''}"></span></div><div class="bd"><b>${n}</b><small>${OFF.has(n)?'Hors ligne':'En ligne'} · Accueil matin</small></div></div>`).join('')}</div>`).join('')}`}).join('')}
 <div class="hint">${S.role==='admin'?'Une seule aire dans l\'organisation ? Le filtre « Aire » n\'apparaît pas du tout.':'Inès ne voit dans le filtre que les aires où elle a des écrans : Geopolis et Internef.'}</div>
 ${S.pair?pairSheet():''}`;
}

function pairSheet(){
 const a=AREAS.find(x=>x.n===S.pairArea)||AREAS[0];
 return `<div class="modal" id="mdl"><div class="sheet" onclick="event.stopPropagation()"><h3>Connecter un écran</h3><div class="muted" style="font-size:13px">Saisissez le code affiché sur l'écran.</div>
  <div class="grid2"><div><label>Code à 6 chiffres</label><input placeholder="123 456"></div><div><label>Nom</label><input placeholder="Ex. Accueil 3"></div></div>
  <div class="grid2"><div><label>Aire</label><select id="pa">${AREAS.map(x=>`<option ${x.n===a.n?'selected':''}>${x.n}</option>`).join('')}</select></div>
  <div><label>Zone</label><select>${Object.keys(a.zones).map(z=>`<option>${z}</option>`).join('')}</select></div></div>
  <p class="muted" style="font-size:12.5px;margin:10px 0 0">${S.area?`Pré-rempli avec le filtre en cours (« ${S.area} »).`:'Pré-rempli avec la dernière aire utilisée.'} Un utilisateur qui connecte un écran le gère d'office.</p>
  <div class="foot"><button class="btn ghost" id="pc">Annuler</button><button class="btn" id="pc2">Connecter</button></div></div></div>`;
}

/* 3 — Connecter */
function v3(){S.pair=true;return v2()}

/* 4 — Médiathèque */
function v4(){
 const mine=[['Affiche été','Geopolis'],['Menu cafétéria','Geopolis'],['Plan du campus','Principale'],['Horaires biblio','Internef']];
 const shared=[['Logos et charte','Principale'],['Campagne automne','Internef']];
 const l=S.tab==='mine'?mine:shared;
 return `<div class="ph"><h1>Médiathèque</h1><span class="grow"></span><button class="btn">${I.plus} Ajouter</button></div>
 <div class="tabs" id="tb"><button data-t="mine" class="${S.tab==='mine'?'on':''}">Mes médias</button><button data-t="shared" class="${S.tab==='shared'?'on':''}">Partagés avec moi</button></div>
 <div class="mgrid">${l.map(([n,a])=>`<div class="card md"><div class="t"></div><div class="bd"><b>${n}</b><small class="muted">créé quand « ${a} » était ouverte</small></div></div>`).join('')}</div>
 <div class="hint">Avant, ces médias étaient éparpillés selon l'aire ouverte au moment de leur création. Désormais ils sont tous là. L'aire d'origine n'est plus affichée nulle part.</div>`;
}

/* 5 — règles */
function v5(){
 return `<div class="card"><h3>Ce qui change</h3><table class="t"><thead><tr><th></th><th>Avant</th><th>Après</th></tr></thead><tbody>
  <tr><td>Haut du menu</td><td>Sélecteur d'aire (filtre global)</td><td>Rien</td></tr>
  <tr><td>Écrans</td><td>Écrans de l'aire ouverte (+ les autres en groupes)</td><td>Tous ses écrans, filtre <b>Aire</b> puis <b>Zone</b></td></tr>
  <tr><td>Connecter un écran</td><td>Va dans l'aire ouverte</td><td>On choisit l'aire et la zone dans la fenêtre</td></tr>
  <tr><td>Listes de lecture, Médiathèque, Compositions</td><td>Celles de l'aire ouverte</td><td>Toutes les siennes + celles partagées, sans aire</td></tr>
  <tr><td>Choisir la liste d'un écran</td><td>Listes de l'aire de l'écran</td><td>Toutes les listes qu'on voit</td></tr>
  <tr><td>Planning, Zones</td><td>Aire ouverte</td><td>Même filtre « Aire » que la page Écrans</td></tr>
  <tr><td>Aires (zones, veille, luminosité)</td><td>Membres › Aires</td><td>Inchangé</td></tr></tbody></table></div>
 <div class="two"><div class="card"><h3>Règles</h3><ol>
  <li>L'aire ne range que les <b>écrans</b> (et leurs zones, murs, veille, luminosité).</li>
  <li>Listes, médias, dossiers et compositions n'ont plus d'aire : ils sont à leur propriétaire.</li>
  <li>Le filtre « Aire » n'apparaît que s'il y a au moins deux aires (pour un utilisateur : deux aires où il a des écrans).</li>
  <li>Le filtre est mémorisé par personne, pour la page Écrans seulement.</li></ol></div>
 <div class="card"><h3>Questions à trancher</h3><ol>
  <li>Planning et Zones : même filtre « Aire » en haut de page (proposé), ou tout afficher groupé par aire ?</li>
  <li>Un mur réunit des écrans d'une même aire : on garde cette contrainte ? <span class="muted">Proposé : oui.</span></li>
  <li>« Déplacer vers une autre aire » pour une liste ou un média disparaît (plus d'aire) ; on le garde pour un écran ? <span class="muted">Proposé : oui, depuis l'écran.</span></li>
  <li>Les anciens partages entre aires (lien vivant) : on les convertit en partages « toute l'organisation » ? <span class="muted">Proposé : inutile, tout est déjà visible par propriétaire ; on les supprime.</span></li></ol></div></div>`;
}

function bind(){
 const sd=$('#sd');if(sd)sd.onclick=e=>{const b=e.target.closest('button');if(b){S.side=b.dataset.v;render()}};
 const rl=$('#rl');if(rl)rl.onclick=e=>{const b=e.target.closest('button');if(b){S.role=b.dataset.v;S.menu=null;render()}};
 const da=$('#ddArea');if(da)da.onclick=()=>{S.menu=S.menu==='area'?null:'area';render()};
 const dz=$('#ddZone');if(dz&&S.area)dz.onclick=()=>{S.menu=S.menu==='zone'?null:'zone';render()};
 $$('[data-area]').forEach(b=>b.onclick=()=>{S.area=b.dataset.area;S.zone='';S.menu=null;S.pairArea=S.area||S.pairArea;render()});
 $$('[data-zone]').forEach(b=>b.onclick=()=>{S.zone=b.dataset.zone;S.menu=null;render()});
 const pb=$('#pairBtn');if(pb)pb.onclick=()=>{S.pair=true;S.pairArea=S.area||S.pairArea;render()};
 const close=()=>{S.pair=false;if(S.step===3)S.step=2;render()};
 const md=$('#mdl');if(md){md.onclick=close;$('#pc').onclick=close;$('#pc2').onclick=close;$('#pa').onchange=e=>{S.pairArea=e.target.value;render()}}
 const tb=$('#tb');if(tb)tb.onclick=e=>{const b=e.target.closest('button');if(b){S.tab=b.dataset.t;render()}};
}
$('#steps').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.step=+b.dataset.s;S.menu=null;S.pair=false;render()};
render();
</script></body></html>
