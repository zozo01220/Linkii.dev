<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organisation multi-sites allégée — 3 idées seulement (maquette)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--row:#EDF1F5;--brand:#0B1F3A;--signal:#3B82C4;--sig-bg:#E6F0F9;--ok:#1E8E5A;--ok-bg:#E1F0E8;--ok-ink:#155A38;--warn-bg:#FBF0DC;--warn-ink:#7A4F12;--danger:#C8372D;--radius:4px;--cr:10px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.note{background:var(--warn-bg);color:var(--warn-ink);padding:9px 20px;font-size:13px}
.steps{display:flex;gap:8px;padding:14px 20px 0;flex-wrap:wrap}
.steps button{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 14px;display:inline-flex;gap:8px;align-items:center;font-size:13px}
.steps button i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--row);font-size:12px}
.steps button.on{background:var(--brand);color:#fff;border-color:var(--brand)}.steps button.on i{background:#fff;color:var(--brand)}
.wrap{padding:14px 20px 40px;max-width:1180px}
.cap h2{margin:6px 0 4px;font-size:18px;font-weight:600}.cap p{margin:0 0 12px;color:var(--muted);max-width:900px}
.ctl{display:flex;gap:10px;align-items:center;margin:0 0 10px;color:var(--muted);font-size:13px;min-height:30px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 13px;color:var(--muted)}.seg button+button{border-left:1px solid var(--line-2)}.seg button.on{background:var(--brand);color:#fff}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line-2);border-radius:var(--cr);overflow:hidden;background:var(--bg);min-height:600px;position:relative}
.side{background:var(--brand);color:#C9D4E3;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side .logo{color:#fff;font-weight:600;font-size:17px;padding:2px 8px 12px}.side .nv{padding:7px 9px;border-radius:var(--radius);font-size:13.5px}.side .nv.on{background:rgba(255,255,255,.14);color:#fff}.side .sp{flex:1}.side .sep{height:1px;background:rgba(255,255,255,.14);margin:6px 4px}
.main{padding:18px 24px 26px;min-width:0;position:relative}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:4px}.ph h1{margin:0;font-size:20px;font-weight:600}.grow{flex:1}
.sub{color:var(--muted);margin:0 0 16px}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--radius);padding:6px 13px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}.btn.sm{padding:3px 10px;font-size:12.5px}
.link{border:0;background:none;color:var(--signal);padding:0;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--row);color:var(--muted);white-space:nowrap}
.pill.blue{background:var(--sig-bg);color:#1F5C93}.pill.dark{background:var(--brand);color:#fff}.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:var(--cr)}
.lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin:20px 0 8px;display:flex;gap:8px;align-items:center}
.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:8px;display:inline-flex;gap:5px;align-items:center}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-size:11.5px;font-weight:500;flex:none}
.stack{display:inline-flex}.stack .av{width:24px;height:24px;font-size:10px;border:2px solid #fff;margin-left:-6px}.stack .av:first-child{margin-left:0}
.who{display:flex;gap:11px;align-items:center;min-width:0}.who small{display:block;color:var(--muted);font-size:12.5px}
.row{display:flex;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--row)}.row:first-child{border-top:0}
.row.c{cursor:pointer}.row.c:hover{background:#F9FAFC}
select.in,input.in{height:32px;border:1px solid var(--line-2);border-radius:var(--radius);padding:0 9px;background:#fff}
.x{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:4px;display:inline-grid;place-items:center}.x:hover{background:var(--row)}
.search{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line-2);border-radius:var(--radius);padding:0 10px;height:34px;max-width:320px;margin-bottom:10px}.search input{border:0;outline:0;flex:1;background:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sc{padding:16px 18px;cursor:pointer}.sc:hover{border-color:var(--signal)}.sc h3{margin:0 0 2px;font-size:16px;font-weight:600}.sc .n{display:flex;gap:18px;margin:12px 0;color:var(--muted);font-size:13px}.sc .n b{display:block;color:var(--ink);font-size:20px;font-weight:500}
.kp{display:flex;gap:26px;margin:4px 0 0;color:var(--muted);font-size:13px}.kp b{display:block;color:var(--ink);font-size:20px;font-weight:500}
.hint{background:var(--sig-bg);border-radius:var(--radius);padding:9px 13px;font-size:13px;color:#1F5C93;margin:12px 0}
.adm{display:flex;gap:12px;align-items:center;padding:12px 16px;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:var(--cr)}
.ck{width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:4px;display:inline-grid;place-items:center;background:#fff;flex:none;padding:0}
.ck.on{background:var(--signal);border-color:var(--signal)}.ck.on:after{content:"";width:8px;height:4px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.panel{position:absolute;right:0;top:0;bottom:0;width:380px;max-width:100%;background:#fff;border-left:1px solid var(--line-2);box-shadow:-10px 0 30px rgba(11,31,58,.16);display:none;flex-direction:column;z-index:30}.panel.on{display:flex}
.panel .ph2{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.panel h3{margin:0;font-size:16px}.panel .pb{padding:14px 18px;overflow:auto;flex:1}.panel .pf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.fo{padding:14px;position:relative}.fo .ic{width:44px;height:34px;border-radius:5px 5px 4px 4px;background:var(--sig-bg);border:1px solid #BCD6EC;margin-bottom:10px}.fo b{display:block;font-weight:500}.fo .tag{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.fo .sh{position:absolute;right:10px;top:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}.cmp .card{padding:16px 18px}.cmp h3{margin:0 0 10px;font-size:15px;font-weight:600}
table.t{width:100%;border-collapse:collapse}table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line)}table.t td{padding:9px 12px;border-top:1px solid var(--row)}table.t td:not(:first-child),table.t th:not(:first-child){text-align:center}
.yes{color:var(--ok);font-weight:600}.no{color:var(--line-2)}
.q{padding:16px 18px;margin-top:14px}.q h3{margin:0 0 8px;font-size:15px}.q li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brand);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:99;display:none}.toast.on{display:block}
.vl{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}.vl svg{width:13px;height:13px}.vl:hover{border-color:var(--signal)}
.vlist{border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;margin-top:8px;background:#FBFCFD}
.screens{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.scr .th{height:96px;background:#1B2E4A;border-radius:10px 10px 0 0;position:relative}.scr .dot{position:absolute;right:10px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--ok)}.scr .bd{padding:11px 14px 6px}.scr .tag{margin-top:6px}.scr .ft{padding:8px 14px 12px;display:flex;gap:6px;flex-wrap:wrap}
.fo.nw{border-color:var(--signal);background:#F2F7FC}
.hide{display:none!important}
@media (max-width:900px){.app,.cmp{grid-template-columns:1fr}.side{display:none}}
</style></head><body>
<div class="note"><b>Maquette — rien n'est codé.</b> Version allégée du multi-sites : <b>3 idées seulement</b> (un site, un rôle par site, un partage de contenu). Données inventées, tout est cliquable.</div>
<div class="steps" id="steps">
 <button class="on" data-s="1"><i>1</i>Mes sites</button>
 <button data-s="2"><i>2</i>Un site</button>
 <button data-s="3"><i>3</i>Une personne</button>
 <button data-s="4"><i>4</i>Ce que voit la personne</button>
 <button data-s="5"><i>5</i>Partager du contenu</button>
 <button data-s="6"><i>6</i>Règles et suite</button>
</div>

<div class="wrap">
 <div class="cap"><h2 id="capT"></h2><p id="capP"></p></div>
 <div class="ctl" id="ctl"></div>
 <div class="app" id="app">
  <aside class="side"><div class="logo">Linkii</div><div class="nv" id="navScr">Écrans</div><div class="nv">Listes de lecture</div><div class="nv">Planning</div><div class="sep"></div><div class="nv" id="navMed">Médiathèque</div><div class="sp"></div><div class="nv" id="navOrg">Organisation</div><div class="sep"></div><div class="nv">Intégrations</div><div class="nv">Widgets</div></aside>
  <div class="main" id="main"></div>
 </div>
 <div class="card q hide" id="s5"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const I={plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>',left:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',share:'<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/></svg>',eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)};
const ini=n=>n.split(' ').map(w=>w[0]).join('').slice(0,2);
const hue=['#0B1F3A','#3B82C4','#1E8E5A','#B7791F','#7B5EA7','#C8372D'];const av=(n,i=0)=>`<span class="av" style="background:${hue[i%hue.length]}">${ini(n)}</span>`;

/* ---------- données inventées ---------- */
const BIG=['Siège','Lausanne','Genève','Fribourg','Neuchâtel','Sion','Bâle','Berne','Zurich','Lugano','Lucerne','Saint-Gall'].map((n,i)=>({n,screens:[8,6,5,4,3,3,5,4,7,2,3,3][i],people:[3,9,7,4,3,2,5,4,8,2,3,3][i]}));
const SMALL=[{n:'Lausanne',screens:6,people:4},{n:'Genève',screens:5,people:3}];
const ADMINS=['Marie Dupont','Karim Benali'];
const ZONES={'Accueil':['Accueil 1','Accueil 2'],'Caisses':['Caisse 1','Caisse 2'],'Vitrines':['Vitrine rue'],'Cafétéria':['Cafétéria']};
const ROLES=['Lecteur','Contributeur','Éditeur'];
const DESC={Lecteur:'voit tout, ne modifie rien',Contributeur:'gère médias et listes, publie ; voit les écrans sans les configurer',Éditeur:'gère aussi les écrans (ajout, réglages, zones)'};
const LAUS=[{n:'Sophie Morel',e:'sophie.morel@exemple.ch',r:'Éditeur',v:'Tous les écrans'},{n:'Tom Leroy',e:'tom.leroy@exemple.ch',r:'Éditeur',v:'Tous les écrans'},{n:'Inès Garcia',e:'ines.garcia@exemple.ch',r:'Contributeur',v:'Caisses, Vitrines'},{n:'Luc Favre',e:'luc.favre@exemple.ch',r:'Contributeur',v:'Caisses, Vitrines'},{n:'Anaïs Rochat',e:'anais.rochat@exemple.ch',r:'Lecteur',v:'Tous les écrans'}];
const S={step:1,size:'big',role:'Contributeur',side:'origin',allSites:false,sites:new Set(['Genève','Lausanne']),done:false,newFolder:false,vis:'some',zones:new Set(['Caisses','Vitrines']),edit:false};
const roleSel=(r,id)=>`<select class="in" ${id!==undefined?`data-r="${id}"`:''}>${ROLES.map(x=>`<option ${x===r?'selected':''}>${x}</option>`).join('')}</select>`;
const can={share:r=>r!=='Lecteur',content:r=>r!=='Lecteur',screens:r=>r==='Éditeur'};

const CAP={
1:['Mes sites','Un site = ses écrans, ses listes et sa médiathèque. Pour un seul site, rien de tout ça n\'apparaît : c\'est le mode mono-site tel qu\'il est.'],
2:['Un site : qui y travaille','Une seule liste, un rôle par personne. Plus de tiroir de droits, plus d\'« accès en cascade ».'],
3:['Une personne : ses sites, son rôle, ses écrans','Pour chaque site : un rôle (voir seulement, gérer le contenu, ou tout gérer) et, si besoin, les écrans qu\'elle voit. C\'est le seul endroit où l\'on limite quelque chose.'],
4:['Ce que voit la personne','Ici une personne limitée aux Caisses et aux Vitrines de Lausanne. Changez son rôle pour voir ce qui disparaît : le contenu (médias, listes, dossiers) reste celui du site, sans filtre.'],
5:['Partager du contenu','On ne partage jamais un écran. On partage du contenu — dossier, média ou liste — avec d\'autres sites, qui l\'utilisent sans le modifier. Un dossier créé apparaît tout de suite, pour tout le site.'],
6:['Règles et suite','Tout tient dans ce tableau. Le reste est de la brique à ajouter plus tard.']};

function render(){
 const s=S.step;$$('#steps button').forEach(b=>b.classList.toggle('on',+b.dataset.s===s));
 $('#capT').textContent=CAP[s][0];$('#capP').textContent=CAP[s][1];
 $('#app').classList.toggle('hide',s===6);$('#s5').classList.toggle('hide',s!==6);
 $('#navOrg').className='nv'+(s<4?' on':'');$('#navScr').className='nv'+(s===4?' on':'');$('#navMed').className='nv'+(s===5?' on':'');
 const rseg=`<span>Se voir en tant que :</span><div class="seg" id="rl">${ROLES.map(r=>`<button data-r="${r}" class="${S.role===r?'on':''}">${r}</button>`).join('')}</div>`;
 let ctl='';
 if(s===1)ctl=`<span>Nombre de sites :</span><div class="seg" id="sz"><button data-z="big" class="${S.size==='big'?'on':''}">12 sites</button><button data-z="small" class="${S.size==='small'?'on':''}">2 sites</button></div>`;
 if(s===4)ctl=rseg+`<span>·</span><span>Écrans visibles :</span><div class="seg" id="vs"><button data-v="all" class="${S.vis==='all'?'on':''}">Tous</button><button data-v="some" class="${S.vis==='some'?'on':''}">Certains (Caisses, Vitrines)</button></div>`;
 if(s===5)ctl=rseg+`<span>·</span><span>Côté :</span><div class="seg" id="sd"><button data-d="origin" class="${S.side==='origin'?'on':''}">Siège (qui partage)</button><button data-d="recip" class="${S.side==='recip'?'on':''}">Genève (qui reçoit)</button></div>`;
 $('#ctl').innerHTML=ctl;
 const m=$('#main');
 if(s===1)m.innerHTML=v1();else if(s===2)m.innerHTML=v2();else if(s===3)m.innerHTML=v3();else if(s===4)m.innerHTML=v4();else if(s===5)m.innerHTML=v5();else $('#s5').innerHTML=v6();
 bind();
}

/* 1 — Mes sites */
function v1(){const L=S.size==='big'?BIG:SMALL;
 const head=`<div class="ph"><h1>Organisation</h1><span class="grow"></span><button class="btn" data-t="Nouveau site : un nom, c'est tout">${I.plus} Nouveau site</button></div><p class="sub">Vos sites, et qui y travaille.</p>
 <div class="adm"><div class="stack">${ADMINS.map((a,i)=>av(a,i)).join('')}</div><div><b>Administrateurs de l'organisation</b><div class="muted" style="font-size:12.5px">${ADMINS.join(', ')} · ils voient et gèrent tous les sites</div></div><span class="grow"></span><button class="link" data-t="Ajouter ou retirer un administrateur">Gérer</button></div>`;
 if(S.size==='small')return head+`<div class="cards">${L.map(x=>`<div class="card sc" data-site="${x.n}"><h3>${x.n}</h3><div class="n"><span><b>${x.screens}</b>écrans</span><span><b>${x.people}</b>personnes</span></div><span class="link">Ouvrir ›</span></div>`).join('')}</div>`;
 return head+`<label class="search">${I.search}<input placeholder="Rechercher un site" id="fs"></label><div class="card" id="sl">${siteRows(L)}</div>
 <div class="muted" style="margin-top:10px;font-size:13px">Besoin de retrouver une personne ? <button class="link" data-go="3">Rechercher parmi les 86 personnes</button></div>`}
const siteRows=L=>L.map(x=>`<div class="row c" data-site="${x.n}"><b style="min-width:130px">${x.n}</b><span class="muted" style="width:90px">${x.screens} écrans</span><span class="muted" style="width:110px">${x.people} personnes</span><span class="grow"></span>›</div>`).join('')||'<div class="row muted">Aucun site ne correspond.</div>';

/* 2 — Un site */
function v2(){return `<button class="back" data-go="1">${I.left} Organisation</button>
 <div class="ph"><h1>Lausanne</h1><span class="grow"></span><button class="btn ghost" data-t="Renommer ou supprimer le site">Renommer</button></div>
 <div class="kp"><span><b>6</b>écrans</span><span><b>${LAUS.length+2}</b>personnes</span><span><b>4</b>zones</span></div>
 <div class="lab"><span>Personnes de ce site</span><span class="grow"></span><button class="btn sm" id="addP">${I.plus} Ajouter une personne</button></div>
 <div class="card" id="plist">
  <div class="row hide" id="addrow"><input class="in" placeholder="Adresse e-mail" style="flex:1;max-width:260px"> ${roleSel('Contributeur')} <button class="btn sm" data-t="Invitation envoyée : un e-mail, un rôle, terminé (tous les écrans par défaut)">Inviter</button><button class="link" id="addC">Annuler</button></div>
  ${LAUS.map((p,i)=>`<div class="row"><div class="who">${av(p.n,i+2)}<div><b>${p.n}</b><small>${p.e}</small></div></div><span class="grow"></span><button class="vl" data-go="3" title="Modifier les écrans visibles">${I.eye} ${p.v}</button>${roleSel(p.r,i)}<button class="x" title="Retirer de ce site" data-t="${p.n} n'a plus accès à Lausanne (son compte et ses autres sites ne changent pas)">${I.x}</button></div>`).join('')}
  <div class="row muted" style="font-size:13px"><div class="stack">${ADMINS.map((a,i)=>av(a,i)).join('')}</div><span>+ les 2 administrateurs de l'organisation, qui ont accès à tout</span></div>
 </div>
 <div class="hint">${ROLES.map(r=>`<b>${r}</b> : ${DESC[r]}.`).join('<br>')}</div>
 <div class="lab">Contenu partagé</div>
 <div class="card"><div class="row"><div class="who"><div><b>Reçu d'autres sites</b><small>Siège : « Affiches été », « Charte et logos » · lecture seule</small></div></div><span class="grow"></span><span class="pill blue">2 dossiers</span></div>
 <div class="row"><div class="who"><div><b>Partagé par Lausanne</b><small>« Menu du jour » vers Genève et Fribourg</small></div></div><span class="grow"></span><span class="pill">1 dossier</span></div></div>`}

/* 3 — Une personne */
function v3(){const zs=Object.keys(ZONES);const some=S.vis==='some';
 const label=!some?'Tous les écrans':[...S.zones].join(', ')||'Aucun';
 return `<button class="back" data-go="2">${I.left} Lausanne</button>
 <div class="ph"><div class="who">${av('Inès Garcia',4)}<div><h1 style="font-size:20px">Inès Garcia</h1><small class="muted">ines.garcia@exemple.ch · <span class="pill ok">Actif</span></small></div></div><span class="grow"></span><button class="btn ghost" data-t="Désactiver : plus de connexion, ses accès sont conservés">Désactiver</button></div>
 <div class="lab"><span>Ses sites</span></div>
 <div class="card">
  <div class="row" style="align-items:flex-start"><div style="min-width:130px"><b>Lausanne</b></div><div style="flex:1"><div class="muted" style="font-size:13px">Écrans visibles : <b style="color:var(--ink);font-weight:500">${label}</b> <button class="link" id="visEdit">${S.edit?'Fermer':'Modifier'}</button></div>
   ${S.edit?`<div class="vlist"><div class="row" style="padding:6px 0;border:0"><button class="ck ${!some?'on':''}" data-vm="all"></button><div><b>Tous les écrans</b><div class="muted" style="font-size:12.5px">y compris les futurs</div></div></div>
   ${zs.map(z=>`<div class="row" style="padding:6px 0;border:0;${!some?'opacity:.4':''}"><button class="ck ${!some||S.zones.has(z)?'on':''}" data-zn="${z}"></button><div><span>${z}</span><div class="muted" style="font-size:12.5px">${ZONES[z].join(', ')}</div></div></div>`).join('')}

  <div class="row"><div style="min-width:130px"><b>Genève</b></div><div style="flex:1" class="muted"><span style="font-size:13px">Écrans visibles : Tous les écrans</span></div>${roleSel('Lecteur')}<button class="x" data-t="Inès n'a plus accès à Genève">${I.x}</button></div>
  <div class="row"><select class="in" style="min-width:200px"><option>Ajouter à un site…</option>${BIG.slice(3).map(x=>`<option>${x.n}</option>`).join('')}</select>${roleSel('Contributeur')}<button class="btn sm" data-t="Ajoutée au site, tous les écrans visibles par défaut">Ajouter</button></div>
 </div>
 <div class="row" style="padding:14px 0 0;border:0"><button class="ck" data-t="Administrateur de l'organisation : accès à tous les sites, y compris les futurs"></button><div><b>Administrateur de l'organisation</b><div class="muted" style="font-size:12.5px">Tous les sites, y compris les futurs. Peut créer des sites et inviter.</div></div></div>

/* 4 — Ce que voit la personne : page Écrans */
function v4(){const r=S.role;const all=Object.entries(ZONES).flatMap(([z,l])=>l.map(n=>({n,z})));
 const list=S.vis==='all'?all:all.filter(x=>S.zones.has(x.z));
 return `<div class="ph"><h1>Écrans</h1><span class="muted">Lausanne · ${list.length} écran${list.length>1?'s':''} visible${list.length>1?'s':''}</span><span class="grow"></span>${can.screens(r)?`<button class="btn" data-t="Ajouter un écran : code d'appairage">${I.plus} Ajouter un écran</button>`:''}</div>
 <p class="sub">${r==='Lecteur'?'Vous voyez l\'état des écrans et ce qu\'ils diffusent.':r==='Contributeur'?'Vous voyez les écrans et choisissez ce qu\'ils diffusent.':'Vous gérez les écrans de ce site.'}</p>
 <div class="screens">${list.map((x,i)=>`<div class="card scr"><div class="th"><span class="dot"></span></div><div class="bd"><b>${x.n}</b><div class="muted" style="font-size:12.5px">${['Menu du jour','Affiches été','Promotions'][i%3]}</div><div class="tag"><span class="pill">${x.z}</span></div></div>
  <div class="ft">${r==='Éditeur'?`<button class="btn sm ghost" data-t="Réglages de l'écran : veille, luminosité, zone…">Réglages</button><button class="btn sm ghost" data-t="Choisir la liste diffusée">Changer la liste</button>`:r==='Contributeur'?`<button class="btn sm ghost" data-t="Choisir la liste diffusée">Changer la liste</button>`:'<span class="muted" style="font-size:12.5px">Lecture seule</span>'}</div></div>`).join('')}</div>
 <div class="hint">${r==='Lecteur'?'<b>Lecteur</b> : aucun bouton de modification, nulle part (écrans, médiathèque, listes).':r==='Contributeur'?'<b>Contributeur</b> : pas de « Ajouter un écran » ni de « Réglages ». Il garde la médiathèque, les listes et le choix de la liste d\'un écran.':'<b>Éditeur</b> : tout, y compris ajouter et régler les écrans.'} Les écrans hors de sa visibilité n'apparaissent pas du tout.</div>`}

/* 5 — Partager */
function v5(){
 const ed=can.share(S.role);
 if(S.side==='recip')return `<div class="ph"><h1>Médiathèque</h1><span class="muted">Genève</span></div><p class="sub">Les dossiers de Genève, et ceux que d'autres sites lui partagent.</p>
 <div class="folders"><div class="card fo"><div class="ic"></div><b>Menu du jour</b><div class="muted" style="font-size:12.5px">12 médias</div></div>
 <div class="card fo"><div class="ic"></div><b>Affiches été</b><div class="muted" style="font-size:12.5px">24 médias</div><div class="tag"><span class="pill blue">${I.share} Siège</span><span class="pill">Lecture seule</span></div></div>
 <div class="card fo"><div class="ic"></div><b>Charte et logos</b><div class="muted" style="font-size:12.5px">9 médias</div><div class="tag"><span class="pill blue">${I.share} Siège</span><span class="pill">Lecture seule</span></div></div></div>
 <div class="hint">Genève peut <b>utiliser</b> ces dossiers dans ses listes et les diffuser sur ses écrans. Elle ne peut ni les modifier ni les supprimer. Si le Siège ajoute un média, il apparaît tout seul.</div>`;
 return `<div class="ph"><h1>Médiathèque</h1><span class="muted">Siège</span><span class="grow"></span>${ed?`<button class="btn" id="nf">${I.plus} Nouveau dossier</button>`:''}</div><p class="sub">Les dossiers du Siège, visibles par tout le site.</p>
 <div class="folders">
  ${S.newFolder?`<div class="card fo nw"><div class="ic"></div><b>Nouveau dossier</b><div class="muted" style="font-size:12.5px">vide</div><div class="tag"><span class="pill">Non partagé</span></div><button class="btn sm ghost sh" data-t="Même fenêtre « Partager »">${I.share} Partager</button></div>`:''}
  <div class="card fo"><div class="ic"></div><b>Affiches été</b><div class="muted" style="font-size:12.5px">24 médias</div><div class="tag">${S.done||S.allSites?`<span class="pill blue">${I.share} ${S.allSites?'Tous les sites':[...S.sites].length+' sites'}</span>`:'<span class="pill">Non partagé</span>'}</div>${ed?`<button class="btn sm ghost sh" id="shBtn">${I.share} Partager</button>`:''}</div>
  <div class="card fo"><div class="ic"></div><b>Charte et logos</b><div class="muted" style="font-size:12.5px">9 médias</div><div class="tag"><span class="pill blue">${I.share} Tous les sites</span></div>${ed?`<button class="btn sm ghost sh" data-t="Même fenêtre « Partager »">${I.share} Partager</button>`:''}</div>
  <div class="card fo"><div class="ic"></div><b>Réunions internes</b><div class="muted" style="font-size:12.5px">5 médias</div><div class="tag"><span class="pill">Non partagé</span></div>${ed?`<button class="btn sm ghost sh" data-t="Même fenêtre « Partager »">${I.share} Partager</button>`:''}</div>
 </div>
 ${ed?'':`<div class="hint">Vous êtes <b>Lecteur</b> : vous voyez tout, mais ni « Nouveau dossier » ni « Partager » n'apparaissent.</div>`}
 ${ed?`<div class="hint">Un dossier créé apparaît <b>tout de suite</b>, pour tout le site, quel que soit le rôle ou les écrans visibles de son auteur. Même geste pour partager un média ou une liste : menu ⋯ › « Partager avec des sites… ».</div>`:''}
 <div class="panel" id="panel"><div class="ph2"><h3>Partager « Affiches été »</h3><span class="grow"></span><button class="x" id="pc">${I.x}</button></div>
  <div class="pb"><div class="row" style="padding:8px 0;border:0"><button class="ck ${S.allSites?'on':''}" id="allCk"></button><div><b>Tous les sites</b><div class="muted" style="font-size:12.5px">y compris les sites créés plus tard</div></div></div>
  <div class="lab" style="margin-top:8px">Ou seulement</div>
  ${BIG.slice(1).map(x=>`<div class="row" style="padding:6px 0;border:0;${S.allSites?'opacity:.4':''}"><button class="ck ${S.allSites||S.sites.has(x.n)?'on':''}" data-st="${x.n}"></button><span>${x.n}</span></div>`).join('')}
  <div class="hint">Les sites choisis pourront <b>utiliser</b> ce dossier dans leurs listes. Ils ne pourront pas le modifier.</div></div>
  <div class="pf"><button class="btn ghost" id="pc2">Annuler</button><button class="btn" id="pgo">Partager</button></div></div>`}

/* 6 — Règles et suite */
function v6(){const Y='<span class="yes">✓</span>',N='<span class="no">—</span>';
 return `<h3>Ce qu'on peut faire, selon son rôle dans un site</h3><table class="t"><thead><tr><th></th><th>Lecteur</th><th>Contributeur</th><th>Éditeur</th><th>Administrateur</th></tr></thead><tbody>
 <tr><td>Voir les écrans <span class="muted">(ceux qui lui sont visibles)</span></td><td>${Y}</td><td>${Y}</td><td>${Y}</td><td>${Y}</td></tr>
 <tr><td>Voir médias, listes, dossiers du site et reçus</td><td>${Y}</td><td>${Y}</td><td>${Y}</td><td>${Y}</td></tr>
 <tr><td>Créer et modifier médias, listes, dossiers</td><td>${N}</td><td>${Y}</td><td>${Y}</td><td>${Y}</td></tr>
 <tr><td>Choisir la liste diffusée par un écran, planning</td><td>${N}</td><td>${Y}</td><td>${Y}</td><td>${Y}</td></tr>
 <tr><td>Partager du contenu avec d'autres sites</td><td>${N}</td><td>${Y}</td><td>${Y}</td><td>${Y}</td></tr>
 <tr><td>Ajouter et configurer les écrans, zones</td><td>${N}</td><td>${N}</td><td>${Y}</td><td>${Y}</td></tr>
 <tr><td>Inviter, changer les rôles, créer un site</td><td>${N}</td><td>${N}</td><td>${N}</td><td>${Y}</td></tr></tbody></table>
 <div class="cmp"><div class="card"><h3>Deux règles de visibilité, pas plus</h3><ol style="margin:0;padding-left:18px">
  <li><b>Les écrans</b> : une personne voit tous les écrans d'un site, ou certaines zones. C'est le seul filtre.</li>
  <li><b>Le contenu</b> (médias, listes, dossiers) : toute personne du site le voit. Plus de visibilité par dossier, plus de dossier « privé ».</li></ol>
  <div class="muted" style="margin-top:10px;font-size:13px">Besoin d'un contenu réellement séparé ? On crée un site.</div></div>
 <div class="card"><h3>Ce qu'on retire de la version actuelle</h3><ul style="margin:0;padding-left:18px">
  <li>Les vues Lieux / Personnes, filtres et actions en lot</li>
  <li>Le périmètre aire › zone › écran à trois états, les accès multiples et leurs chevauchements</li>
  <li><b>La visibilité des dossiers</b> par personne ou par rôle, et le partage de dossier par personne</li>
  <li>Les rôles sur mesure (option avancée)</li>
  <li>Le partage entre sites en écriture</li></ul></div></div>
 <div class="card q" style="margin-top:14px"><h3>Briques à ajouter plus tard, une par une</h3><ol style="margin:0;padding-left:18px"><li><b>Responsable de site</b> : Éditeur qui invite les personnes de son site</li><li><b>Recherche et filtres</b>, dès qu'on dépasse ~20 sites</li><li><b>Ajouter plusieurs personnes</b> à un site d'un coup</li><li><b>Partage en écriture</b> entre sites</li><li><b>Rôles sur mesure</b> (Réglages avancés)</li></ol></div>`}

function reopen(){$('#panel').classList.add('on')}
function bind(){
 $$('[data-t]').forEach(b=>b.onclick=()=>{if(b.classList.contains('ck'))b.classList.toggle('on');toast(b.dataset.t)});
 $$('[data-go]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.go;render()});
 $$('[data-site]').forEach(b=>b.onclick=()=>{S.step=2;render()});
 const sz=$('#sz');if(sz)sz.onclick=e=>{const z=e.target.dataset.z;if(z){S.size=z;render()}};
 const fs=$('#fs');if(fs)fs.oninput=()=>{$('#sl').innerHTML=siteRows(BIG.filter(x=>x.n.toLowerCase().includes(fs.value.toLowerCase())));$$('[data-site]').forEach(b=>b.onclick=()=>{S.step=2;render()})};
 const a=$('#addP');if(a){a.onclick=()=>$('#addrow').classList.remove('hide');$('#addC').onclick=()=>$('#addrow').classList.add('hide')}
 $$('#plist select[data-r]').forEach(s=>s.onchange=()=>toast(`Rôle changé : ${s.value} (enregistré tout de suite)`));
 const rl=$('#rl');if(rl)rl.onclick=e=>{const r=e.target.dataset.r;if(r){S.role=r;render()}};
 const vs=$('#vs');if(vs)vs.onclick=e=>{const v=e.target.dataset.v;if(v){S.vis=v;render()}};
 const sd=$('#sd');if(sd)sd.onclick=e=>{const d=e.target.dataset.d;if(d){S.side=d;render()}};
 const ve=$('#visEdit');if(ve)ve.onclick=()=>{S.edit=!S.edit;render()};
 $$('[data-vm]').forEach(b=>b.onclick=()=>{S.vis=S.vis==='all'?'some':'all';render()});
 $$("[data-zn]").forEach(b=>{b.onclick=()=>{if(S.vis==="all")return;const z=b.dataset.zn;S.zones.has(z)?S.zones.delete(z):S.zones.add(z);render()}});
 const nf=$('#nf');if(nf)nf.onclick=()=>{S.newFolder=true;render();toast('Dossier créé : il apparaît immédiatement pour tout le site')};
 const sb=$('#shBtn');if(sb)sb.onclick=reopen;
 const pc=$('#pc');if(pc){const close=()=>$('#panel').classList.remove('on');pc.onclick=close;$('#pc2').onclick=close;
  $('#allCk').onclick=()=>{S.allSites=!S.allSites;render();reopen()};
  $$('[data-st]').forEach(b=>b.onclick=()=>{if(S.allSites)return;const n=b.dataset.st;S.sites.has(n)?S.sites.delete(n):S.sites.add(n);render();reopen()});
  $('#pgo').onclick=()=>{S.done=true;render();toast('Dossier partagé : les sites choisis le voient dans leur médiathèque')}}
}
$('#steps').onclick=e=>{const b=e.target.closest('button');if(b){S.step=+b.dataset.s;render()}};
render();
</script></body></html>
