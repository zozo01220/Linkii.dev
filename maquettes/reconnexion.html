<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette – Reconnexion automatique</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --nuit: #0B1F3A; --acier: #5A6B80; --brume: #DDE3EA; --fond: #F5F7FA;
    --blanc: #FFFFFF; --signal: #3B82C4; --bord2: #C5CED9;
    --maj-dot: #B7791F; --maj-bg: #FBF0DC; --maj-tx: #7A4F12;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 400 15px/1.5 "IBM Plex Sans", sans-serif; background: var(--fond); color: var(--nuit); }

  /* Page factice derrière le blocage */
  .app { display: grid; grid-template-columns: 210px 1fr; min-height: 100vh; }
  .side { background: var(--nuit); padding: 20px 16px; color: #fff; }
  .side b { display: block; font-size: 18px; margin-bottom: 24px; }
  .side span { display: block; padding: 8px 10px; border-radius: 6px; color: #b8c4d4; }
  .side span.on { background: rgba(255,255,255,.1); color: #fff; }
  .main { padding: 28px 32px; }
  h1 { font-size: 22px; margin: 0 0 18px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { background: var(--blanc); border: 1px solid var(--brume); border-radius: 10px; padding: 14px; }
  .thumb { height: 100px; border-radius: 6px; background: var(--brume); margin-bottom: 10px; }
  .card small { color: var(--acier); }

  /* Blocage plein écran */
  .lock {
    position: fixed; inset: 0; z-index: 10000;
    display: grid; place-items: center; padding: 16px;
    background: rgba(11, 31, 58, .62);
    backdrop-filter: blur(3px);
    cursor: wait;
  }
  .box {
    width: min(420px, 100%); background: var(--blanc); border-radius: 14px;
    padding: 32px 28px 26px; text-align: center;
    box-shadow: 0 20px 60px rgba(11, 31, 58, .35);
  }
  .spin {
    width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 50%;
    border: 4px solid var(--brume); border-top-color: var(--signal);
    animation: tourne 0.9s linear infinite;
  }
  @keyframes tourne { to { transform: rotate(360deg); } }
  .box h2 { font-size: 19px; font-weight: 600; margin: 0 0 6px; }
  .box p { margin: 0; color: var(--acier); font-size: 14px; }
  .note {
    margin-top: 18px; padding: 8px 12px; border-radius: 8px; font-size: 13px;
    background: var(--maj-bg); color: var(--maj-tx);
  }

  /* Barre de bascule de la maquette (hors produit) */
  .demo { position: fixed; left: 12px; bottom: 12px; z-index: 10001; background: #fff; border: 1px solid var(--bord2);
          border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--acier); }
  .demo button { font: inherit; margin-left: 6px; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <aside class="side"><b>Linkii</b><span class="on">Écrans</span><span>Médiathèque</span><span>Listes de lecture</span><span>Réglages</span></aside>
  <main class="main">
    <h1>Écrans</h1>
    <div class="cards">
      <div class="card"><div class="thumb"></div><b>Accueil</b><br><small>En ligne</small></div>
      <div class="card"><div class="thumb"></div><b>Cafétéria</b><br><small>En ligne</small></div>
      <div class="card"><div class="thumb"></div><b>Hall</b><br><small>Hors ligne</small></div>
    </div>
  </main>
</div>

<div class="lock" role="alertdialog" aria-modal="true" aria-live="assertive" aria-labelledby="t">
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <h2 id="t">Connexion perdue</h2>
    <p id="d">Reconnexion en cours… la page se rechargera d’elle-même.</p>
    <div class="note">Merci de ne pas fermer cette page.</div>
  </div>
</div>

<div class="demo">Maquette :
  <button onclick="etat(0)">Reconnexion</button>
  <button onclick="etat(1)">Serveur retrouvé</button>
</div>
<script>
  function etat(n) {
    document.getElementById('t').textContent = n ? 'Serveur retrouvé' : 'Connexion perdue';
    document.getElementById('d').textContent = n ? 'Rechargement de la page…' : 'Reconnexion en cours… la page se rechargera d’elle-même.';
  }
</script>
</body>
</html>
