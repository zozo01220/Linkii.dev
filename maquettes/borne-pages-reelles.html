<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Borne interactive (pages réelles)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="../Linkii.Poc/wwwroot/app.css">
<style>
.mock{position:sticky;top:0;z-index:90;background:#fff;border-bottom:1px dashed #CDD3DC;padding:8px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font:12px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#6B7686;height:auto;min-height:45px}
.mock b{color:#0B1F3A}.mock .lbl{color:#8E98A8}
.mseg{display:inline-flex;background:#E8EBF0;border-radius:8px;padding:2px}
.mseg button{border:0;background:none;padding:5px 11px;border-radius:6px;color:#6B7686;font:inherit;cursor:pointer}
.mseg button.on{background:#fff;color:#1B2433;box-shadow:0 1px 2px #0002;font-weight:600}
.shell{min-height:calc(100vh - 45px)}
.nsb{--bg:#fff;width:264px;flex:none;position:sticky;top:45px;height:calc(100vh - 45px);background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px;font-family:inherit}
.nsb *{box-sizing:border-box}
.nsb button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left}
.nsb svg{display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nsb .brand{display:flex;align-items:center;gap:8px;padding:2px 8px 12px}
.nsb .brand img{height:24px;width:auto}
.nsb .meta{display:flex;align-items:center;gap:6px}
.nsb .plan{font-size:10.5px;font-weight:600;letter-spacing:.04em;border-radius:3px;padding:1px 7px;background:var(--row);color:var(--muted)}
.nsb .ver{font-size:11px;color:var(--muted)}
.nsb .fold{margin-left:auto;width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.nsb .fold:hover{background:var(--row)}.nsb .fold svg{width:16px;height:16px}
.nsb .scroll{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.nsb .sp{flex:1;min-height:8px}
.nsb .grp,.nsb .grpbtn{font-size:10.5px;font-weight:600;letter-spacing:.07em;color:#8E98A8;padding:14px 10px 4px;text-transform:uppercase;display:flex;align-items:center;width:100%}
.nsb .grpbtn svg{width:12px;height:12px;margin-left:auto;transition:transform .15s}.nsb .grpbtn.shut svg{transform:rotate(-90deg)}
.nsb .sep{height:1px;background:var(--line);margin:8px 10px}
.nsb .it{display:flex;align-items:center;gap:11px;width:100%;padding:7px 10px;border-radius:5px;color:var(--text,#1B2433);font-size:14px;position:relative}
.nsb .it svg{width:18px;height:18px;color:#5A6678}
.nsb .it:hover{background:var(--row)}
.nsb .it.on{background:var(--signal-t,rgba(59,130,196,.12));font-weight:600;color:var(--ink)}
.nsb .it.on svg{color:var(--signal)}
.nsb .it.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
.nsb .bd{margin-left:auto;font-size:11.5px;min-width:20px;text-align:center;border-radius:9px;padding:0 6px;background:var(--row);color:var(--muted)}
.nsb .bd.warn{background:#E8751A;color:#fff;font-weight:600}.nsb .bd.new{background:#C0392B;color:#fff;font-weight:600}
.nsb .bd+.bd{margin-left:6px}
.nsb .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#C0392B}
.nsb .mode{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:5px;font-size:13.5px;color:var(--muted)}
.nsb .mode>svg{width:18px;height:18px}
.nsb .mode .sw{margin-left:auto;width:32px;height:18px;border-radius:9px;background:#CDD3DC;position:relative;transition:.15s}
.nsb .mode .sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0004;transition:.15s}
.nsb .mode.on .sw{background:var(--signal)}.nsb .mode.on .sw::after{left:16px}
.nsb .mode small{display:none}
.nsb .user{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:6px;padding:10px 8px 2px}
.nsb .avatar{width:32px;height:32px;border-radius:50%;background:var(--brand,#0B1F3A);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.nsb .who{min-width:0;line-height:1.25;flex:1}.nsb .who b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nsb .who small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nsb .user>svg{width:16px;height:16px;color:#9AA3B0}

/* ---------- style Android (Material 3) ---------- */
.nsb.and{--bg:#EEF2F8;width:300px;font-family:Roboto,"Segoe UI",system-ui,sans-serif;border-right:0;border-radius:0 28px 28px 0;padding:12px 12px 10px;height:calc(100vh - 45px)}
.nsb.and .brand{padding:10px 16px 14px}.nsb.and .brand img{height:26px}
.nsb.and .plan{background:#D5E4F7;color:#0A2A4A;border-radius:8px;font-weight:500;letter-spacing:.01em;font-size:11px;padding:2px 8px}
.nsb.and .grp,.nsb.and .grpbtn{font-size:14px;font-weight:500;text-transform:none;letter-spacing:.01em;color:#44474E;padding:16px 16px 6px}
.nsb.and .sep{margin:8px 16px;background:#C4C6D0}
.nsb.and .it{height:56px;padding:0 24px 0 16px;border-radius:28px;gap:12px;font-size:14.5px;font-weight:500;color:#44474E}
.nsb.and .it svg{width:24px;height:24px;color:inherit}
.nsb.and .it:hover{background:#0B1F3A14}
.nsb.and .it.on{background:#D5E4F7;color:#0A2A4A}
.nsb.and .it.on svg{fill:rgba(10,42,74,.14);color:#0A2A4A}
.nsb.and .it.on::before{display:none}
.nsb.and .bd{background:none;color:#44474E;font-size:12px;font-weight:500}
.nsb.and .bd.warn{background:#E8751A;color:#fff;border-radius:10px;padding:1px 7px}.nsb.and .bd.new{background:#B3261E;color:#fff;border-radius:10px;padding:1px 7px}
.nsb.and .mode{margin:6px 4px 0;padding:10px 12px 10px 16px;border-radius:16px;background:#F7F9FC;width:auto;gap:12px;color:#191C20}
.nsb.and .mode>svg{width:22px;height:22px;color:#44474E}
.nsb.and .mode span:nth-child(2){flex:1;line-height:1.2;font-size:14px;font-weight:500}
.nsb.and .mode small{display:block;font-size:11.5px;font-weight:400;color:#44474E}
.nsb.and .mode .sw{width:52px;height:32px;border-radius:16px;border:2px solid #74777F;background:none}
.nsb.and .mode .sw::after{left:6px;top:6px;width:16px;height:16px;background:#74777F;box-shadow:none}
.nsb.and .mode.on .sw{background:#0B1F3A;border-color:#0B1F3A}.nsb.and .mode.on .sw::after{left:24px;top:2px;width:24px;height:24px;background:#fff}
.nsb.and .user{border-top:0;margin:8px 4px 0;padding:8px 8px 8px 12px;border-radius:28px}
.nsb.and .avatar{width:40px;height:40px;font-weight:500;font-size:14px}

/* barre d'onglets des pages « hub » */
.hubtabs{display:flex;gap:2px;margin:-8px 0 20px;border-bottom:1px solid var(--line)}
.hubtabs button{border:0;background:none;padding:10px 16px;font:inherit;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.hubtabs button.on{color:var(--ink);font-weight:600;border-color:var(--signal)}
.hubtabs button:hover{color:var(--ink)}
.note{position:fixed;right:16px;bottom:14px;z-index:80;background:#0B1F3A;color:#fff;font:12px/1.4 "IBM Plex Sans",system-ui,sans-serif;padding:8px 12px;border-radius:6px;max-width:360px;opacity:.94}

/* ===== Carte écran en TV ===== */
.tvc{position:relative;display:flex;flex-direction:column;padding:12px 12px 12px;background:#fff;border:1px solid var(--line);border-radius:var(--card-radius,12px);cursor:pointer;transition:box-shadow .15s,border-color .15s;min-width:0}
.tvc:hover{border-color:var(--line-2);box-shadow:0 4px 14px rgba(11,31,58,.08)}
.tvc .chk{position:absolute;left:12px;top:12px;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:4px;background:#fff;opacity:0;z-index:3}
.tvc .more{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);opacity:0;z-index:3}
.tvc:hover .chk,.tvc:hover .more{opacity:1}
.tvc .stage{height:196px;display:grid;place-items:center;background:linear-gradient(#F1F4F9,#E8EDF4);border-radius:8px}
.tv{display:flex;flex-direction:column;align-items:center}
.tv .bezel{position:relative;background:#10151D;border-radius:6px;padding:5px;box-shadow:0 6px 14px rgba(11,31,58,.28),inset 0 0 0 1px #2A3342}
.tv.land .bezel{width:216px;height:121px}
.tv.port .bezel{width:86px;height:153px}
.tv .scr{position:relative;width:100%;height:100%;border-radius:2px;overflow:hidden;background:#000;color:#fff;display:grid;place-items:center}
.tv .scr::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.14) 0,rgba(255,255,255,0) 38%);pointer-events:none}
.tv .led{position:absolute;right:7px;bottom:1.5px;width:4px;height:4px;border-radius:50%;background:#1E8E5A}
.tv.off .led{background:#C8352F}
.tv .neck{width:10px;height:8px;background:#2A3342}.tv.port .neck{height:6px}
.tv .foot{width:64px;height:4px;border-radius:2px;background:#3A4558}.tv.port .foot{width:46px}
.tv .c{width:100%;height:100%;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:600;padding:6px}
.tv.port .c{font-size:10.5px}
.tv.off .scr>.c{filter:grayscale(1) brightness(.45)}
.tv .ovl{position:absolute;left:0;right:0;bottom:0;padding:3px 4px;font-size:10.5px;font-weight:600;background:#C8352F;color:#fff;text-align:center;z-index:2}
.tv .none{width:100%;height:100%;background:#0F0F0F;display:grid;place-items:center;color:#555;font-size:11px}
.tvc .meta{padding:10px 2px 0}
.tvc .r1{display:flex;align-items:center;gap:8px}
.tvc .r1 b{font-weight:500;font-size:15.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvc .dt{width:9px;height:9px;border-radius:50%;background:#1E8E5A;flex:none}.tvc .dt.off{background:#C8352F}
.tvc .fmt{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.tvc .tsm{color:var(--muted);font-size:12.5px;margin-top:2px}
.tvc .tpl{display:flex;gap:6px;align-items:center;margin-top:6px;color:var(--muted);font-size:12.5px}
.tvc.is-off .r1 b{color:var(--muted)}
.tv .ovl{white-space:nowrap}.tv.port .ovl{font-size:9px;padding:3px 2px}
.tvc svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tvc .more svg{width:16px;height:16px;fill:currentColor;stroke:none}

/* ===== Borne interactive : ajouts de la maquette ===== */
.mock .bxs{display:inline-flex;gap:3px;flex-wrap:wrap}
.mock .bxs button{border:1px solid #D5DBE4;background:#fff;color:#6B7686;font:inherit;padding:3px 9px;border-radius:14px;cursor:pointer}
.mock .bxs button.on{background:#0B1F3A;border-color:#0B1F3A;color:#fff}
.bx-svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bx-new{display:inline-block;background:#E8710A;color:#fff;font-size:10px;font-weight:600;padding:0 6px;border-radius:8px;margin-left:6px;vertical-align:middle}
.bx-t{background:#EEF4FB;border-color:#CFE0F2!important;color:#285D91!important;display:inline-flex;gap:3px;align-items:center}
.bx-t svg{width:12px;height:12px}
.bx-rel{position:relative;display:inline-block}
.bx-menu{position:absolute;right:0;top:100%;margin-top:6px;background:#fff;border:1px solid var(--line-2);border-radius:8px;box-shadow:0 10px 30px rgba(11,31,58,.18);width:310px;z-index:20;padding:6px}
.bx-menu button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;font:inherit}
.bx-menu button:hover{background:var(--row)}.bx-menu small{display:block;color:var(--muted);font-size:12px}
.bx-veil{position:fixed;inset:45px 0 0 0;background:rgba(11,31,58,.38);z-index:70}
.bx-drw{position:fixed;top:45px;right:0;bottom:0;width:560px;max-width:96vw;background:#fff;z-index:71;box-shadow:-14px 0 40px rgba(11,31,58,.22);display:flex;flex-direction:column}
.bx-drw .dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.bx-drw .dh h2{font-size:19px;flex:1;margin:0;font-weight:500}
.bx-drw .dh .x{cursor:pointer;color:var(--muted);font-size:22px;line-height:1;border:0;background:none}
.bx-drw .db{padding:18px 22px;overflow:auto;flex:1}.bx-drw .df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.bx-lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:500}
.bx-h{color:var(--muted);font-size:13px;display:block}
.bx-opt{display:flex;gap:14px;align-items:center;border:1px solid var(--line-2);border-radius:8px;padding:13px 15px;margin-bottom:10px;background:#fff;cursor:pointer}
.bx-opt.on{border-color:var(--signal);background:#F4F8FC;box-shadow:inset 3px 0 0 var(--signal)}
.bx-opt .ic{width:38px;height:38px;border-radius:6px;background:var(--row);display:grid;place-items:center;flex:none}.bx-opt.on .ic{background:var(--brand);color:#fff}
.bx-opt small{display:block;color:var(--muted);font-size:13px}.bx-opt .rad{width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:50%;margin-left:auto;flex:none}.bx-opt.on .rad{border-color:var(--signal);background:radial-gradient(var(--signal) 0 45%,#fff 50%)}
.bx-pill{font-size:11px;border:1px solid #CFE0F2;border-radius:999px;padding:0 7px;color:#285D91;background:#EEF4FB;white-space:nowrap}
.bx-dl{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;gap:14px;align-items:center;background:#FAFBFC;margin:6px 0 10px}
.bx-dl .ic{width:42px;height:42px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center}.bx-dl small{color:var(--muted);display:block;font-size:12px}
.bx-ora{background:#E8710A!important;border-color:#E8710A!important;color:#fff!important}
.bx-code{display:flex;gap:8px;margin:8px 0 10px}
.bx-code input{width:46px;height:58px;text-align:center;font-size:26px;border:1px solid var(--line-2);border-radius:6px;font-family:var(--mono);text-transform:uppercase}
.bx-code input:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 2px #E3EEF8}
.bx-st{font-size:13px;color:var(--muted)}.bx-st.ok{color:var(--ok);font-weight:500}
.bx-field{border:1px solid var(--line-2);border-radius:var(--radius);padding:8px 12px;background:#fff;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.bx-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px}
.bx-card h3{font-size:16px;font-weight:500;margin:0}.bx-card>.bx-h{margin:2px 0 14px}
.bx-ch{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}.bx-ch>div:first-child{flex:1}
.bx-two{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
.bx-tl{display:flex;flex-direction:column;gap:8px}
.bx-tr{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff}
.bx-tr .g{color:var(--line-2);cursor:grab;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.bx-tr .sq{width:46px;height:34px;border-radius:5px;flex:none;display:grid;place-items:center;color:#fff;font-size:11px;background-size:cover}
.bx-tr small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bx-tr .grow{flex:1;min-width:0}
.bx-tr.err{border-color:#EBC2BE;background:#FDF6F5}.bx-tr.err small{color:var(--danger-ink)}
.bx-tr.new{animation:bxpop 1s}@keyframes bxpop{0%{background:#FFF3E0;transform:scale(1.02)}100%{background:#fff;transform:none}}
.bx-mini{background:#0B1F3A;border-radius:10px;padding:12px;display:grid;place-items:center}
.bx-mini .k{width:100%;aspect-ratio:16/9;background:#fff;border-radius:3px;padding:6%;display:flex;flex-direction:column;gap:3%;container-type:inline-size}
.bx-mini.port .k{width:58%;aspect-ratio:9/16}
.bx-mini .lg{display:flex;gap:6px;align-items:center;font-size:max(9px,5cqw);font-weight:500}.bx-mini .lg i{width:14%;aspect-ratio:1;border-radius:3px;background:var(--brand)}
.bx-mini .g{display:grid;grid-template-columns:repeat(3,1fr);gap:4%;flex:1}.bx-mini.port .g{grid-template-columns:repeat(2,1fr)}
.bx-mini .g i{border-radius:4px}
.bx-mini.acc .g{flex:0 0 48%;margin-top:auto}
.bx-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden}
.bx-seg button{border:0;background:#fff;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.bx-seg button+button{border-left:1px solid var(--line-2)}
.bx-seg button.on{background:var(--brand);color:#fff}
.bx-seg .ori{display:inline-block;border:1.6px solid currentColor;border-radius:2px}
.bx-seg .ori.p{width:9px;height:14px}.bx-seg .ori.l{width:14px;height:9px}
.bx-slider{height:4px;background:var(--line-2);border-radius:2px;position:relative;margin:14px 0 6px}.bx-slider i{position:absolute;left:0;top:0;height:4px;background:var(--signal);border-radius:2px}.bx-slider b{position:absolute;top:-6px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--signal);margin-left:-8px}
.bx-row{display:flex;gap:16px;flex-wrap:wrap}.bx-row>*{flex:1;min-width:200px}
.bx-sw{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}.bx-sw:last-child{margin-bottom:0}
.bx-sw .s{width:40px;height:22px;border-radius:11px;background:var(--line-2);position:relative;flex:none;cursor:pointer;margin-top:1px}.bx-sw .s::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .12s}
.bx-sw .s.on{background:var(--signal)}.bx-sw .s.on::after{left:21px}
.bx-sw small{display:block;color:var(--muted);font-size:13px}
.bx-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.bx-pk{border:1px solid var(--line-2);border-radius:8px;overflow:hidden;cursor:pointer;background:#fff}.bx-pk.on{border-color:var(--signal);box-shadow:0 0 0 3px rgba(59,130,196,.2)}
.bx-pk .t{aspect-ratio:4/3;display:grid;place-items:center;color:#fff;font-size:11px}.bx-pk .n{padding:6px 8px;font-size:12px;line-height:1.3}.bx-pk .n small{display:block;color:var(--muted);font-size:11px}
.bx-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.bx-cats button{font:inherit;padding:4px 12px;border:1px solid var(--line-2);border-radius:16px;font-size:13px;color:var(--muted);background:#fff;cursor:pointer}.bx-cats button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.bx-cols{display:flex;gap:8px;margin-bottom:14px;align-items:center}.bx-cols i{width:30px;height:30px;border-radius:6px;cursor:pointer;border:2px solid transparent}.bx-cols i.on{border-color:var(--ink)}
.bx-adv{border-top:1px dashed var(--line-2);margin-top:6px;padding-top:12px}
.bx-adv summary{cursor:pointer;color:var(--ink);font-weight:500;font-size:14px;list-style:none;display:flex;gap:8px;align-items:center}.bx-adv summary::-webkit-details-marker{display:none}
.bx-adv[open] summary{margin-bottom:12px}
.bx-banner{background:#EEF4FB;border:1px solid #CFE0F2;color:#285D91;border-radius:8px;padding:10px 14px;font-size:13px;margin:0 0 16px}
.bx-warn{background:var(--warn-bg);border:1px solid #EBD3A6;color:var(--warn-ink);border-radius:8px;padding:9px 12px;font-size:13px;margin-top:10px}
.bx-okb{background:var(--ok-bg);border:1px solid #BFDCCB;color:var(--ok-ink);border-radius:8px;padding:9px 12px;font-size:13px;margin-top:10px}
.bx-hand{position:absolute;left:10px;top:10px;width:30px;height:30px;border-radius:50%;background:#fff;color:#0B1F3A;display:grid;place-items:center;box-shadow:0 1px 4px rgba(11,31,58,.35);z-index:3}
.bx-hand svg{width:17px;height:17px}
.tvc .stage{position:relative}
.bx-chips{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.bx-chips button{font:inherit;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line-2);background:#fff;color:var(--ink);border-radius:var(--radius)}
.bx-chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.bx-chips button small{font-family:var(--mono);font-size:11px;opacity:.7}.bx-chips svg{width:15px;height:15px}
.bx-cv{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,#2F7CC4,#0B1F3A);touch-action:none;container-type:inline-size;margin:0 auto}
.bx-cv.port{aspect-ratio:9/16;max-width:290px}
.bx-cv .lab{position:absolute;left:0;right:0;bottom:8%;text-align:center;color:#fff;font-weight:500;font-size:clamp(12px,5cqw,22px);opacity:.9}
.bx-w{position:absolute;background:rgba(255,255,255,.18);border:1.5px dashed rgba(255,255,255,.7);border-radius:8px;color:#fff;padding:5px 10px;cursor:grab;user-select:none;font-size:clamp(10px,3.4cqw,15px);line-height:1.25;backdrop-filter:blur(3px);white-space:nowrap}
.bx-w.dragging{cursor:grabbing;background:rgba(255,255,255,.3);border-color:#fff}
.bx-w b{display:block;font-size:1.6em;font-weight:500}.bx-w.off{display:none}
.bx-wl{display:flex;flex-direction:column;gap:8px}
.bx-wi{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff}
.bx-wi small{color:var(--muted);display:block;font-size:12px;font-family:var(--mono)}
.bx-pl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bx-pl>div{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--row);background:#fff;font-size:14px}.bx-pl>div:last-child{border-bottom:0}
.bx-src{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:2px 9px;border-radius:10px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.bx-src.inh{background:#EEF4FB;border-color:#CFE0F2;color:#285D91}.bx-src.own{background:var(--brand);border-color:var(--brand);color:#fff}
.bx-blk{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bx-pt{display:grid;grid-template-columns:minmax(220px,1.3fr) 1.6fr 1fr 110px;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--row);background:#fff}
.bx-pt:last-child{border-bottom:0}
.bx-pt.h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#FAFBFC;border-bottom:1px solid var(--line)}
.bx-pt.hl{background:#F4F8FC;box-shadow:inset 3px 0 0 var(--signal)}
.bx-pt .who{display:flex;gap:10px;align-items:center}.bx-pt .who small{color:var(--muted);font-size:12px;display:block;line-height:1.2}
.bx-pt .mh{width:26px;height:26px;border-radius:50%;background:var(--row);display:grid;place-items:center;flex:none}.bx-pt .mh svg{width:15px;height:15px}
.bx-pt.l1 .who{padding-left:22px}.bx-pt.l2 .who{padding-left:44px}
/* statistiques */
.bx-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.bx-kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}.bx-kpi small{color:var(--muted);font-size:12px;display:block}.bx-kpi b{font-size:26px;font-weight:500;display:block;line-height:1.2;margin-top:2px}.bx-kpi em{font-style:normal;font-size:12px;color:var(--ok)}
.bx-bars{display:flex;flex-direction:column;gap:9px}
.bx-bar2{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;font-size:14px}.bx-bar2 span:nth-child(2){height:10px;background:var(--row);border-radius:5px;overflow:hidden}.bx-bar2 i{display:block;height:100%;border-radius:5px}
.bx-bar2 span:last-child{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.bx-hrs{display:flex;gap:4px;align-items:flex-end;height:120px;padding-top:6px}.bx-hrs i{flex:1;background:var(--signal);border-radius:3px 3px 0 0;opacity:.85}
.bx-hrl{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-family:var(--mono);margin-top:4px}
/* récap */
.bx-rc{display:grid;grid-template-columns:180px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.bx-rc>div{padding:11px 16px;border-bottom:1px solid var(--row);font-size:14px}.bx-rc>div:nth-child(odd){font-weight:500;background:#FAFBFC}
.bx-rc>div:nth-last-child(-n+2){border-bottom:0}
.bx-rc ul{margin:0;padding-left:18px}.bx-rc li{margin:2px 0}
.bx-q{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bx-q div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px}.bx-q b{display:block;margin-bottom:4px}.bx-q small{color:var(--muted);font-size:13px;display:block}
.bx-q .rec{color:var(--ok-ink);font-size:13px;margin-top:6px;display:block}
/* borne visiteur */
.bx-stage{background:#101822;border-radius:12px;padding:22px;display:grid;place-items:center}
.bx-stage>div{width:100%;max-width:900px}.bx-stage.port>div{max-width:430px}
.bx-k{aspect-ratio:16/9;background:#fff;position:relative;overflow:hidden;border-radius:3px;user-select:none;container-type:inline-size}
.bx-stage.port .bx-k{aspect-ratio:9/16}
.bx-kp{position:absolute;inset:0;display:none;padding:4.5% 5%;flex-direction:column;gap:2.4%}.bx-kp.on{display:flex}
.bx-kp .lg{display:flex;gap:2%;align-items:center;font-weight:500;font-size:2.4cqw;color:var(--muted)}.bx-kp .lg i{width:4cqw;aspect-ratio:1;border-radius:4px;background:var(--brand)}
.bx-stage.port .bx-kp .lg{font-size:4.4cqw}.bx-stage.port .bx-kp .lg i{width:8cqw}
.bx-kp h2{font-size:4cqw;line-height:1.15;margin:0;font-weight:500}.bx-stage.port .bx-kp h2{font-size:8cqw}
.bx-kp p{color:var(--muted);font-size:1.8cqw;margin:0}.bx-stage.port .bx-kp p{font-size:3.8cqw}
.bx-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:2.2cqw;flex:1}
.bx-stage.port .bx-tiles{grid-template-columns:repeat(2,1fr);gap:3.4cqw}
.bx-k.acc .bx-kp[data-pg=home] .bx-tiles{flex:0 0 50%;margin-top:auto}
.bx-tile{border-radius:1.2cqw;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:6%;font-weight:500;font-size:2.4cqw;cursor:pointer;border:0;text-align:left;transition:transform .12s;line-height:1.2;font-family:inherit}
.bx-stage.port .bx-tile{font-size:4.8cqw;border-radius:2.4cqw}
.bx-tile small{font-weight:400;font-size:.6em;opacity:.85;margin-top:.3em;color:#fff;display:block}.bx-tile:active{transform:scale(.96)}
.bx-back{align-self:flex-start;background:var(--brand);color:#fff;border:0;border-radius:30px;padding:.45em 1.2em;font-size:1.8cqw;cursor:pointer;font-family:inherit}
.bx-stage.port .bx-back{font-size:3.8cqw}
.bx-k.acc .bx-back{order:9;align-self:stretch;text-align:center;padding:.8em}
.bx-cont{flex:1;border-radius:8px;display:grid;place-items:center;color:var(--muted);position:relative;font-size:1.8cqw;text-align:center}
.bx-stage.port .bx-cont{font-size:3.6cqw}
.bx-qr{position:absolute;right:3%;bottom:3%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:2%;display:flex;gap:6%;align-items:center;font-size:1.4cqw;color:var(--ink);width:26%}
.bx-stage.port .bx-qr{font-size:2.8cqw;width:50%}
.bx-qr i{width:42%;aspect-ratio:1;flex:none;background:repeating-conic-gradient(#0B1F3A 0 25%,#fff 0 50%) 0 0/25% 25%;border:3px solid #0B1F3A}
.bx-urlb{display:flex;gap:8px;align-items:center;background:var(--row);border-radius:6px;padding:.5em .8em;font-size:1.5cqw;color:var(--muted);font-family:var(--mono)}.bx-stage.port .bx-urlb{font-size:3cqw}
.bx-bar{position:absolute;left:0;bottom:0;height:5px;background:var(--signal);z-index:4}
.bx-idle{position:absolute;inset:0;display:none;z-index:3;background:linear-gradient(135deg,#0B1F3A,#2F7CC4);color:#fff}.bx-idle.on{display:block}
.bx-idle .wg{position:absolute;font-size:2cqw;line-height:1.25}.bx-stage.port .bx-idle .wg{font-size:4cqw}
.bx-idle .wg b{display:block;font-size:2.6em;font-weight:500;letter-spacing:-.02em}
.bx-idle .sl{position:absolute;left:5%;right:5%;bottom:13%;background:rgba(255,255,255,.14);border-radius:10px;padding:3% 4%;font-size:2.6cqw}.bx-stage.port .bx-idle .sl{font-size:5cqw;bottom:16%}
.bx-idle .tc{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-size:1.6cqw;animation:bxp 1.8s infinite}.bx-stage.port .bx-idle .tc{font-size:3.4cqw}
@keyframes bxp{50%{opacity:.3}}
.bx-cap{color:#9FB0C4;font-size:13px;margin-top:12px;text-align:center}
.bx-bs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}.bx-bs span{font-size:12px;padding:3px 10px;border:1px solid #2A3A4E;border-radius:14px;color:#9FB0C4}.bx-bs span.on{background:var(--signal);border-color:var(--signal);color:#fff}
.bx-vtools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bx-pcbox{background:#101822;border-radius:10px;padding:10px;display:grid;place-items:center}.bx-pcbox .s{width:100%;aspect-ratio:16/9;background:#1D2B3C;border-radius:3px;display:grid;place-items:center;text-align:center;color:#fff;padding:6%}
.bx-pcbox.port .s{width:42%;aspect-ratio:9/16}
.bx-pcbox .cd{font-family:var(--mono);font-size:24px;letter-spacing:.14em;margin:6px 0}
.bx-note{position:sticky;bottom:0;background:#FFF8E1;border-top:1px dashed #E0B84A;padding:8px 18px;font-size:12.5px;color:#6B5200;margin-top:20px}
@media (max-width:1100px){.bx-two{grid-template-columns:1fr}.bx-kpis{grid-template-columns:repeat(2,1fr)}.bx-q{grid-template-columns:1fr}.bx-pt{grid-template-columns:1fr 1fr}}
</style>

function bxStatsTab(){

  const hrs=[2,3,8,22,38,51,44,60,72,48,40,30,18,9];

function bxVisiteur(){
  const vt=visTiles();

    let c;
    if(t.k==='Site web')c=`<div class="bx-urlb">🔒 unil.ch <span style="flex:1"></span>Navigation limitée à ce site</div><div class="bx-cont" style="background:#F5F7FA;border:1px solid var(--line)">Page du site, défilable au doigt</div>`;
    else if(t.k==='PDF')c=`<div class="bx-cont" style="background:#F5F7FA;border:1px solid var(--line)">${t.s.split(' · ')[0]}<br>page 1 / ${(t.s.match(/(\d+) pages/)||[0,1])[1]} · glissez pour tourner</div>`;
    else if(t.k==='Présentation')c=`<div class="bx-cont" style="background:#EDF1F5">Diapositive 1 / 9 · glissez pour changer</div>`;
    else c=`<div class="bx-cont" style="background:repeating-linear-gradient(45deg,#EDF1F5 0 10px,#fff 10px 20px)">Plan · vous êtes ici ●</div>`;
    const qr=t.qr&&BX.sw.qr?`<div class="bx-qr"><i></i><span>Emporter sur mon téléphone</span></div>`:'';
    return `<div class="bx-kp" data-pg="${t.id}"><button class="bx-back" data-kgo="home">← Retour</button><h2>${t.t}</h2>${c}${qr}</div>`;};
  window.__bxNames=Object.fromEntries([['home','Accueil'],...vt.map(t=>[t.id,t.t])]);
  const wg=(k,html)=>BX.w[k][2]?`<div class="wg" style="left:${BX.w[k][0]}%;top:${BX.w[k][1]}%">${html}</div>`:'';
  return bxBorneHead()+`<div class="bx-vtools">${oriSeg()}<div class="bx-sw" style="margin:0;align-items:center"><span class="s${BX.acc?' on':''}" data-bx="acc"></span><b style="font-weight:400">Accessibilité</b></div><span style="flex:1"></span><button class="btn ghost sm" data-bx="go:visiteur">Recommencer</button></div>
   <div class="bx-stage ${ORI()?'port':''}"><div><div class="bx-k ${BX.acc?'acc':''}" id="bxK">
   <div class="bx-kp on" data-pg="home"><div class="lg"><i></i>Université de Lausanne</div><h2>Bienvenue</h2><p>Touchez une tuile pour commencer.</p>
     <div class="bx-tiles">${vt.map(t=>`<button class="bx-tile" style="background:${t.c}${BX.sw.big?';font-size:1.2em':''}" data-kgo="${t.id}">${t.t}<small>${t.s.split(' · ')[0]}</small></button>`).join('')}</div></div>
   ${vt.map(page).join('')}
   <div class="bx-idle" id="bxIdle">${wg('clk','<b id="bxClk">12:00</b>Mardi 27 octobre')}${wg('wx','<b>12 °C</b>⛅ Lausanne')}<div class="sl">Menu du midi · Soupe, plat du jour, dessert</div><div class="tc">Touchez l’écran pour commencer</div></div>
   <div class="bx-bar" id="bxBar" style="width:100%"></div></div>
   <p class="bx-cap" id="bxCap">Page : Accueil</p><div class="bx-bs"><span class="on" id="bb1">Accueil</span><span id="bb2">Page ouverte</span><span id="bb3">Retour auto à l’accueil</span><span id="bb4">Diffusion (liste, planning, widgets)</span></div></div></div>
   <span class="bx-h" style="margin-top:12px">Cliquez dans l’écran comme un visiteur. Délais accélérés (12 s) pour la démonstration. La tuile « Plan d’évacuation » est en erreur : elle n’apparaît pas.</span>`;}

    <div><b>Dans quel plan ?</b><small>Borne dans Pro uniquement, ou dans tous les plans payants.</small><span class="rec">Proposition : Pro.</span></div>
    <div><b>Sous-menus</b><small>Une tuile qui ouvre un groupe de tuiles (ex. « Services » › 4 services).</small><span class="rec">Proposition : plus tard.</span></div>
    <div><b>Plusieurs langues</b><small>Bouton FR / EN à l’accueil, titres de tuiles traduits.</small><span class="rec">Proposition : plus tard.</span></div>
    <div><b>Accueil en composition</b><small>Remplacer la grille par une composition avec zones cliquables (l’éditeur de la 1re maquette).</small><span class="rec">Proposition : plus tard.</span></div>
    <div><b>Mode borne sur Android</b><small>Le player est le même ; il reste le verrouillage (épinglage d’écran).</small><span class="rec">Proposition : après validation sur Windows.</span></div>
    <div><b>Onglets ou filtre</b><small>Sur la page Écrans : filtre + icône (maquette) ou deux onglets séparés.</small><span class="rec">Proposition : filtre + icône.</span></div>
   </div>
   <h2 style="font-size:18px;font-weight:500;margin:24px 0 10px">Hors de la version légère</h2>
   <div class="bx-banner" style="margin:0">Formulaires et saisie de données (RGPD), paiement, impression de tickets, lecteur de badge, navigation web libre, prise de rendez-vous.</div>`;}

function bxMain(){
  if(['ecrans','ajout','code'].includes(BX.scn))return bxEcrans()+bxDrawer();
  if(['menu','tuile','veille','params','stats'].includes(BX.scn))return bxBorne();
  if(BX.scn==='recap')return bxRecap();
  return bxVisiteur();}
const _rm=renderMain;
const NOTE='<div class="bx-note">Maquette : pages réelles de l’app ; seuls la borne, ses réglages et ses tiroirs sont nouveaux. Rien n’est codé.</div>';
renderMain=function(){
  if(BX.scn==='planning'&&st.page==='screens')BX.scn='ecrans';
  if(BX.apres&&BX.scn==='planning'&&st.page==='planning'){
    _rm();const m=document.getElementById('main'),t=m.querySelector('.hubtabs');
    while(t&&t.nextSibling)m.removeChild(t.nextSibling);
    m.insertAdjacentHTML('beforeend',bxPlanning()+NOTE);
  } else if(st.page==='screens'&&BX.apres){document.getElementById('main').innerHTML=bxMain()+NOTE;bxAfter();}
  else _rm();
  document.querySelectorAll('#bxSeg button').forEach(b=>b.classList.toggle('on',BX.apres&&b.dataset.s===BX.scn));
  document.querySelectorAll('#avSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.a===BX.apres));
};
function bxGo(s){
  BX.scn=s;BX.addMenu=false;BX.apres=1;
  if(['menu','tuile','veille','params','stats'].includes(s))BX.tab=s==='tuile'?'menu':s;
  if(['menu','tuile','veille','params','stats','visiteur','planning','recap'].includes(s))BX.paired=true;
  st.page=s==='planning'?'planning':'screens';render();window.scrollTo(0,0);}
document.addEventListener('click',e=>{
  const a=e.target.closest('#bxSeg button');if(a){bxGo(a.dataset.s);return}
  const v=e.target.closest('#avSeg button');if(v){BX.apres=+v.dataset.a;st.page='screens';if(BX.apres)BX.scn='ecrans';render();return}
  const o=e.target.closest('[data-bxopen]');if(o&&!e.target.closest('.more')){bxGo('menu');return}
  const x=e.target.closest('[data-bx]');if(!x)return;
  const d=x.dataset.bx,[k,val]=d.split(':');
  if(d==='addmenu'){BX.addMenu=!BX.addMenu;renderMain();return}
  if(k==='go'){bxGo(val);return}
  if(k==='tab'){BX.tab=val;BX.scn=val;renderMain();window.scrollTo(0,0);return}
  if(k==='flt'){BX.flt=val;renderMain();return}
  if(k==='wt'){BX.w[val][2]=BX.w[val][2]?0:1;renderMain();return}
  if(k==='sw'){BX.sw[val]=BX.sw[val]?0:1;renderMain();return}
  if(k==='ori'){BX.ori=val;renderMain();return}
  if(k==='cat'){BX.cat=val;renderMain();return}
  if(d==='acc'){BX.acc=!BX.acc;renderMain();return}
  if(d==='paired'){BX.paired=true;BX.ori='port';bxGo('menu');return}
  if(d==='tile'){BX.tile=true;bxGo('menu');return}
});

/* ---------- Interactions : code, sélections, widgets, borne ---------- */
let bxT,bxT0,bxTOT=12000;
function bxAfter(){
  const ins=[...document.querySelectorAll('#bxCode input')];
  ins.forEach((el,i)=>{
    el.addEventListener('input',()=>{el.value=el.value.replace(/[^a-z0-9]/gi,'').toUpperCase();if(el.value&&ins[i+1])ins[i+1].focus();chk()});
    el.addEventListener('keydown',ev=>{if(ev.key==='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus()});
    el.addEventListener('paste',ev=>{const t=(ev.clipboardData.getData('text')||'').replace(/[^a-z0-9]/gi,'').toUpperCase();if(!t)return;ev.preventDefault();ins.forEach((y,j)=>y.value=t[j]||'');chk()});});
  function chk(){const v=ins.map(y=>y.value).join(''),s=document.getElementById('bxSt');
    if(v.length<6){s.className='bx-st';s.textContent='La borne se relie dès que le code est complet. Essayez : 4K79M2';return}
    if(v==='4K79M2'){s.className='bx-st ok';s.textContent='✓ Borne reliée';document.getElementById('bxAfter').style.display='block';document.getElementById('bxSave').disabled=false;
      document.getElementById('bxPc').innerHTML='<div><div style="font-size:12px">✓ Reliée</div><div style="font-size:10px;opacity:.75;margin-top:4px">Récupération des réglages…</div></div>';}
    else{s.className='bx-st';s.textContent='Ce code ne correspond à aucune borne. Vérifiez-le sur l’écran.'}}
  const pk=document.getElementById('bxPick');if(pk)pk.onclick=ev=>{const p=ev.target.closest('.bx-pk');if(p)[...pk.children].forEach(y=>y.classList.toggle('on',y===p))};
  const cl=document.getElementById('bxCols');if(cl)cl.onclick=ev=>{const p=ev.target.closest('i');if(p)[...cl.children].forEach(y=>{if(y.tagName==='I')y.classList.toggle('on',y===p)})};
  bxDrag();
  if(BX.scn==='visiteur')bxKiosk();
}
function bxDrag(){
  const cv=document.getElementById('bxCv');if(!cv)return;let d=null;
  const nm={clk:'Horloge',wx:'Météo'};
  cv.onpointerdown=e=>{const el=e.target.closest('[data-wid]');if(!el)return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){ }d={el,dx:e.clientX-el.offsetLeft,dy:e.clientY-el.offsetTop};el.classList.add('dragging')};
  cv.onpointermove=e=>{if(!d)return;
    const x=Math.max(0,Math.min(cv.clientWidth-d.el.offsetWidth,e.clientX-d.dx)),y=Math.max(0,Math.min(cv.clientHeight-d.el.offsetHeight,e.clientY-d.dy));
    const px=Math.round(x/cv.clientWidth*100),py=Math.round(y/cv.clientHeight*100);d.el.style.left=px+'%';d.el.style.top=py+'%';
    BX.w[d.el.dataset.wid][0]=px;BX.w[d.el.dataset.wid][1]=py;
    const s=document.getElementById('bxPos');if(s)s.textContent=nm[d.el.dataset.wid]+' : '+px+' % · '+py+' %'};
  cv.onpointerup=()=>{if(d){d.el.classList.remove('dragging');d=null;renderMain()}};
}
function bxKiosk(){
  const k=document.getElementById('bxK'),bar=document.getElementById('bxBar'),idle=document.getElementById('bxIdle');
  const mark=n=>{for(let i=1;i<=4;i++){const el=document.getElementById('bb'+i);if(el)el.classList.toggle('on',i===n)}};
  const cur=()=>k.querySelector('.bx-kp.on').dataset.pg;
  function clock(){const d=new Date(),c=document.getElementById('bxClk');if(c)c.textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}clock();
  function touch(){bxT0=Date.now();clearInterval(bxT);bar.style.width='100%';
    bxT=setInterval(()=>{if(!document.body.contains(k)){clearInterval(bxT);return}
      const r=1-(Date.now()-bxT0)/bxTOT;bar.style.width=Math.max(r,0)*100+'%';
      if(r<=0){clearInterval(bxT);
        if(cur()==='home'){idle.classList.add('on');document.getElementById('bxCap').textContent='Diffusion : liste, planning et widgets';mark(4);bar.style.width='0';clock()}
        else{go('home');mark(3);setTimeout(()=>{if(cur()==='home'&&!idle.classList.contains('on'))mark(1)},1500)}}},100)}
  function go(p){idle.classList.remove('on');k.querySelectorAll('.bx-kp').forEach(y=>y.classList.toggle('on',y.dataset.pg===p));
    document.getElementById('bxCap').textContent='Page : '+(window.__bxNames[p]||p);mark(p==='home'?1:2);touch()}
  k.onclick=ev=>{if(idle.classList.contains('on')){go('home');return}const g=ev.target.closest('[data-kgo]');if(g)go(g.dataset.kgo);else touch()};
  touch();
}
/* barre de la maquette */
document.getElementById('mockbar').innerHTML='<b>Borne interactive — pages réelles</b>'
 +'<span class="mseg" id="avSeg"><button data-a="0">Avant (actuel)</button><button data-a="1" class="on">Après (avec la borne)</button></span>'
 +'<span class="bxs" id="bxSeg">'+SC.map(s=>'<button data-s="'+s[0]+'">'+s[1]+'</button>').join('')+'</span>';
render();

</script>
