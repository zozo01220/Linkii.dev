<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette : fenêtre standard d'un contenu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F7FA; --surface: #fff; --ink: #0B1F3A; --muted: #5A6B80; --line: #DDE3EA; --line-2: #C5CED9; --row: #EDF1F5;
  --brand: #0B1F3A; --signal: #3B82C4; --danger: #C8372D; --publish: #CC8400;
  --bar: 52px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; font-weight: 500; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* ---------- barre de la maquette (hors application) ---------- */
.mq-bar { position: fixed; inset: 0 0 auto 0; height: var(--bar); z-index: 300; background: #10243f; color: #fff; display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow-x: auto; white-space: nowrap; }
.mq-bar b { font-size: 13px; opacity: .7; margin-right: 4px; }
.mq-bar button { border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.mq-bar button.on { background: #fff; color: var(--ink); border-color: #fff; }
.mq-bar i { width: 1px; height: 22px; background: rgba(255,255,255,.25); margin: 0 6px; flex: none; }

/* ---------- page derrière : une liste de lecture ---------- */
.pg { padding: calc(var(--bar) + 36px) 16px 60px; max-width: 860px; margin: 0 auto; }
.pg h1 { font-size: 26px; letter-spacing: -.01em; }
.pg .meta { color: var(--muted); font-size: 14px; margin: 2px 0 22px; }
.ln { position: relative; display: flex; align-items: center; gap: 14px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.ln .th { width: 72px; height: 41px; border-radius: 5px; flex: none; display: grid; place-items: center; color: #fff; }
.ln .gw { flex: 1; min-width: 0; }
.ln .gw b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ln .gw small { color: var(--muted); font-size: 13px; }
.ln .dots { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.ln .dots:hover, .ln .dots[aria-expanded="true"] { background: var(--row); color: var(--ink); }
.ln.off { background: transparent; border-style: dashed; }
.ln.off .th, .ln.off .gw b { opacity: .45; }
.pill { font-size: 12px; border: 1px solid var(--line-2); color: var(--muted); border-radius: 999px; padding: 1px 9px; }
.menu { position: absolute; right: 10px; top: 46px; z-index: 20; min-width: 236px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(11,31,58,.18); padding: 6px; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; text-align: left; }
.menu button:hover { background: var(--row); }
.menu button.danger { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.menu .new { margin-left: auto; font-size: 11px; background: var(--publish); color: #fff; border-radius: 999px; padding: 0 8px; }

/* ---------- la fenêtre standard ---------- */
.backdrop { position: fixed; inset: var(--bar) 0 0 0; background: rgba(11,31,58,.45); z-index: 100; }
/* proportions fixes 16:10, jamais d'agrandissement : la largeur se cale sur la place disponible */
.win { position: fixed; z-index: 101; left: 50%; top: calc(50% + var(--bar) / 2); transform: translate(-50%, -50%);
  width: min(1120px, calc(100vw - 32px), calc((100vh - var(--bar) - 32px) * 1.6)); aspect-ratio: 16 / 10;
  background: var(--surface); border-radius: 14px; box-shadow: 0 24px 60px rgba(11,31,58,.3); display: flex; flex-direction: column; overflow: hidden; }
.w-head { display: flex; align-items: center; gap: 14px; padding: 0 20px 0 24px; height: 68px; flex: none; border-bottom: 1px solid var(--line); }
.w-ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.w-name { flex: 1; min-width: 0; }
.w-name input { display: block; width: 100%; border: 0; background: transparent; font-size: 18px; font-weight: 500; padding: 1px 6px; margin-left: -6px; border-radius: 5px; text-overflow: ellipsis; }
.w-name input:hover { background: var(--row); }
.w-name input:focus { background: var(--surface); outline: 2px solid var(--signal); }
.w-name small { color: var(--muted); font-size: 13px; }
.ib { width: 40px; height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
.ib:hover { color: var(--ink); border-color: var(--line-2); }
.ib.flat { border-color: transparent; }
.ib.flat:hover { background: var(--row); }
.btn { border: 0; background: var(--brand); color: #fff; border-radius: 8px; height: 40px; padding: 0 18px; font-weight: 500; flex: none; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.w-sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; flex: none; }

.w-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); }
.w-form { overflow-y: auto; padding: 26px 24px 26px 28px; }
.fd { margin-bottom: 22px; }
.fd > label, .fd > .lb { display: block; font-weight: 500; font-size: 14px; margin-bottom: 7px; }
.fd input[type=text], .fd input[type=number], .fd select { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; background: var(--surface); }
.fd input:hover, .fd select:hover { border-color: var(--line-2); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; height: 36px; border-radius: 6px; color: var(--muted); font-size: 14px; }
.seg button.on { background: var(--row); color: var(--ink); font-weight: 500; }
.col { display: flex; align-items: center; gap: 10px; height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; }
.col input[type=color] { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line-2); border-radius: 50%; background: none; overflow: hidden; cursor: pointer; flex: none; }
.col input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.col input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
.col span { font-size: 14px; color: var(--muted); text-transform: uppercase; }
.sw { display: flex; gap: 10px; }
.sw button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); }
.sw button.on { box-shadow: 0 0 0 2px var(--ink); }
.dur { display: flex; align-items: center; gap: 10px; }
.dur input { width: 96px !important; text-align: center; }
.dur span { color: var(--muted); font-size: 14px; }
.grp { border-top: 1px solid var(--line); padding-top: 22px; margin-top: 4px; }
.grp > h4 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.fold { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 0; color: var(--signal); margin-bottom: 22px; }

/* zone d'affichage : toujours un cadre paysage 16:9 ; un contenu portrait s'y affiche debout, au centre */
.w-stage { background: #F7F8FA; border-left: 1px solid var(--line); padding: 28px; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.fit { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; }
.zone { width: min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 10px; background: #E9EDF2; display: grid; place-items: center; overflow: hidden; position: relative; }
.scr { height: 100%; aspect-ratio: 16 / 9; container-type: inline-size; position: relative; overflow: hidden; background: #000; color: #fff; display: grid; place-items: center; }
.zone.p .scr { aspect-ratio: 9 / 16; border-radius: 6px; box-shadow: 0 6px 18px rgba(11,31,58,.18); height: calc(100% - 20px); }
.st-foot { display: flex; align-items: center; justify-content: center; gap: 12px; padding-top: 16px; flex: none; color: var(--muted); font-size: 13px; }
.fmt { display: flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 2px; }
.fmt button { border: 0; background: transparent; width: 36px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.fmt button.on { background: var(--row); color: var(--ink); }

/* aperçu : état vide en pointillés, boutons au survol */
.empty { position: absolute; inset: 0; background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.empty > div { border: 2px dashed var(--line-2); border-radius: 12px; inset: 6cqw; position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 12px; }
.acts { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; opacity: 0; transition: opacity .15s; }
.zone:hover .acts, .acts:focus-within { opacity: 1; }
.acts button { border: 0; background: rgba(11,31,58,.88); color: #fff; border-radius: 8px; height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 6px; font-size: 14px; }
.acts button.sq { width: 36px; padding: 0; justify-content: center; }
.ph { position: absolute; inset: 0; width: 100%; height: 100%; }
.cap { position: absolute; left: 0; right: 0; bottom: 8cqw; text-align: center; font-size: 5cqw; font-weight: 500; text-shadow: 0 1px 6px rgba(0,0,0,.5); padding: 0 4cqw; }
.msg { text-align: center; padding: 6cqw; }
.msg .t { font-size: 5cqw; font-weight: 500; opacity: .75; }
.msg .n { font-size: 9cqw; font-weight: 500; line-height: 1.1; margin: 1cqw 0; }
.msg .s { font-size: 3.6cqw; opacity: .85; }
.clk { font-size: 20cqw; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.wx { text-align: center; }
.wx .c { font-size: 4.5cqw; opacity: .85; }
.wx .d { font-size: 17cqw; font-weight: 500; line-height: 1.05; }
.wx .r { display: flex; justify-content: center; gap: 5cqw; margin-top: 2cqw; font-size: 3.2cqw; }
.wx .r span b { display: block; font-size: 4.2cqw; }

@media (max-width: 760px) {
  .win { aspect-ratio: auto; height: calc(100vh - var(--bar) - 24px); }
  .w-body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
  .w-stage { order: -1; border-left: 0; border-bottom: 1px solid var(--line); padding: 16px; height: 46vw; min-height: 190px; }
  .st-foot span, .w-sep, .nav { display: none; }
  .w-form { padding: 20px 16px; }
}
</style>
</head>
<body>

<div class="mq-bar" role="toolbar" aria-label="Maquette">
  <b>Maquette</b>
  <button data-app="image">Image, vide</button>
  <button data-app="image2">Image</button>
  <button data-app="msg">Message</button>
  <button data-app="clock">Horloge</button>
  <button data-app="wx">Météo</button>
  <i></i>
  <button data-app="menu">Menu ⋯ de la ligne</button>
</div>

<!-- page derrière la fenêtre : la liste de lecture et ses lignes -->
<main class="pg">
  <h1>Accueil</h1>
  <p class="meta">5 contenus · 1 min 10 s · sur 3 écrans</p>
  <div id="lines"></div>
</main>

<div id="modal">
  <div class="backdrop"></div>
  <div class="win" role="dialog" aria-modal="true" aria-label="Modifier le contenu">
    <div class="w-head">
      <span class="w-ico" id="wIco"></span>
      <div class="w-name"><input id="wName" aria-label="Nom du contenu" title="Cliquer pour renommer" maxlength="80"><small id="wApp"></small></div>
      <button class="ib" title="Options avancées" aria-label="Options avancées"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
      <button class="ib flat nav" title="Contenu précédent" aria-label="Contenu précédent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="ib flat nav" title="Contenu suivant" aria-label="Contenu suivant"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <span class="w-sep"></span>
      <button class="btn">Enregistrer</button>
      <button class="ib flat" title="Fermer sans enregistrer" aria-label="Fermer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="w-body">
      <div class="w-form" id="wForm"></div>
      <div class="w-stage">
        <div class="fit"><div class="zone" id="zone"><div class="scr" id="scr"></div></div></div>
        <div class="st-foot">
          <div class="fmt" role="group" aria-label="Format de l'écran">
            <button data-fmt="l" title="Écran paysage" aria-label="Écran paysage"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/></svg></button>
            <button data-fmt="p" title="Écran portrait" aria-label="Écran portrait"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="2"/></svg></button>
          </div>
          <span id="fmtTxt"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const I = {
  image: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>',
  msg: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h8"/></svg>',
  clock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  wx: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
  edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  cal: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  copy: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  eyeoff: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l16 16M10 6.2A9 9 0 0 1 12 6c5 0 8.5 4 9.5 6a13 13 0 0 1-2.6 3.4M6.3 7.8A13 13 0 0 0 2.5 12c1 2 4.500 6 9.500 6 1.300 0 2.500-.3 3.600-.7M10 10a3 3 0 0 0 4 4"/></svg>',
  eye: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.500 12c1-2 4.500-6 9.500-6s8.500 4 9.500 6c-1 2-4.500 6-9.500 6s-8.500-4-9.500-6z"/><circle cx="12" cy="12" r="3"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  dots: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="19" cy="12" r="1.800"/></svg>'
};
const PHOTO = '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6C98A"/><stop offset="1" stop-color="#E88E6A"/></linearGradient></defs><rect width="400" height="300" fill="url(#sky)"/><circle cx="290" cy="95" r="34" fill="#FFF3D6"/><path d="M0 210l90-90 70 60 60-80 180 150v50H0z" fill="#7A4B5E"/><path d="M0 250l120-70 110 50 170-60v130H0z" fill="#3E2E4F"/>';

// chaque application déclare ses champs ; la fenêtre, elle, ne change jamais
const APPS = {
  image: { name: 'Affiche de la semaine', app: 'Image', color: '#E0A21A', ico: I.image, v: { src: false, fit: 'meet', bg: '#000000', txt: '', dur: 10 } },
  msg:   { name: 'Bienvenue à Camille', app: 'Message', color: '#3B82C4', ico: I.msg, v: { t: 'Bienvenue', n: 'Camille Martin', s: 'Responsable accueil', th: '#1F2A5C', dur: 12 } },
  clock: { name: 'Horloge du hall', app: 'Horloge', color: '#0B1F3A', ico: I.clock, v: { style: 'a', fg: '#F5F5F4', bg: '#0A0A0B', dur: 15 } },
  wx:    { name: 'Météo Lausanne', app: 'Météo', color: '#1E8E5A', ico: I.wx, v: { city: 'Lausanne', unit: 'C', days: '3', bg: '#1C4E80', dur: 10 } }
};
let cur = 'image', fmt = 'l', txtOpen = false;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const fText = (k, label) => `<div class="fd"><label for="f-${k}">${label}</label><input type="text" id="f-${k}" data-k="${k}" value="${esc(APPS[cur].v[k])}"></div>`;
const fSeg = (k, label, opts) => `<div class="fd"><span class="lb">${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(o => `<button type="button" data-k="${k}" data-v="${o[0]}" class="${APPS[cur].v[k] == o[0] ? 'on' : ''}">${o[1]}</button>`).join('')}</div></div>`;
const fCol = (k, label) => `<div class="fd"><label for="f-${k}">${label}</label><div class="col"><input type="color" id="f-${k}" data-k="${k}" value="${APPS[cur].v[k]}"><span>${APPS[cur].v[k]}</span></div></div>`;
const fSw = (k, label, cols) => `<div class="fd"><span class="lb">${label}</span><div class="sw" role="group" aria-label="${label}">${cols.map(c => `<button type="button" data-k="${k}" data-v="${c[0]}" title="${c[1]}" aria-label="${c[1]}" style="background:${c[0]}" class="${APPS[cur].v[k] == c[0] ? 'on' : ''}"></button>`).join('')}</div></div>`;
// bloc commun à toutes les applications
const fList = () => `<div class="grp"><h4>Dans cette liste</h4><div class="fd"><label for="f-dur">Durée d'affichage</label><div class="dur"><input type="number" id="f-dur" data-k="dur" min="1" max="86400" value="${APPS[cur].v.dur}"><span>secondes</span></div></div></div>`;

function form() {
  const v = APPS[cur].v; let h = '';
  if (cur == 'image') {
    h = fSeg('fit', 'Cadrage', [['meet', 'Entière'], ['slice', 'Remplir']]) + fCol('bg', 'Couleur du fond')
      + (txtOpen || v.txt ? fText('txt', 'Texte sur l’image') : '<button type="button" class="fold" id="addTxt">+ Ajouter un texte sur l’image</button>');
  } else if (cur == 'msg') {
    h = fText('t', 'Accroche') + fText('n', 'Titre') + fText('s', 'Sous-titre')
      + fSw('th', 'Couleur', [['#1F2A5C', 'Nuit'], ['#3B82C4', 'Bleu'], ['#1E8E5A', 'Vert'], ['#8A231C', 'Bordeaux'], ['#111111', 'Noir']]);
  } else if (cur == 'clock') {
    h = fSeg('style', 'Style', [['a', 'Aiguilles'], ['d', 'Chiffres']]) + fCol('fg', 'Couleur de l’horloge') + fCol('bg', 'Couleur du fond');
  } else {
    h = fText('city', 'Ville') + fSeg('unit', 'Unité', [['C', '°C'], ['F', '°F']]) + fSeg('days', 'Prévisions', [['0', 'Aujourd’hui'], ['3', '3 jours'], ['5', '5 jours']]) + fCol('bg', 'Couleur du fond');
  }
  $('#wForm').innerHTML = h + fList();
}

function preview() {
  const v = APPS[cur].v, s = $('#scr'); let h = '';
  s.style.background = v.bg || v.th || '#000'; s.style.color = '#fff';
  if (cur == 'image') {
    if (!v.src) h = `<div class="empty"><div><span>Glissez une image ici</span><button type="button" class="btn ghost" id="pick">Choisir une image</button></div></div>`;
    else h = `<svg class="ph" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid ${v.fit}">${PHOTO}</svg>${v.txt ? `<div class="cap">${esc(v.txt)}</div>` : ''}`
           + `<div class="acts"><button type="button" id="pick">${I.edit} Changer</button><button type="button" class="sq" id="unpick" title="Retirer l’image" aria-label="Retirer l’image">${I.trash}</button></div>`;
  } else if (cur == 'msg') {
    h = `<div class="msg"><div class="t">${esc(v.t)}</div><div class="n">${esc(v.n)}</div><div class="s">${esc(v.s)}</div></div>`;
  } else if (cur == 'clock') {
    const d = new Date(), hh = d.getHours(), mm = d.getMinutes(); s.style.color = v.fg;
    if (v.style == 'd') h = `<div class="clk">${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}</div>`;
    else {
      let t = ''; for (let i = 0; i < 12; i++) t += `<path d="M50 6v${i % 3 ? 3 : 5}" transform="rotate(${i * 30} 50 50)" stroke-width="${i % 3 ? .6 : 1}"/>`;
      h = `<svg viewBox="0 0 100 100" style="height:82%;aspect-ratio:1" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="50" cy="50" r="46" stroke-width=".4" opacity=".4"/>${t}<path d="M50 50V26" stroke-width="2" transform="rotate(${(hh % 12) * 30 + mm / 2} 50 50)"/><path d="M50 50V14" stroke-width="1.2" transform="rotate(${mm * 6} 50 50)"/><circle cx="50" cy="50" r="1.600" fill="currentColor"/></svg>`;
    }
  } else {
    const f = c => v.unit == 'F' ? Math.round(c * 9 / 5 + 32) : c, names = ['Ven.', 'Sam.', 'Dim.', 'Lun.', 'Mar.'], temps = [9, 7, 11, 12, 8];
    const days = names.slice(0, +v.days).map((n, i) => `<span>${n}<b>${f(temps[i])}°</b></span>`).join('');
    h = `<div class="wx"><div class="c">${esc(v.city)} · Éclaircies</div><div class="d">${f(8)}°</div>${days ? `<div class="r">${days}</div>` : ''}</div>`;
  }
  s.innerHTML = h;
  $('#zone').classList.toggle('p', fmt == 'p');
  document.querySelectorAll('[data-fmt]').forEach(b => b.classList.toggle('on', b.dataset.fmt == fmt));
  $('#fmtTxt').textContent = fmt == 'p' ? 'Aperçu sur un écran portrait' : 'Aperçu sur un écran paysage';
}

function lines(menuOn) {
  const L = [['#E0A21A', I.image, 'Affiche de la semaine', 'Image · 10 s', 0], ['#3B82C4', I.msg, 'Bienvenue à Camille', 'Message · 12 s', 0],
             ['#0B1F3A', I.clock, 'Horloge du hall', 'Horloge · 15 s', 0], ['#1E8E5A', I.wx, 'Météo Lausanne', 'Météo · 10 s', 1], ['#7A4B5E', I.image, 'Menu du jour', 'Image · 10 s', 0]];
  $('#lines').innerHTML = L.map((l, i) => `<div class="ln ${l[4] ? 'off' : ''}"><span class="th" style="background:${l[0]}">${l[1]}</span><div class="gw"><b>${l[2]}</b><small>${l[3]}</small></div>${l[4] ? '<span class="pill">Désactivé</span>' : ''}`
    + `<button class="dots" aria-label="Actions" aria-expanded="${menuOn && i == 1}">${I.dots}</button>`
    + (menuOn && i == 1 ? `<div class="menu" role="menu"><button role="menuitem">${I.edit} Modifier…</button><button role="menuitem">${I.cal} Programmer la diffusion…</button><button role="menuitem">${I.copy} Dupliquer</button><button role="menuitem">${I.eyeoff} Désactiver <span class="new">nouveau</span></button><hr><button role="menuitem" class="danger">${I.trash} Retirer de la liste</button></div>` : '')
    + `</div>`).join('');
}

function show(id) {
  document.querySelectorAll('.mq-bar [data-app]').forEach(b => b.classList.toggle('on', b.dataset.app == id));
  const menu = id == 'menu';
  $('#modal').hidden = menu; lines(menu);
  if (menu) return;
  cur = id == 'image2' ? 'image' : id;
  if (id == 'image') APPS.image.v.src = false;
  if (id == 'image2') APPS.image.v.src = true;
  const a = APPS[cur];
  $('#wIco').innerHTML = a.ico; $('#wIco').style.background = a.color;
  $('#wName').value = a.name; $('#wApp').textContent = a.app;
  form(); preview();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.app) return show(b.dataset.app);
  if (b.dataset.fmt) { fmt = b.dataset.fmt; return preview(); }
  if (b.id == 'pick') { APPS.image.v.src = true; return show('image2'); }
  if (b.id == 'unpick') { APPS.image.v.src = false; return show('image'); }
  if (b.id == 'addTxt') { txtOpen = true; form(); return $('#f-txt').focus(); }
  if (b.dataset.k) { APPS[cur].v[b.dataset.k] = b.dataset.v; form(); preview(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k) return;
  APPS[cur].v[k] = e.target.value;
  if (e.target.type == 'color') e.target.nextElementSibling.textContent = e.target.value;
  preview();
});
$('#wName').addEventListener('input', e => APPS[cur].name = e.target.value);
show('image');
</script>
</body>
</html>
