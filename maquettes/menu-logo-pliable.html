<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Logo et menu latéral pliable</title>
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--text:#1D1D1F;--muted:#6E7684;--line:#E3E6EB;--line-2:#D2D6DD;--brand:#0B1F3A;--signal:#3B82C4;
  --red:#E5352B;--orange:#F29100;--gold:#CC8500;--ok-bg:#E1F0E8;--ok-ink:#155A38;--warn-bg:#FBF0DA;--warn-ink:#7A4E0C;--danger-bg:#FBE4E2;--danger-ink:#8A231C;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--w-open:264px;--w-shut:72px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,p{margin:0}button{font:inherit;color:inherit;cursor:pointer}
svg{display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.mock{position:sticky;top:0;z-index:90;background:#fff;border-bottom:1px dashed var(--line-2);padding:8px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mock b{color:var(--text)}
.seg{display:inline-flex;background:#ECEEF2;border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;color:var(--muted);font-size:12.5px}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px #0002;font-weight:600}
.app{display:flex;min-height:calc(100vh - 45px)}

/* ===== barre latérale ===== */
.side{width:var(--w-open);flex:none;position:sticky;top:45px;height:calc(100vh - 45px);background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:0 14px 18px;transition:width .25s cubic-bezier(.4,0,.2,1);z-index:20}
.app.shut .side{width:var(--w-shut);padding:0 12px 18px}

/* tête : logo + bouton */
.head-side{height:76px;display:flex;align-items:center;gap:6px;padding:0 6px;position:relative;margin-bottom:6px}
.logo{position:relative;height:34px;width:108px;flex:none}
.meta{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-left:6px;flex:1;min-width:0}
.plan-tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;border-radius:4px;padding:1px 7px;background:#EDF1F5;color:var(--muted);line-height:1.5}
.ver{font-size:11px;color:var(--muted);line-height:1;white-space:nowrap}
.app.shut .meta{display:none}
.tip-logo{left:calc(100% + 22px)}
.app.shut .logo:hover .tip-logo{display:block}
.logo img{position:absolute;left:0;top:50%;height:34px;transform:translateY(-50%);transition:opacity .18s}
.logo .long{object-view-box:inset(15% 5% 15% 5%);aspect-ratio:1786/498;height:30px;width:auto}
.logo .court{height:34px;opacity:0;left:50%;transform:translate(-50%,-50%)}
.app.shut .logo .long{opacity:0}
.app.shut .logo .court{opacity:1}
.app.shut .head-side{justify-content:center;padding:0}
.app.shut .logo{flex:none;width:34px}
.tg{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex:none;transition:.15s}
.tg:hover{background:var(--bg);color:var(--ink);border-color:var(--line-2)}
.tg svg{width:16px;height:16px;transition:transform .25s}
.app.shut .tg svg{transform:rotate(180deg)}

/* variante B : poignée sur le bord */
body[data-v=b] .head-side .tg{display:none}
.edge{display:none;position:absolute;right:-13px;top:26px;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--line-2);
  place-items:center;color:var(--muted);box-shadow:0 1px 4px #0b1f3a1a;opacity:0;transition:.15s;z-index:30}
.edge svg{width:14px;height:14px;transition:transform .25s}
.app.shut .edge svg{transform:rotate(180deg)}
body[data-v=b] .edge{display:grid}
body[data-v=b] .side:hover .edge,body[data-v=b] .edge:focus-visible{opacity:1}
.edge:hover{color:var(--ink);background:var(--bg)}
/* variante A : en mode replié, le bouton passe sous le logo */
body[data-v=a] .app.shut .head-side{flex-direction:column;height:auto;padding:16px 0 6px;gap:14px}

/* entrées */
.nav{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;color:var(--muted);height:40px;padding:0 12px;border-radius:4px;font-size:15px;white-space:nowrap;transition:background .12s,color .12s}
.nav svg{width:18px;height:18px}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav.on{background:#E7EAEE;color:var(--ink);font-weight:500;box-shadow:inset 2px 0 0 var(--brand);border-radius:0 4px 4px 0}
.nav span.t{overflow:hidden;transition:opacity .15s}
.nav-sep{height:1px;background:var(--line);margin:8px 12px}
.sp{flex:1}
.pl{margin-left:auto;min-width:24px;height:20px;padding:0 7px;border-radius:10px;font-size:12px;font-weight:600;display:grid;place-items:center;background:#E6E9EF;color:#5A6472;transition:.15s}
.pl.red{background:var(--red);color:#fff}.pl.org{background:var(--orange);color:#fff}

/* replié : icônes seules, pastilles en coin, infobulles */
.app.shut .nav{justify-content:center;padding:0;height:44px;border-radius:6px}
.app.shut .nav.on{border-radius:6px;box-shadow:none;background:#E7EAEE}
.app.shut .nav span.t{display:none}
.app.shut .nav svg{width:20px;height:20px}
.app.shut .pl{position:absolute;top:3px;right:6px;min-width:16px;height:16px;padding:0 4px;font-size:10px;margin:0;border:2px solid #fff;box-sizing:content-box}
.app.shut .pl.lt{display:none}
.app.shut .nav-sep{margin:8px 6px}
.tip{display:none;position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:#1D1D1F;color:#fff;font-size:12.5px;padding:5px 10px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:40;font-weight:400}
.tip::before{content:"";position:absolute;left:-4px;top:50%;margin-top:-4px;border:4px solid transparent;border-left:0;border-right-color:#1D1D1F}
.app.shut .nav:hover .tip,.app.shut .user-btn:hover .tip,.app.shut .mode-switch:hover .tip{display:block}

/* bas de menu */
.mode-switch .sw{margin-left:auto;width:34px;height:20px;border-radius:10px;background:var(--brand);position:relative;flex:none}
.mode-switch .sw::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.app.shut .mode-switch .sw{display:none}
.user-btn{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:4px;padding:8px;background:none;text-align:left}
.user-btn:hover{background:var(--bg)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:500;font-size:13px;flex:none}
.who{flex:1;min-width:0}.who b{display:block;font-weight:500;font-size:14px;white-space:nowrap}.who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.shut .who,.app.shut .user-btn>svg{display:none}
.app.shut .user-btn{justify-content:center;padding:8px 0}

/* contenu */
main{flex:1;min-width:0;padding:32px 40px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}.crumb{color:var(--muted);font-size:13px}
.head{display:flex;align-items:flex-end;gap:16px;margin:10px 0 20px}
.head h1{font-size:28px;font-weight:500}.head p{color:var(--muted)}.grow{flex:1}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:4px;padding:9px 16px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.scene{height:110px;display:grid;place-items:center;color:#fff;font-weight:600;position:relative}
.badge{position:absolute;top:10px;left:10px;border-radius:4px;padding:2px 9px;font-size:11.5px;font-weight:600;background:var(--ok-bg);color:var(--ok-ink)}
.cb{padding:11px 16px 13px}.cb b{font-weight:500}.cb small{display:block;color:var(--muted);font-size:12.5px}
.note{background:#fff;border:1px dashed var(--line-2);border-radius:8px;padding:10px 14px;color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.6}
.note b{color:var(--text)}
kbd{font:inherit;font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fafbfc}

@media (max-width:820px){.app .side{width:var(--w-shut)!important;padding:0 12px 18px}}
</style>
</head>
<body data-v="a">
<div class="mock"><b>Maquette</b>
<span>Bouton de pliage :</span>
<div class="seg" id="vseg"><button data-v="a" class="on">A · dans l'en-tête</button><button data-v="b">B · poignée sur le bord</button></div>
<span>Raccourci <kbd>Ctrl</kbd> + <kbd>B</kbd> · le choix est mémorisé par personne</span></div>

<div class="app" id="app">
<aside class="side" id="side"></aside>
<main id="main"></main>
</div>
