<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linkii — Barre du bas, Écrans au centre (maquette)</title>
<style>
:root{--bg:#EEF1F5;--ink:#0B1F3A;--muted:#5A6B80;--line:#CBD5E1;--brand:#0B1F3A;--signal:#3B82C4;--ok:#1E8E5A;--ok-bg:#E1F0E8;--danger:#C8372D;--danger-bg:#FBE4E2;--shadow:0 1px 2px rgba(11,31,58,.08),0 4px 14px rgba(11,31,58,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:#cfd6df;color:var(--ink);font-size:15px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1.pg{font-size:18px;font-weight:500;margin:22px 24px 4px}
p.pg{margin:0 24px 16px;color:#33445a;font-size:13px;max-width:900px}
.cap{font-size:12px;font-weight:500;color:#33445a;margin:0 0 8px 4px}
.wrap{display:flex;flex-wrap:wrap;gap:28px;padding:0 24px 30px;align-items:flex-start}
.phone{width:375px;height:760px;background:var(--bg);border-radius:34px;border:8px solid #101a2a;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.st{height:26px;flex:none;background:var(--brand);color:#fff;font-size:12px;font-weight:500;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.bar{background:var(--brand);color:#fff;padding:4px 14px 12px;display:flex;align-items:center;gap:10px}
.bar h2{margin:0;font-size:17px;font-weight:500;flex:1}
.sw{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);border-radius:16px;padding:5px 10px;font-size:13px}
.sw i{width:32px;height:20px;border-radius:10px;background:var(--signal);position:relative}
.sw i::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.body{flex:1;overflow:hidden;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 12px 17px;margin-bottom:12px;position:relative;display:flex;gap:12px;align-items:center}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ok);border-radius:14px 0 0 14px}
.card.off::before{background:var(--danger)}
.th{width:92px;height:56px;border-radius:8px;background:linear-gradient(135deg,#3B82C4,#0B1F3A)}
.card b{font-weight:500;display:block}.card small{color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:12px;background:var(--ok-bg);color:#155A38;margin-top:4px}
.pill.o{background:var(--danger-bg);color:#8A231C}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid div{aspect-ratio:1}
/* ---------- barre du bas ---------- */
.tabs{position:relative;flex:none;height:64px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:stretch}
.tabs .t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--muted);position:relative}
.tabs .t svg{width:22px;height:22px}
.tabs .t.on{color:var(--brand);font-weight:600}
.tabs .t.on:not(.hero)::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--signal)}
/* A : bouton central surélevé, rond, sort de la barre */
.A .hero{flex:1.15;justify-content:flex-end;padding-bottom:6px}
.A .hero .b{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;border:4px solid #fff;box-shadow:0 6px 16px rgba(11,31,58,.35)}
.A .hero .b svg{width:28px;height:28px}
.A .hero.on .b{background:var(--signal);box-shadow:0 6px 16px rgba(59,130,196,.55)}
.A .hero.on{color:var(--signal);font-weight:600}
/* B : grande tuile arrondie intégrée à la barre, sans dépasser */
.B{height:68px}
.B .hero{flex:1.3}
.B .hero .b{width:60px;height:46px;border-radius:16px;background:#E3E8EF;color:var(--brand);display:grid;place-items:center}
.B .hero .b svg{width:28px;height:28px}
.B .hero.on .b{background:var(--brand);color:#fff;box-shadow:0 4px 10px rgba(11,31,58,.3)}
.B .hero span{font-size:10.5px}
/* C : bouton central surélevé en pilule avec libellé dedans */
.C .hero{flex:1.5}
.C .hero .b{position:absolute;left:50%;top:-14px;transform:translateX(-50%);height:46px;padding:0 18px;border-radius:23px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 6px 16px rgba(11,31,58,.35);border:3px solid #fff}
.C .hero .b svg{width:20px;height:20px}
.C .hero.on .b{background:var(--signal)}
.C .hero>span{opacity:0}
.fab{position:absolute;right:14px;bottom:78px;width:54px;height:54px;border-radius:18px;background:var(--signal);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(59,130,196,.5)}
.fab svg{width:26px;height:26px}
.mini{width:375px;background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.15);padding:30px 0 0;overflow:hidden}
.mini .tabs{border-radius:0 0 14px 14px}
.lab{font-size:12px;color:#33445a;margin:0 0 6px 4px}
.note{max-width:380px;font-size:12.5px;line-height:1.5;background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.note b{font-size:13.5px}
.note ul{margin:6px 0 0;padding-left:18px}
</style>
</head>
<body>
<h1 class="pg">Barre du bas : Écrans au centre et mis en évidence (maquette, rien n'est codé)</h1>
<p class="pg">Nouvel ordre : Médias · Listes · <b>Écrans</b> · Planning · Plus. Écrans devient le bouton principal, plus gros, au milieu. Trois façons de le mettre en valeur ci-dessous ; la A est celle que je recommande.</p>

<div class="wrap" id="root"></div>

<script>
const I={
 scr:'<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 img:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
 cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 dots:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>'};
function tabs(v,active){ // v: A|B|C ; active: media|screens|lists
  const t=(k,ico,l)=>`<div class="t ${active===k?'on':''}">${ico}${l}</div>`;
  const hero=`<div class="t hero ${active==='screens'?'on':''}"><div class="b">${I.scr}${v==='C'?'Écrans':''}</div><span>Écrans</span></div>`;
  return `<div class="tabs ${v}">${t('media',I.img,'Médias')}${t('lists',I.list,'Listes')}${hero}${t('plan',I.cal,'Planning')}${t('more',I.dots,'Plus')}</div>`}
function hd(title){return `<div class="st"><span>9:41</span><span>●●● 5G ▮</span></div><div class="bar"><h2>${title}</h2><div class="sw">Expert<i></i></div></div>`}
const screensBody=`<div class="body"><div class="card"><div class="th"></div><div><b>Hall d'entrée</b><small>Liste « Bienvenue »</small><br><span class="pill">En ligne</span></div></div><div class="card"><div class="th" style="background:linear-gradient(135deg,#d9a441,#7a4f12)"></div><div><b>Cafétéria</b><small>Menu du jour</small><br><span class="pill">En ligne</span></div></div><div class="card off"><div class="th" style="background:#c9d1db"></div><div><b>Salle de réunion 2</b><small>Vu il y a 3 h</small><br><span class="pill o">Hors ligne</span></div></div></div>`;
const g=n=>Array.from({length:n},(_,i)=>`<div style="background:linear-gradient(${i*40}deg,hsl(${(i*47)%360} 55% 50%),hsl(${(i*47+40)%360} 50% 28%))"></div>`).join('');
const mediaBody=`<div class="body" style="padding:0"><div style="padding:12px 14px 6px;font-weight:600">Aujourd'hui <small style="color:#5A6B80;font-weight:400">9</small></div><div class="grid">${g(15)}</div></div><div class="fab">${I.up}</div>`;
const root=document.getElementById('root');
const ph=(cap,html)=>`<div><p class="cap">${cap}</p><div class="phone">${html}</div></div>`;
root.innerHTML=
 ph('1 · Option A (recommandée) — Écrans actif',hd('Écrans')+screensBody+tabs('A','screens'))+
 ph('2 · Option A — sur Médias : Écrans reste gros mais discret',hd('Médiathèque')+mediaBody+tabs('A','media'))+
 `<div style="display:flex;flex-direction:column;gap:16px">
   <div><p class="lab"><b>A · bouton rond surélevé</b> (sort de la barre, comme un bouton d'action principal)</p><div class="mini">${tabs('A','screens')}</div></div>
   <div><div class="mini">${tabs('A','media')}</div></div>
   <div><p class="lab"><b>B · grande tuile intégrée</b> (reste dans la barre, plus sobre)</p><div class="mini" style="padding-top:6px">${tabs('B','screens')}</div></div>
   <div><div class="mini" style="padding-top:6px">${tabs('B','media')}</div></div>
   <div><p class="lab"><b>C · pilule avec libellé</b> (le mot « Écrans » dans le bouton)</p><div class="mini">${tabs('C','screens')}</div></div>
   <div><div class="mini">${tabs('C','media')}</div></div>
   <div class="note"><b>Détails</b><ul>
    <li>Ordre : Médias, Listes, <b>Écrans</b> (centre), Planning, Plus.</li>
    <li>Écrans est toujours le plus gros : bleu signal quand on est dessus, bleu nuit sinon.</li>
    <li>Le bouton flottant d'import (page Médias) reste au-dessus de la barre, à droite.</li>
    <li><b>À décider :</b> en mode simple (sans Planning) il reste 4 onglets, donc pas de vrai centre. Proposition : Médias · Écrans · Listes · Plus, Écrans toujours le plus gros.</li>
   </ul></div>
 </div>`;
</script>
</body>
</html>
