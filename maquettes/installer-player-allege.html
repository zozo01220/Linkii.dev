<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Installer le player (allégée)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--signal:#3B82C4;--sig-bg:#EAF2FA;--sig-ink:#1d4f80;--ok:#2E8B57}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.mock{position:sticky;top:0;z-index:300;background:#FFF8E1;border-bottom:1px dashed #E0B84A;padding:8px 16px;font-size:13px;color:#6B5200}
.mock .row{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.mock .sc{border:1px solid #E0B84A;background:#fff;border-radius:4px;padding:3px 10px;font-size:13px}
.mock .sc.on{background:#6B5200;border-color:#6B5200;color:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:0 16px;font-weight:500;display:inline-flex;gap:8px;align-items:center;height:38px;white-space:nowrap}
.btn.sm{height:32px;padding:0 12px;font-size:13px}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}
.app{display:flex;min-height:640px;position:relative;overflow:hidden}
.side{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
.logo{font-size:28px;font-weight:500;letter-spacing:-.5px;margin:0 0 18px 8px}
.nav{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:6px;color:var(--muted)}
.nav.on{background:var(--sig-bg);color:var(--ink);font-weight:500}.nav .cnt{margin-left:auto;font-size:12px}
.nav.hl{outline:2px solid var(--signal);outline-offset:1px;color:var(--ink)}
.ic{width:20px;text-align:center;flex:none}
.spacer{flex:1;min-height:40px}
.modeb{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border-radius:6px;margin-top:8px}
.modeb i{margin-left:auto;width:34px;height:20px;border-radius:10px;background:var(--ink);position:relative}.modeb i::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.me{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--line);margin-top:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.main{flex:1;padding:24px 32px;position:relative}
.main h1{margin:0;font-size:28px;font-weight:500}.sub{color:var(--muted);margin:2px 0 16px}
.head{display:flex;gap:12px}.head>div:first-child{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:6px}
.srow{display:flex;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}.srow:first-child{border-top:0}
.thumb{width:84px;height:48px;border-radius:4px;background:#0E1E38}
.addw{position:relative}
.menu{position:absolute;right:0;top:44px;width:340px;background:#fff;border:1px solid var(--line-2);border-radius:6px;box-shadow:0 8px 24px rgba(11,31,58,.16);padding:6px;z-index:5}
.menu .it{padding:9px 10px;border-radius:4px;display:flex;gap:12px;align-items:center}
.menu small{display:block;color:var(--muted);font-size:12px}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .it.hl{outline:2px solid var(--signal);outline-offset:-2px;background:var(--sig-bg)}
/* icônes officielles (Simple Icons) */
.bi{width:20px;height:20px;flex:none;display:block}
.bi.lg{width:26px;height:26px}
/* panneau d'installation */
.veil{position:absolute;inset:0;background:rgba(11,31,58,.38);z-index:20}
.drawer{position:absolute;right:0;top:0;bottom:0;width:480px;background:#fff;border-left:1px solid var(--line-2);box-shadow:-10px 0 30px rgba(11,31,58,.18);z-index:30;display:flex;flex-direction:column}
.mh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:18px;font-weight:500}.mh small{display:block;color:var(--muted)}
.x{margin-left:auto;border:1px solid var(--line-2);background:#fff;width:34px;height:34px;border-radius:4px;font-size:18px}
.pl{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
.pl .t{flex:1}.pl b{font-weight:500}.pl small{display:block;color:var(--muted);font-size:12.5px}
.pl.soon{opacity:.5}
.modal{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:660px;max-width:calc(100% - 24px);background:#fff;border-radius:6px;box-shadow:0 12px 40px rgba(11,31,58,.28);z-index:30}
.mb{padding:18px 20px}.mf{display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--line)}
.st{font-weight:500;margin:0 0 8px;display:flex;gap:8px;align-items:center}.st i{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}.st span{color:var(--muted);font-weight:400;font-size:12.5px}
.pks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 18px}
.pk{border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}.pk:hover{border-color:var(--signal);background:var(--sig-bg)}.pk .bi{width:28px;height:28px;margin-bottom:4px}.pk b{font-weight:500}.pk small{color:var(--muted);font-size:12px}.pk.off{opacity:.5;background:var(--bg)}
.code{height:56px;border:1px solid var(--line-2);border-radius:4px;display:grid;place-items:center;font-size:26px;letter-spacing:.45em;color:#A9B4C2;margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.fld label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:4px}.fld input,.fld select{width:100%;height:40px;border:1px solid var(--line-2);border-radius:4px;padding:0 10px;background:#fff;font:inherit}
.sw-row{display:flex;gap:20px;align-items:center;background:var(--bg);border-radius:6px;padding:12px 14px}.sw-row>div{flex:1}.sw-row small{display:block;color:var(--muted);font-size:12.5px}.sw{width:36px;height:20px;border-radius:10px;background:var(--ok);position:relative;flex:none}.sw::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.scene{display:none}.scene.on{display:block}
</style>
</head>
<body>
<div class="mock"><div class="row" id="scs">
  <button class="sc on" data-s="a">1 · Menu latéral</button>
  <button class="sc" data-s="b">2 · Connecter un écran</button>
  <button class="sc" data-s="c">Ce que l'entrée latérale ouvre</button></div>
  <div id="note"></div></div>
<div id="root"></div>
<script>
const ic=(n,c,cls='')=>`<img class="bi ${cls}" alt="" src="https://cdn.simpleicons.org/${n}/${c}">`;
const winSvg=(cls='')=>`<svg class="bi ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path fill="#0078D4" d="M0 3.449 9.75 2.1v9.451H0zm10.949-1.5L24 0v11.4H10.949zM0 12.6h9.75v9.451L0 20.699zm10.949 0H24V24l-13.051-1.8z"/></svg>`;
const side=hl=>`<div class="side"><div class="logo">linkivi</div>
<div class="nav on"><span class="ic">▭</span>Écrans</div><div class="nav"><span class="ic">☰</span>Programmation</div><div class="nav"><span class="ic">▣</span>Contenus</div><div class="nav"><span class="ic">▨</span>Statistiques</div>
<div class="spacer"></div><div class="nav"><span class="ic">⚇</span>Organisation</div><div class="nav"><span class="ic">⚙</span>Réglages</div>
<div class="nav ${hl?'hl':''}"><span class="ic">⬇</span>Installer le player</div>
<div class="modeb"><span class="ic">≡</span>Mode expert<i></i></div>
<div class="me"><div class="av">LU</div><div><b style="font-weight:500">LPR Unil</b><br><small style="color:var(--muted)">ludovicgregory.prieur@unil.ch</small></div></div></div>`;
const head=()=>`<div class="head"><div><h1>Vos écrans</h1><p class="sub">Choisissez la liste de lecture et les widgets de chaque écran, puis publiez.</p></div>
<div class="addw"><button class="btn">+ Ajouter ▾</button></div></div>`;
const pick=(n,svg,name,ver,off)=>`<button class="pk ${off?'off':''}">${svg}<b>${name}</b><small>${ver}</small></button>`;
const pairForm=`<div class="modal"><div class="mh"><h3>Connecter un écran</h3><button class="x">×</button></div><div class="mb">
<div class="st"><i>1</i> Installez le player sur l'écran <span>(une fois par écran)</span></div>
<div class="pks">${pick(1,winSvg(),'Windows','v0.3.1 · .msi')}${pick(2,ic('android','3DDC84'),'Android / TV','v1.3.1 · .apk')}${pick(3,ic('googlechrome','4285F4'),'Navigateur','Sans installation')}${pick(4,ic('linux','000000'),'Linux','Bientôt',true)}</div>
<div class="st"><i>2</i> Saisissez le code à 6 chiffres affiché sur l'écran</div>
<div class="code">000000</div>
<div class="g2"><div class="fld"><label>Nom de l'écran</label><input placeholder="Ex. Accueil, salle de pause"></div><div class="fld"><label>Liste de lecture</label><select><option>— Aucune liste de lecture —</option></select></div></div>
<div class="g3"><div class="fld"><label>Matériel</label><select><option>Téléviseur</option></select></div><div class="fld"><label>Format</label><select><option>Paysage</option></select></div><div class="fld"><label>Résolution</label><select><option>Auto (de l'appareil)</option></select></div></div>
<div class="sw-row"><div><b>Plein écran</b><small>Coupé : sur un PC Windows, le player s'ouvre en fenêtre dès l'appairage. Pratique pour tester plusieurs écrans sur un PC.</small></div><i class="sw"></i></div>
</div><div class="mf"><button class="btn ghost">Annuler</button><span style="flex:1"></span><button class="btn">+ Connecter</button></div></div>`;
const rows=`<div class="card"><div class="srow"><div class="thumb"></div><div><b>Salle LPR</b></div></div><div class="srow"><div class="thumb"></div><div><b>Accueil</b></div></div></div>`;
const panel=`<div class="veil"></div><div class="drawer"><div class="mh"><div><h3>Installer le player</h3><small>À installer sur l'écran. Il affiche ensuite un code à saisir dans « Connecter un écran ».</small></div><button class="x">×</button></div>
<div class="pl">${winSvg('lg')}<div class="t"><b>Windows</b><small>v0.3.1 · 51 Mo</small></div><button class="btn sm">⬇ Télécharger</button></div>
<div class="pl">${ic('android','3DDC84','lg')}<div class="t"><b>Android et Android TV</b><small>v1.3.1 · 9 Mo</small></div><button class="btn sm">⬇ Télécharger</button></div>
<div class="pl soon">${ic('linux','000000','lg')}<div class="t"><b>Linux</b><small>Bientôt disponible</small></div></div>
<div class="pl">${ic('googlechrome','4285F4','lg')}<div class="t"><b>Navigateur</b><small>linkivi.duckdns.org/player/</small></div><button class="btn ghost sm">Ouvrir ↗</button></div></div>`;
const S={a:`<div class="app">${side(true)}<div class="main">${head(false)}${rows}</div></div>`,
 b:`<div class="app">${side(false)}<div class="main">${head()}${rows}</div><div class="veil"></div>${pairForm}</div>`,
 c:`<div class="app">${side(false)}<div class="main">${head(false)}${rows}</div>${panel}</div>`};
const N={a:"<b>Menu latéral.</b> Une entrée « Installer le player » au-dessus de « Mode expert ». Elle ouvre le panneau de la 3e vue.",
 b:"<b>Connecter un écran.</b> Rien dans « + Ajouter » : le choix du player est l'étape 1 de la fenêtre, avec les logos officiels (un clic télécharge ou ouvre). Linux est grisé tant que le player n'existe pas. Le formulaire est aussi remis en ordre : code en grand, champs groupés, « Plein écran » en pleine largeur.",
 c:"<b>Ce qui s'ouvre.</b> Un seul panneau, quatre lignes : logo officiel, version, bouton. Linux est grisé tant que le player n'existe pas."};
const root=document.getElementById('root');
for(const k in S){const d=document.createElement('div');d.className='scene';d.id=k;d.innerHTML=S[k];root.appendChild(d)}
function show(s){document.querySelectorAll('.scene').forEach(e=>e.classList.toggle('on',e.id===s));
 document.querySelectorAll('#scs .sc').forEach(b=>b.classList.toggle('on',b.dataset.s===s));note.innerHTML=N[s]}
document.querySelectorAll('#scs .sc').forEach(b=>b.onclick=()=>show(b.dataset.s));show('c');
</script>
</body>
</html>
