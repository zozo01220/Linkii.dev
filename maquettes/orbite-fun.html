<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linkii · Orbite (maquette fun)</title>
<style>
  :root{
    --bg:#070b1a; --ink:#e8ecff; --mute:#8b93b8; --line:rgba(160,175,255,.18);
    --orange:#ff8a3d; --ok:#4ade80; --bad:#ff5d6c; --glass:rgba(18,24,52,.65);
  }
  *{box-sizing:border-box;margin:0}
  body{
    height:100vh;overflow:hidden;color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(1200px 700px at 50% 55%,#16205a 0%,transparent 60%),
      radial-gradient(700px 500px at 85% 10%,#3a1559 0%,transparent 60%),
      var(--bg);
  }
  #stars{position:fixed;inset:0;z-index:0}
  header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:20px;padding:14px 24px}
  .logo{font-weight:700;font-size:20px;letter-spacing:-.5px}
  .logo i{color:var(--orange);font-style:normal}
  .modes{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:3px;backdrop-filter:blur(8px)}
  .modes button{all:unset;cursor:pointer;padding:6px 16px;border-radius:99px;color:var(--mute)}
  .modes button.on{background:var(--ink);color:#0b1030;font-weight:600}
  .search{margin-left:auto;display:flex;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:7px 16px;color:var(--mute);backdrop-filter:blur(8px)}
  kbd{border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--orange),#c43bff);display:grid;place-items:center;font-weight:700}

  #space{position:fixed;inset:0;z-index:1}
  .ring{position:absolute;left:50%;top:50%;border:1px dashed var(--line);border-radius:50%;transform:translate(-50%,-50%) scaleY(.55)}
  .ringlabel{position:absolute;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);transform:translateX(-50%)}
  .sun{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffd29a,#ff8a3d 55%,#b8350f);
    box-shadow:0 0 60px 20px rgba(255,138,61,.45),0 0 160px 60px rgba(255,138,61,.18);
    display:grid;place-items:center;text-align:center;color:#2a0d00;animation:pulse 4s ease-in-out infinite}
  .sun b{font-size:15px;display:block}
  .sun span{font-size:11px;opacity:.8}
  @keyframes pulse{50%{box-shadow:0 0 80px 28px rgba(255,138,61,.55),0 0 190px 70px rgba(255,138,61,.2)}}

  .planet{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;cursor:pointer;
    box-shadow:inset -10px -10px 22px rgba(0,0,0,.55),0 0 22px var(--glow);
    background:radial-gradient(circle at 32% 28%,var(--c1),var(--c2));
    display:grid;place-items:center;font-size:22px;transition:transform .2s,box-shadow .2s}
  .planet:hover,.planet.drop{transform:scale(1.25);z-index:3}
  .planet.drop{box-shadow:0 0 0 4px var(--orange),0 0 50px var(--orange)}
  .planet.off{filter:grayscale(1) brightness(.5);animation:flick 2.4s infinite}
  .planet.off::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--bad)}
  @keyframes flick{0%,90%{opacity:1}93%{opacity:.4}96%{opacity:.9}}
  .planet .name{position:absolute;top:70px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;text-shadow:0 1px 6px #000}
  .planet.sel{box-shadow:0 0 0 3px #fff,0 0 30px var(--glow)}
  .moon{position:absolute;right:-4px;top:-2px;width:18px;height:18px;border-radius:50%;background:#fff;color:#111;font-size:10px;font-weight:700;display:grid;place-items:center}

  #tip{position:fixed;z-index:9;pointer-events:none;opacity:0;transition:opacity .15s;width:220px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;backdrop-filter:blur(12px)}
  #tip .mini{height:90px;border-radius:8px;margin-bottom:8px;display:grid;place-items:center;font-size:30px}
  #tip small{color:var(--mute)}

  aside{position:fixed;z-index:6;top:70px;right:20px;bottom:130px;width:310px;background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(14px);
    transform:translateX(120%);transition:transform .35s cubic-bezier(.2,.9,.3,1);overflow:auto}
  aside.open{transform:none}
  aside h2{font-size:20px;margin:2px 0}
  .chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.1)}
  .chip.ok{background:rgba(74,222,128,.18);color:var(--ok)} .chip.bad{background:rgba(255,93,108,.2);color:var(--bad)}
  .screen{height:150px;border-radius:12px;margin:14px 0;display:grid;place-items:center;font-size:44px;border:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);color:var(--mute)}
  .row b{color:var(--ink);font-weight:500}
  .btn{all:unset;cursor:pointer;display:block;text-align:center;margin-top:12px;padding:10px;border-radius:12px;background:var(--orange);color:#2a0d00;font-weight:700}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
  .x{position:absolute;right:16px;top:12px;cursor:pointer;color:var(--mute);font-size:18px}

  .dock{position:fixed;z-index:6;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px)}
  .dock .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);max-width:80px}
  .comet{width:64px;height:64px;border-radius:14px 50% 50% 14px;cursor:grab;display:grid;place-items:center;font-size:26px;position:relative;user-select:none;
    background:linear-gradient(90deg,transparent,var(--cc));box-shadow:0 0 18px var(--cc);transition:transform .15s}
  .comet:hover{transform:translateY(-6px) rotate(-6deg)}
  .comet small{position:absolute;bottom:-18px;font-size:10px;color:var(--mute);white-space:nowrap}
  #ghost{position:fixed;z-index:20;pointer-events:none;font-size:34px;display:none;filter:drop-shadow(0 0 12px var(--orange))}
  #toast{position:fixed;z-index:30;left:50%;top:70px;transform:translate(-50%,-30px);opacity:0;transition:.35s;background:var(--ink);color:#0b1030;padding:10px 20px;border-radius:99px;font-weight:600}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .hint{position:fixed;left:24px;bottom:28px;z-index:4;color:var(--mute);font-size:12px;max-width:190px}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<header>
  <div class="logo">link<i>ii</i> <span style="font-weight:400;color:var(--mute);font-size:13px">· orbite</span></div>
  <div class="modes"><button class="on">Orbite</button><button>Liste</button><button>Carte</button></div>
  <div class="search">🔭 Chercher un écran, un média… <kbd>Ctrl K</kbd></div>
  <div class="avatar">LP</div>
</header>

<div id="space"></div>
<div class="hint">Survolez une planète pour la figer. Attrapez une comète en bas et lâchez-la sur un écran pour la publier.</div>

<aside id="panel"></aside>
<div id="tip"></div>

<div class="dock">
  <div class="lbl">Médiathèque</div>
  <div class="comet" style="--cc:#ff8a3d" data-m="Menu du jour" data-i="🍽️">🍽️<small>Menu du jour</small></div>
  <div class="comet" style="--cc:#38bdf8" data-m="Météo" data-i="⛅">⛅<small>Météo</small></div>
  <div class="comet" style="--cc:#c084fc" data-m="Vidéo accueil" data-i="🎬">🎬<small>Vidéo accueil</small></div>
  <div class="comet" style="--cc:#4ade80" data-m="Planning salles" data-i="📅">📅<small>Planning salles</small></div>
  <div class="comet" style="--cc:#fb7185" data-m="Alerte incendie" data-i="🚨">🚨<small>Alerte</small></div>
  <div class="comet" style="--cc:#facc15;opacity:.6" data-m="Nouveau" data-i="➕">➕<small>Ajouter</small></div>
</div>
<div id="ghost"></div>
<div id="toast"></div>

<script>
/* ---- données de démo ---- */
const rings=[
  {name:"Accueil",r:210,speed:.00012,screens:[
    {n:"Hall d'entrée",i:"👋",c:["#ffb36b","#c4421a"],on:1,pl:"Bienvenue"},
    {n:"Réception",i:"🛎️",c:["#7dd3fc","#1d4ed8"],on:1,pl:"Météo + agenda"},
    {n:"Vitrine rue",i:"🛍️",c:["#f0abfc","#86198f"],on:0,pl:"Promos"}]},
  {name:"Cafétéria",r:340,speed:-.00008,screens:[
    {n:"Menu mural",i:"🍽️",c:["#fde68a","#b45309"],on:1,pl:"Menu du jour"},
    {n:"Caisse",i:"💳",c:["#86efac","#15803d"],on:1,pl:"Offres"},
    {n:"Terrasse",i:"☀️",c:["#fca5a5","#b91c1c"],on:1,pl:"Météo"},
    {n:"Distributeurs",i:"🥤",c:["#a5b4fc","#4338ca"],on:1,pl:"Boissons"}]},
  {name:"Étages",r:480,speed:.00005,screens:[
    {n:"Salle Mercure",i:"📅",c:["#67e8f9","#0e7490"],on:1,pl:"Planning salles"},
    {n:"Salle Vénus",i:"📅",c:["#67e8f9","#0e7490"],on:1,pl:"Planning salles"},
    {n:"Open space",i:"📢",c:["#d8b4fe","#7e22ce"],on:1,pl:"Annonces"},
    {n:"Couloir 2",i:"🧭",c:["#fdba74","#c2410c"],on:0,pl:"—"},
    {n:"Atelier",i:"🛠️",c:["#bef264","#4d7c0f"],on:1,pl:"Consignes"}]}
];
const space=document.getElementById('space');
const sun=document.createElement('div');sun.className='sun';
sun.innerHTML='<div><b>Mon organisation</b><span>12 écrans · 10 en ligne</span></div>';
space.appendChild(sun);
let paused=null, t=0, selected=null;
rings.forEach((g,gi)=>{
  const ring=document.createElement('div');ring.className='ring';g.el=ring;space.appendChild(ring);
  const lab=document.createElement('div');lab.className='ringlabel';g.lab=lab;lab.textContent=g.name+" · "+g.screens.length;space.appendChild(lab);
  g.screens.forEach((s,si)=>{
    s.a0=(si/g.screens.length)*Math.PI*2+gi;
    const p=document.createElement('div');p.className='planet'+(s.on?'':' off');
    p.style.setProperty('--c1',s.c[0]);p.style.setProperty('--c2',s.c[1]);p.style.setProperty('--glow',s.c[0]+'88');
    p.innerHTML=s.i+'<span class="name">'+s.n+'</span>'+(!s.on?'<span class="moon" style="background:var(--bad);color:#fff">!</span>':'');
    p.onmouseenter=e=>{paused=g;showTip(p,s)};
    p.onmouseleave=()=>{paused=null;document.getElementById('tip').style.opacity=0};
    p.onclick=()=>openPanel(s,p);
    s.p=p;space.appendChild(p);
  });
});
function layout(){
  const W=innerWidth,H=innerHeight,cx=W/2,cy=H/2+10,k=Math.min(1,W/1300,H/900);
  rings.forEach(g=>{
    const R=g.r*k;g.el.style.width=R*2+'px';g.el.style.height=R*2+'px';g.el.style.left=cx+'px';g.el.style.top=cy+'px';
    g.lab.style.left=cx+'px';g.lab.style.top=cy+R*.55+6+'px';
    g.screens.forEach(s=>{
      const a=s.a0+g.ang;
      s.p.style.left=cx+Math.cos(a)*R+'px';s.p.style.top=cy+Math.sin(a)*R*.55+'px';
      s.p.style.zIndex=Math.sin(a)>0?2:1;
    });
  });
  sun.style.left=cx+'px';sun.style.top=cy+'px';
}
rings.forEach(g=>g.ang=0);
let last=performance.now();
function loop(now){const dt=now-last;last=now;
  rings.forEach(g=>{if(paused!==g)g.ang+=g.speed*dt*6});layout();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---- info-bulle + panneau ---- */
function showTip(p,s){
  const t=document.getElementById('tip');
  t.innerHTML='<div class="mini" style="background:linear-gradient(135deg,'+s.c[0]+','+s.c[1]+')">'+s.i+'</div><b>'+s.n+'</b><br><small>'+(s.on?'En diffusion · '+s.pl:'Hors ligne depuis 2 h')+'</small>';
  const r=p.getBoundingClientRect();t.style.left=Math.min(innerWidth-240,r.right+14)+'px';t.style.top=Math.max(70,r.top-30)+'px';t.style.opacity=1;
}
function openPanel(s,p){
  document.querySelectorAll('.planet.sel').forEach(x=>x.classList.remove('sel'));p.classList.add('sel');
  const a=document.getElementById('panel');
  a.innerHTML='<span class="x" onclick="panel.classList.remove(\'open\')">✕</span>'+
  '<span class="chip '+(s.on?'ok':'bad')+'">'+(s.on?'● En ligne':'● Hors ligne')+'</span><h2>'+s.n+'</h2>'+
  '<div class="screen" style="background:linear-gradient(135deg,'+s.c[0]+'55,'+s.c[1]+'99)">'+s.i+'</div>'+
  '<div class="row">Diffuse<b>'+s.pl+'</b></div><div class="row">Liste de lecture<b>Standard</b></div>'+
  '<div class="row">Prochain créneau<b>18:00 · Soirée</b></div><div class="row">Dernier contact<b>'+(s.on?'à l’instant':'il y a 2 h')+'</b></div>'+
  '<a class="btn">Modifier la liste</a><a class="btn ghost">Paramètres de l’écran</a>';
  a.classList.add('open');
}

/* ---- glisser les comètes ---- */
const ghost=document.getElementById('ghost');let drag=null;
document.querySelectorAll('.comet').forEach(c=>{
  c.addEventListener('pointerdown',e=>{drag=c.dataset;ghost.textContent=c.dataset.i;ghost.style.display='block';mv(e)});
});
addEventListener('pointermove',mv);
function mv(e){if(!drag)return;ghost.style.left=e.clientX-17+'px';ghost.style.top=e.clientY-17+'px';
  document.querySelectorAll('.planet').forEach(p=>{const r=p.getBoundingClientRect();
    p.classList.toggle('drop',e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)})}
addEventListener('pointerup',()=>{if(!drag)return;
  const t=document.querySelector('.planet.drop');
  if(t){const s=rings.flatMap(g=>g.screens).find(s=>s.p===t);s.pl=drag.m;t.classList.remove('drop');
    t.firstChild.textContent=drag.i;toast('✨ « '+drag.m+' » publié sur '+s.n)}
  drag=null;ghost.style.display='none'});
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}

/* ---- ciel étoilé ---- */
const cv=document.getElementById('stars'),cx=cv.getContext('2d');let st=[];
function resize(){cv.width=innerWidth;cv.height=innerHeight;st=Array.from({length:180},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.2,p:Math.random()*6}))}
resize();addEventListener('resize',resize);
(function twinkle(n){cx.clearRect(0,0,cv.width,cv.height);
  st.forEach(s=>{cx.globalAlpha=.4+.6*Math.abs(Math.sin(n/1200+s.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()});
  requestAnimationFrame(twinkle)})(0);
</script>
</body>
</html>
