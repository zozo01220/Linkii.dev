<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette : application LinkedIn (pages réelles)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../Linkii.Poc/wwwroot/app.css">
<style>
/* ---------- barre de la maquette (hors application) ---------- */
.mock{position:sticky;top:0;z-index:2000;background:#fff;border-bottom:1px dashed #CDD3DC;padding:7px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:12.5px/1.4 "IBM Plex Sans",system-ui,sans-serif;color:#6B7686}
.mock b{color:#0B1F3A;font-weight:600}
.mseg{display:inline-flex;background:#E8EBF0;border-radius:8px;padding:2px;flex-wrap:wrap}
.mseg button{border:0;background:none;padding:4px 10px;border-radius:6px;color:#6B7686;font:inherit;cursor:pointer}
.mseg button.on{background:#fff;color:#1B2433;box-shadow:0 1px 2px #0002;font-weight:600}
.mseg.st button{color:#8A231C}
.shell{min-height:calc(100vh - 45px)}
.mock-note{position:fixed;right:16px;bottom:16px;z-index:1990;max-width:340px;background:#FFF8E1;border:1px dashed #E0B84A;color:#6B5200;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.45;box-shadow:0 6px 18px rgba(11,31,58,.12)}
.mock-note b{color:#6B5200}

/* ---------- éléments nouveaux (n'existent pas encore dans app.css) ---------- */
.int-card.hl{box-shadow:0 0 0 2px var(--signal)}
.nm-new{font-size:10.5px;font-weight:600;letter-spacing:.03em;background:var(--signal);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.cw-row .cw-av.pg{border-radius:6px;color:#fff}
.cw-row .cw-role{font-size:12px;color:var(--muted);border:1px solid var(--line-2);border-radius:99px;padding:1px 8px;margin-left:auto;margin-right:10px;white-space:nowrap}
.cw-row.dis{opacity:.5;cursor:default;border-style:dashed}
.li-posts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.li-post{display:flex;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface)}
.li-post:first-child{border-top:0}
.li-post .th{width:52px;height:34px;border-radius:4px;overflow:hidden;flex:none;background:var(--row);position:relative}
.li-post .th svg{width:100%;height:100%;display:block}
.li-post .th .pl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:11px}
.li-post .tx{flex:1;min-width:0;font-size:13px;line-height:1.35}
.li-post .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-post .tx small{color:var(--muted);font-size:12px}
.li-post .s{font-size:12px;white-space:nowrap}
.li-post .s.wait{color:var(--warn-ink);font-weight:500}.li-post .s.ok{color:var(--ok-ink)}.li-post .s.hid{color:var(--muted)}
.li-post.wait{background:var(--warn-bg)}
.apd-row .apd-sel{height:34px;border:1px solid var(--line);border-radius:var(--radius);padding:0 10px;background:#fff;font:inherit;font-size:14px}
.cvs-account .exp{color:var(--warn-ink)}
.tvbig{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px}
.tvbig .frame{width:min(1000px,100%);background:#111;border-radius:14px;padding:12px}
.tvbig .frame.p{width:min(380px,100%)}
.tvbig .frame .scr16{aspect-ratio:16/9;border-radius:4px;overflow:hidden;position:relative}
.tvbig .frame.p .scr16{aspect-ratio:9/16}
.tvbig .cap{color:var(--muted);font-size:13.5px;text-align:center;max-width:820px}
.doc-an{max-width:920px}
.doc-an h2{font-size:19px;font-weight:500;margin:28px 0 10px}
.doc-an p,.doc-an li{color:#2A3B52;font-size:14.5px;line-height:1.55}
.doc-an ul,.doc-an ol{padding-left:20px;margin:6px 0}
.doc-an table{border-collapse:collapse;width:100%;font-size:14px;background:#fff;margin:8px 0}
.doc-an th,.doc-an td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.doc-an th{background:var(--row);font-weight:500}
.doc-an code{font-family:var(--mono);font-size:12.5px;background:var(--row);padding:1px 5px;border-radius:4px}
.dec td:first-child{width:36px;text-align:center;font-weight:600}
.dec td:nth-child(3){white-space:nowrap}

/* ---------- rendu du player (mêmes principes que .p-full.k-facebook : fond Nuit, cartes blanches) ---------- */
.li-scr{position:absolute;inset:0;container-type:size;background:#0B1F3A;color:#fff;font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
.li-in{position:absolute;inset:0;font-size:1cqw;padding:3.2em 4.4em;display:flex;flex-direction:column;gap:1.6em}
.li-h{display:flex;align-items:center;gap:.6em;font-size:2.9em;font-weight:500;letter-spacing:-.01em;flex:none}
.li-h svg{width:1.2em;height:1.2em;flex:none}
.li-h .pg{width:1.2em;height:1.2em;border-radius:.22em;background:#fff;color:#0B1F3A;display:grid;place-items:center;font-size:.55em;font-weight:600;flex:none}
.li-h span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-h small{font-size:.5em;font-weight:400;color:#9AAABD}
.li-card{background:#fff;color:#0B1F3A;border-radius:.8em;overflow:hidden;display:flex;min-width:0;min-height:0}
.li-card .im{position:relative;flex:none;overflow:hidden;background:#E9EDF2}
.li-card .im svg{position:absolute;inset:0;width:100%;height:100%}
.li-card .tx{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1}
.li-x{line-height:1.38;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.li-x .tag{color:#0A66C2}
.li-m{color:#5A6B80;display:flex;align-items:center;gap:.6em}
.li-rx{display:flex;align-items:center;gap:.5em;color:#5A6B80;white-space:nowrap}
.li-rx i{width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8em;color:#fff;margin-right:-.75em;border:.15em solid #fff}
.li-rx i:last-of-type{margin-right:.1em}
.li-qr{display:flex;align-items:center;gap:.8em;color:#5A6B80;text-align:right;line-height:1.25;margin-left:auto}
.li-qr svg{flex:none;border:.15em solid #E9EDF2;border-radius:.3em}
.li-dots{display:flex;gap:.6em;justify-content:center;flex:none}
.li-dots i{width:.7em;height:.7em;border-radius:50%;background:#2E4566}.li-dots i.on{background:#fff;width:2em;border-radius:.35em}
.li-bar{position:absolute;left:0;bottom:0;height:.45em;width:38%;background:#3B82C4}
/* une à la fois */
.li-one .li-card{flex:1}
.li-one .im{width:52%}
.li-one .tx{padding:2.6em 2.8em 2.2em;gap:1.6em}
.li-one .li-m{font-size:1.6em}
.li-one .li-x{font-size:2.5em;-webkit-line-clamp:7;flex:1}
.li-one .li-ft{display:flex;align-items:flex-end;gap:2em;font-size:1.5em}
.li-one .li-qr svg{width:5.4em;height:5.4em}
.li-one.txt .tx{padding:3em 6em}.li-one.txt .li-x{font-size:3.4em}
/* mur */
.li-wall .grid{flex:1;min-height:0;display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr;gap:1.6em}
.li-wall .li-card{flex-direction:column}
.li-wall .li-card:first-child{grid-row:1/3}
.li-wall .im{height:52%}
.li-wall .li-card:first-child .im{height:58%}
.li-wall .tx{padding:1em 1.3em;gap:.6em}
.li-wall .li-x{font-size:1.7em;-webkit-line-clamp:2;flex:1}
.li-wall .li-card:first-child .li-x{font-size:2.2em;-webkit-line-clamp:4}
.li-wall .li-ft{display:flex;align-items:center;justify-content:space-between;font-size:1.25em}
.li-wall .li-card:not(:first-child) .im{height:46%}
/* vidéo */
.li-vid .vbar{position:absolute;left:4%;right:4%;bottom:5%;height:.5em;border-radius:.25em;background:rgba(255,255,255,.45)}
.li-vid .vbar i{display:block;height:100%;width:42%;background:#fff;border-radius:.25em}
.li-vid .mute{position:absolute;left:4%;top:5%;background:rgba(0,0,0,.55);color:#fff;border-radius:.4em;padding:.3em .7em;font-size:1.4em;display:flex;gap:.4em;align-items:center}
/* portrait */
.li-scr.port .li-in{font-size:1.9cqw;padding:3em 3em 2.6em}
.li-port .li-card{flex:1;flex-direction:column}
.li-port .im{height:44%}
.li-port .tx{padding:2em 2.2em;gap:1.4em}
.li-port .li-m{font-size:1.6em}
.li-port .li-x{font-size:2.5em;-webkit-line-clamp:9;flex:1}
.li-port .li-ft{display:flex;align-items:flex-end;gap:1em;font-size:1.45em}
.li-port .li-qr svg{width:6em;height:6em}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="linkedin" viewBox="0 0 24 24"><rect width="24" height="24" rx="4" fill="#0A66C2"/><path fill="#fff" d="M5.3 9.3h2.9v9.4H5.3zM6.8 4.6a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4M10.1 9.3h2.8v1.3c.4-.7 1.4-1.5 2.8-1.5 3 0 3.5 2 3.5 4.5v5.1h-2.9v-4.5c0-1.1 0-2.5-1.5-2.5s-1.8 1.2-1.8 2.4v4.6h-2.9z"/></symbol>
  <symbol id="li-white" viewBox="0 0 24 24"><rect width="24" height="24" rx="4" fill="#fff"/><path fill="#0A66C2" d="M5.3 9.3h2.9v9.4H5.3zM6.8 4.6a1.7 1.7 0 1 1 0 3.4 1.7 1.7 0 0 1 0-3.4M10.1 9.3h2.8v1.3c.4-.7 1.4-1.5 2.8-1.5 3 0 3.5 2 3.5 4.5v5.1h-2.9v-4.5c0-1.1 0-2.5-1.5-2.5s-1.8 1.2-1.8 2.4v4.6h-2.9z"/></symbol>
</svg>

<div class="mock" role="toolbar" aria-label="Maquette">
  <b>Maquette LinkedIn</b>
  <span class="mseg" id="steps"></span>
  <span class="mseg st" id="states"></span>
  <span class="mseg" id="docb"></span>
</div>

<div id="app"></div>
<div class="mock-note" id="note"></div>

<script>
const LOGOS = "../Linkii.Poc/wwwroot/brand-logos.svg";
const ico = (d, s=18) => `<svg class="ico-svg" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const P = {
  search:'<circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path>',
  install:'<path d="M12 3v11M8 10l4 4 4-4"></path><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>',
  plus:'<path d="M12 5v14M5 12h14"></path>', check:'<path d="M20 6L9 17l-5-5"></path>',
  dotsv:'<circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle>',
  dots:'<circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle>',
  pen:'<path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path>',
  eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle>',
  up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path>',
  left:'<path d="M15 18l-6-6 6-6"></path>', right:'<path d="M9 18l6-6-6-6"></path>', x:'<path d="M18 6L6 18M6 6l12 12"></path>',
  chev:'<path d="M6 9l6 6 6-6"></path>', loop:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
  sync:'<path d="M23 4v6h-6M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect>',
  list:'<path d="M3 12h18M3 6h18M3 18h18"></path>',
  pin:'<rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M17.5 14v7M14 17.5h7"></path>',
  play:'<path d="M8 5.5v13l10.5-6.5z"></path>', pause:'<path d="M8 5v14M16 5v14"></path>',
  scr:'<rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path>',
  plsq:'<rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M10 8.5v7l5.5-3.5z"></path>'
};
const brand = (id, s=34) => `<svg class="brand-logo" width="${s}" height="${s}" role="img" aria-hidden="true"><use href="${id==='linkedin'?'':LOGOS}#${id}" width="100%" height="100%"></use></svg>`;

/* ---------------- données factices ---------------- */
const IMG = [
 '<defs><linearGradient id="a1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CC3E6"/><stop offset="1" stop-color="#DCE9F5"/></linearGradient></defs><rect width="400" height="300" fill="url(#a1)"/><rect x="60" y="120" width="120" height="180" fill="#3E5878"/><rect x="190" y="70" width="150" height="230" fill="#24405F"/><g fill="#9CC3E6" opacity=".8"><rect x="210" y="95" width="20" height="26"/><rect x="245" y="95" width="20" height="26"/><rect x="280" y="95" width="20" height="26"/><rect x="210" y="140" width="20" height="26"/><rect x="245" y="140" width="20" height="26"/><rect x="280" y="140" width="20" height="26"/><rect x="80" y="145" width="18" height="22"/><rect x="115" y="145" width="18" height="22"/></g><rect x="0" y="270" width="400" height="30" fill="#2B3A4C"/>',
 '<rect width="400" height="300" fill="#E8DCC8"/><circle cx="130" cy="150" r="58" fill="#C78C5B"/><circle cx="130" cy="122" r="28" fill="#6B4A33"/><path d="M72 300c0-60 26-96 58-96s58 36 58 96z" fill="#0A66C2"/><circle cx="270" cy="160" r="54" fill="#E0B48A"/><circle cx="270" cy="134" r="26" fill="#2F2A26"/><path d="M214 300c0-56 25-90 56-90s56 34 56 90z" fill="#2E8B57"/><rect x="0" y="0" width="400" height="40" fill="#D9CBB2"/>',
 '<rect width="400" height="300" fill="#1E2E44"/><rect x="40" y="60" width="320" height="180" rx="10" fill="#2E4566"/><path d="M70 210l60-60 40 40 50-70 110 90z" fill="#3B82C4"/><circle cx="300" cy="100" r="18" fill="#F4B400"/><rect x="40" y="250" width="200" height="12" rx="6" fill="#3E5878"/>',
 '<rect width="400" height="300" fill="#DCEBDD"/><path d="M0 230c80-30 160-30 240 0s120 20 160 0v70H0z" fill="#6DAE4F"/><g fill="#2E7D4F"><circle cx="90" cy="150" r="40"/><circle cx="170" cy="130" r="50"/><circle cx="270" cy="150" r="42"/></g><g fill="#6B4A33"><rect x="86" y="180" width="8" height="50"/><rect x="166" y="170" width="8" height="60"/><rect x="266" y="182" width="8" height="48"/></g>',
 '<rect width="400" height="300" fill="#F2E3D5"/><path d="M0 220c80-40 160-40 240 0s120 30 160 0v80H0z" fill="#E88E6A"/><circle cx="300" cy="90" r="40" fill="#FFF3D6"/><rect x="80" y="110" width="90" height="110" rx="6" fill="#0B1F3A"/><rect x="95" y="125" width="60" height="8" rx="4" fill="#F2E3D5"/><rect x="95" y="142" width="40" height="8" rx="4" fill="#F2E3D5"/>'
];
const POSTS = [
 {id:0,d:"il y a 2 h",t:"Nous inaugurons aujourd'hui nos nouveaux locaux du quai Nord. Merci à toutes les équipes qui ont rendu ce déménagement possible en trois semaines ! Portes ouvertes vendredi dès 16 h.",tags:"#nouveauxlocaux #équipe",img:0,like:"248",com:"31",st:"wait"},
 {id:1,d:"il y a 5 jours",t:"Bienvenue à Léa et Samuel qui rejoignent l'équipe projets. Ils accompagneront nos clients sur les chantiers de la région.",tags:"#bienvenue",img:1,like:"187",com:"22",st:"ok"},
 {id:2,d:"il y a 1 semaine",t:"Retour en vidéo sur notre conférence « Bâtir sobre » : 300 participants, 12 intervenants et beaucoup d'idées à mettre en pratique.",tags:"#conférence",img:2,like:"96",com:"8",st:"ok",vid:true},
 {id:3,d:"il y a 10 jours",t:"Nous avons planté 120 arbres avec nos clients ce week-end au bord du lac. Merci à tous les bénévoles pour leur énergie !",tags:"#environnement",img:3,like:"305",com:"40",st:"ok"},
 {id:4,d:"il y a 2 semaines",t:"Nous recrutons : cheffe ou chef de projet, 80 à 100 %, poste basé au quai Nord. Candidatures ouvertes jusqu'au 30 novembre.",tags:"#emploi",img:4,like:"412",com:"57",st:"hid"}
];
const SHOWN = () => POSTS.filter(p => p.st === "ok");
const pic = i => `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">${IMG[i]}</svg>`;
function qr(seed){let s=seed*7+3;const r=()=>{s=(s*9301+49297)%233280;return s/233280};let o='<svg viewBox="0 0 25 25" shape-rendering="crispEdges"><rect width="25" height="25" fill="#fff"/>';
 const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#0B1F3A"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0B1F3A"/>`;
 for(let y=0;y<25;y++)for(let x=0;x<25;x++){if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;if(r()>.52)o+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#0B1F3A"/>`}
 return o+f(0,0)+f(18,0)+f(0,18)+'</svg>'}

/* ---------------- état de la maquette ---------------- */
const ST = { step:"store", layout:"one", react:true, qr:true, tv:"one" };

/* ---------------- rendu sur l'écran ---------------- */
function render(kind = ST.layout, portrait = false){
  const head = `<div class="li-h"><span class="pg">AR</span><span>Atelier Rivage <small>· sur LinkedIn</small></span><svg><use href="#li-white"/></svg></div>`;
  const rx = p => ST.react ? `<span class="li-rx"><i style="background:#0A66C2">👍</i><i style="background:#DF704D">❤</i><i style="background:#6DAE4F">👏</i>${p.like} · ${p.com} commentaires</span>` : '<span></span>';
  const qrb = p => ST.qr ? `<span class="li-qr">Lire sur<br>LinkedIn${qr(p.id)}</span>` : '';
  const body = p => `${p.t} <span class="tag">${p.tags}</span>`;
  if (portrait) {
    const p = SHOWN()[0];
    return `<div class="li-scr port"><div class="li-in li-port">${head}<div class="li-card"><div class="im">${pic(p.img)}</div><div class="tx"><div class="li-m">${p.d}</div><div class="li-x">${body(p)}</div><div class="li-ft">${rx(p)}${qrb(p)}</div></div></div><div class="li-dots"><i class="on"></i><i></i><i></i></div></div><div class="li-bar"></div></div>`;
  }
  if (kind === "wall") {
    return `<div class="li-scr"><div class="li-in li-wall">${head}<div class="grid">${SHOWN().map(p=>`<div class="li-card"><div class="im">${pic(p.img)}${p.vid?'<div class="li-vid"><span class="mute" style="font-size:1em">▶ vidéo</span></div>':''}</div><div class="tx"><div class="li-x">${body(p)}</div><div class="li-ft"><span class="li-m">${p.d}</span>${rx(p)}</div></div></div>`).join('')}</div></div></div>`;
  }
  const p = kind === "video" ? POSTS[2] : SHOWN()[0];
  const vid = kind === "video" ? `<div class="li-vid"><span class="mute">🔇 Vidéo sans le son</span><div class="vbar"><i></i></div></div>` : '';
  return `<div class="li-scr"><div class="li-in li-one">${head}<div class="li-card"><div class="im">${pic(p.img)}${vid}</div><div class="tx"><div class="li-m">${p.d}</div><div class="li-x">${body(p)}</div><div class="li-ft">${rx(p)}${qrb(p)}</div></div></div><div class="li-dots"><i></i><i class="on"></i><i></i></div></div><div class="li-bar"></div></div>`;
}

/* ---------------- menu latéral (balisage réel) ---------------- */
function sidebar(active, withLi){
  const nav = (href, label, d, on) => `<a href="#" class="nav ${on?'active':''}" data-tip="${label}"><svg viewBox="0 0 24 24">${d}</svg> ${label} </a>`;

  <section class="ci-conf" aria-label="Configuration"><div class="ci-conf-main"><h4 class="ci-t">Configuration</h4>
   <div class="dw">
    <div class="dw-field"><label>Page LinkedIn</label><select><option>Atelier Rivage</option><option>Atelier Rivage – Carrières</option></select><small>Une page par contenu. Les pages se choisissent dans Applications › LinkedIn.</small></div>
    <div class="dw-field"><label>Présentation</label>${seg('seg-li-layout',[['one','Une à la fois'],['wall','Mur']],'layout')}<small>${ST.layout==='one'?'Chaque publication en grand, l\'une après l\'autre. Les vidéos sont lues sans le son.':'Les 3 dernières publications ensemble : une grande à gauche, deux à droite.'}</small></div>
    <div class="dw-field"><label>Nombre de publications</label><input type="number" min="1" max="10" value="5"><small>Les plus récentes parmi les publications affichées.</small></div>
   </div>
   <div class="cs-more">
    <section class="ci-listset" aria-label="Publications"><h4 class="ci-t">Publications</h4>
     <div class="li-posts">${POSTS.map(p=>`<div class="li-post ${p.st==='wait'?'wait':''}"><span class="th">${pic(p.img)}${p.vid?'<span class="pl">▶</span>':''}</span><span class="tx"><b>${p.t}</b><small>${p.d}${p.vid?' · vidéo':''}${stTxt[p.st]}</small></span>${st[p.st]}</div>`).join('')}</div>
     <p class="hint">Les nouvelles publications attendent votre accord (réglage dans Applications › LinkedIn). « Valider » les met à l'écran sans republier la liste.</p></section>
    <section class="ci-listset" aria-label="Dans cette liste de lecture"><h4 class="ci-t">Dans cette liste de lecture</h4><div class="dw"><div class="dw-field"><label>Durée de chaque publication (secondes)</label><input type="number" min="5" max="120" value="12"><small>Une vidéo reste jusqu'à sa fin.</small></div></div></section>
    <section class="ci-listset" aria-label="Programmation"><div class="ci-prog"><h4 class="ci-t">Programmation</h4> <div class="ci-seg" role="radiogroup"><button type="button" role="radio" aria-checked="true" class="on">Toujours</button> <button type="button" role="radio" aria-checked="false" class="">Période</button></div><p class="hint">Le contenu passe en boucle sans limite de date.</p></div></section>
    <section class="ci-listset" aria-label="QR code"><h4 class="ci-t">QR code </h4><div class="ci-qr"><div class="ci-qr-master"><div><b>QR code vers la publication</b><small>Chaque publication affiche un QR code qui l'ouvre sur LinkedIn ; chaque scan est compté.</small></div> <input type="checkbox" class="ios" ${ST.qr?'checked':''} data-t="qr"></div></div></section>
   </div></div></section></div></div></div></div>`;
}

/* ---------------- Écrans (cartes réelles .ec) ---------------- */
function ecCard(name, kind, portrait){
  return `<div class="pl-card ec  "><div class="ec-top"><div class="ec-stage "><div class="ec-tvw ${portrait?'p':''}"><div class="ec-tv"><span class="sc-zones dir-row"><span class="sc-zone" style="flex:100 1 0;position:relative;overflow:hidden">${render(kind, portrait)}</span></span></div> <span class="ec-neck"></span><span class="ec-base"></span></div> <button type="button" class="ec-hit" tabindex="-1"></button></div> <span class="ec-stat on"><i class="d"></i>En ligne</span>
  <div class="ec-ov"><input type="checkbox" class="ec-ck"> <div class="ec-rb"><button type="button" class="ec-rbtn" data-tip="Simuler">${ico(P.play,16)}</button><button type="button" class="ec-rbtn" data-tip="Aperçu en direct">${ico(P.eye,16)}</button> <button type="button" class="ec-rbtn" data-tip="Mettre en pause">${ico(P.pause,16)}</button></div></div></div>
  <div class="ec-bd"><div class="ec-nm"><span class="ec-kd">${ico(P.scr,16)}</span><button type="button" class="ec-name">${name}</button><div class="kebab ec-kw"><button type="button" class="kebab-btn">${ico(P.dotsv,16)}</button></div></div><label class="ec-pl">${ico(P.plsq,16)} <span class="ec-pln">Accueil</span> <span class="ec-chev">${ico(P.chev,16)}</span></label><div class="ec-ft"><span class="ec-ps ok">${ico(P.check,16)}<span class="t">Tout est à jour</span></span><span class="ec-ic"><span class="ec-share"></span></span></div></div></div>`;
}
function screensMain(){
  const big = ST.tv === 'portrait' ? `<div class="frame p"><div class="scr16">${render('one',true)}</div></div>` : `<div class="frame"><div class="scr16">${render(ST.tv)}</div></div>`;
  const cap = {one:"Une à la fois : la publication en grand, photo à gauche, texte à droite, réactions et QR code. 12 s par publication ; la barre bleue montre le temps restant.",wall:"Mur : les 3 dernières publications validées, la plus récente en grand. Convient aux écrans vus de loin.",video:"Vidéo : lue sans le son, la publication suivante vient à la fin de la vidéo.",portrait:"Écran portrait : la photo passe en haut, le texte prend toute la largeur."}[ST.tv];
  return `<div class="page-head "><div><h1 class="cmp-h1">Vos écrans</h1><p class="sub">Atelier Rivage · 3 écrans en ligne</p></div></div>
  <div class="pl-grid">${ecCard('Accueil – hall','one')}${ecCard('Cafétéria','wall')}${ecCard('Ascenseur','one',true)}</div>
  <h2 class="cat-group" style="margin-top:30px">Sur l'écran, en grand <span class="cat-count">player</span></h2>
  <div class="mseg" style="margin:6px 0 4px">${[['one','Une à la fois'],['wall','Mur'],['video','Vidéo'],['portrait','Portrait']].map(([v,l])=>`<button class="${ST.tv===v?'on':''}" data-tv="${v}">${l}</button>`).join('')}</div>
  <div class="tvbig">${big}<p class="cap">${cap}</p></div>`;
}

/* ---------------- analyse ---------------- */
const DOC = `<div class="page-head "><div><h1>Application LinkedIn : analyse</h1><p class="sub sc-intro">Version 2 · 14 novembre 2026 · maquette sur les pages réelles, rien de codé</p></div></div>
<div class="doc-an">
<h2>Décisions prises le 14 novembre</h2>
<table class="dec">
<tr><th>#</th><th>Question</th><th>Décision</th><th>Effet dans la maquette</th></tr>
<tr><td>1</td><td>Mode sans compte (« liens collés »)</td><td>Abandonné</td><td>Une seule source : la page entreprise, par connexion LinkedIn.</td></tr>
<tr><td>2</td><td>Validation des nouvelles publications</td><td>Activée par défaut, tous les plans</td><td>Réglage dans Applications › LinkedIn › Configuration ; liste « À valider / Valider » dans la fenêtre du contenu.</td></tr>
<tr><td>3</td><td>Plusieurs pages par contenu</td><td>Non : une page par contenu</td><td>Champ « Page LinkedIn » à choix unique.</td></tr>
<tr><td>4</td><td>Réactions et commentaires</td><td>Le nombre seulement, désactivable</td><td>Interrupteur dans les paramètres de l'application (vaut pour tous les contenus LinkedIn).</td></tr>
<tr><td>5</td><td>Vidéos</td><td>Lues sur l'écran</td><td>Sans le son ; la publication suivante vient à la fin de la vidéo.</td></tr>
<tr><td>6</td><td>Plan</td><td>Dès Essential, tous les plans</td><td>Aucune pastille de plan sur la carte du Store.</td></tr>
<tr><td>7</td><td>Bandeau</td><td>Non : pleine page seulement</td><td>Présentations « Une à la fois » et « Mur » ; ni bandeau ni angle.</td></tr>
</table>

<h2>Ce qui existe déjà</h2>
<ul>
<li>Une application LinkedIn v2.0.0 a été retirée le 7 octobre ; son code est dans <code>_archive/avant-retrait-apps-2026-10-07/</code> (OAuth, Posts API, tests sur réponses simulées). Elle n'a jamais été essayée sur le vrai LinkedIn. On n'en reprend pas l'identifiant et la clé saisis par chaque client, ni le mode « liens collés ».</li>
<li>L'intégration Facebook (§43) sert de modèle : compte de la plateforme, jetons chiffrés, fournisseur côté serveur, cache de 15 min, le player ne reçoit que texte, date, image et vidéo.</li>
</ul>

<h2>Contraintes de LinkedIn (à revérifier avant de coder)</h2>
<ul>
<li><b>Bloquant n° 1</b> : la lecture des pages passe par la <b>Community Management API</b>, à demander à LinkedIn (page vérifiée, description de l'usage, approbation au délai inconnu, refus possible). La carte reste masquée du Store tant que ce n'est pas accordé.</li>
<li>Seules les pages entreprise : un profil personnel ne peut pas être lu (état « Aucune page » de l'assistant).</li>
<li>Connexion d'environ 60 jours ; renouvellement automatique incertain selon le produit accordé. Rappels à J-7 et J-1 (centre de notifications et e-mail), carte rouge, et les écrans gardent la dernière version.</li>
<li>Photos et vidéos : adresses temporaires ; le serveur en garde une copie pour les écrans (vidéos comprises, lues hors ligne).</li>
</ul>

<h2>Parcours (pages réelles de la maquette)</h2>
<ol>
<li><b>Store</b> : carte dans « Réseaux sociaux », à côté de Facebook, bouton d'installation.</li>
<li><b>Assistant</b> (WizardShell, WizardAccount) : Compte › Sélection des pages › Terminé.</li>
<li><b>Mes applications</b> : carte LinkedIn ; en erreur, « Connexion LinkedIn expirée : reconnecter ».</li>
<li><b>Applications › LinkedIn › Configuration</b> : compte et échéance, réactions, validation, ancienneté.</li>
<li><b>Liste de lecture › Ajouter › LinkedIn</b>, puis la fenêtre standard d'un contenu (§236).</li>
<li><b>Écrans</b> : les cartes TV montrent le rendu ; rendu en grand pour chaque présentation.</li>
</ol>

<h2>Lots proposés</h2>
<ol>
<li>Prérequis hors code : application LinkedIn Linkivi, demande de la Community Management API, adresses de retour.</li>
<li>Lot 1 : connexion, assistant, carte de Mes applications, page Configuration, rappels d'échéance.</li>
<li>Lot 2 : manifeste v3 (placement plein écran seul), fournisseur, fenêtre du contenu, rendus « Une à la fois » et portrait.</li>
<li>Lot 3 : Mur, vidéos, validation des publications, QR code et comptage des scans.</li>
</ol>

<h2>Points encore ouverts</h2>
<ul>
<li>Ancienneté maximale : réglage de l'application (maquette) ou de chaque contenu ?</li>
<li>Republications d'autres pages : les exclure toujours (proposé) ou laisser le choix ?</li>
<li>Une publication supprimée sur LinkedIn quitte les écrans à la synchronisation suivante (15 min) : à confirmer.</li>
</ul>
</div>`;

/* ---------------- moteur ---------------- */
const STEPS = [['store','1 · Store'],['w1','2 · Compte'],['w2','3 · Pages'],['w3','4 · Terminé'],['mine','5 · Mes applications'],['app','6 · Paramètres de l\'app'],['list','7 · Ajouter à une liste'],['win','8 · Fenêtre du contenu'],['screens','9 · Sur l\'écran']];
const STATES = [['nopage','Aucune page'],['expire','Connexion expirée'],['w1x','Reconnexion']];
const NOTES = {
 store:"<b>Store réel</b> (classes .int-card, .btn-use-ic). LinkedIn rejoint « Réseaux sociaux » à côté de Facebook, sans pastille de plan : disponible dès Essential.",
 w1:"<b>Assistant réel</b> (WizardShell + WizardAccount). Seuls les textes changent. Cliquer « Continuer avec LinkedIn ».",
 w2:"Liste à cocher <b>.cw-row</b> comme les Pages Facebook, avec le rôle de la personne sur chaque page. Une page en lecture seule est grisée et expliquée.",
 w3:"Écran de fin standard : seul « Fermer ».",
 mine:"Carte de <b>Mes applications</b> : la page et le compte en sous-titre. L'application apparaît aussi dans le menu (groupe Applications).",
 app:"<b>Applications › LinkedIn › Configuration</b> (AppDetail réel). Décision 4 : les réactions se règlent ici, pour tous les contenus LinkedIn. La validation y est activée par défaut (décision 2).",
 list:"Page d'une liste réelle : LinkedIn apparaît dans la colonne <b>Ajouter</b>. Cliquer dessus ouvre la fenêtre du contenu.",
 win:"<b>Fenêtre standard</b> réelle (.ci-std, §236). Deux présentations seulement (décision 7). Essayer « Mur » et l'interrupteur du QR code.",
 listdone:"Après « Enregistrer » : la ligne LinkedIn signale la publication à valider.",
 screens:"<b>Cartes TV réelles</b> (.pl-card.ec) avec le rendu LinkedIn, puis le rendu du player en grand (fond Nuit et cartes blanches, comme Facebook).",
 nopage:"État d'erreur : le compte ne gère aucune page.",
 expire:"Connexion expirée : carte rouge dans Mes applications. Les écrans gardent les dernières publications.",
 w1x:"Reconnexion : même assistant, texte « Reconnectez ». Les contenus et écrans ne changent pas.",
 doc:"Analyse mise à jour avec tes 7 décisions."
};
function draw(){
  const s = ST.step;
  document.getElementById('steps').innerHTML = STEPS.map(([k,l])=>`<button class="${s===k||(s==='listdone'&&k==='list')?'on':''}" data-go="${k}">${l}</button>`).join('');
  document.getElementById('states').innerHTML = STATES.map(([k,l])=>`<button class="${s===k?'on':''}" data-go="${k}">${l}</button>`).join('');
  document.getElementById('docb').innerHTML = `<button class="${s==='doc'?'on':''}" data-go="doc">Analyse</button>`;
  const A = document.getElementById('app');
  const inst = !['store','w1','w2','w3','nopage'].includes(s);
  if (s==='store') A.innerHTML = shell('store', storeMain(true));
  else if (s==='w1') A.innerHTML = shell('store', storeMain(), W1());
  else if (s==='w2') A.innerHTML = shell('store', storeMain(), W2());
  else if (s==='w3') A.innerHTML = shell('store', storeMain(), W3());
  else if (s==='nopage') A.innerHTML = shell('store', storeMain(), NOPAGE());
  else if (s==='mine') A.innerHTML = shell('apps', mineMain('new'), '', true);
  else if (s==='expire') A.innerHTML = shell('apps', mineMain('expire'), '', true);
  else if (s==='w1x') A.innerHTML = shell('apps', mineMain('expire'), W1(true), true);
  else if (s==='app') A.innerHTML = shell('liapp', appMain(), '', true);
  else if (s==='list') A.innerHTML = shell('lists', listMain(false), '', true);
  else if (s==='listdone') A.innerHTML = shell('lists', listMain(true), '', true);
  else if (s==='win') A.innerHTML = shell('lists', listMain(false, ciWin()), '', true);
  else if (s==='screens') A.innerHTML = shell('screens', screensMain(), '', true);
  else if (s==='doc') A.innerHTML = shell('', DOC, '', true);
  document.getElementById('note').innerHTML = NOTES[s] || '';
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-pg],[data-all],[data-t],[data-tv]'); if (!t) return;
  if (t.dataset.go) { e.preventDefault(); ST.step = t.dataset.go; return draw(); }
  if (t.dataset.tv) { ST.tv = t.dataset.tv; return draw(); }
  if (t.dataset.t) { e.preventDefault(); ST[t.dataset.t] = !ST[t.dataset.t]; return draw(); }
  if (t.dataset.all) { const all = PAGES.filter(p=>!p.dis).every(p=>p.on); PAGES.forEach(p=>{ if(!p.dis) p.on = !all; }); return draw(); }
  if (t.dataset.pg) { const p = PAGES[+t.dataset.pg]; if (p.dis) return; p.on = !p.on; return draw(); }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset.set) { ST[t.dataset.set] = t.value; draw(); } });
draw();
</script>
