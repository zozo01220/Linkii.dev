<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Accès rapide au Store</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--signal:#3B82C4;--sig-bg:#EAF2FA;--ok:#2E8B57;--use:#E8731A}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.mock{position:sticky;top:0;z-index:300;background:#FFF8E1;border-bottom:1px dashed #E0B84A;padding:8px 16px;font-size:13px;color:#6B5200}
.mock .row{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.mock .sc{border:1px solid #E0B84A;background:#fff;border-radius:4px;padding:3px 10px;font-size:13px}
.mock .sc.on{background:#6B5200;border-color:#6B5200;color:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:0 16px;font-weight:500;display:inline-flex;gap:8px;align-items:center;height:38px;white-space:nowrap}
.btn.sm{height:30px;padding:0 12px;font-size:13px}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}
.btn.use{background:var(--use);border-color:var(--use)}
.app{display:flex;min-height:660px;position:relative;overflow:hidden}
.side{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
.logo{font-size:28px;font-weight:500;letter-spacing:-.5px;margin:0 0 18px 8px}
.nav{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:6px;color:var(--muted)}
.nav.on{background:var(--sig-bg);color:var(--ink);font-weight:500}
.nav.hl{outline:2px solid var(--signal);outline-offset:1px;color:var(--ink)}
.nav .pill{margin-left:auto;font-size:11px;background:var(--use);color:#fff;border-radius:10px;padding:1px 7px;font-weight:600}
.ic{width:20px;text-align:center;flex:none}
.spacer{flex:1;min-height:30px}
.sep{border-top:1px solid var(--line);margin:8px 12px}
.me{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--line);margin-top:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.col{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{height:56px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.top .grow{flex:1}
.search{width:300px;height:36px;border:1px solid var(--line-2);border-radius:18px;padding:0 14px;display:flex;align-items:center;gap:8px;color:var(--muted);background:var(--bg)}
.search kbd{margin-left:auto;font:inherit;font-size:11px;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;background:#fff}
.tbtn{height:36px;border:1px solid var(--line-2);background:#fff;border-radius:18px;padding:0 14px;display:inline-flex;gap:8px;align-items:center;font-weight:500}
.tbtn.hl{outline:2px solid var(--signal);outline-offset:2px;border-color:var(--signal)}
.tbtn .ic{color:var(--use)}
.circ{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;background:#fff;color:var(--muted)}
.main{flex:1;padding:24px 32px;position:relative}
.main h1{margin:0;font-size:28px;font-weight:500}.sub{color:var(--muted);margin:2px 0 16px}
.head{display:flex;gap:12px}.head>div:first-child{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:6px}
.srow{display:flex;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}.srow:first-child{border-top:0}
.thumb{width:84px;height:48px;border-radius:4px;background:#0E1E38}
.menu{position:absolute;right:32px;top:72px;width:350px;background:#fff;border:1px solid var(--line-2);border-radius:6px;box-shadow:0 8px 24px rgba(11,31,58,.16);padding:6px;z-index:5}
.menu .it{padding:9px 10px;border-radius:4px;display:flex;gap:12px;align-items:center}
.menu small{display:block;color:var(--muted);font-size:12px}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .it.hl{outline:2px solid var(--signal);outline-offset:-2px;background:var(--sig-bg)}
.menu .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 10px 2px}
.bi{width:22px;height:22px;flex:none;display:block}
.veil{position:absolute;inset:0;background:rgba(11,31,58,.38);z-index:20}
.drawer{position:absolute;right:0;top:0;bottom:0;width:470px;background:#fff;border-left:1px solid var(--line-2);box-shadow:-10px 0 30px rgba(11,31,58,.18);z-index:30;display:flex;flex-direction:column}
.mh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:18px;font-weight:500}.mh small{display:block;color:var(--muted)}
.x{margin-left:auto;border:1px solid var(--line-2);background:#fff;width:34px;height:34px;border-radius:4px;font-size:18px}
.dsr{padding:12px 20px;border-bottom:1px solid var(--line)}
.dsr .search{width:100%;border-radius:6px}
.chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);border-radius:14px;padding:2px 11px;font-size:12.5px;background:#fff;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dbody{flex:1;overflow:auto}
.dh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 20px 4px}
.it2{display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--line)}
.it2 .t{flex:1}.it2 b{font-weight:500}.it2 small{display:block;color:var(--muted);font-size:12.5px}
.ok{color:var(--ok);font-size:12.5px;font-weight:500}
.dfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;align-items:center}
.dfoot a{color:var(--signal);cursor:pointer}
.scene{display:none}.scene.on{display:block}
.vs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:18px 24px;max-width:1200px;margin:0 auto}
.vs .opt{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px}
.vs h4{margin:0 0 4px;font-size:16px;font-weight:500}.vs p{margin:0 0 8px;color:var(--muted)}
.vs ul{margin:0;padding-left:18px;color:var(--muted)}.vs .reco{border-color:var(--use);box-shadow:0 0 0 2px #FCE6D3}
.vs .tag{display:inline-block;background:var(--use);color:#fff;font-size:11px;font-weight:600;border-radius:10px;padding:1px 8px;margin-bottom:6px}
/* mobile */
.phones{display:flex;gap:40px;justify-content:center;padding:28px;flex-wrap:wrap}
.phone{width:320px;height:620px;border:8px solid #1b2a40;border-radius:34px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.phone .ph{padding:16px 18px 8px;font-size:22px;font-weight:500}
.phone .pb{flex:1;padding:0 14px}
.phone .bar{height:62px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;font-size:11px;color:var(--muted)}
.phone .bar div{display:flex;flex-direction:column;align-items:center;gap:2px}.phone .bar .ic{font-size:18px}
.phone .bar .on{color:var(--ink);font-weight:500}.phone .bar .hl{outline:2px solid var(--signal);outline-offset:3px;border-radius:6px;padding:0 6px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 24px rgba(11,31,58,.2);padding:14px 14px 18px;z-index:5}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 12px}
.sheet .g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet .g div{border:1px solid var(--line);border-radius:8px;padding:10px 4px;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.sheet .g .hl{outline:2px solid var(--signal);background:var(--sig-bg)}
.cap{text-align:center;color:var(--muted);margin-top:10px;max-width:320px}
</style>
</head>
<body>
<div class="mock"><div class="row" id="scs">
  <button class="sc on" data-s="a">1 · Menu latéral</button>
  <button class="sc" data-s="b">2 · Barre du haut</button>
  <button class="sc" data-s="c">3 · Ce qui s'ouvre (tiroir Store)</button>
  <button class="sc" data-s="d">4 · Dans « + Ajouter »</button>
  <button class="sc" data-s="e">5 · App mobile</button>
  <button class="sc" data-s="f">Comparatif</button></div>
  <div id="note"></div></div>
<div id="root"></div>
<script>
const ic=(n,c)=>`<img class="bi" alt="" src="https://cdn.simpleicons.org/${n}/${c}">`;
const side=hl=>`<div class="side"><div class="logo">linkivi</div>
<div class="nav on"><span class="ic">▭</span>Écrans</div><div class="nav"><span class="ic">☰</span>Programmation</div><div class="nav"><span class="ic">▣</span>Contenus</div><div class="nav"><span class="ic">▨</span>Compositions</div><div class="nav"><span class="ic">⚡</span>Mes intégrations</div>
<div class="nav ${hl?'hl':''}"><span class="ic">✦</span>Store<span class="pill">Nouveau</span></div>
<div class="spacer"></div><div class="sep"></div><div class="nav"><span class="ic">⚇</span>Organisation</div><div class="nav"><span class="ic">⚙</span>Réglages</div>
<div class="me"><div class="av">LU</div><div><b style="font-weight:500">LPR Unil</b><br><small style="color:var(--muted)">ludovicgregory.prieur@unil.ch</small></div></div></div>`;
const topbar=hl=>`<div class="top"><div class="search">⌕ Rechercher un écran, un contenu…<kbd>Ctrl K</kbd></div><div class="grow"></div>
<button class="tbtn ${hl?'hl':''}"><span class="ic">✦</span>Store</button><div class="circ">?</div><div class="circ">🔔</div></div>`;
const rows=`<div class="card"><div class="srow"><div class="thumb"></div><div><b>Salle LPR</b></div></div><div class="srow"><div class="thumb"></div><div><b>Accueil</b></div></div></div>`;
const page=(h,withTop,hlTop,menu)=>`<div class="col">${withTop?topbar(hlTop):''}<div class="main"><div class="head"><div><h1>Contenus</h1><p class="sub">Images, vidéos, pages web et intégrations à diffuser.</p></div><button class="btn">+ Ajouter ▾</button></div>${rows}${menu||''}</div></div>`;
const entry=(logo,name,desc,state)=>`<div class="it2">${logo}<div class="t"><b>${name}</b><small>${desc}</small></div>${state}</div>`;
const use=`<button class="btn use sm">Utiliser</button>`;
const drawer=`<div class="veil"></div><div class="drawer"><div class="mh"><div><h3>Store</h3><small>Ajoutez une intégration sans quitter votre page.</small></div><button class="x">×</button></div>
<div class="dsr"><div class="search">⌕ Rechercher une intégration…</div><div class="chips"><span class="chip on">Pour cette page</span><span class="chip">Tout</span><span class="chip">Calendriers</span><span class="chip">Réseaux sociaux</span><span class="chip">Météo</span><span class="chip">Fichiers</span></div></div>
<div class="dbody"><div class="dh">Suggérées pour Contenus</div>
${entry(ic('googleslides','FBBC04'),'Google Slides','Présentations converties en images',use)}
${entry(ic('canva','00C4CC'),'Canva','Vos designs, prêts à diffuser',use)}
${entry(ic('facebook','1877F2'),'Facebook','Publications de votre page',use)}
${entry(ic('instagram','E4405F'),'Instagram','Dernières publications',use)}
<div class="dh">Déjà dans Mes intégrations</div>
${entry(ic('googledrive','4285F4'),'Google Drive','Compte connecté','<span class="ok">✓ Actif</span>')}
${entry(ic('microsoftonedrive','0078D4'),'OneDrive','Compte connecté','<span class="ok">✓ Actif</span>')}</div>
<div class="dfoot"><a>Ouvrir le Store complet ↗</a><span style="flex:1"></span><button class="btn ghost sm">Fermer</button></div></div>`;
const addMenu=`<div class="menu"><div class="it"><span class="ic">⬆</span><div>Depuis l'ordinateur<small>Images, vidéos, PDF</small></div></div><div class="it"><span class="ic">🔗</span><div>Depuis une adresse<small>Page web, flux</small></div></div><div class="it"><span class="ic">☁</span><div>Depuis un cloud<small>Drive, OneDrive…</small></div></div><hr>
<div class="lab">Plus d'intégrations</div><div class="it hl"><span class="ic" style="color:var(--use)">✦</span><div>Parcourir le Store<small>Slides, Canva, réseaux sociaux, météo…</small></div></div></div>`;
const phone=(sheet,hlBar)=>`<div><div class="phone"><div class="ph">Écrans</div><div class="pb"><div class="card"><div class="srow"><div class="thumb"></div><div><b>Salle LPR</b></div></div><div class="srow"><div class="thumb"></div><div><b>Accueil</b></div></div></div></div>
<div class="bar"><div class="on"><span class="ic">▭</span>Écrans</div><div><span class="ic">☰</span>Programme</div><div><span class="ic">▣</span>Contenus</div><div class="${hlBar?'hl':''}"><span class="ic">⋯</span>Plus</div></div>${sheet||''}</div></div>`;
const sheet=`<div class="sheet"><div class="grab"></div><div class="g"><div><span class="ic">▨</span>Compositions</div><div><span class="ic">⚡</span>Intégrations</div><div class="hl"><span class="ic" style="color:var(--use)">✦</span><b>Store</b></div><div><span class="ic">⚇</span>Organisation</div><div><span class="ic">⚙</span>Réglages</div><div><span class="ic">⬇</span>Installer</div></div></div>`;
const S={
 a:`<div class="app">${side(true)}${page(0,false)}</div>`,
 b:`<div class="app">${side(false)}${page(0,true,true)}</div>`,
 c:`<div class="app">${side(false)}${page(0,true)}${drawer}</div>`,
 d:`<div class="app">${side(false)}${page(0,true,false,addMenu)}</div>`,
 e:`<div class="phones">${phone('',true)}<div>${phone(sheet,true)}</div></div>`,
 f:`<div class="vs">
  <div class="opt reco"><span class="tag">Recommandé</span><h4>Menu + tiroir rapide</h4><p>Entrée « Store » dans le menu, et bouton « Store » en haut de chaque page.</p><ul><li>Toujours visible, une seule place</li><li>Ouvre un tiroir : on reste sur sa page</li><li>Suggestions selon la page courante</li><li>Même geste sur mobile (feuille « Plus »)</li></ul></div>
  <div class="opt"><h4>Dans « + Ajouter » seulement</h4><p>Ligne « Parcourir le Store » au bas du menu Ajouter.</p><ul><li>Au bon moment : quand on veut ajouter</li><li>Pas de place prise dans le menu</li><li>Moins découvrable hors des pages de contenu</li></ul></div>
  <div class="opt"><h4>Bouton flottant</h4><p>Pastille ✦ en bas à droite, partout.</p><ul><li>Accès maximal</li><li>Masque du contenu, surtout sur les écrans de lecture et sur mobile</li><li>Ne suit pas la charte (calme, sans flottant)</li></ul></div></div>`};
const N={
 a:"<b>Menu latéral.</b> Une entrée « Store » (étoile orange) après « Mes intégrations », avec une pastille « Nouveau » quand le catalogue s'enrichit. Permanent, mais ne fait plus perdre la page : voir le tiroir (3).",
 b:"<b>Barre du haut.</b> Un bouton « Store » à droite, à côté de la recherche, visible sur toutes les pages même quand le menu est replié. La recherche globale (Ctrl K) remonte aussi les intégrations du Store.",
 c:"<b>Ce qui s'ouvre.</b> Un tiroir par-dessus la page, pas un changement de page : recherche, filtres, « Pour cette page » en premier (ex. Slides, Canva sur Contenus), bouton orange « Utiliser » comme dans le Store. Ce qui est déjà ajouté est rappelé en bas. Le lien du pied ouvre le Store complet.",
 d:"<b>Dans « + Ajouter ».</b> Dernière ligne du menu Ajouter, séparée : « Parcourir le Store ». Ouvre le même tiroir (3). À combiner avec 1 ou 2, pas seul.",
 e:"<b>App mobile.</b> « Store » dans la feuille « Plus » (barre du bas inchangée à 4 entrées). Le tiroir devient une feuille plein écran.",
 f:"<b>Comparatif.</b> Ma recommandation : menu latéral + bouton du haut, tous deux ouvrant le même tiroir ; « Parcourir le Store » dans « + Ajouter » en complément."};
const root=document.getElementById('root');
for(const k in S){const d=document.createElement('div');d.className='scene';d.id=k;d.innerHTML=S[k];root.appendChild(d)}
function show(s){document.querySelectorAll('.scene').forEach(e=>e.classList.toggle('on',e.id===s));
 document.querySelectorAll('#scs .sc').forEach(b=>b.classList.toggle('on',b.dataset.s===s));note.innerHTML=N[s]}
document.querySelectorAll('#scs .sc').forEach(b=>b.onclick=()=>show(b.dataset.s));show('c');
</script>
</body>
</html>
