<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Compositions, étape 3 : intégrations et champs reliés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--row:#EDF1F5;--brand-tint:#EBEDF0;--signal:#3B82C4;--ok:#2E8B57;--bad:#C0392B;--radius:4px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:#fff;color:var(--ink);font-size:14px;line-height:1.45;overflow:hidden}
button,select,input{font:inherit;color:inherit}
h4{margin:0;font-weight:500}
/* bandeau de la maquette */
.mock{position:fixed;top:0;left:0;right:0;z-index:100;background:#FFF8E1;border-bottom:1px dashed #E0B84A;padding:6px 16px;font-size:13px;color:#6B5200;display:flex;flex-direction:column;gap:5px}
.mock .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mock .sc{border:1px solid #E0B84A;background:#fff;border-radius:4px;padding:2px 10px;cursor:pointer;font-size:13px}
.mock .sc.on{background:#6B5200;border-color:#6B5200;color:#fff}
.mock .txt{line-height:1.35}
.app{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column}
/* barre du haut (comme l'éditeur actuel) */
.top{height:58px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);background:#fff}
.tb{height:34px;min-width:34px;border:0;background:none;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;cursor:pointer;color:var(--ink);white-space:nowrap}
.tb:hover{background:var(--bg)}
.tb svg{width:18px;height:18px;flex:none}
.sep{width:1px;height:26px;background:var(--line);margin:0 6px;flex:none}
.back{background:var(--bg);width:40px;height:40px}
.name{font-weight:500;font-size:16px;border:1px solid transparent;border-radius:4px;padding:5px 8px;width:210px;background:none}
.fmt{border:1px solid var(--line-2);border-radius:4px;padding:5px 10px;font-size:13px;background:#fff;white-space:nowrap}
.btn{font-weight:500;cursor:pointer;border:1px solid var(--ink);border-radius:var(--radius);padding:8px 16px;background:var(--ink);color:#fff;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;height:38px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}
.btn.sm{height:32px;padding:4px 12px;font-size:13px}
/* Aperçu : valeurs / noms des champs */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;height:32px}
.seg button{border:0;border-right:1px solid var(--line-2);background:#fff;padding:0 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff;font-weight:500}
.segl{font-size:12.5px;color:var(--muted);margin-right:6px}
/* corps */
.main{flex:1;display:flex;min-height:0}
.rail{width:80px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 6px;gap:2px;background:#fff}
.rail button{border:0;background:none;border-radius:6px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
.rail button svg{width:22px;height:22px}
.rail button:hover{background:var(--bg)}
.rail button.on{background:var(--brand-tint);color:var(--ink);font-weight:500}
.rail .new{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#E8833A}
.panel{width:330px;flex:none;border-right:1px solid var(--line);background:#fff;overflow-y:auto;padding:16px}
.center{flex:1;position:relative;min-width:0;background:#E8ECF1;overflow:hidden}
.frame{position:absolute;box-shadow:0 2px 18px rgba(11,31,58,.16)}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.overlay{position:absolute;inset:0;pointer-events:none}
.selbox{position:absolute;border:2px solid var(--signal);margin:-1px 0 0 -1px}
.selbox .hd{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid var(--signal);margin:-6px 0 0 -6px;border-radius:2px}
.seltag{position:absolute;left:-2px;top:-24px;background:var(--signal);color:#fff;font-size:11.5px;padding:2px 7px;border-radius:3px 3px 3px 0;white-space:nowrap;display:flex;gap:5px;align-items:center}
.rowtag{position:absolute;border:2px dashed #E8833A;margin:-1px 0 0 -1px}
.rowtag span{position:absolute;right:-2px;top:-22px;background:#E8833A;color:#fff;font-size:11px;padding:1px 7px;border-radius:3px 3px 0 3px;white-space:nowrap}
/* barre contextuelle */
.ctx{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(11,31,58,.14);display:flex;align-items:center;gap:4px;padding:6px 8px;z-index:5;white-space:nowrap;max-width:calc(100% - 24px);overflow-x:auto}
.ctx select,.ctx input[type=text]{border:1px solid var(--line-2);border-radius:4px;padding:5px 6px;background:#fff;height:32px}
.ctx .lbl{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;padding:0 4px}
.ctx .kind{display:inline-flex;gap:6px;align-items:center;font-weight:500;padding:0 6px 0 2px}
.ctx .sep{height:22px;margin:0 4px}
.ctx .cb{height:32px;border:1px solid transparent;background:none;border-radius:4px;padding:0 9px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.ctx .cb:hover{background:var(--bg)}
.ctx .cb.on{background:#EAF2FA;border-color:#B9D3EC;color:#1d4f80;font-weight:500}
.ctx .sw{width:32px;height:32px;border:1px solid var(--line-2);border-radius:4px;padding:3px;background:#fff}
.ctx .sw i{display:block;width:100%;height:100%;border-radius:2px}
.ctx .num{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;height:32px}
.ctx .num button{border:0;background:var(--bg);width:26px;height:32px}.ctx .num span{width:38px;text-align:center}
/* champ relié (pastille) dans l'éditeur */
.chain{display:inline-block;width:14px;height:14px;vertical-align:-2px}
.fd{border-radius:.18em}
.stage.names .fd{background:rgba(59,130,196,.28);box-shadow:0 0 0 .06em rgba(59,130,196,.7) inset;padding:0 .18em;font-style:normal}
.stage.mk-2 .wt .fd,.stage.mk-3 .lr .fd{background:rgba(59,130,196,.16);box-shadow:0 .07em 0 rgba(59,130,196,.9)}
.stage.names .ghost{opacity:.35}
/* panneaux */
.ph{display:flex;align-items:center;margin-bottom:12px}.ph h4{flex:1;font-size:16px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:4px;padding:7px 10px;margin-bottom:12px;color:var(--muted)}
.search input{border:0;outline:none;flex:1;min-width:0}
.grp{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.grp small{font-weight:400;letter-spacing:0;text-transform:none;margin-left:auto}
.help{color:var(--muted);font-size:13px;margin:0 0 10px}
.wrow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:9px 10px;margin-bottom:8px;cursor:grab;background:#fff}
.wrow:hover{border-color:var(--signal)}
.wrow.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.wi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
.wrow b{font-weight:500;display:block}.wrow small{color:var(--muted);font-size:12.5px;display:block;line-height:1.3}
.wrow .t{flex:1;min-width:0}
.wrow.off{opacity:.55;cursor:default;border-style:dashed}
.tag{font-size:10.5px;border-radius:3px;padding:1px 6px;font-weight:500;white-space:nowrap;flex:none}
.tag.blk{background:#EAF2FA;color:#1d4f80}.tag.new{background:#FDEBDC;color:#9A4A0E}.tag.fld{background:#E6F3EC;color:#1E6B42}
.link{background:none;border:0;color:var(--signal);cursor:pointer;padding:6px 0;font-weight:500}
.srcard{border:1px solid var(--line);border-radius:6px;padding:11px 12px;margin-bottom:10px}
.srcard .h{display:flex;gap:10px;align-items:center}
.srcard .h b{font-weight:500;flex:1}
.srcard .meta{color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.5}
.srcard .uses{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.srcard .uses span{background:var(--row);border-radius:3px;padding:1px 7px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.kebab{border:0;background:none;width:28px;height:28px;border-radius:4px;cursor:pointer;color:var(--muted)}
/* inspecteur à droite */
.insp{width:330px;flex:none;border-left:1px solid var(--line);background:#fff;overflow-y:auto}
.insp .ih{display:flex;align-items:center;gap:8px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.insp .ih b{flex:1;font-weight:500;font-size:15px}
.insp .ib{padding:14px 16px}
.field{display:grid;gap:6px;margin-bottom:14px}.field>label{font-size:13px;font-weight:500;color:var(--muted)}
.field select,.field input[type=text],.field input[type=number]{border:1px solid var(--line-2);border-radius:4px;padding:7px 9px;width:100%;background:#fff}
.inl{display:flex;gap:8px;align-items:center}
.inl input[type=number]{width:72px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-bottom:8px}
.radios{display:grid;gap:6px}.radios label{display:flex;gap:8px;align-items:center;font-size:13.5px}
.mapr{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:13px;background:var(--bg);border-radius:6px;padding:10px 12px}
.mapr .k{display:flex;gap:6px;align-items:center}.mapr .v{color:var(--muted)}
.hint{background:#EAF2FA;color:#1d4f80;border-radius:4px;padding:8px 10px;font-size:13px;margin:4px 0 14px}
/* calques */
.ly{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--row);font-size:13px}
.ly.on{background:var(--brand-tint)}
.ly .ic{width:26px;height:26px;border-radius:4px;background:var(--bg);display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:600;flex:none}
.ly .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly .mk{font-size:11px;color:var(--signal);display:inline-flex;gap:3px;align-items:center}
.ly.dim .nm{opacity:.5}
/* menus flottants */
.pop{position:absolute;background:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(11,31,58,.22);padding:6px;z-index:8}
.pop .pt{font-size:12px;color:var(--muted);padding:6px 10px 4px;display:flex;gap:8px;align-items:center}
.pop .pt b{color:var(--ink);font-weight:500}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.pop .mi{display:flex;width:100%;border:0;background:none;padding:6px 10px;border-radius:4px;text-align:left;cursor:pointer;gap:10px;align-items:center}
.pop .mi:hover,.pop .mi.on{background:var(--bg)}
.pop .mi.on{box-shadow:inset 2px 0 0 var(--signal)}
.pop .mi small{color:var(--muted);margin-left:auto;font-size:12.5px;white-space:nowrap}
.pop .foot{display:flex;gap:8px;align-items:center;padding:8px 10px 4px;font-size:13px;color:var(--muted)}
/* note de maquette */
.note{position:absolute;right:14px;bottom:14px;width:340px;background:#FFF8E1;border:1px dashed #E0B84A;color:#5a4500;border-radius:6px;padding:10px 12px;font-size:12.5px;line-height:1.45;z-index:4}
.note .nt{display:flex;margin-bottom:3px;color:#6B5200;font-weight:600}.note .nt button{margin-left:auto;border:0;background:none;cursor:pointer;color:#6B5200;font-size:15px;line-height:1;padding:0 2px}
.note ul{margin:4px 0 0;padding-left:18px}.note li{margin:2px 0}
/* fenêtre */
.scrim{position:fixed;inset:0;background:rgba(11,31,58,.45);display:grid;place-items:center;z-index:80}
.modal{background:#fff;border-radius:10px;width:min(720px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(11,31,58,.35);overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}.modal .mh h4{flex:1;font-size:17px}
.modal .mb{padding:16px 20px;overflow-y:auto}
.modal .mf{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line);background:#FAFBFC}
.xb{width:34px;height:34px;border:0;border-radius:4px;background:var(--bg);cursor:pointer;font-size:18px}
.week{display:grid;grid-template-columns:110px 70px 1fr;gap:8px 12px;align-items:center;margin-bottom:6px}
.week .d{font-weight:500}
.week .sl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.week .sl span{border:1px solid var(--line-2);border-radius:4px;padding:3px 8px;font-size:13px;background:#fff}
.week .sl .closed{border:0;color:var(--muted);padding-left:0}
.week .sl button{border:1px dashed var(--line-2);background:none;border-radius:4px;padding:3px 8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.tgl{width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;flex:none}
.tgl::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px}
.tgl.on{background:var(--signal)}.tgl.on::after{left:16px}
.exc{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--row)}
.exc .x{color:var(--muted)}
.fieldsprev{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;background:var(--bg);border-radius:6px;padding:10px 12px;font-size:13px}
.fieldsprev div{display:flex;justify-content:space-between;gap:10px}.fieldsprev span{color:var(--muted)}
.mtabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:-4px 0 14px}.mtabs button{border:0;background:none;padding:8px 0;color:var(--muted);cursor:default}.mtabs .on{color:var(--ink);font-weight:500;border-bottom:2px solid var(--signal);margin-bottom:-1px}
</style>
</head>
<body>
<div class="mock" id="mock">
  <div class="row"><b>Maquette — étape 3</b>&nbsp;·&nbsp;
    <button class="sc" data-s="1">1. Intégrations dans l'éditeur</button>
    <button class="sc" data-s="2">2. Champ dans un texte</button>
    <button class="sc" data-s="3">3. Liste reliée</button>
    <button class="sc" data-s="4">4. Panneau Données</button>
    <button class="sc" data-s="5">5. Afficher si…</button>
    <button class="sc" data-s="6">6. Source « Horaires »</button>
  </div>
  <div class="txt" id="mocktxt"></div>
</div>

<div class="app" id="app">
  <div class="top">
    <button class="tb back" title="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <input class="name" value="Accueil — hall">
    <span class="fmt">Paysage · 1920 × 1080</span>
    <span class="sep"></span>
    <button class="tb" title="Annuler">↶</button><button class="tb" title="Rétablir">↷</button>
    <span class="sep"></span>
    <button class="tb">−</button><span style="font-size:13px;width:40px;text-align:center">52%</span><button class="tb">+</button>
    <span class="sep"></span>
    <button class="tb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>Calques</button>
    <span style="flex:1"></span>
    <span class="segl">Aperçu</span>
    <span class="seg" id="mode"><button data-m="values">Données réelles</button><button data-m="names">Noms des champs</button></span>
    <span class="sep"></span>
    <button class="btn ghost">Aperçu</button>
    <button class="btn ghost">Annuler</button>
    <button class="btn">Enregistrer ▾</button>
  </div>
  <div class="main">
    <nav class="rail" id="rail">
      <button data-p="modeles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg>Modèles</button>
      <button data-p="medias"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>Médias</button>
      <button data-p="texte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Texte</button>
      <button data-p="formes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3 3 11h10L8 3Z"/><circle cx="17" cy="16" r="4"/><rect x="3" y="14" width="7" height="7"/></svg>Éléments</button>
      <button data-p="widgets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><path d="M17 13v8M13 17h8"/></svg>Widgets</button>
      <button data-p="donnees"><span class="new"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Données</button>
    </nav>
    <aside class="panel" id="panel"></aside>
    <div class="center" id="center">
      <div class="ctx" id="ctx"></div>
      <div class="frame" id="frame"><div class="stage" id="stage"></div><div class="overlay" id="overlay"></div></div>
      <div id="pops"></div>
      <div class="note" id="note"></div>
    </div>
    <aside class="insp" id="insp"></aside>
  </div>
</div>
<div id="modal"></div>

<script>
const CHAIN='<svg class="chain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
const COND='◐';
let scene=1, mode='values';

/* ---------- la composition (coordonnées en pixels de la page 1920 × 1080) ---------- */
const BOX={
  weather:{x:80,y:540,w:600,h:300,tag:'Bloc · Météo — Lausanne'},
  wtext:{x:80,y:372,w:620,h:140,tag:'Texte · 3 champs reliés'},
  hours:{x:80,y:880,w:600,h:110,tag:'Badge « Ouvert » · '+COND+' affiché si ouvert'},
  list:{x:840,y:190,w:1000,h:676,tag:'Liste reliée · Calendrier « Salles de réunion » · 5 lignes'},
  ticker:{x:760,y:960,w:1160,h:120,tag:'Bandeau · Flux RSS « 24 heures »'}
};
const EVENTS=[['08:30','Point équipe','Salle Léman'],['10:00','Visite client — atelier','Salle Jura'],['12:15','Formation sécurité','Auditoire'],['14:00','Comité de direction','Salle Léman'],['16:30','Apéro de bienvenue','Cafétéria']];
function F(n,v){return '<span class="fd">'+(mode==='names'?'{'+n+'}':v)+'</span>'}
function stageHtml(){
  const ink='#0B1F3A', sig='#3B82C4';
  let h='';
  h+='<div style="position:absolute;left:0;top:0;width:760px;height:1080px;background:'+ink+'"></div>';
  h+='<div style="position:absolute;left:80px;top:70px;width:200px;height:96px;border:4px solid #fff;border-radius:10px;color:#fff;font:800 30px/1.05 Poppins;display:grid;place-items:center;text-align:center">VOTRE<br>LOGO</div>';
  h+='<div style="position:absolute;left:80px;top:205px;color:#fff;font:900 128px/1 \'Playfair Display\'">Bienvenue</div>';
  h+='<div class="wt" style="position:absolute;left:80px;top:372px;width:620px;color:#C9D6E6;font:400 44px/1.3 Poppins">Il fait '+F('Température','14')+'° à '+F('Ville','Lausanne')+', '+F('Condition','ciel dégagé')+'.</div>';
  // bloc Météo (intégration weather-slide, rendue à la taille du rectangle)
  h+='<div style="position:absolute;left:80px;top:540px;width:600px;height:300px;border-radius:24px;background:rgba(255,255,255,.07);color:#fff;font-family:Poppins;padding:30px 34px">'+

  const c=document.getElementById('center'), f=document.getElementById('frame'), s=document.getElementById('stage');
  const W=c.clientWidth, H=c.clientHeight, k=Math.min((W-60)/1920,(H-100)/1080);
  f.style.width=1920*k+'px'; f.style.height=1080*k+'px';
  f.style.left=(W-1920*k)/2+'px'; f.style.top=Math.max(64,(H-1080*k)/2+20)+'px';
  s.style.transform='scale('+k+')';
  const sc=SC[scene], o=document.getElementById('overlay'); o.innerHTML='';
  if(sc.sel){const b=BOX[sc.sel];
    o.innerHTML='<div class="selbox" style="left:'+b.x*k+'px;top:'+b.y*k+'px;width:'+b.w*k+'px;height:'+b.h*k+'px">'+
      ['0,0','50,0','100,0','0,50','100,50','0,100','50,100','100,100'].map(p=>{const[a,bb]=p.split(',');return '<span class="hd" style="left:'+a+'%;top:'+bb+'%"></span>'}).join('')+
      '<span class="seltag">'+b.tag+'</span></div>';
    if(sc.row) o.innerHTML+='<div class="rowtag" style="left:'+840*k+'px;top:'+190*k+'px;width:'+1000*k+'px;height:'+120*k+'px"><span>Ligne modèle</span></div>';
  }
}
function show(n){
  scene=n; const sc=SC[n];
  if(sc.mode) mode=sc.mode; else if(n!==4) mode='values';
  document.querySelectorAll('.sc').forEach(b=>b.classList.toggle('on',+b.dataset.s===n));
  document.getElementById('mocktxt').textContent=sc.txt;
  document.querySelectorAll('#rail button').forEach(b=>b.classList.toggle('on',b.dataset.p===sc.panel));
  document.getElementById('panel').innerHTML=(P[sc.panel]||P.widgets)();
  document.getElementById('ctx').innerHTML=CTX[n]||'';
  const insp=document.getElementById('insp'); insp.innerHTML=INSP[sc.insp]||''; insp.style.display=sc.insp?'':'none';
  document.getElementById('pops').innerHTML=POPS[sc.pop]||'';
  const note=document.getElementById('note'); note.innerHTML=sc.note||''; note.style.display=sc.note?'':'none'; note.style.left=sc.noteLeft?'14px':''; note.style.right=sc.noteLeft?'auto':'';
  document.getElementById('modal').innerHTML=sc.modal?HOURS:'';
  render(); requestAnimationFrame(fit);
}
function render(){
  const s=document.getElementById('stage');
  s.className='stage '+(mode==='names'?'names':'mk-'+scene);
  s.innerHTML=stageHtml();
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
}
document.querySelectorAll('.sc').forEach(b=>b.onclick=()=>show(+b.dataset.s));
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render();});
document.getElementById('rail').onclick=e=>{const b=e.target.closest('button');if(!b||!P[b.dataset.p])return;
  document.querySelectorAll('#rail button').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('panel').innerHTML=P[b.dataset.p]();};
addEventListener('resize',fit);
show(1);
</script>
</body>
</html>
