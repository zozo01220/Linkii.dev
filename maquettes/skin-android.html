<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Skin Android (Material You)</title>
<style>
:root{
  --p:#1B5FA8;--on-p:#fff;--pc:#D3E4FF;--on-pc:#001C3A;
  --sc:#DCE3F1;--on-sc:#141C2B;
  --bg:#F8F9FF;--s1:#F1F3FA;--s2:#EBEEF6;--s3:#E5E8F0;--on-s:#191C20;--on-sv:#43474E;--out:#73777F;--outv:#C3C6CF;
  --err:#BA1A1A;--err-c:#FFDAD6;--on-err-c:#410002;--ok-c:#C8EFD4;--on-ok-c:#00210F;--warn-c:#FFDEA6;--on-warn-c:#271900;
  --font:"Google Sans","Roboto","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font);background:#CBD0DA;color:var(--on-s);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0;font-weight:400}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.mock{position:sticky;top:0;z-index:90;background:#fff;border-bottom:1px dashed #b8bec9;padding:8px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:#5b6270}
.seg{display:inline-flex;background:#ECEEF2;border-radius:99px;padding:2px}
.seg button{padding:5px 14px;border-radius:99px;color:#5b6270;font-size:12.5px}.seg button.on{background:#fff;color:#111;box-shadow:0 1px 2px #0002;font-weight:600}
.sw{display:flex;gap:8px;align-items:center}.sw i{width:22px;height:22px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px #0003}.sw i.on{box-shadow:0 0 0 2px #111}

#stage{display:flex;justify-content:center;padding:18px}
#dev{width:100%;max-width:1320px;height:calc(100vh - 90px);min-height:640px;background:var(--bg);border-radius:28px;overflow:hidden;display:flex;position:relative;box-shadow:0 20px 60px #0004;transition:max-width .3s}
body.phone #dev{max-width:392px;border-radius:40px;border:8px solid #17181c;flex-direction:column}

/* rail de navigation (bureau) */
.rail{width:96px;flex:none;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:20px 0 16px;gap:6px}
.rail .menu{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.fab{width:56px;height:56px;border-radius:16px;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;box-shadow:0 2px 6px #0003,0 1px 2px #0002;margin-bottom:18px;position:relative;overflow:hidden}
.dest{width:88px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 8px;font-size:12px;font-weight:500;color:var(--on-sv);position:relative}
.dest .pillb{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative;transition:.2s;overflow:hidden}
.dest:hover .pillb{background:var(--s3)}
.dest.on{color:var(--on-s);font-weight:700}.dest.on .pillb{background:var(--sc);color:var(--on-sc)}
.dest .bd{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.rail .sp{flex:1}
.avs{width:40px;height:40px;border-radius:50%;background:var(--p);color:var(--on-p);display:grid;place-items:center;font-weight:500}

/* contenu */
.content{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.sheet{flex:1;margin:8px 12px 12px 0;background:var(--s1);border-radius:28px;overflow:auto;padding:0 32px 32px;position:relative}
body.phone .sheet{margin:0;border-radius:0;padding:0 16px 90px;background:var(--bg)}
.appbar{position:sticky;top:0;z-index:5;background:var(--s1);display:flex;align-items:center;gap:8px;padding:18px 0 10px}
body.phone .appbar{background:var(--bg)}
.search{flex:1;max-width:560px;height:52px;border-radius:26px;background:var(--s3);display:flex;align-items:center;gap:14px;padding:0 20px;color:var(--on-sv)}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden}.ib:hover{background:#0000000d}
.sp1{flex:1}
.title{font-size:32px;line-height:40px;margin:14px 0 4px;font-weight:400}
.sub{color:var(--on-sv);margin-bottom:18px;max-width:560px}
body.phone .title{font-size:28px}

/* boutons / chips / segments */
.btn{height:40px;padding:0 24px;border-radius:20px;background:var(--p);color:var(--on-p);font-weight:500;display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.btn.t{background:none;color:var(--p);padding:0 12px}.btn.o{background:none;color:var(--p);border:1px solid var(--out)}.btn.tn{background:var(--sc);color:var(--on-sc)}
.btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{height:32px;border-radius:8px;border:1px solid var(--out);padding:0 14px;display:inline-flex;align-items:center;gap:8px;color:var(--on-sv);font-weight:500;position:relative;overflow:hidden}
.chip.on{background:var(--sc);border-color:transparent;color:var(--on-sc)}.chip svg{width:16px;height:16px}
.tabs{display:flex;border-bottom:1px solid var(--outv);margin-bottom:18px;overflow-x:auto}
.tabs button{padding:12px 20px;color:var(--on-sv);font-weight:500;position:relative;white-space:nowrap}
.tabs button.on{color:var(--p)}.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--p)}
.tabs .c{font-size:11px;background:var(--s3);border-radius:9px;padding:0 6px;margin-left:6px}
.msg{display:inline-flex;border:1px solid var(--out);border-radius:20px;overflow:hidden;margin-bottom:18px}
.msg button{height:38px;padding:0 20px;color:var(--on-sv);font-weight:500;border-left:1px solid var(--out)}.msg button:first-child{border-left:0}.msg button.on{background:var(--sc);color:var(--on-sc)}

/* cartes écrans */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--s1);background:#fff;border-radius:24px;overflow:hidden;position:relative;transition:box-shadow .2s;border:1px solid var(--outv)}
.card:hover{box-shadow:0 4px 14px #0002}
body:not(.phone) .card{background:var(--bg)}
.scene{height:130px;margin:8px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:500;font-size:16px;position:relative;text-shadow:0 1px 6px #0006}
.scene.off{filter:grayscale(1) brightness(.85)}
.st{position:absolute;top:10px;left:10px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:8px;text-shadow:none}
.st.ok{background:var(--ok-c);color:var(--on-ok-c)}.st.off{background:var(--err-c);color:var(--on-err-c)}.st.warn{background:var(--warn-c);color:var(--on-warn-c)}
.cb{display:flex;align-items:center;gap:12px;padding:6px 8px 12px 18px}
.cb b{font-weight:500;font-size:16px;display:block}.cb small{color:var(--on-sv)}.cb .g{flex:1;min-width:0}

/* listes */
.list{background:var(--bg);border-radius:24px;overflow:hidden}
body.phone .list{background:var(--s1)}
.li{display:flex;align-items:center;gap:16px;padding:12px 16px;min-height:72px;position:relative;overflow:hidden}
.li+.li{border-top:1px solid var(--outv)}
.li .lead{width:48px;height:48px;border-radius:14px;flex:none}
.li .g{flex:1;min-width:0}.li b{font-weight:500;font-size:16px;display:block}.li small{color:var(--on-sv);display:block}
.li .tr{color:var(--on-sv);font-size:12px;text-align:right}
.swt{width:52px;height:32px;border-radius:16px;background:var(--p);position:relative;flex:none}.swt::after{content:"✓";position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--on-p);color:var(--p);font-size:13px;display:grid;place-items:center}
.swt.off{background:var(--s3);border:2px solid var(--out)}.swt.off::after{content:"";left:6px;right:auto;top:6px;width:16px;height:16px;background:var(--out)}

/* réglages */
.sec{font-size:14px;color:var(--p);font-weight:500;margin:22px 0 10px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.skin{border-radius:24px;border:2px solid var(--outv);padding:10px;background:var(--bg);text-align:left;position:relative}
.skin.on{border-color:var(--p);background:var(--pc)}
.skin .pv{height:104px;border-radius:14px;margin-bottom:8px;overflow:hidden;display:flex;background:#fff;border:1px solid #0001}
.skin b{font-weight:500;display:block}.skin small{color:var(--on-sv)}
.skin .ck{position:absolute;top:16px;right:16px;width:24px;height:24px;border-radius:50%;background:var(--p);color:var(--on-p);display:none;place-items:center}
.skin.on .ck{display:grid}
.seeds{display:flex;gap:14px;flex-wrap:wrap}
.seed{width:56px;height:56px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--out);position:relative;overflow:hidden}
.seed.on{box-shadow:0 0 0 3px var(--p)}
.row{display:flex;align-items:center;gap:16px;padding:14px 4px}.row .g{flex:1}.row small{color:var(--on-sv);display:block}

/* barre du bas (téléphone) */
.bnav{display:none}
body.phone .rail{display:none}
body.phone .bnav{display:flex;position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--s2);justify-content:space-around;align-items:flex-start;padding-top:12px;z-index:8}
body.phone .bnav .dest{width:auto;flex:1}
body.phone .fabp{display:grid}
.fabp{display:none;position:absolute;right:16px;bottom:96px;z-index:9;height:56px;padding:0 20px;border-radius:16px;background:var(--pc);color:var(--on-pc);font-weight:500;gap:10px;place-items:center;grid-auto-flow:column;box-shadow:0 3px 8px #0003}
body.phone .rail-fab{display:none}

/* snackbar + ripple */
#snack{position:absolute;left:50%;bottom:24px;transform:translate(-50%,90px);opacity:0;transition:.3s;background:#2E3135;color:#F0F0F7;border-radius:6px;padding:14px 16px;display:flex;gap:28px;align-items:center;min-width:300px;z-index:50;box-shadow:0 4px 12px #0005}
#snack.on{transform:translate(-50%,0);opacity:1}#snack b{color:#A5C8FF;font-weight:500}
body.phone #snack{bottom:100px;min-width:0;width:calc(100% - 24px)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
</style>
</head>
<body>
<div class="mock"><b style="color:#111">Skin Android</b>
<div class="seg" id="dv"><button data-d="d" class="on">Bureau</button><button data-d="p">Téléphone</button></div>
<span>Couleur dynamique</span><div class="sw" id="seeds"></div>
<span>Cliquez dans le menu, la pastille ＋ ou « Publier » pour voir les animations.</span></div>

<div id="stage"><div id="dev">
  <nav class="rail" id="rail"></nav>
  <div class="content">
    <div class="sheet" id="sheet"></div>
  </div>
  <nav class="bnav" id="bnav"></nav>
  <button class="fabp" id="fabp"></button>
  <div id="snack"><span>Publié sur 3 écrans</span><b>Annuler</b></div>
</div></div>

<script>
const I={
 screens:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
 more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
 dots:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',
 check:'<path d="M5 12l5 5 9-10"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>'
};
const ic=(n,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24">${I[n]}</svg>`;
const SEEDS={blue:['#1B5FA8','#D3E4FF','#001C3A','#DCE3F1','#F8F9FF','#F1F3FA','#EBEEF6','#E5E8F0'],
 green:['#2F6B3F','#B2F1BD','#00210B','#D5E8D4','#F6FBF3','#EFF5EC','#E9F0E6','#E3EAE0'],
 purple:['#6750A4','#E9DDFF','#22005D','#E8DEF8','#FEF7FF','#F8F1FA','#F3EDF7','#ECE6F0'],
 orange:['#9A4600','#FFDCC6','#311300','#F8DECF','#FFF8F5','#FBF0EA','#F5EAE3','#EFE4DD']};
const $=s=>document.querySelector(s);
$('#seeds').innerHTML=Object.keys(SEEDS).map(k=>`<i data-s="${k}" style="background:${SEEDS[k][0]}" class="${k==='blue'?'on':''}"></i>`).join('');
function seed(k){const s=SEEDS[k],r=document.documentElement.style;
 ['--p','--pc','--on-pc','--sc','--bg','--s1','--s2','--s3'].forEach((v,i)=>r.setProperty(v,s[i]));
 r.setProperty('--on-sc',s[2]);document.querySelectorAll('#seeds i').forEach(x=>x.classList.toggle('on',x.dataset.s===k));
 document.querySelectorAll('.seed').forEach(x=>x.classList.toggle('on',x.dataset.s===k))}
const NAV=[['screens','Écrans',2],['list','Listes'],['cal','Planning'],['img','Médias'],['gear','Réglages']];
let page='screens',skinSel='android';
const dest=([id,l,b])=>`<button class="dest ${page===id?'on':''}" data-p="${id}"><span class="pillb">${ic(id==='gear'?'gear':id)}${b?`<span class="bd">${b}</span>`:''}</span>${l}</button>`;
function nav(){
 $('#rail').innerHTML=`<button class="ib menu">${ic('menu')}</button><button class="fab rail-fab" data-act="add" title="Connecter un écran">${ic('plus')}</button>${NAV.slice(0,4).map(dest).join('')}<div class="sp"></div>${dest(NAV[4])}<div class="avs">LP</div>`;
 $('#bnav').innerHTML=NAV.slice(0,4).map(dest).join('')+dest(NAV[4]);
 $('#fabp').innerHTML=`${ic('plus')}Connecter`;$('#fabp').dataset.act='add';
}
const SC=[['101','ok','#B03A8E','Contenus tout personnel','Vous'],['MAX','ok','#3B6FA5','Affichage menu midi','Vous'],['Accueil RDC','off','#2F6F5E','Bienvenue','Martin'],['Cafétéria','ok','#8A5A2B','Restaurant','Vous'],['Salle 204','warn','#555F6E','','Julie'],['Mur hall','ok','#1F3F73','Bienvenue','Martin']];
const ST={ok:'En ligne',off:'Hors ligne',warn:'À configurer'};
const bar=()=>`<div class="appbar"><div class="search">${ic('search')}<span>Rechercher dans Linkii</span></div><div class="sp1"></div><button class="ib">${ic('more')}</button></div>`;
function view(){
 if(page==='screens')return bar()+`<h1 class="title">Vos écrans</h1><p class="sub">Choisissez la liste de lecture de chaque écran, puis publiez.</p>
 <div class="tabs"><button class="on">Mes écrans<span class="c">3</span></button><button>Partagés avec moi<span class="c">2</span></button><button>Toute l'organisation<span class="c">6</span></button></div>
 <div class="chips"><span class="chip on">${ic('check')}Tous</span><span class="chip">En ligne</span><span class="chip">Hors ligne</span><span class="chip">À configurer</span><span class="chip">Aire : toutes ▾</span></div>
 <div class="grid">${SC.map(s=>`<div class="card"><div class="scene ${s[1]==='off'?'off':''}" style="background:linear-gradient(135deg,${s[2]},${s[2]}aa)"><span class="st ${s[1]}">${ST[s[1]]}</span>${s[3]||'—'}</div><div class="cb"><div class="g"><b>${s[0]}</b><small>${s[3]||'Aucune liste'} · ${s[4]}</small></div><button class="ib">${ic('dots')}</button></div></div>`).join('')}</div>
 <button class="btn" style="margin-top:22px" data-act="pub">${ic('send')}Publier les changements</button>`;
 if(page==='list')return bar()+`<h1 class="title">Listes de lecture</h1><p class="sub">Les séquences que vos écrans diffusent en boucle.</p>
 <div class="msg"><button class="on">Mes listes</button><button>Partagées</button><button>Brouillons</button></div>
 <div class="list">${[['Bienvenue','#ffb36b','6 contenus · Accueil RDC, Mur hall',1],['Affichage menu midi','#fbbf24','3 contenus · MAX',1],['Restaurant','#8A5A2B','9 contenus · Cafétéria',1],['Contenus tout personnel','#B03A8E','4 contenus · 101',0],['Soirée portes ouvertes','#5E5CE6','12 contenus · aucun écran',0]].map(r=>`<div class="li"><div class="lead" style="background:linear-gradient(135deg,${r[1]},${r[1]}88)"></div><div class="g"><b>${r[0]}</b><small>${r[2]}</small></div><span class="swt ${r[3]?'':'off'}"></span></div>`).join('')}</div>`;
 if(page==='gear')return bar()+`<h1 class="title">Réglages</h1><p class="sub">Apparence de l'application.</p>
 <div class="sec">Habillage</div><div class="skins">
 ${[['classique','Classique','Nuit, angles nets',`<div style="width:34%;background:#fff;border-right:1px solid #ddd"></div><div style="flex:1;background:#F5F7FA"></div>`],
    ['macos','macOS','Barre latérale translucide',`<div style="width:34%;background:#F0F1F5;border-right:1px solid #ddd"></div><div style="flex:1;background:#F5F5F7"></div>`],
    ['android','Android','Material You, couleurs dynamiques',`<div style="width:18%;background:var(--bg)"></div><div style="flex:1;background:var(--s1);border-radius:14px 0 0 14px"></div>`]]
 .map(k=>`<button class="skin ${skinSel===k[0]?'on':''}" data-k="${k[0]}"><span class="ck">${ic('check',16)}</span><div class="pv">${k[3]}</div><b>${k[1]}</b><small>${k[2]}</small></button>`).join('')}</div>
 <div class="sec">Couleur dynamique</div><div class="seeds">${Object.keys(SEEDS).map(k=>`<button class="seed" data-s="${k}" style="background:${SEEDS[k][0]}"></button>`).join('')}</div>
 <div class="sec">Options</div><div class="list"><div class="row" style="padding:14px 20px"><div class="g">Suivre la couleur de la marque<small>Utilise la couleur du revendeur plutôt que celle choisie ici</small></div><span class="swt off"></span></div>
 <div class="row" style="padding:14px 20px;border-top:1px solid var(--outv)"><div class="g">Animations<small>Ondulations et transitions</small></div><span class="swt"></span></div></div>`;
 return bar()+`<h1 class="title">${NAV.find(n=>n[0]===page)[1]}</h1><p class="sub">Page non maquettée ici : seul l'habillage change.</p>`;
}
function render(){nav();$('#sheet').innerHTML=view()}
function snack(t){const s=$('#snack');s.firstElementChild.textContent=t;s.classList.add('on');clearTimeout(snack.t);snack.t=setTimeout(()=>s.classList.remove('on'),2800)}
document.addEventListener('pointerdown',e=>{
 const t=e.target.closest('.btn,.chip,.ib,.fab,.pillb,.fabp,.li,.tabs button,.msg button');if(!t)return;
 if(getComputedStyle(t).position==='static')t.style.position='relative';t.style.overflow='hidden';
 const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='rp';
 s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.appendChild(s);setTimeout(()=>s.remove(),600)});
document.addEventListener('click',e=>{
 const d=e.target.closest('#dv button');if(d){document.body.classList.toggle('phone',d.dataset.d==='p');document.querySelectorAll('#dv button').forEach(x=>x.classList.toggle('on',x===d));return}
 const sd=e.target.closest('[data-s]');if(sd)return seed(sd.dataset.s);
 const k=e.target.closest('[data-k]');if(k){skinSel=k.dataset.k;return render()}
 const p=e.target.closest('[data-p]');if(p){page=p.dataset.p;return render()}
 const a=e.target.closest('[data-act]');if(a)snack(a.dataset.act==='pub'?'Publié sur 3 écrans':'Prêt à connecter un écran : saisissez le code affiché');
 const tb=e.target.closest('.tabs button');if(tb){tb.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===tb))}
 const ch=e.target.closest('.chips .chip');if(ch){ch.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));ch.classList.add('on')}
 const mb=e.target.closest('.msg button');if(mb){mb.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===mb))}
});
render();
</script>
</body>
</html>
