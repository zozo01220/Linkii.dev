<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Fil moins blanc</title>
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line-2:#C5CED9;--signal:#3B82C4}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.note{background:#fff;border-bottom:1px dashed var(--line-2);padding:8px 16px;color:var(--muted);font-size:13px}.note b{color:var(--ink)}
.wrap{max-width:1180px;margin:22px auto 60px;padding:0 20px}
h2{font-size:17px;font-weight:500;margin:26px 0 2px}p{margin:0 0 10px;color:var(--muted);font-size:14px}
.mono{font-family:"JetBrains Mono",Consolas,monospace;font-weight:500;font-variant-numeric:tabular-nums}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
svg .f{fill:currentColor;stroke:none}

/* pellicule */
.film{position:relative;border-radius:14px;background:linear-gradient(180deg,#14305A,#0B1F3A);padding:26px 14px 22px;overflow:hidden;display:flex;gap:0;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 14px,transparent 14px 30px),repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 14px,transparent 14px 30px),linear-gradient(180deg,#14305A,#0B1F3A);
  background-size:auto 8px,auto 8px,auto;background-repeat:repeat-x,repeat-x,no-repeat;background-position:0 8px,0 calc(100% - 8px),0 0}
.u{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;padding-left:44px}
.u:first-child{padding-left:0}
.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:500}
.card{position:relative;width:132px;height:132px;border-radius:12px;overflow:hidden}
.ft{position:absolute;left:0;right:0;bottom:0;padding:26px 8px 7px;background:linear-gradient(transparent,rgba(5,14,28,.82));color:#fff;display:flex;align-items:flex-end;gap:6px}
.nm{flex:1;min-width:0;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px;border-radius:7px;font-size:12px}
.ty{position:absolute;right:7px;top:7px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ty svg{width:14px;height:14px}
.when{font-size:12px;color:#B9C7DA;white-space:nowrap}
.tr{position:absolute;left:8px;top:calc(26px + 24px + 6px + 66px - 12px);display:flex;flex-direction:column;align-items:center;gap:3px;width:30px}
.tr .b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.tr .b svg{width:15px;height:15px}
.tr small{font-size:10.5px;color:#B9C7DA;white-space:nowrap}
.u::before{content:"";position:absolute;left:0;width:44px;top:calc(24px + 6px + 66px);border-top:2px solid rgba(255,255,255,.28)}
.u:first-child::before{display:none}
.u .tr{left:7px}

/* images factices */
.i1{background:linear-gradient(135deg,#F5A623,#E58E00)}
.i2{background:linear-gradient(135deg,#fff,#dfe6ee)}
.i3{background:linear-gradient(135deg,#0A5BD8,#3B82C4)}
.i4{background:linear-gradient(135deg,#1c3a63,#4f7fbf)}
.i5{background:linear-gradient(135deg,#d9e2ee,#9fb4cc)}
.i1::after,.i3::after{content:"";position:absolute;inset:14% 18%;border-radius:50%;border:12px solid rgba(255,255,255,.55)}
.i2::after{content:"Unil.";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:700;color:#0B1F3A}
.i4::after{content:"";position:absolute;left:14%;right:14%;top:18%;height:46%;border-radius:6px;background:rgba(255,255,255,.18)}

/* ACTUEL : tout en blanc */
.v0 .num{background:#fff;color:var(--ink)}
.v0 .dur{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.v0 .ty{box-shadow:0 0 0 2px #fff}
.v0 .tr .b{background:#fff;color:var(--ink)}

/* 1 verre fumé */
.v1 .num{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.65)}
.v1 .dur{background:rgba(11,31,58,.55);color:#fff;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px)}
.v1 .ty{box-shadow:none;border:1.5px solid rgba(255,255,255,.55)}
.v1 .tr .b{background:#14305A;color:#fff;border:1.5px solid rgba(255,255,255,.6)}

/* 2 texte nu */
.v2 .num{background:none;color:#fff;font-size:15px;width:auto;height:auto}
.v2 .dur{background:none;color:#fff;padding:0;height:auto;font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.v2 .ty{width:20px;height:20px;box-shadow:none;right:6px;top:6px}.v2 .ty svg{width:12px;height:12px}
.v2 .tr .b{background:none;color:#fff;width:auto}.v2 .tr .b svg{width:18px;height:18px}

/* 3 image libre : la durée sort de la carte */
.v3 .num{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.65)}
.v3 .ft{padding-top:18px}
.v3 .dur{display:none}
.v3 .ty{width:22px;height:22px;box-shadow:none;right:6px;top:6px}.v3 .ty svg{width:12px;height:12px}
.v3 .tr .b{background:#14305A;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.v3 .when b{color:#fff;font-weight:500}
.reco{margin-top:24px;background:#EAF3FC;border-radius:12px;padding:14px 18px;font-size:14px}
</style>
</head>
<body>
<div class="note"><b>Maquette — rien n'est codé.</b> Même fil, quatre traitements : le numéro, la durée, le bouton de transition et la pastille de type passent de « tout blanc » à des éléments qui laissent voir l'image. Le nœud papillon et le libellé permanent sous le rond (choix C) sont déjà appliqués.</div>
<div class="wrap" id="w"></div>
<script>
const bow='<svg viewBox="0 0 24 24"><path d="M3 6v12l8-6zM21 6v12l-8-6z"/></svg>';
const clock='<svg viewBox="0 0 24 24" width="12" height="12"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const img='<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>';
const cards=[['i1','UNIL-LOGO','0:10','#E8A23A','Image'],['i2','unil-logo','0:10','#E8A23A','Image'],['i3','UNIL-LOGO','0:10','#E8A23A','Image'],['i4','Borne — Aide','0:20','#7B5CC4','Composition'],['i5','Menu semaine','0:15','#2E9E6B','Page web']];
const eff=['','Fondu','Fondu','Zoom','Fondu'];
const when=['0:00','0:10','0:20','0:30','0:50'];
function strip(v){
 return `<div class="film v${v}">`+cards.map((c,i)=>`<div class="u">
  ${i?`<div class="tr"><div class="b">${bow}</div><small>${eff[i]}</small></div>`:''}
  <div class="num">${i+1}</div>
  <div class="card ${c[0]}"><div class="ty" style="background:${c[3]}">${img}</div>
   <div class="ft"><div class="nm">${c[1]}</div><div class="dur mono">${clock}${c[2]}</div></div></div>
  <div class="when">${v==3?`<b class="mono">${c[2]}</b> · passe à ${when[i]}`:`passe à ${when[i]}`}</div>
 </div>`).join('')+`</div>`;
}
const T=[
 ['Actuel','Numéro, durée et bouton de transition en pleins blancs, pastille de type cerclée de blanc : ça fait quatre taches blanches par carte.',0],
 ['1 · Verre fumé','Les éléments deviennent des contours fins ou du verre sombre translucide, texte blanc : plus aucun aplat blanc, l’image reste en premier.',1],
 ['2 · Texte nu','Plus de pastilles du tout pour le numéro, la durée et la transition : du texte et une icône posés directement, avec une légère ombre. C’est le plus léger.',2],
 ['3 · Image libre','La carte ne porte plus que le nom et un petit repère de type ; la durée passe sous la carte avec « passe à ». L’image est presque entière.',3]
];
document.getElementById('w').innerHTML=T.map(t=>`<h2>${t[0]}</h2><p>${t[1]}</p>${strip(t[2])}`).join('')+
`<div class="reco"><b>Ma préférence : la 1 (verre fumé) pour la durée et le numéro, avec la logique de la 3 pour le bouton de transition.</b> Concrètement : numéro en rond contour, durée en verre sombre (elle reste sur la carte et reste éditable d'un clic), bouton de transition en rond bleu nuit contour, pastille de type sans cerclage blanc. Le blanc plein n'est gardé que pour l'état « réglé » du bouton de transition, pour qu'il ressorte. Si tu veux encore plus d'image, la 3 sort la durée de la carte.</div>`;
</script>
</body>
</html>
