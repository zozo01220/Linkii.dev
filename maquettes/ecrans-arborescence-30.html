<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Écrans — affichage Arborescence (maquette, 30 écrans)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" />
<link rel="stylesheet" href="../Linkii.Poc/wwwroot/app.css" />
<style>
/* Ajouts de la maquette (le reste vient de app.css) */
.sc-zone img, .wc-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.wc-img { position: absolute; }

/* ---- Proposition : affichage « Arborescence » (mode Expert) ---- */
.tr-wrap { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 20px; align-items: start; }
.tr-tree { position: sticky; top: 16px; background: #fff; border: 1px solid var(--line); border-radius: var(--card-radius); padding: 10px 8px; max-height: calc(100vh - 32px); overflow: auto; }
.tr-tree h5 { margin: 4px 8px 8px; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.tr-node { display: flex; align-items: center; gap: 7px; width: 100%; min-height: 34px; padding: 5px 8px; border: 0; background: none; font: inherit; font-size: 14px; color: var(--ink); border-radius: var(--radius); cursor: pointer; text-align: left; }
.tr-node:hover { background: var(--bg); }
.tr-node.on { background: var(--brand-tint); font-weight: 500; box-shadow: inset 2px 0 0 var(--brand); border-radius: 0 var(--radius) var(--radius) 0; }
.tr-node .ico-svg { flex: none; color: var(--muted); }
.tr-node .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-node .n { flex: none; color: var(--muted); font-size: 12.5px; font-weight: 400; min-width: 18px; text-align: right; }
.tr-node .bad { flex: none; display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 999px; background: var(--danger-bg); color: var(--danger-ink); font-size: 11.5px; font-weight: 500; }
.tr-node .pdot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.tr-node .tw { flex: none; display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: -4px; border-radius: 3px; color: var(--muted); transition: transform .12s; }
.tr-node .tw:hover { background: var(--line); color: var(--ink); }
.tr-node.open > .tw { transform: rotate(0deg); }
.tr-node:not(.open) > .tw { transform: rotate(-90deg); }
.tr-node.root { font-weight: 500; }
.tr-node .open-tag { flex: none; font-size: 11px; color: var(--signal); font-weight: 500; }
.tr-kids { margin: 0 0 4px 17px; padding-left: 6px; border-left: 1px solid var(--line); }
.tr-kids .tr-node { font-size: 13.5px; min-height: 30px; }
.tr-sep { height: 1px; background: var(--row); margin: 6px 4px; }
.tr-tree .tr-foot { display: flex; gap: 6px; padding: 8px 4px 2px; }
.tr-tree .tr-foot .linklike { font-size: 13px; }

.tr-crumb { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); margin: 2px 0 12px; flex-wrap: wrap; }
.tr-crumb button { border: 0; background: none; padding: 0; font: inherit; color: var(--signal); cursor: pointer; }
.tr-crumb b { color: var(--ink); font-weight: 500; }

.tr-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.tr-kpi { display: grid; gap: 2px; padding: 10px 14px; background: #fff; border: 1px solid var(--line); border-radius: var(--card-radius); font: inherit; color: var(--ink); text-align: left; cursor: pointer; transition: border-color .12s; }
.tr-kpi:hover { border-color: var(--line-2); }
.tr-kpi b { font-size: 22px; font-weight: 500; line-height: 1.2; }
.tr-kpi small { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
.tr-kpi small .sc-dot { width: 8px; height: 8px; }
.tr-kpi.on { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }
.tr-kpi.danger b { color: var(--danger); }
.tr-kpi.warn b { color: var(--warn); }
.tr-kpi .gd-sleep { width: 8px; height: 8px; border-radius: 50%; background: #7B8BA3; }

.tr-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
.tr-tools .grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 5px 11px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button.on { background: var(--brand); color: #fff; }

.tr-area { background: #fff; border: 1px solid var(--line); border-radius: var(--card-radius); margin-bottom: 12px; }
.tr-ah { display: flex; align-items: center; gap: 10px; padding: 10px 14px; min-height: 52px; }
.tr-ah .tr-tg { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 0; border-radius: var(--radius); background: none; color: var(--muted); cursor: pointer; transition: transform .12s; }
.tr-ah .tr-tg:hover { background: var(--row); color: var(--ink); }
.tr-area.closed .tr-tg { transform: rotate(-90deg); }
.tr-ah h2 { font-size: 16px; font-weight: 500; white-space: nowrap; }
.tr-ah h2 button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.tr-ah h2 button:hover { color: var(--signal); }
.tr-ah .ap { color: var(--muted); display: inline-flex; }
.tr-sum { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.tr-sum > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tr-sum .sc-dot { width: 8px; height: 8px; }
.tr-sum .bad { color: var(--danger-ink); background: var(--danger-bg); border-radius: 999px; padding: 1px 9px; }
.tr-sum .pend { color: var(--warn-ink); background: var(--warn-bg); border-radius: 999px; padding: 1px 9px; }
.tr-ah .grow { flex: 1; }
.tr-ah .btn.sm, .tr-ah .tb-btn { white-space: nowrap; }
.tr-area.closed .tr-zones { display: none; }
.tr-area.calm .tr-ah { min-height: 44px; }
.tr-area.calm h2 { color: var(--muted); font-weight: 400; }
.tr-zones { padding: 0 14px 14px; border-top: 1px solid var(--row); }
.tr-zh { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.tr-zh .ico-svg { color: var(--muted); }
.tr-zh .cnt { text-transform: none; letter-spacing: 0; font-weight: 400; }
.tr-zh .sy { text-transform: none; letter-spacing: 0; font-weight: 400; color: #1F5C93; display: inline-flex; align-items: center; gap: 4px; }
.tr-zh .grow { flex: 1; }
.tr-zh .linklike { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12.5px; }

.tr-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 10px; }
/* vignettes : les zones se suivent côte à côte, chacune à la largeur de ses écrans */
.tr-zones.tiles { display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 28px; }
.tr-zones.tiles .tr-zg { min-width: 0; max-width: 100%; }
.tr-zones.tiles .tr-tiles { display: flex; flex-wrap: wrap; gap: 10px; }
.tr-zones.tiles .tr-tile { width: 176px; }
.tr-zones.tiles .tr-tile.wall { width: 362px; }
.tr-tile { position: relative; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
.tr-tile:hover { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal); }
.tr-tile .th { position: relative; aspect-ratio: 16 / 9; display: grid; place-items: center; container-type: size; overflow: hidden; background: #0E1726; }
.tr-tile .th .gc-mon { border-width: 2px; }
.tr-tile.is-off .gc-mon, .tr-tile.is-off .gc-frame { filter: grayscale(1) brightness(.6); }
.tr-tile.is-off { border-color: #EBC3BF; }
.tr-tile .tp { position: absolute; right: 6px; top: 6px; padding: 1px 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); font-size: 11px; font-weight: 500; }
.tr-tile .ck { position: absolute; left: 7px; top: 7px; z-index: 2; opacity: 0; transition: opacity .12s; }
.tr-tile:hover .ck, .tr-tile .ck:checked { opacity: 1; }
.tr-tile .tb { padding: 7px 9px 8px; display: grid; gap: 1px; }
.tr-tile .nm { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; min-width: 0; }
.tr-tile .nm .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-tile .nm .sc-dot { width: 8px; height: 8px; }
.tr-tile .nm .dev-logo { flex: none; }
.tr-tile .ln { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; }
.tr-tile .ln span { overflow: hidden; text-overflow: ellipsis; }
.tr-tile .ln.bad { color: var(--danger-ink); }
.tr-tile .ln.sl { color: #4F5F78; }
.tr-tile.wall { grid-column: span 2; }
.tr-tile.wall .th { aspect-ratio: 32 / 9.2; }
.tr-tile.wall .th .gc-frame { width: min(92cqw, calc(84cqh * var(--ar))); }
.tr-tile.wall .tb .nm .wl { flex: none; font-weight: 400; color: var(--muted); font-size: 12px; }
.sc-dot.veille { background: #7B8BA3; } .sc-dot.pause { background: var(--warn); }

.tr-rows { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tr-row { display: grid; grid-template-columns: 18px minmax(160px, 1.4fr) minmax(120px, 1fr) minmax(150px, 1.2fr) minmax(150px, 1fr) 84px 24px; gap: 12px; align-items: center; padding: 8px 12px; font-size: 13.5px; cursor: pointer; background: #fff; }
.tr-row + .tr-row { border-top: 1px solid var(--row); }
.tr-row:hover { background: var(--bg); }
.tr-row .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-row .mu { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.tr-row .bad { color: var(--danger-ink); }
.tr-row .tp { justify-self: start; padding: 1px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); font-size: 11.5px; font-weight: 500; }
.tr-row .go { color: var(--muted); display: inline-flex; }
.tr-row.wall .nm small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.tr-row.sub { background: #FAFBFC; }
.tr-row.sub .nm { font-weight: 400; padding-left: 16px; }

.tr-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: var(--card-radius); margin-bottom: 16px; flex-wrap: wrap; }
.tr-head h2 { font-size: 20px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.tr-head h2 .ico-svg { color: var(--muted); }
.tr-head .grow { flex: 1; }
.tr-zsec { margin-bottom: 22px; }
.tr-zsec .zline { margin-bottom: 14px; }
.pl-grid.tr-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.tr-empty { padding: 28px; text-align: center; color: var(--muted); background: #fff; border: 1px dashed var(--line-2); border-radius: var(--card-radius); }

.view-toggle button.new { position: relative; }
.view-toggle button.new::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: #E07B2E; }

/* bandeau de la maquette (ne fait pas partie de la page) */
.mk-note { margin: 0 0 18px; padding: 10px 14px; border: 1px dashed var(--line-2); border-radius: var(--card-radius); background: #FFFCF5; color: var(--ink); font-size: 13.5px; }
.mk-note b { font-weight: 500; }
.mq-bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2000; display: flex; gap: 4px; align-items: center; background: #0B1F3A; color: #fff; border-radius: 99px; padding: 5px 6px 5px 14px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); white-space: nowrap; }
.mq-bar button { font: inherit; font-size: 13px; color: #cfd8e3; background: none; border: 0; border-radius: 99px; padding: 5px 12px; cursor: pointer; }
.mq-bar button.on { background: #fff; color: #0B1F3A; }
.mq-bar .vr { width: 1px; height: 18px; background: #34496A; margin: 0 4px; }
.content { padding-bottom: 90px; }
</style></head>

/* ---------- état d'un écran ---------- */
const isOff = s => s.st === 'off';
const dotCls = s => s.st === 'off' ? 'hors-ligne' : s.st === 'sleep' ? 'veille' : s.st === 'pause' ? 'pause' : 'en-ligne';
const stateText = s => s.st === 'off' ? (s.off ? 'Hors ligne depuis ' + s.off : 'Jamais connecté') : s.st === 'sleep' ? 'En veille · réveil 07:00' : s.st === 'pause' ? 'En pause · reprise 14:30' : 'En ligne';
const plName = s => s.zones ? s.zones.map(z => PL[z[0]][0]).join(' · ') + ' · ' + s.zones.length + ' zones' : PL[s.pl][0];
const count = list => ({ n: list.length, on: list.filter(s => s.st === 'on').length, off: list.filter(isOff).length, sleep: list.filter(s => s.st === 'sleep' || s.st === 'pause').length, pend: list.filter(s => s.pend).length });
const areaScreens = a => a.zones.flatMap(z => z.s);

/* aperçu (sc-zones / pause / veille), comme dans Screens.razor */
function preview(s) {
  if (s.st === 'sleep') return `<span class="sc-pause-art sc-sleep-art"><small>Écran éteint</small></span>`;
  if (s.st === 'pause') return `<span class="sc-pause-art"><b>☕</b><small>Petite pause</small></span>`;
  const zs = s.zones || [[s.pl, 1]];
  if (!s.dev && isOff(s)) return `<span class="sc-zones dir-row"><span class="sc-zone" style="flex:1 1 0"><span class="sc-empty">${PL[s.pl][0]}</span></span></span>`;
  return `<span class="sc-zones ${s.port ? 'dir-col' : 'dir-row'}">${zs.map(z => `<span class="sc-zone" style="flex:${z[1]} 1 0"><img src="${TH(PL[z[0]][1])}" alt="" loading="lazy"></span>`).join('')}</span>`;
}
function wallFrame(z) {
  const [c, r] = z.wall;
  return `<div class="gc-frame">${z.s.map((s, i) => { const cx = i % c, cy = Math.floor(i / c);
    return `<button type="button" class="gc-tile ${isOff(s) ? 'off' : ''}"><span class="wc-img" style="width:${c * 100}%;height:${r * 100}%;left:-${cx * 100}%;top:-${cy * 100}%"><img src="${TH(PL[z.pl][1])}" alt=""></span><span class="gc-tn">${i + 1}</span>${isOff(s) ? '<span class="gc-toff">Hors ligne</span>' : ''}</button>`; }).join('')}</div>`;
}
const wallAr = z => (z.wall[0] * 16 / (z.wall[1] * 9)).toFixed(4);

/* ---------- cartes actuelles (balisage de Screens.razor) ---------- */
function plRow(name) {
  return `<div class="gc-sel">${ico('playbox', 16)}<select aria-label="Liste de lecture"><option>${name}</option><option>— Aucune liste de lecture —</option></select><span class="gc-chev">${ico('chevron', 14)}</span></div>
  <div class="sc-live gc-live" role="group"><button type="button" class="act" aria-label="Aperçu">${ico('eye', 16)}</button><button type="button" class="act" aria-label="Pause">${ico('pause', 16)}</button></div>`;
}
function fullCard(s, showZone = true) {
  const off = isOff(s), cls = s.st === 'sleep' ? 'sleep' : s.st === 'pause' ? 'warn' : off ? 'bad' : 'ok';
  const lbl = s.st === 'on' ? 'En ligne' : stateText(s);
  return `<div class="pl-card gc ${off ? 'is-off' : ''} ${s.st === 'on' ? 'is-on' : ''} ${s.st === 'pause' ? 'is-paused' : ''}">
  <div class="gc-top">
    <div class="gc-stage"><div class="gc-mon ${s.port ? 'portrait' : ''}">${preview(s)}</div><button type="button" class="gc-hit" tabindex="-1"></button>
      <span class="gc-pill ${off ? 'off' : ''}"><span class="gc-d ${cls}"></span>${lbl}</span>
      ${s.pend ? `<span class="gc-pills-r"><span class="gc-pill warn">À publier</span></span>` : ''}</div>
    <input type="checkbox" class="sc-check" aria-label="Sélectionner ${s.n}">
    <div class="kebab"><button type="button" class="kebab-btn" aria-label="Actions">${ico('dots', 18)}</button></div>
    <div class="gc-ctl">${plRow(plName(s))}</div>
  </div>
  <div class="gc-body">
    <div class="gc-name"><button type="button" class="gc-nm linklike-name">${s.n}</button>${devLogo(s, 20)}</div>
    <div class="gc-sub">${s.dev ? `<b>${OS[s.dev]}</b> <span class="sep">·</span> App <span class="mono">1.144.0</span>` : '<span>En attente des informations de l\'écran</span>'}<span class="sep"> · </span><span class="gc-pl">${ico('playbox', 13)} ${plName(s)}</span></div>
    <div class="gc-chips">${showZone ? `<span class="gc-chip">${s.zone.n}</span>` : ''}${s.zone.sync ? `<span class="gc-chip sync">${ico('link', 12)} Synchronisé</span>` : ''}</div>
  </div>
</div>`;
}
function wallCard(z) {
  const c = count(z.s), full = c.off === 0;
  return `<div class="pl-card gc gc-wall" style="--cols:${z.wall[0]};--rows:${z.wall[1]};--ar:${wallAr(z)}" role="group">
  <div class="gc-top">
    <div class="gc-stage">${wallFrame(z)}<button type="button" class="gc-hit" tabindex="-1"></button>
      <span class="gc-pill gc-apponly"><span class="gc-d ${full ? 'ok' : 'warn'}"></span>${full ? `${c.n} sur ${c.n} en ligne` : `Mur incomplet · ${c.n - c.off} sur ${c.n}`}</span></div>
    <input type="checkbox" class="sc-check">
    <div class="kebab"><button type="button" class="kebab-btn">${ico('dots', 18)}</button></div>
    <div class="gc-anchor gc-wchip"><button type="button" class="gc-chip btn-chip">${z.s.map(s => `<span class="sc-dot ${dotCls(s)}"></span>`).join('')}<span>${z.s.length} écrans</span> ${ico('chevron', 12)}</button></div>
    <div class="gc-ctl">${plRow(PL[z.pl][0])}</div>
  </div>
  <div class="gc-body">
    <div class="gc-name"><button type="button" class="gc-nm linklike-name">${z.n}</button><span class="gc-ico">${ico('grid', 18)}</span></div>
    <div class="gc-sub">Mur d'écrans ${z.wall[0]} × ${z.wall[1]}<span class="sep"> · </span><span class="gc-pl">${ico('playbox', 13)} ${PL[z.pl][0]}</span></div>
  </div>
</div>`;
}
function lightCard(s) {
  const off = isOff(s);
  return `<div class="pl-card gc gc-light ${off ? 'is-off' : 'is-on'}" role="button" tabindex="0">
  <div class="gc-top"><div class="gc-stage"><div class="gc-mon ${s.port ? 'portrait' : ''}">${preview(s)}</div>
    <span class="gc-pill ${off ? 'off' : ''}"><span class="gc-d ${off ? 'bad' : 'ok'}"></span>${off ? stateText(s) : 'En ligne'}</span></div></div>
  <div class="gc-body">
    <div class="gc-name"><span class="gc-nm">${s.n}</span>${devLogo(s, 20)}</div>
    <div class="gc-area">${ico('pin', 13)} ${s.area.n}</div>
    <div class="gc-sub">${s.dev ? `<b>${OS[s.dev]}</b>` : '<span>En attente des informations de l\'écran</span>'}</div>
    <div class="gc-plrow"><div class="gc-sel">${ico('playbox', 16)}<span class="gc-selro">${plName(s)}</span></div></div>
  </div>
</div>`;
}
function zoneCards(z, showZone) { return z.wall ? wallCard(z) : z.s.map(s => fullCard(s, showZone)).join(''); }

/* ---------- vue actuelle : grille à plat ---------- */
function viewCards() {
  const own = AREAS.find(a => a.own), others = AREAS.filter(a => !a.own);
  return `<div class="pl-grid">${own.zones.map(z => zoneCards(z, true)).join('')}${others.flatMap(a => areaScreens(a)).map(lightCard).join('')}</div>`;
}

/* ---------- proposition : Arborescence ---------- */
const ui = { sel: { a: null, z: null }, dens: 'tiles', filt: null, open: new Set(['lau']), closed: new Set(), q: '' };
const match = s => (!ui.q || (s.n + ' ' + s.zone.n + ' ' + s.area.n).toLowerCase().includes(ui.q)) &&
  (!ui.filt || (ui.filt === 'off' ? isOff(s) : ui.filt === 'pend' ? s.pend : ui.filt === 'sleep' ? (s.st === 'sleep' || s.st === 'pause') : ui.filt === 'on' ? s.st === 'on' : true));

function tree() {
  const t = count(ALL);
  return `<nav class="tr-tree" aria-label="Aires et zones">
  <h5>Aires de gestion · ${AREAS.length}</h5>
  <button type="button" class="tr-node root ${!ui.sel.a ? 'on' : ''}" data-sel="">${ico('layers', 16)}<span class="lbl">Toutes les aires</span>${t.off ? `<span class="bad" title="Hors ligne">${t.off}</span>` : ''}<span class="n">${t.n}</span></button>
  <div class="tr-sep"></div>
  ${AREAS.map(a => { const c = count(areaScreens(a)), op = ui.open.has(a.id);
    return `<button type="button" class="tr-node ${op ? 'open' : ''} ${ui.sel.a === a.id && !ui.sel.z ? 'on' : ''}" data-sel="${a.id}"><span class="tw" data-tw="${a.id}">${ico('chevron', 14)}</span><span class="lbl">${a.n}</span>${a.own ? '<span class="open-tag" title="Aire ouverte dans le back-office">ouverte</span>' : ''}${c.pend ? '<span class="pdot" title="Modifications à publier"></span>' : ''}${c.off ? `<span class="bad" title="Hors ligne">${c.off}</span>` : ''}<span class="n">${c.n}</span></button>
    ${op ? `<div class="tr-kids">${a.zones.map(z => { const zc = count(z.s);
      return `<button type="button" class="tr-node ${ui.sel.z === z.id ? 'on' : ''}" data-sel="${a.id}" data-z="${z.id}">${ico(z.wall ? 'grid' : 'box', 14)}<span class="lbl">${z.n}</span>${zc.off ? `<span class="bad">${zc.off}</span>` : ''}<span class="n">${zc.n}</span></button>`; }).join('')}</div>` : ''}`; }).join('')}
  <div class="tr-sep"></div>
  <div class="tr-foot"><button type="button" class="linklike" data-all="open">Tout déplier</button> · <button type="button" class="linklike" data-all="close">Tout replier</button></div>
</nav>`;
}
function kpis(list) {
  const c = count(list);
  const k = (f, n, lbl, dot, cls = '') => `<button type="button" class="tr-kpi ${cls} ${ui.filt === f ? 'on' : ''}" data-f="${f}"><b>${n}</b><small>${dot}${lbl}</small></button>`;
  return `<div class="tr-kpis">${k('', c.n, 'Écrans', ico('layers', 13))}${k('on', c.on, 'En ligne', '<span class="sc-dot en-ligne"></span>')}${k('off', c.off, 'Hors ligne', '<span class="sc-dot hors-ligne"></span>', c.off ? 'danger' : '')}${k('sleep', c.sleep, 'En veille ou en pause', '<span class="gd-sleep"></span>')}${k('pend', c.pend, 'À publier', '<span class="sc-dot mise-a-jour"></span>', c.pend ? 'warn' : '')}</div>`;
}
function tile(s) {
  const ln = s.st === 'off' ? `<div class="ln bad">${stateText(s)}</div>` : s.st !== 'on' ? `<div class="ln sl">${ico(s.st === 'sleep' ? 'moon' : 'pause', 12)}<span>${stateText(s)}</span></div>` : `<div class="ln">${ico('playbox', 12)}<span>${plName(s)}</span></div>`;
  return `<div class="tr-tile ${isOff(s) ? 'is-off' : ''}" title="Paramètres de l'écran « ${s.n} »${s.area.own ? '' : ' (ouvre l\'aire ' + s.area.n + ')'}"><div class="th"><input type="checkbox" class="sc-check ck" aria-label="Sélectionner ${s.n}"><div class="gc-mon ${s.port ? 'portrait' : ''}">${preview(s)}</div>${s.pend ? '<span class="tp">À publier</span>' : ''}</div>
  <div class="tb"><div class="nm"><span class="sc-dot ${dotCls(s)}"></span><span class="t">${s.n}</span>${devLogo(s, 16)}</div>${ln}</div></div>`;
}
function wallTile(z) {
  const c = count(z.s);
  return `<div class="tr-tile wall ${c.off === z.s.length ? 'is-off' : ''}" style="--cols:${z.wall[0]};--rows:${z.wall[1]};--ar:${wallAr(z)}"><div class="th">${wallFrame(z)}</div>
  <div class="tb"><div class="nm"><span class="sc-dot ${c.off ? 'mise-a-jour' : 'en-ligne'}"></span><span class="t">${z.n}</span><span class="wl">${z.wall[0]} × ${z.wall[1]}</span></div><div class="ln ${c.off ? 'bad' : ''}">${c.off ? `Mur incomplet · ${c.n - c.off} sur ${c.n} en ligne` : ico('playbox', 12) + '<span>' + PL[z.pl][0] + '</span>'}</div></div></div>`;
}
function row(s, sub) {
  return `<div class="tr-row ${sub ? 'sub' : ''}"><span class="sc-dot ${dotCls(s)}"></span><span class="nm">${s.n}</span><span class="mu">${devLogo(s, 16)}${s.dev ? OS[s.dev] : 'En attente'}</span><span class="mu">${ico('playbox', 13)}${plName(s)}</span><span class="mu ${isOff(s) ? 'bad' : ''}">${stateText(s)}</span>${s.pend ? '<span class="tp">À publier</span>' : '<span></span>'}<span class="go">${ico('right', 16)}</span></div>`;
}
function wallRow(z) {
  const c = count(z.s);
  return `<div class="tr-row wall"><span class="sc-dot ${c.off ? 'mise-a-jour' : 'en-ligne'}"></span><span class="nm">${z.n}<small>Mur ${z.wall[0]} × ${z.wall[1]}</small></span><span class="mu">${ico('grid', 14)} ${c.n} écrans</span><span class="mu">${ico('playbox', 13)}${PL[z.pl][0]}</span><span class="mu ${c.off ? 'bad' : ''}">${c.off ? `Incomplet · ${c.n - c.off} sur ${c.n}` : 'En ligne'}</span><span></span><span class="go">${ico('chevron', 16)}</span></div>` + z.s.filter(match).map(s => row(s, true)).join('');
}
function zoneBlock(z) {
  const list = z.s.filter(match);
  if (!list.length) return '';
  const body = ui.dens === 'rows' ? `<div class="tr-rows">${z.wall ? wallRow(z) : list.map(s => row(s)).join('')}</div>`
    : `<div class="tr-tiles">${z.wall ? wallTile(z) : list.map(tile).join('')}</div>`;
  return `<div class="tr-zg"><div class="tr-zh">${ico(z.wall ? 'grid' : 'box', 13)} ${z.n} <span class="cnt">· ${z.s.length} écran${z.s.length > 1 ? 's' : ''}</span>${z.sync ? `<span class="sy">${ico('link', 12)} synchronisée</span>` : ''}<span class="grow"></span></div>${body}</div>`;
}
function areaSection(a) {
  const scr = areaScreens(a), c = count(scr), hits = scr.filter(match);
  const calm = ui.filt && !hits.length;
  const closed = calm || ui.closed.has(a.id);
  return `<section class="tr-area ${closed ? 'closed' : ''} ${calm ? 'calm' : ''}" data-a="${a.id}">
  <header class="tr-ah">
    <button type="button" class="tr-tg" data-fold="${a.id}" aria-expanded="${!closed}">${ico('chevron', 16)}</button>
    <span class="ap">${ico('pin', 16)}</span>
    <h2><button type="button" data-sel="${a.id}">${a.n}</button></h2>
    ${a.own ? '<span class="lx-chip">Aire ouverte</span>' : ''}
    <span class="tr-sum">${calm ? '<span>Rien à signaler</span>' : `<span>${c.n} écran${c.n > 1 ? 's' : ''}</span><span><span class="sc-dot en-ligne"></span>${c.on} en ligne</span>${c.off ? `<span class="bad">${c.off} hors ligne</span>` : ''}${c.pend ? `<span class="pend">${c.pend} à publier</span>` : ''}`}</span>
    <span class="grow"></span>
    ${!calm && c.pend ? `<button type="button" class="btn ghost sm">${ico('upload', 14)} Publier (${c.pend})</button>` : ''}
    ${calm ? '' : `<button type="button" class="tb-btn" data-sel="${a.id}">Détail ${ico('arrow', 14)}</button>`}
  </header>
  ${closed ? '' : `<div class="tr-zones ${ui.dens}">${a.zones.map(zoneBlock).join('')}</div>`}
</section>`;
}
function paneAll() {
  const list = ALL.filter(match);
  return `<div class="tr-crumb"><b>Toutes les aires</b><span>· ${AREAS.length} aires · ${AREAS.reduce((n, a) => n + a.zones.length, 0)} zones</span></div>
  ${kpis(ALL)}
  <div class="tr-tools"><span>${ui.filt ? `${list.length} écran${list.length > 1 ? 's' : ''} correspondant${list.length > 1 ? 's' : ''} · <button type="button" class="linklike" data-f="">Tout afficher</button>` : 'Groupés par aire puis par zone. Cliquez sur une aire pour la déplier dans l\'arbre.'}</span><span class="grow"></span>
    <div class="seg" role="group" aria-label="Densité"><button type="button" data-d="tiles" class="${ui.dens === 'tiles' ? 'on' : ''}">${ico('grid', 14)} Vignettes</button><button type="button" data-d="rows" class="${ui.dens === 'rows' ? 'on' : ''}">${ico('menu', 14)} Lignes</button></div></div>
  ${AREAS.map(areaSection).join('')}`;
}
function paneArea(a, zid) {
  const zs = zid ? a.zones.filter(z => z.id === zid) : a.zones, scr = zs.flatMap(z => z.s), c = count(scr);
  const zz = zid && zs[0];
  return `<div class="tr-crumb"><button type="button" data-sel="">Toutes les aires</button>${ico('right', 13)}${zz ? `<button type="button" data-sel="${a.id}">${a.n}</button>${ico('right', 13)}<b>${zz.n}</b>` : `<b>${a.n}</b>`}</div>
  <div class="tr-head"><h2>${ico(zz ? (zz.wall ? 'grid' : 'box') : 'pin', 20)} ${zz ? zz.n : a.n}</h2>${a.own ? '<span class="lx-chip">Aire ouverte</span>' : '<span class="lx-chip" title="Modifier un écran ouvre cette aire">Autre aire</span>'}
    <span class="tr-sum"><span>${c.n} écran${c.n > 1 ? 's' : ''}</span><span><span class="sc-dot en-ligne"></span>${c.on} en ligne</span>${c.off ? `<span class="bad">${c.off} hors ligne</span>` : ''}${c.pend ? `<span class="pend">${c.pend} à publier</span>` : ''}</span>
    <span class="grow"></span>
    <a class="tb-btn">${ico('calendar', 14)} Planning</a>${c.pend ? `<button type="button" class="btn sm">${ico('upload', 14)} Publier (${c.pend})</button>` : ''}
    <div class="kebab"><button type="button" class="kebab-btn">${ico('dots', 18)}</button></div></div>
  ${zs.map(z => { const list = z.s.filter(match); if (!list.length) return '';
    return `<section class="tr-zsec">${zz ? '' : `<div class="zline"><span><b>${z.n}</b> · ${z.wall ? `mur d'écrans ${z.wall[0]} × ${z.wall[1]}` : 'zone libre'} · ${z.s.length} écran${z.s.length > 1 ? 's' : ''}</span>${z.sync ? `<span class="zstate sync">${ico('link', 13)} Lecture synchronisée</span>` : ''}<div class="grow"></div><button type="button" class="linklike" data-sel="${a.id}" data-z="${z.id}">Voir la zone seule</button></div>`}
    <div class="pl-grid tr-grid">${zoneCards(z, false)}</div></section>`; }).join('') || '<div class="tr-empty">Aucun écran ne correspond.</div>'}`;
}
function viewTree() {
  const a = AREAS.find(x => x.id === ui.sel.a);
  return `<div class="tr-wrap">${tree()}<div class="tr-pane">${a ? paneArea(a, ui.sel.z) : paneAll()}</div></div>`;
}

/* ---------- textes de la maquette ---------- */
const NOTES = {
  cartes: "<b>Aujourd'hui</b> : les 30 écrans des 8 aires à plat. L'aire ouverte (Lausanne) a ses cartes complètes, les 21 autres écrans suivent en cartes de consultation, sans regroupement : on ne voit plus ni les aires ni les zones, ni où sont les problèmes.",
  arbre: "<b>Proposition, mode Expert</b> : 3ᵉ affichage « Arborescence » (icône ⊤ dans la bascule). Arbre aires › zones à gauche (nombre d'écrans, hors ligne en rouge, point orange = à publier), compteurs cliquables en haut, puis une section repliable par aire avec des vignettes compactes rangées par zone. Proposé d'office au-delà de 10 écrans ; Cartes et Liste restent là.",
  lignes: "<b>Arborescence en lignes</b> : même regroupement, une ligne par écran (état, appareil, liste de lecture). Un mur tient sur une ligne, ses écrans en dessous. Pratique à 50 ou 100 écrans.",
  aire: "<b>Une aire choisie dans l'arbre</b> : on retrouve les cartes complètes habituelles (liste de lecture, aperçu, pause, menu ⋯), rangées par zone, avec Publier et Planning de l'aire. Pour une autre aire que celle ouverte, un clic sur l'écran ouvre son aire (comme aujourd'hui).",
  surveiller: "<b>Compteur « Hors ligne » cliqué</b> : seuls les écrans concernés restent, les aires sans problème se replient en une ligne « Rien à signaler ». Idem pour « À publier » ou « En veille »."
};

/* ---------- rendu et interactions ---------- */
let mode = 'arbre';
function render() {
  document.getElementById('view').innerHTML = mode === 'cartes' ? viewCards() : viewTree();
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.toggle('on', b.dataset.v === (mode === 'cartes' ? 'cartes' : 'arbre')));
}
function go(st) {
  document.querySelectorAll('.mq-bar button').forEach(b => b.classList.toggle('on', b.dataset.st === st));
  document.getElementById('note').innerHTML = NOTES[st];
  mode = st === 'cartes' ? 'cartes' : 'arbre';
  ui.dens = st === 'lignes' ? 'rows' : 'tiles';
  ui.filt = st === 'surveiller' ? 'off' : null;
  ui.sel = st === 'aire' ? { a: 'gen', z: null } : { a: null, z: null };
  if (st === 'aire') ui.open.add('gen');
  ui.closed.clear();
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => go(b.dataset.st));
document.querySelector('.view-toggle').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v === 'cartes') go('cartes'); else if (b.dataset.v === 'arbre') go('arbre');
});
document.getElementById('q').addEventListener('input', e => { ui.q = e.target.value.trim().toLowerCase(); if (mode !== 'cartes') render(); });
document.getElementById('view').addEventListener('click', e => {
  const tw = e.target.closest('[data-tw]');
  if (tw) { const id = tw.dataset.tw; ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id); render(); return; }
  const fold = e.target.closest('[data-fold]');
  if (fold) { const id = fold.dataset.fold; ui.closed.has(id) ? ui.closed.delete(id) : ui.closed.add(id); if (ui.filt) ui.filt = null; render(); return; }
  const all = e.target.closest('[data-all]');
  if (all) { AREAS.forEach(a => all.dataset.all === 'open' ? (ui.open.add(a.id), ui.closed.delete(a.id)) : (ui.open.delete(a.id), ui.closed.add(a.id))); render(); return; }
  const f = e.target.closest('[data-f]');
  if (f) { ui.filt = ui.filt === f.dataset.f || !f.dataset.f ? null : f.dataset.f; render(); return; }
  const d = e.target.closest('[data-d]');
  if (d) { ui.dens = d.dataset.d; render(); return; }
  const s = e.target.closest('[data-sel]');
  if (s) { ui.sel = { a: s.dataset.sel || null, z: s.dataset.z || null }; if (ui.sel.a) ui.open.add(ui.sel.a); render(); window.scrollTo(0, 0); }
});
paintIcons();
const st0 = new URLSearchParams(location.search).get('etat');
go(NOTES[st0] ? st0 : 'arbre');
</script>
</body></html>
