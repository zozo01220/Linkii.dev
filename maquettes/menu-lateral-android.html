<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Menu latéral style Android (Material 3)</title>
<style>
:root{
  --surface:#F7F9FC;--surface-c:#EEF2F8;--on-surface:#191C20;--on-var:#44474E;--outline:#C4C6D0;
  --primary:#0B1F3A;--on-primary:#fff;--sec-cont:#D5E4F7;--on-sec-cont:#0A2A4A;--tert:#E8751A;--error:#B3261E;
  --sans:Roboto,"Google Sans","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);background:#DDE3EA;color:var(--on-surface);font-size:14px;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mock{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px dashed var(--outline);padding:8px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:#666}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.seg button{padding:6px 14px;font-size:12.5px;color:var(--on-var)}
.seg button+button{border-left:1px solid var(--outline)}
.seg button.on{background:var(--sec-cont);color:var(--on-sec-cont);font-weight:500}
.stage{display:flex;gap:40px;padding:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.cap{font-size:12px;color:#5a6472;max-width:340px;line-height:1.5;margin-top:14px}
.cap b{color:var(--on-surface)}

/* ---------- appareil ---------- */
.dev{background:var(--surface);border-radius:28px;box-shadow:0 0 0 8px #1b1f24,0 12px 40px #0004;overflow:hidden;position:relative}
.dev.tab{width:760px;height:560px;display:flex}
.dev.ph{width:340px;height:640px;display:flex;flex-direction:column}
.page{flex:1;min-width:0;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.page h2{margin:0;font-size:22px;font-weight:400}
.ghost{background:var(--surface-c);border-radius:16px;height:64px}
.ghost.big{height:150px}
.appbar{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.appbar h2{font-size:22px;font-weight:400;margin:0}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--on-var)}
.ib:hover{background:#0001}.ib svg{width:24px;height:24px}

/* ---------- tiroir de navigation M3 ---------- */
.drawer{width:300px;flex:none;background:var(--surface-c);border-radius:0 28px 28px 0;display:flex;flex-direction:column;padding:12px 12px 10px;overflow:hidden}
.d-head{display:flex;align-items:center;gap:8px;padding:10px 16px 14px}
.d-head img{height:26px;width:auto}
.chip{font-size:11px;font-weight:500;border-radius:8px;padding:2px 8px;background:var(--sec-cont);color:var(--on-sec-cont)}
.ver{font-size:11.5px;color:var(--on-var)}
.d-head .ib{margin-left:auto;width:36px;height:36px}
.scroll{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.sp{flex:1;min-height:6px}
.title{font-size:14px;font-weight:500;color:var(--on-var);padding:16px 16px 6px}
.dv{height:1px;background:var(--outline);margin:8px 16px;opacity:.7}
.item{display:flex;align-items:center;gap:12px;height:56px;width:100%;padding:0 24px 0 16px;border-radius:28px;color:var(--on-var);font-size:14.5px;font-weight:500;text-align:left;position:relative}
.item svg{width:24px;height:24px}
.item:hover{background:#0B1F3A14}
.item.on{background:var(--sec-cont);color:var(--on-sec-cont)}
.item.on svg{fill:rgba(10,42,74,.14)}
.item .lbl{flex:1}
.badge{font-size:12px;font-weight:500;min-width:20px;text-align:center;color:var(--on-var)}
.badge.fill{background:var(--error);color:#fff;border-radius:10px;padding:1px 7px}
.badge.warn{background:var(--tert);color:#fff;border-radius:10px;padding:1px 7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--error);margin-right:6px}
.xo{font-size:10px;font-weight:500;border:1px solid var(--outline);border-radius:6px;padding:0 5px;color:var(--on-var)}
.modecard{display:flex;align-items:center;gap:12px;margin:6px 4px 0;padding:10px 12px 10px 16px;border-radius:16px;background:var(--surface)}
.modecard svg{width:22px;height:22px;color:var(--on-var)}
.modecard .t{flex:1;line-height:1.2}.modecard .t b{display:block;font-size:14px;font-weight:500}.modecard .t small{font-size:11.5px;color:var(--on-var)}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid #74777F;position:relative;transition:.15s;flex:none}
.sw::after{content:"";position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:#74777F;transition:.15s}
.on .sw,.sw.on{background:var(--primary);border-color:var(--primary)}
.on .sw::after,.sw.on::after{left:24px;top:2px;width:24px;height:24px;background:#fff}
.acct{display:flex;align-items:center;gap:12px;margin:8px 4px 0;padding:8px 8px 8px 12px;border-radius:28px}
.acct:hover{background:#0B1F3A14}
.av{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:500}
.who{flex:1;min-width:0;line-height:1.25}.who b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:12px;color:var(--on-var);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct svg{width:20px;height:20px;color:var(--on-var)}

/* ---------- rail (replié) ---------- */
.rail{width:88px;flex:none;background:var(--surface);border-right:1px solid #E1E4EA;display:flex;flex-direction:column;align-items:center;padding:12px 0 10px;gap:2px}
.rail img{height:26px;margin:6px 0 2px}
.rail .rl{font-size:9.5px;color:var(--on-var);line-height:1.1;text-align:center;margin-bottom:8px}
.r-it{width:80px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0 8px;font-size:11.5px;font-weight:500;color:var(--on-var);position:relative}
.r-it .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative;transition:.15s}
.r-it svg{width:24px;height:24px}
.r-it:hover .pill{background:#0B1F3A14}
.r-it.on .pill{background:var(--sec-cont);color:var(--on-sec-cont)}.r-it.on{color:var(--on-surface)}
.r-it.on svg{fill:rgba(10,42,74,.14)}
.r-it .bd{position:absolute;top:-2px;right:10px;min-width:16px;height:16px;border-radius:8px;background:var(--error);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.r-it .bd.warn{background:var(--tert)}.r-it .bd.d{min-width:8px;width:8px;height:8px;padding:0;top:2px;right:16px}
.rail .sp{flex:1}
.rail .mini{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:8px;font-size:10px;color:var(--on-var)}
.rail .sw{width:40px;height:24px;border-width:2px}
.rail .sw::after{left:4px;top:4px;width:12px;height:12px}
.rail .sw.on::after{left:18px;top:2px;width:16px;height:16px}
.rail .av{width:36px;height:36px;font-size:13px}

/* ---------- téléphone : barre du bas + feuille « Plus » ---------- */
.bar{display:flex;background:var(--surface-c);height:80px;padding:12px 8px 16px;gap:2px;flex:none}
.bar .r-it{flex:1;width:auto;padding:0}
.bar .r-it .bd{right:calc(50% - 26px)}
.scrim{position:absolute;inset:0;background:#0007;opacity:0;pointer-events:none;transition:.2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface-c);border-radius:28px 28px 0 0;padding:10px 12px 14px;transform:translateY(105%);transition:.25s;max-height:86%;overflow:auto}
.dev.openSheet .scrim{opacity:1;pointer-events:auto}.dev.openSheet .sheet{transform:none}
.grab{width:32px;height:4px;border-radius:2px;background:#74777F;opacity:.4;margin:2px auto 8px}
.sheet .item{height:52px}
.sheet .d-head{padding-top:0}
.hid{display:none!important}
</style>
</head>
<body>
<div class="mock">
  <b>Menu latéral — style Android (Material 3)</b>
  <span class="seg" id="vSeg">
    <button data-v="drawer" class="on">Tiroir (tablette / PC)</button>
    <button data-v="rail">Rail replié</button>
    <button data-v="phone">Téléphone</button>
    <button data-v="all">Les trois</button>
  </span>
  <span class="seg" id="mSeg"><button data-m="0">Simple</button><button data-m="1" class="on">Expert</button></span>
  <span>Maquette seule — rien n’est codé.</span>
</div>
<div class="stage" id="stage"></div>

<script>
const I={
 screens:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
 lists:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 plan:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 media:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
 compo:'<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="11" width="8" height="10" rx="1"/><rect x="3" y="14" width="8" height="7" rx="1"/>',
 widgets:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 integ:'<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v5"/>',
 stats:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/>',
 team:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 1.8 4 4.5"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 bars:'<path d="M4 7h16M4 12h16M4 17h10"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 left:'<path d="M15 6l-6 6 6 6"/>',up:'<path d="M6 15l6-6 6 6"/>',more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>'
};
const ic=k=>`<svg viewBox="0 0 24 24">${I[k]}</svg>`;
const ALL={
 screens:{l:'Écrans',n:'12',w:1},lists:{l:'Listes de lecture',n:'8'},plan:{l:'Planning',x:1},
 media:{l:'Médiathèque',n:'2',f:1},compo:{l:'Compositions',n:'3'},widgets:{l:'Widgets'},integ:{l:'Intégrations',d:1},
 stats:{l:'Statistiques',x:1},team:{l:'Organisation',x:1,n:'6'},gear:{l:'Réglages'}
};
const GROUPS=[['Diffuser',['screens','lists','plan']],['Contenus',['media','compo','widgets','integ']],['Suivre',['stats']],['Administration',['team','gear']]];
const st={v:'drawer',m:1,sel:'screens',sheet:false};
const keep=ks=>ks.filter(k=>!ALL[k].x||st.m);
const LOGO='<img src="../Linkii.Poc/wwwroot/brand/logo-long.png" alt="Linkivi" onerror="this.outerHTML=\'<b style=&quot;font-size:18px;color:#0B1F3A&quot;>Linkivi</b>\'">';
const badge=k=>{const a=ALL[k];return a.d?'<span class="dot"></span>':a.f?`<span class="badge fill">${a.n}</span>`:a.w?'<span class="badge warn" title="1 écran hors ligne">1</span><span class="badge">'+a.n+'</span>':a.n?`<span class="badge">${a.n}</span>`:''};
const mode=()=>`<button class="modecard ${st.m?'on':''}" data-mode>${ic('bars')}<span class="t"><b>Mode expert</b><small>${st.m?'Toutes les fonctions':'Affichage simplifié'}</small></span><span class="sw ${st.m?'on':''}"></span></button>`;
const acct=()=>`<button class="acct"><span class="av">LP</span><span class="who"><b>Université de Lausanne</b><small>ludovic.prieur@unil.ch</small></span>${ic('up')}</button>`;

function drawerItems(){
  let h='';GROUPS.forEach(([g,ks],i)=>{ks=keep(ks);if(!ks.length)return;
    if(g==='Administration')h+='<div class="sp"></div>';
    h+=`<div class="title">${g}</div>`+ks.map(k=>`<button class="item ${st.sel===k?'on':''}" data-sel="${k}">${ic(k)}<span class="lbl">${ALL[k].l}</span>${badge(k)}</button>`).join('');});
  return h;}
const drawer=()=>`<nav class="drawer"><div class="d-head">${LOGO}<span class="chip">Essential</span><span class="ver">v1.27</span><button class="ib" title="Replier">${ic('left')}</button></div><div class="scroll">${drawerItems()}</div>${mode()}${acct()}</nav>`;

function railBtn(k){const a=ALL[k];const bd=a.d?'<span class="bd d"></span>':a.f?`<span class="bd">${a.n}</span>`:a.w?'<span class="bd warn">1</span>':'';
  return `<button class="r-it ${st.sel===k?'on':''}" data-sel="${k}"><span class="pill">${ic(k)}${bd}</span>${a.l.replace('Listes de lecture','Listes').replace('Administration','Admin')}</button>`;}
const rail=()=>{let ks=keep(['screens','lists','plan','media','compo','widgets','integ','stats','team','gear']);
  return `<nav class="rail">${LOGO.replace('logo-long','logo-court')}<div class="rl">Essential<br>v1.27</div>${ks.slice(0,ks.indexOf('team')>-1?ks.indexOf('team'):ks.indexOf('gear')).map(railBtn).join('')}<div class="sp"></div>${ks.slice(ks.indexOf('team')>-1?ks.indexOf('team'):ks.indexOf('gear')).map(railBtn).join('')}<div class="mini"><button class="sw ${st.m?'on':''}" data-mode></button>Expert</div><span class="av">LP</span></nav>`;};

function phone(){
  const main=keep(['screens','lists','media','compo']);
  const more=GROUPS.flatMap(([g,ks])=>keep(ks)).filter(k=>!main.includes(k)||0);
  const bar=['screens','lists','media'].map(railBtn).join('')+`<button class="r-it" data-sheet><span class="pill">${ic('more')}${st.m?'<span class="bd d"></span>':''}</span>Plus</button>`;
  const rest=['compo','plan','widgets','integ','stats','team','gear'].filter(k=>keep([k]).length);
  return `<div class="dev ph ${st.sheet?'openSheet':''}"><div class="appbar"><button class="ib" data-sheet>${ic('menu')}</button><h2>${ALL[st.sel].l}</h2></div>
   <div class="page"><div class="ghost"></div><div class="ghost big"></div><div class="ghost"></div></div>
   <div class="bar">${bar}</div>
   <div class="scrim" data-sheet></div>
   <div class="sheet"><div class="grab"></div><div class="d-head">${LOGO}<span class="chip">Essential</span><span class="ver">v1.27</span></div>
    ${rest.map(k=>`<button class="item ${st.sel===k?'on':''}" data-sel="${k}">${ic(k)}<span class="lbl">${ALL[k].l}</span>${k==='plan'||k==='stats'||k==='team'?(st.m?'':''):''}${badge(k)}</button>`).join('')}
    <div class="dv"></div>${mode()}${acct()}</div></div>`;}

const tabletWrap=(nav,title)=>`<div class="dev tab">${nav}<div class="page"><h2>${ALL[st.sel].l}</h2><div class="ghost"></div><div class="ghost big"></div><div class="ghost"></div></div></div>`;
const cap=(t,d)=>`<div class="cap"><b>${t}</b><br>${d}</div>`;
function render(){
  const v=st.v,out=[];
  if(v==='drawer'||v==='all')out.push(`<div>${tabletWrap(drawer())}${cap('Tiroir de navigation (déplié)','Indicateur « pilule » sur l’élément actif, rubriques en titres, fond tonal, coins très arrondis. Mode expert en carte à interrupteur Material, compte en pied de tiroir.')}</div>`);
  if(v==='rail'||v==='all')out.push(`<div>${tabletWrap(rail())}${cap('Rail de navigation (replié)','Icône + libellé sous une pilule. Le bouton de pliage du tiroir bascule vers ce rail. Logo court, plan et version empilés ; interrupteur Expert réduit.')}</div>`);
  if(v==='phone'||v==='all')out.push(`<div>${phone()}${cap('Téléphone (app BackOffice)','Barre du bas à 3 destinations + « Plus » (point rouge s’il y a une alerte). La feuille glisse du bas : le tiroir complet, avec logo, plan, version, mode expert et compte. Touchez ☰ ou « Plus ».')}</div>`);
  document.getElementById('stage').innerHTML=out.join('');
  document.querySelectorAll('#vSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('#mSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.m===st.m));
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-sel]');if(t){st.sel=t.dataset.sel;st.sheet=false;render();return}
  if(e.target.closest('[data-mode]')){st.m=st.m?0:1;if(!st.m&&ALL[st.sel].x)st.sel='screens';render();return}
  if(e.target.closest('[data-sheet]')){st.sheet=!st.sheet;render();return}
  const v=e.target.closest('#vSeg button');if(v){st.v=v.dataset.v;render();return}
  const m=e.target.closest('#mSeg button');if(m){st.m=+m.dataset.m;if(!st.m&&ALL[st.sel].x)st.sel='screens';render()}
});
render();
</script>
</body>
</html>
