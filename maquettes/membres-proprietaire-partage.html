<div class="note"><b>Maquette — rien n'est codé.</b> Plusieurs utilisateurs : chacun ses écrans, ses médias, ses listes ; on partage du contenu ; la lecture seule se règle par page. Données inventées, tout est cliquable.</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const I={plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',x:'<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>',search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',share:'<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/></svg>',eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',chev:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'};
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)};

const M=[
 {id:'marie',n:'Marie Dupont',e:'marie.dupont@exemple.ch',role:'adm',c:0},

 {id:'ines',n:'Inès Garcia',e:'ines.garcia@exemple.ch',role:'usr',scr:'own',med:'own',pl:'own',zones:['Caisses','Vitrines'],scrs:[],c:4},
 {id:'tom',n:'Tom Leroy',e:'tom.leroy@exemple.ch',role:'usr',scr:'own',med:'own',pl:'own',zones:['Accueil','Cafétéria'],scrs:[],c:1},
 {id:'luc',n:'Luc Favre',e:'luc.favre@exemple.ch',role:'usr',scr:'own',med:'own',pl:'own',zones:[],scrs:['Salle A'],c:2,inv:true},
 {id:'anais',n:'Anaïs Rochat',e:'anais.rochat@exemple.ch',role:'usr',scr:'ro',med:'own',pl:'own',zones:[],scrs:[],c:3,job:'Communication'},
 {id:'paul',n:'Paul Meier',e:'paul.meier@exemple.ch',role:'usr',scr:'ro',med:'ro',pl:'ro',zones:[],scrs:[],c:5,job:'Direction'}];

const MED={
 ines:{f:[['Promotions été',14],['Prix caisses',6]],m:[['Affiche soldes','img'],['Vidéo vitrine','vid'],['Horaires','img']]},
 tom:{f:[['Accueil — bienvenue',8],['Menus cafétéria',12]],m:[['Plan du bâtiment','pdf']]},

 tom:[{k:'f',n:'Logos et charte',c:9,from:'anais',p:'Peut utiliser'}]};

 anais:{f:[['Campagnes',3]],l:[['Campagne automne',8]]},luc:{f:[],l:[['Salle A — jour',3]]},marie:{f:[],l:[['Écran de veille',2]]}};
const SHP={ines:[{k:'l',n:'Campagne automne',c:8,from:'anais',p:'Peut utiliser'}]};

const S={step:1,sheet:null,f:null,who:'ines',page:'scr',tab:'mine',side:'from',share:new Map(),orgAll:false,shared:false,adminView:'all',assign:null};

const CAP={
1:['Membres','Une ligne par personne : son rôle, et ce qu\'elle fait dans les trois pages. Seul dans l\'organisation ? Cette page reste vide et rien d\'autre ne change.'],
2:['La fiche membre : tout se règle au même endroit','Un rôle, puis pour chaque page : « Gère les siens » ou « Voit tout · lecture seule ». Pour les écrans, on coche des zones ou des écrans. Création et modification utilisent la même fiche.'],
3:['Ce que voit chacun','Changez de personne et de page. En « Gère les siens », on ne voit que ce qu\'on possède (et, dans un onglet à part, ce qu\'on nous partage). En lecture seule, on voit tout ce que possède l\'organisation, sans un seul bouton de modification.'],
4:['Partager en deux clics','Bouton « Partager » sur un média, un dossier, une liste ou un dossier de listes → choisir des personnes. Le destinataire le retrouve dans son onglet « Partagés avec moi », jamais mélangé à ses propres éléments.'],
5:['Attribuer des écrans (côté administrateur)','Le seul filtre de visibilité porte sur les écrans. L\'administrateur l\'attribue depuis la fiche membre, ou ici directement depuis l\'écran ou la zone : mêmes données, deux portes d\'entrée.'],
6:['Où régler quoi ? et les règles','Votre question 8 : régler la visibilité et les droits séparément, ou tout dans la fiche membre ? Trois options comparées, une recommandation, puis les règles complètes.']};

function render(){
 const s=S.step;$$('#steps button').forEach(b=>b.classList.toggle('on',+b.dataset.s===s));
 $('#capT').textContent=CAP[s][0];$('#capP').textContent=CAP[s][1];
 $('#app').classList.toggle('hide',s===6);$('#doc').classList.toggle('hide',s!==6);
 const nav=s<=2?'mem':s===3?S.page:s===4?'med':'scr';
 $$('.side [data-nav]').forEach(n=>n.classList.toggle('on',n.dataset.nav===nav));
 const meM=s===3?byId(S.who):s===4?byId(S.side==='from'?'ines':'tom'):byId('marie');
 $('#me').innerHTML=`${av(meM,1)}<div>${meM.n}<small>${meM.role==='adm'?'Administrateur':'Utilisateur'}</small></div>`;
 let ctl='';
 if(s===1||s===2)ctl=`<span>Fiche :</span><div class="seg" id="sh"><button data-o="ines" class="${S.sheet==='ines'?'on':''}">Modifier Inès</button><button data-o="anais" class="${S.sheet==='anais'?'on':''}">Modifier Anaïs</button><button data-o="new" class="${S.sheet==='new'?'on':''}">Nouveau membre</button><button data-o="" class="${!S.sheet?'on':''}">Fermée</button></div>`;
 if(s===3)ctl=`<span>Se connecter en tant que :</span><div class="seg" id="who">${['ines','anais','paul'].map(id=>{const m=byId(id);return `<button data-w="${id}" class="${S.who===id?'on':''}">${first(m)}</button>`}).join('')}</div><span>Page :</span><div class="seg" id="pg">${Object.entries(PAGE).map(([k,v])=>`<button data-p="${k}" class="${S.page===k?'on':''}">${v}</button>`).join('')}</div><span class="pill ${byId(S.who)[S.page]==='ro'?'dark':'blue'}">${MODE[byId(S.who)[S.page]]}</span>`;
 if(s===4)ctl=`<span>Côté :</span><div class="seg" id="sd"><button data-d="from" class="${S.side==='from'?'on':''}">Inès partage</button><button data-d="to" class="${S.side==='to'?'on':''}">Tom reçoit</button></div>`;
 if(s===5)ctl=`<span>Marie (administratrice) affiche :</span><div class="seg" id="av"><button data-a="all" class="${S.adminView==='all'?'on':''}">Toute l'organisation</button><button data-a="mine" class="${S.adminView==='mine'?'on':''}">Mes écrans</button></div>`;
 $('#ctl').innerHTML=ctl;
 if(s===6){$('#doc').innerHTML=v6();bind();return}
 $('#main').innerHTML=s<=2?v1()+sheet():s===3?v3():s===4?v4():v5();
 bind();
}

/* ---------- 1 · Membres ---------- */
function accCell(m,k){
 if(m.role==='adm')return '<span class="muted">—</span>';
 if(m[k]==='ro')return `<span class="pill dark">${I.eye} Tout · lecture</span>`;
 if(k==='scr'){const l=screensOf(m);if(!l.length)return '<span class="pill warn">Aucun écran</span>';
  const lab=[...m.zones,...m.scrs].join(', ');return `<div class="acc">${l.length} écran${l.length>1?'s':''}<small>${lab}</small></div>`}
 return '<span class="acc">Les siens</span>';
}
function v1(){
 return `<div class="ph"><h1>Membres</h1><span class="muted">${M.length} membres</span><span class="grow"></span><button class="btn" data-open="new">${I.plus} Nouveau membre</button></div>
 <p class="sub">Qui gère quoi, en un coup d'œil. Cliquez une ligne pour la modifier.</p>
 <div class="card"><table class="t"><thead><tr><th>Membre</th><th>Rôle</th><th>Écrans</th><th>Médiathèque</th><th>Listes de lecture</th><th></th></tr></thead><tbody>
 ${M.map(m=>`<tr data-open="${m.id}"><td><div class="who">${av(m)}<div><b style="font-weight:500">${m.n}</b><small>${m.inv?'<span class="pill warn">Invitation envoyée</span>':m.e}</small></div></div></td>
  <td>${m.role==='adm'?'<span class="pill blue">Administrateur</span>':'Utilisateur'}</td>
  ${m.role==='adm'?'<td colspan="3" class="muted" style="font-size:13px">Voit et gère tout, invite des membres</td>':`<td>${accCell(m,'scr')}</td><td>${accCell(m,'med')}</td><td>${accCell(m,'pl')}</td>`}
  <td class="muted">${I.chev}</td></tr>`).join('')}
 </tbody></table></div>
 <div class="hint"><b>Anaïs</b> (communication) voit tous les écrans sans pouvoir les régler, mais gère ses médias et ses listes. <b>Paul</b> (direction) consulte tout sans rien modifier.</div>`}

/* ---------- 2 · Fiche membre (tiroir du bas) ---------- */
function openSheet(id){
 S.sheet=id||null;if(!id){S.f=null;return}
 if(id==='new')S.f={isNew:true,n:'',e:'',role:'usr',scr:'own',med:'own',pl:'own',zones:new Set(),scrs:new Set(),pick:true};
 else{const m=byId(id);S.f={id,n:m.n,e:m.e,role:m.role,scr:m.scr||'own',med:m.med||'own',pl:m.pl||'own',zones:new Set(m.zones||[]),scrs:new Set(m.scrs||[]),pick:false}}
}
const fScreens=f=>SCR.filter(s=>f.zones.has(s.z)||f.scrs.has(s.n));
function seg2(k,v){return `<div class="seg" data-fk="${k}"><button data-v="own" class="${v==='own'?'on':''}">Gère les siens</button><button data-v="ro" class="${v==='ro'?'on':''}">${I.eye.replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px"')} Voit tout · lecture seule</button></div>`}
function summary(f){const nm=f.n?first(f):'Cette personne';
 if(f.role==='adm')return `<b>${nm} verra tout et pourra tout modifier</b> : les écrans, médias et listes de tous les membres, et la page Membres.`;
 const k=fScreens(f).length;
 const it=[f.scr==='own'?(k?`<b>${k} écran${k>1?'s':''}</b> à gérer, et aucun autre`:'<b>aucun écran</b> (la page Écrans sera vide)'):'<b>tous les écrans</b>, sans pouvoir les régler',
  f.med==='own'?'<b>ses médias et dossiers</b>, plus ceux qu\'on lui partage':'<b>tous les médias</b> de l\'organisation, sans les modifier',
  f.pl==='own'?'<b>ses listes et dossiers de listes</b>, plus celles qu\'on lui partage':'<b>toutes les listes</b>, sans les modifier'];
 return `${nm} verra :<ul>${it.map(x=>`<li>${x}</li>`).join('')}</ul>`}
function sheet(){
 if(!S.sheet)return '';const f=S.f;const k=fScreens(f).length;
 const chips=[...f.zones].map(z=>`<span class="pill blue">${z} · ${ZONES[z].length}</span>`).join('')+[...f.scrs].filter(n=>!f.zones.has(SCR.find(s=>s.n===n).z)).map(n=>`<span class="pill">${n}</span>`).join('');
 const picker=`<div class="zgrid">${Object.entries(ZONES).map(([z,l])=>`<div class="z"><div class="l"><button class="ck ${f.zones.has(z)?'on':''}" data-fz="${z}"></button><b style="font-weight:500">${z}</b><span class="muted" style="font-size:12px">toute la zone</span></div>
  ${l.map(n=>`<div class="l sc"><button class="ck ${f.zones.has(z)||f.scrs.has(n)?'on':''} ${f.zones.has(z)?'dim':''}" data-fs="${n}"></button>${n}</div>`).join('')}</div>`).join('')}</div>
  <div class="muted" style="font-size:12px;margin-top:8px">Cocher une zone donne aussi les écrans qu'on y ajoutera plus tard.</div>`;
 return `<div class="scrim on" data-close></div><div class="sheet on"><div class="grab"></div>
 <div class="sh-h">${f.isNew?`<span class="av" style="background:var(--row);color:var(--muted)">${I.user}</span><h3>Nouveau membre</h3>`:`${av(byId(f.id))}<div><h3>${f.n}</h3><small class="muted">${f.e}</small></div>`}<span class="grow"></span><button class="x" data-close>${I.x}</button></div>
 <div class="sh-b"><div class="sh-in">
  ${f.isNew?`<div class="fields" style="margin-top:14px"><label>Nom<input class="in" id="fn" value="${f.n}" placeholder="Prénom Nom"></label><label>E-mail<input class="in" id="fe" value="${f.e}" placeholder="nom@exemple.ch"></label></div>`:''}
  <div class="lab">Rôle</div>
  <div class="choice"><button data-role="usr" class="${f.role==='usr'?'on':''}"><b>Utilisateur</b><span>Gère ce qu'il crée et les écrans qu'on lui attribue</span></button><button data-role="adm" class="${f.role==='adm'?'on':''}"><b>Administrateur</b><span>Voit et gère tout, invite des membres</span></button></div>
  ${f.role==='usr'?`<div class="lab">Dans chaque page</div>
  <div class="prow"><div><b>Écrans</b><small>${f.scr==='own'?'seulement ceux attribués':'tous, sans les régler'}</small></div>${seg2('scr',f.scr)}<span></span>
   ${f.scr==='own'?`<div class="scrsel"><div class="chips"><span style="font-size:13px">Ses écrans : <b style="font-weight:500">${k} sur ${SCR.length}</b></span>${chips||'<span class="muted" style="font-size:13px">aucun pour l\'instant</span>'}<span class="grow"></span><button class="link" id="pick">${f.pick?'Fermer':'Choisir les écrans'}</button></div>${f.pick?picker:''}</div>`:''}</div>
  <div class="prow"><div><b>Médiathèque</b><small>${f.med==='own'?'ses médias et dossiers':'tous les médias, sans modifier'}</small></div>${seg2('med',f.med)}<span></span></div>
  <div class="prow"><div><b>Listes de lecture</b><small>${f.pl==='own'?'ses listes et dossiers':'toutes les listes, sans modifier'}</small></div>${seg2('pl',f.pl)}<span></span></div>`
  :`<div class="hint">Un administrateur n'a rien à régler : il voit tout. Dans chaque page, il bascule entre « Les miens » et « Toute l'organisation ».</div>`}
  <div class="sum">${summary(f)}</div>
 </div></div>
 <div class="sh-f">${f.isNew?`<select class="in" id="copy"><option value="">Copier les accès de…</option>${M.filter(m=>m.role==='usr').map(m=>`<option value="${m.id}">${m.n}</option>`).join('')}</select>`:`<button class="link red" data-t="Retirer ${first(f)} : ses médias, listes et dossiers sont transférés à la personne de votre choix (par défaut : vous)">Retirer de l'organisation</button>`}
  <span class="grow"></span><button class="btn ghost" data-close>Annuler</button><button class="btn" id="save">${f.isNew?'Envoyer l\'invitation':'Enregistrer'}</button></div></div>`}

/* ---------- 3 · Ce que voit chacun ---------- */
const roBar=(what)=>`<div class="ro">${I.lock}<span><b>Lecture seule</b> — vous voyez ${what} de l'organisation. Rien n'est modifiable ici.</span></div>`;
const ownerTag=id=>{const m=byId(id);return `<span class="pill" style="padding-left:2px">${av(m,1).replace('class="av s"','class="av s" style="width:18px;height:18px;font-size:8.5px;background:'+hue[m.c%hue.length]+'"')}${first(m)}</span>`};
const fromTag=(x)=>`<span class="pill blue">${I.share} de ${first(byId(x.from))}</span><span class="pill">${x.p}</span>`;
function folderCard(n,c,{edit,owner,shared,sharedTo,nw,id}={}){
 return `<div class="card fo ${nw?'nw':''}"><div class="ic"></div><b>${n}</b><div class="muted" style="font-size:12.5px">${c} média${c>1?'s':''}</div>
 <div class="tags">${owner?ownerTag(owner):''}${shared?fromTag(shared):''}${sharedTo?`<span class="pill blue">${I.share} ${sharedTo}</span>`:''}${nw?'<span class="pill dark">Nouveau</span>':''}</div>
 ${edit?`<div class="cact"><button class="x" title="Partager" ${id?`id="${id}"`:'data-t="Fenêtre « Partager » (même que l\'étape 4)"'}>${I.share}</button><button class="x" title="Plus" data-t="Renommer, déplacer, supprimer…">${I.more}</button></div>`:''}
 ${shared?`<div class="cact"><button class="x" title="Plus" data-t="Ne plus voir (le partage disparaît de chez vous seulement)">${I.more}</button></div>`:''}</div>`}
function mediaCard(n,t,{edit,owner,shared}={}){
 return `<div class="card md"><div class="th ${t}">${t==='img'?'Image':t==='vid'?'Vidéo':'PDF'}</div><div class="bd"><b>${n}</b><div class="tags">${owner?ownerTag(owner):''}${shared?fromTag(shared):''}</div></div>
 ${edit?`<div class="cact"><button class="x" title="Partager" data-t="Fenêtre « Partager » (même que l\'étape 4)">${I.share}</button></div>`:''}</div>`}
function tabs(mine,shared){return `<div class="tabs" id="tabs"><button data-tab="mine" class="${S.tab==='mine'?'on':''}">${mine}</button><button data-tab="shared" class="${S.tab==='shared'?'on':''}">Partagés avec moi ${shared?`<span class="badge">${shared}</span>`:''}</button></div>`}

function pageScreens(m){
 if(m.scr==='own'){const l=screensOf(m);
  return `<div class="ph"><h1>Écrans</h1><span class="muted">${l.length} écran${l.length>1?'s':''}</span><span class="grow"></span><button class="btn" data-t="Ajouter un écran : code d'appairage. L'écran ajouté lui est attribué d'office.">${I.plus} Ajouter un écran</button></div>
  <p class="sub">Les écrans qui vous sont attribués. Aucun autre n'apparaît.</p>
  ${l.length?`<div class="screens">${l.map(s=>`<div class="card scr"><div class="th"><span class="dot"></span></div><div class="bd"><b>${s.n}</b><div class="muted" style="font-size:12.5px">Diffuse : ${ON[s.n]}</div></div>
  <div class="ft"><button class="btn sm ghost" data-t="Choisir la liste diffusée (ses listes + celles qu'on lui partage)">Changer la liste</button><button class="btn sm ghost" data-t="Réglages de l'écran">Réglages</button></div></div>`).join('')}</div>`:'<div class="card empty">Aucun écran ne vous est attribué pour l\'instant.</div>'}`}
 return `<div class="ph"><h1>Écrans</h1><span class="muted">${SCR.length} écrans</span></div><p class="sub">Tous les écrans de l'organisation, par zone.</p>${roBar('tous les écrans')}
 ${Object.entries(ZONES).map(([z,l])=>`<div class="zh"><b>${z}</b><span class="muted">${l.length}</span></div><div class="screens">${l.map(n=>{const s=SCR.find(x=>x.n===n),g=managers(s);
  return `<div class="card scr"><div class="th"><span class="dot"></span></div><div class="bd"><b>${n}</b><div class="muted" style="font-size:12.5px">Diffuse : ${ON[n]}</div></div><div class="ft"><span class="muted" style="font-size:12px">Géré par</span>${g.length?`<span class="stack">${g.map(x=>av(x,1)).join('')}</span>`:'<span class="muted" style="font-size:12px">administrateurs</span>'}</div></div>`}).join('')}</div>`).join('')}`}

function pageMedia(m){
 if(m.med==='own'){const d=MED[m.id]||{f:[],m:[]},sh=SHM[m.id]||[];
  const head=`<div class="ph"><h1>Médiathèque</h1><span class="grow"></span>${S.tab==='mine'?`<button class="btn ghost" data-t="Nouveau dossier : il apparaît tout de suite, chez vous">${I.plus} Dossier</button><button class="btn" data-t="Ajouter : ordinateur, adresse, cloud…">${I.plus} Ajouter</button>`:''}</div>`+tabs(`Mes médias <span class="muted">${d.f.length+d.m.length}</span>`,sh.length);
  if(S.tab==='shared')return head+`<p class="sub">Ce que des collègues vous ont partagé. Utilisable dans vos listes.</p><div class="grid">${sh.map(x=>x.k==='f'?folderCard(x.n,x.c,{shared:x}):mediaCard(x.n,x.t,{shared:x})).join('')}</div>`;
  return head+`<div class="lab" style="margin-top:4px">Dossiers</div><div class="grid">${d.f.map(([n,c])=>folderCard(n,c,{edit:1})).join('')}</div><div class="lab">Médias</div><div class="grid">${d.m.map(([n,t])=>mediaCard(n,t,{edit:1})).join('')}</div>`}
 const all=Object.entries(MED);
 return `<div class="ph"><h1>Médiathèque</h1><span class="grow"></span><select class="in"><option>De : tout le monde</option>${M.map(x=>`<option>${x.n}</option>`).join('')}</select></div><p class="sub">Tous les médias de l'organisation.</p>${roBar('tous les médias')}
 <div class="lab" style="margin-top:4px">Dossiers</div><div class="grid">${all.flatMap(([o,d])=>d.f.map(([n,c])=>folderCard(n,c,{owner:o}))).join('')}</div>
 <div class="lab">Médias</div><div class="grid">${all.flatMap(([o,d])=>d.m.map(([n,t])=>mediaCard(n,t,{owner:o}))).join('')}</div>`}

function listRow(n,c,{edit,owner,shared,folder,used}={}){
 return `<div class="row">${folder?'<span class="fic"></span>':'<span class="pic"></span>'}<div style="min-width:0"><b style="font-weight:500">${n}</b><div class="muted" style="font-size:12.5px">${c} ${folder?'liste'+(c>1?'s':''):'élément'+(c>1?'s':'')}${used?` · sur ${used}`:''}</div></div>
 <div class="tags" style="margin:0">${owner?ownerTag(owner):''}${shared?fromTag(shared):''}</div><span class="grow"></span>
 ${edit?`<button class="x" title="Partager" data-t="Fenêtre « Partager » (même que l'étape 4)">${I.share}</button><button class="x" data-t="Modifier, dupliquer, supprimer…">${I.more}</button>`:''}${shared?`<button class="x" data-t="Utiliser sur un de vos écrans, ou ne plus voir">${I.more}</button>`:''}</div>`}
function pageLists(m){
 if(m.pl==='own'){const d=PL[m.id]||{f:[],l:[]},sh=SHP[m.id]||[];
  const head=`<div class="ph"><h1>Listes de lecture</h1><span class="grow"></span>${S.tab==='mine'?`<button class="btn ghost" data-t="Nouveau dossier de listes">${I.plus} Dossier</button><button class="btn" data-t="Nouvelle liste">${I.plus} Nouvelle liste</button>`:''}</div>`+tabs(`Mes listes <span class="muted">${d.f.length+d.l.length}</span>`,sh.length);
  if(S.tab==='shared')return head+`<div class="card lst">${sh.length?sh.map(x=>listRow(x.n,x.c,{shared:x})).join(''):'<div class="empty">Rien ne vous a été partagé.</div>'}</div>`;
  const used=n=>{const k=Object.values(ON).filter(v=>v===n).length;return k?`${k} écran${k>1?'s':''}`:''};
  return head+`<div class="card lst">${d.f.map(([n,c])=>listRow(n,c,{edit:1,folder:1})).join('')}${d.l.map(([n,c])=>listRow(n,c,{edit:1,used:used(n)})).join('')}</div>`}
 return `<div class="ph"><h1>Listes de lecture</h1><span class="grow"></span><select class="in"><option>De : tout le monde</option>${M.map(x=>`<option>${x.n}</option>`).join('')}</select></div><p class="sub">Toutes les listes de l'organisation.</p>${roBar('toutes les listes')}
 <div class="card lst">${Object.entries(PL).flatMap(([o,d])=>[...d.f.map(([n,c])=>listRow(n,c,{owner:o,folder:1})),...d.l.map(([n,c])=>listRow(n,c,{owner:o}))]).join('')}</div>`}

function v3(){const m=byId(S.who);
 const body=S.page==='scr'?pageScreens(m):S.page==='med'?pageMedia(m):pageLists(m);
 const note={ines:'<b>Inès</b> gère les siens partout : 3 écrans attribués (Caisses, Vitrines), ses médias, ses listes. Les éléments partagés ont leur propre onglet.',
  anais:'<b>Anaïs</b> : Écrans en lecture seule (elle voit les 8, sans bouton), mais Médiathèque et Listes en « Gère les siens ».',
  paul:'<b>Paul</b> : lecture seule dans les trois pages. Il voit tout, avec le nom du propriétaire, et un filtre « De : ».'}[S.who];
 return body+`<div class="hint">${note}</div>`}

/* ---------- 4 · Partager ---------- */

 if(S.side==='to'){const sh=[...(S.shared?[{k:'f',n:'Promotions été',c:14,from:'ines',p:S.share.get('tom')||'Peut utiliser',nw:1}]:[{k:'f',n:'Promotions été',c:14,from:'ines',p:'Peut utiliser',nw:1}]),...SHM.tom];

  <p class="sub">Ce que des collègues vous ont partagé.</p><div class="grid">${sh.map(x=>folderCard(x.n,x.c,{shared:x,nw:x.nw})).join('')}</div>
  <div class="hint">Le nouveau dossier rebondit et la pastille compte les nouveautés. Avec « Peut utiliser », Tom le met dans ses listes ; il ne peut ni le renommer ni y ajouter de média. Avec « Peut modifier », il peut aussi ajouter et retirer des médias. Si Inès ajoute un média, Tom le voit aussitôt.</div>`}
 const d=MED.ines;const n=S.orgAll?'Toute l\'organisation':S.share.size?`${S.share.size} personne${S.share.size>1?'s':''}`:'';
 const others=M.filter(m=>m.id!=='ines');
 return `<div class="ph"><h1>Médiathèque</h1><span class="grow"></span><button class="btn ghost" data-t="Nouveau dossier">${I.plus} Dossier</button><button class="btn" data-t="Ajouter des médias">${I.plus} Ajouter</button></div>
 <div class="tabs"><button class="on">Mes médias <span class="muted">5</span></button><button data-t="Onglet « Partagés avec moi »">Partagés avec moi <span class="badge">2</span></button></div>
 <div class="lab" style="margin-top:4px">Dossiers</div><div class="grid">${folderCard('Promotions été',14,{edit:1,id:'shBtn',sharedTo:S.shared?n:''})}${folderCard('Prix caisses',6,{edit:1})}</div>
 <div class="lab">Médias</div><div class="grid">${d.m.map(([n,t])=>mediaCard(n,t,{edit:1})).join('')}</div>
 <div class="hint">Cliquez l'icône ${I.share.replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px"')} de « Promotions été ». Même geste pour un média, une liste ou un dossier de listes ; on peut aussi sélectionner plusieurs éléments puis « Partager ».</div>
 <div class="panel ${S.panel?'on':''}" id="panel"><div class="ph2"><h3>Partager « Promotions été »</h3><span class="grow"></span><button class="x" id="pc">${I.x}</button></div>
  <div class="pb"><label class="search">${I.search}<input placeholder="Nom ou e-mail d'un membre"></label>
   <div class="pr" style="margin-top:6px"><button class="ck ${S.orgAll?'on':''}" id="allCk"></button><div><b>Toute l'organisation</b><div class="muted" style="font-size:12.5px">chacun le verra dans « Partagés avec moi »</div></div></div>
   <div class="lab" style="margin-top:8px">Ou seulement</div>
   ${others.map(m=>{const on=S.orgAll||S.share.has(m.id);return `<div class="pr" style="${S.orgAll?'opacity:.45':''}"><button class="ck ${on?'on':''}" data-sp="${m.id}"></button>${av(m,1)}<span style="flex:1">${m.n}</span>${S.share.has(m.id)&&!S.orgAll?`<select class="in" style="height:28px;font-size:12.5px" data-perm="${m.id}"><option ${S.share.get(m.id)==='Peut utiliser'?'selected':''}>Peut utiliser</option><option ${S.share.get(m.id)==='Peut modifier'?'selected':''}>Peut modifier</option></select>`:''}</div>`}).join('')}
   <div class="hint"><b>Peut utiliser</b> : le mettre dans ses listes, sans le changer.<br><b>Peut modifier</b> : ajouter et retirer des médias. Supprimer le dossier reste réservé à vous.</div></div>
  <div class="pf"><button class="btn ghost" id="pc2">Annuler</button><button class="btn" id="pgo" ${S.orgAll||S.share.size?'':'disabled'}>Partager</button></div></div>`}

/* ---------- 5 · Attribuer des écrans (admin) ---------- */
function v5(){
 if(S.adminView==='mine')return `<div class="ph"><h1>Écrans</h1><span class="muted">Mes écrans</span></div><div class="card empty">Aucun écran ne vous est attribué.<br><button class="link" id="seeAll" style="margin-top:6px">Voir toute l'organisation (8)</button></div>
  <div class="hint">Comme tout le monde, l'administrateur a « Les miens » ; il a en plus la bascule « Toute l'organisation » dans les trois pages (le choix est mémorisé).</div>`;
 const users=M.filter(m=>m.role==='usr');
 let panel='';
 if(S.assign){const a=S.assign,isZ=a.type==='z';
  panel=`<div class="panel on"><div class="ph2"><h3>Qui gère ${isZ?'la zone ':''}« ${a.n} » ?</h3><span class="grow"></span><button class="x" id="ac">${I.x}</button></div><div class="pb">
  ${isZ?`<p class="muted" style="margin-top:0;font-size:13px">${ZONES[a.n].join(', ')} — et les écrans qu'on ajoutera à cette zone.</p>`:''}
  ${users.map(m=>{if(m.scr==='ro')return `<div class="pr" style="opacity:.55"><span class="ck"></span>${av(m,1)}<span style="flex:1">${m.n}</span><span class="pill dark">${I.eye} voit déjà tout</span></div>`;
   const on=isZ?m.zones.includes(a.n):(m.zones.includes(SCR.find(s=>s.n===a.n).z)||m.scrs.includes(a.n));const via=!isZ&&m.zones.includes(SCR.find(s=>s.n===a.n).z);
   return `<div class="pr"><button class="ck ${on?'on':''} ${via?'dim':''}" data-as="${m.id}"></button>${av(m,1)}<span style="flex:1">${m.n}</span>${via?'<span class="muted" style="font-size:12px">via la zone</span>':''}</div>`}).join('')}
  <div class="hint">Enregistré tout de suite. La personne voit l'écran apparaître dans sa page Écrans.</div></div></div>`}
 return `<div class="ph"><h1>Écrans</h1><span class="muted">Toute l'organisation · ${SCR.length} écrans</span><span class="grow"></span><button class="btn" data-t="Ajouter un écran">${I.plus} Ajouter un écran</button></div><p class="sub">Par zone, avec les personnes qui les gèrent.</p>
 ${Object.entries(ZONES).map(([z,l])=>{const zm=M.filter(m=>m.role==='usr'&&m.scr==='own'&&m.zones.includes(z));
  return `<div class="zh"><b>${z}</b><span class="muted">${l.length}</span>${zm.length?`<span class="stack">${zm.map(x=>av(x,1)).join('')}</span>`:''}<button class="link" data-az="${z}">Attribuer la zone</button></div>
  <div class="screens">${l.map(n=>{const s=SCR.find(x=>x.n===n),g=managers(s);return `<div class="card scr ${g.length?'':'free'}"><div class="th"><span class="dot"></span></div><div class="bd"><b>${n}</b><div class="muted" style="font-size:12.5px">Diffuse : ${ON[n]}</div></div>
   <div class="ft">${g.length?`<span class="stack">${g.map(x=>av(x,1)).join('')}</span><span class="muted" style="font-size:12px">${g.map(first).join(', ')}</span>`:'<span class="pill warn">Personne</span>'}<span class="grow"></span><button class="btn sm ghost" data-asn="${n}">Attribuer</button></div></div>`}).join('')}</div>`}).join('')}
 <div class="hint">« Salle B » n'est attribué à personne : seuls les administrateurs le gèrent. Ce qui est fait ici se retrouve dans la fiche membre, et inversement.</div>${panel}`}

/* ---------- 6 · Où régler quoi ? ---------- */
function v6(){const Y='<span class="yes">✓</span>',N='<span class="no">—</span>';
 return `<div class="card"><h3>Votre question 8 : où régler visibilité et droits ?</h3>
 <div class="opts">
  <div class="opt rec"><span class="pill blue">Recommandé</span><h4 style="margin-top:8px">A · Tout dans la fiche membre</h4><div class="muted" style="font-size:13px">Rôle + 3 choix (un par page) + ses écrans, à la création comme à l'édition.</div>
   <ul><li>Un seul endroit à connaître</li><li>Un membre se crée en ~4 clics (« Copier les accès de… » le fait en 2)</li><li>Raccourci « Attribuer » sur la page Écrans : mêmes données</li></ul></div>
  <div class="opt"><h4>B · Visibilité et droits séparés</h4><div class="muted" style="font-size:13px">Une page « Visibilité » (qui voit quels écrans) et une page « Droits » (lecture seule par page).</div>
   <ul><li>Deux pages pour une même personne : il faut aller-retour</li><li>Utile seulement si les écrans changent de mains très souvent</li><li>C'est ce qui a rendu la version actuelle lourde</li></ul></div>
  <div class="opt"><h4>C · Profils réutilisables</h4><div class="muted" style="font-size:13px">On crée des profils (« Communication », « Direction »…) qu'on attribue aux membres.</div>
   <ul><li>Pratique au-delà de ~30 membres</li><li>Un concept de plus à expliquer</li><li>À ajouter plus tard si besoin ; d'ici là, « Copier les accès de… » suffit</li></ul></div>
 </div></div>
 <div class="card"><h3>Ce que chacun peut faire</h3><table class="r"><thead><tr><th></th><th>Utilisateur<br><span class="muted">Gère les siens</span></th><th>Utilisateur<br><span class="muted">Lecture seule</span></th><th>Administrateur</th></tr></thead><tbody>
  <tr><td>Écrans : voir</td><td>ceux attribués</td><td>tous</td><td>tous</td></tr>
  <tr><td>Écrans : changer la liste, régler, ajouter</td><td>${Y} <span class="muted">(les siens)</span></td><td>${N}</td><td>${Y}</td></tr>
  <tr><td>Médias / listes et leurs dossiers : voir</td><td>les siens + reçus</td><td>tous</td><td>les siens ⇄ tous</td></tr>
  <tr><td>Médias / listes : créer, modifier, supprimer</td><td>${Y} <span class="muted">(les siens)</span></td><td>${N}</td><td>${Y}</td></tr>
  <tr><td>Partager médias, listes et leurs dossiers</td><td>${Y}</td><td>${N}</td><td>${Y}</td></tr>
  <tr><td>Créer des membres, attribuer des écrans</td><td>${N}</td><td>${N}</td><td>${Y}</td></tr></tbody></table>
  <div class="muted" style="font-size:13px;margin-top:8px">La lecture seule se choisit <b>page par page</b> : Anaïs est en lecture seule sur Écrans et gère ses médias et listes.</div></div>
 <div class="two"><div class="card"><h3>Les règles, en cinq lignes</h3><ol>
  <li><b>Tout appartient à quelqu'un</b> : celui qui crée un média, une liste ou un dossier en est propriétaire.</li>
  <li><b>Un seul filtre de visibilité : les écrans</b>, attribués par zone ou un par un.</li>
  <li><b>Chacun voit les siens</b>, et ce qu'on lui partage dans un onglet à part : aucun mélange.</li>
  <li><b>Lecture seule = tout voir</b> dans la page concernée, sans un seul bouton de modification.</li>
  <li><b>Partage</b> : vers des personnes ou toute l'organisation, « Peut utiliser » ou « Peut modifier ».</li></ol></div>
 <div class="card"><h3>Ce qui disparaît de la version actuelle</h3><ul>
  <li>Les aires de gestion dans les droits (les zones restent pour ranger et attribuer les écrans)</li>
  <li>Les niveaux de droits (pages, intégrations, périmètre aire › zone › écran)</li>
  <li>La visibilité par dossier et les dossiers « privés »</li>
  <li>Les vues Lieux / Personnes, les accès multiples et leurs chevauchements</li>
  <li>Les rôles Lecteur / Éditeur / Contributeur : remplacés par « Gère les siens » / « Lecture seule » par page</li></ul></div></div>
 <div class="two"><div class="card"><h3>Questions à trancher</h3><ol>
  <li>Un utilisateur peut-il <b>ajouter un écran</b> lui-même (il lui est alors attribué), ou seul l'administrateur ? <span class="muted">Maquette : oui.</span></li>
  <li><b>Plusieurs personnes sur un même écran</b> : autorisé ? <span class="muted">Maquette : oui (Accueil géré par Tom, et un collègue en plus si besoin).</span></li>
  <li><b>Lecture seule sur la médiathèque mais « Gère les siens » sur les listes</b> : peut-il mettre n'importe quel média de l'organisation dans ses listes ? <span class="muted">Proposé : oui, utiliser n'est pas modifier.</span></li>
  <li>Garder <b>« Peut modifier »</b> dans le partage dès la première version, ou seulement « Peut utiliser » ?</li>
  <li>Quand un membre part : ses éléments vont à <b>l'administrateur qui le retire</b>, ou on demande à qui ?</li></ol></div>
 <div class="card"><h3>Briques pour plus tard</h3><ul>
  <li>Profils réutilisables (option C)</li><li>Troisième choix par page : « Masquée » (la page disparaît du menu)</li><li>Notification au destinataire d'un partage</li><li>Rôle « Responsable » : un utilisateur qui crée des membres sans être administrateur</li></ul>
  <div class="muted" style="font-size:13px;margin-top:10px">Mode mono-utilisateur : inchangé. Sans second membre, ni « Partager », ni onglet « Partagés avec moi », ni bascule « Toute l'organisation ».</div></div></div>`}

/* ---------- interactions ---------- */
function bind(){
 $$('[data-t]').forEach(b=>b.onclick=e=>{e.stopPropagation();toast(b.dataset.t)});
 const sh=$('#sh');if(sh)sh.onclick=e=>{const b=e.target.closest('button');if(!b)return;openSheet(b.dataset.o);S.step=b.dataset.o?2:1;render()};
 $$('[data-open]').forEach(b=>b.onclick=()=>{openSheet(b.dataset.open);S.step=2;render()});
 $$('[data-close]').forEach(b=>b.onclick=()=>{openSheet(null);S.step=1;render()});
 const f=S.f;
 if(f&&S.sheet&&$('#save')){
  $$('[data-role]').forEach(b=>b.onclick=()=>{f.role=b.dataset.role;render()});
  $$('[data-fk]').forEach(sg=>sg.onclick=e=>{const b=e.target.closest('button');if(!b)return;f[sg.dataset.fk]=b.dataset.v;render()});
  const p=$('#pick');if(p)p.onclick=()=>{f.pick=!f.pick;render()};
  $$('[data-fz]').forEach(b=>b.onclick=()=>{const z=b.dataset.fz;f.zones.has(z)?f.zones.delete(z):f.zones.add(z);render()});
  $$('[data-fs]').forEach(b=>b.onclick=()=>{const n=b.dataset.fs;if(f.zones.has(SCR.find(s=>s.n===n).z))return toast('Déjà inclus par la zone : décochez la zone pour choisir écran par écran');f.scrs.has(n)?f.scrs.delete(n):f.scrs.add(n);render()});
  const fn=$('#fn');if(fn){fn.oninput=()=>{f.n=fn.value;$('.sum').innerHTML=summary(f)};$('#fe').oninput=()=>f.e=$('#fe').value}
  const cp=$('#copy');if(cp)cp.onchange=()=>{const m=byId(cp.value);if(!m)return;Object.assign(f,{role:m.role,scr:m.scr,med:m.med,pl:m.pl,zones:new Set(m.zones),scrs:new Set(m.scrs),pick:false});render();toast(`Accès de ${m.n} copiés : il ne reste qu'à envoyer`)};
  $('#save').onclick=()=>{
   if(f.isNew){toast(`Invitation envoyée${f.e?' à '+f.e:''} : la personne choisit son mot de passe (ou Microsoft / Google)`)}
   else{const m=byId(f.id);Object.assign(m,{role:f.role,scr:f.scr,med:f.med,pl:f.pl,zones:[...f.zones],scrs:[...f.scrs]});toast('Enregistré')}
   openSheet(null);S.step=1;render()};
 }
 const w=$('#who');if(w)w.onclick=e=>{const b=e.target.closest('button');if(b){S.who=b.dataset.w;S.tab='mine';render()}};
 const pg=$('#pg');if(pg)pg.onclick=e=>{const b=e.target.closest('button');if(b){S.page=b.dataset.p;S.tab='mine';render()}};
 $$('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
 const sd=$('#sd');if(sd)sd.onclick=e=>{const b=e.target.closest('button');if(b){S.side=b.dataset.d;S.panel=false;render()}};
 const sb=$('#shBtn');if(sb)sb.onclick=e=>{e.stopPropagation();S.panel=true;render()};
 const pc=$('#pc');if(pc){const close=()=>{S.panel=false;render()};pc.onclick=close;$('#pc2').onclick=close;
  $('#allCk').onclick=()=>{S.orgAll=!S.orgAll;render()};
  $$('[data-sp]').forEach(b=>b.onclick=()=>{if(S.orgAll)return;const id=b.dataset.sp;S.share.has(id)?S.share.delete(id):S.share.set(id,'Peut utiliser');render()});
  $$('[data-perm]').forEach(s=>s.onchange=()=>{S.share.set(s.dataset.perm,s.value)});
  $('#pgo').onclick=()=>{S.shared=true;S.panel=false;render();toast('Partagé : visible tout de suite dans leur onglet « Partagés avec moi »')}}
 const avs=$('#av');if(avs)avs.onclick=e=>{const b=e.target.closest('button');if(b){S.adminView=b.dataset.a;S.assign=null;render()}};
 const sa=$('#seeAll');if(sa)sa.onclick=()=>{S.adminView='all';render()};
 $$('[data-asn]').forEach(b=>b.onclick=()=>{S.assign={type:'s',n:b.dataset.asn};render()});
 $$('[data-az]').forEach(b=>b.onclick=()=>{S.assign={type:'z',n:b.dataset.az};render()});
 const ac=$('#ac');if(ac)ac.onclick=()=>{S.assign=null;render()};
 $$('[data-as]').forEach(b=>b.onclick=()=>{const m=byId(b.dataset.as),a=S.assign;
  if(a.type==='z'){m.zones.includes(a.n)?m.zones.splice(m.zones.indexOf(a.n),1):m.zones.push(a.n)}
  else{const z=SCR.find(s=>s.n===a.n).z;if(m.zones.includes(z))return toast(`${first(m)} l'a via la zone ${z} : retirez la zone pour l'enlever`);m.scrs.includes(a.n)?m.scrs.splice(m.scrs.indexOf(a.n),1):m.scrs.push(a.n)}
  render()});
}
$('#steps').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.step=+b.dataset.s;
 if(S.step===2&&!S.sheet)openSheet('ines');if(S.step!==2)openSheet(null);S.panel=false;S.assign=null;render()};
render();
</script></body></html>
