<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Installer le player dans l'application</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--signal:#3B82C4;--sig-bg:#EAF2FA;--sig-ink:#1d4f80;--ok:#2E8B57;--ok-bg:#E1F0E8;--ok-ink:#155A38;--warn:#B7791F;--warn-bg:#FBF1DC;--bad:#C0392B;--r:4px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.mono{font-family:"JetBrains Mono",monospace;font-size:13px}
.mock{position:sticky;top:0;z-index:300;background:#FFF8E1;border-bottom:1px dashed #E0B84A;padding:8px 16px;font-size:13px;color:#6B5200}
.mock .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.mock .sc{border:1px solid #E0B84A;background:#fff;border-radius:4px;padding:3px 10px;font-size:13px}
.mock .sc.on{background:#6B5200;border-color:#6B5200;color:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r);padding:8px 16px;font-weight:500;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;height:38px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}.btn.sm{height:32px;padding:0 12px;font-size:13px}
.lnk{border:0;background:none;color:var(--sig-ink);padding:0;text-decoration:underline;font-size:inherit}
.chip{font-size:11.5px;border-radius:3px;padding:0 6px;font-weight:500;line-height:18px;white-space:nowrap;display:inline-block}
.chip.v{background:var(--sig-bg);color:var(--sig-ink)}.chip.ok{background:var(--ok-bg);color:var(--ok-ink)}.chip.new{background:#C0392B;color:#fff}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.soon{background:#EEE;color:var(--muted)}
/* coquille de l'app */
.app{display:flex;min-height:760px;position:relative;overflow:hidden;background:var(--bg)}
.side{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
.logo{font-size:28px;font-weight:500;letter-spacing:-.5px;margin:0 0 18px 8px}.logo small{font-size:11px;color:var(--muted);letter-spacing:0;margin-left:6px}
.nav{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:6px;color:var(--muted);position:relative}
.nav.on{background:var(--sig-bg);color:var(--ink);font-weight:500}
.nav .cnt{margin-left:auto;font-size:12px}
.nav.hl{outline:2px solid var(--signal);outline-offset:1px;color:var(--ink)}
.nav .chip{margin-left:auto}
.spacer{flex:1;min-height:60px}
.modeb{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border-radius:6px;margin-top:8px}
.modeb .sw{margin-left:auto;width:34px;height:20px;border-radius:10px;background:var(--ink);position:relative}.modeb .sw::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.me{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--line);margin-top:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.main{flex:1;padding:24px 32px;position:relative;min-width:0}
.main h1{margin:0;font-size:28px;font-weight:500}.sub{color:var(--muted);margin:2px 0 16px}
.head{display:flex;gap:12px;align-items:flex-start}.head .grow{flex:1}
.tabsr{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:6px 0 16px}.tabsr span{padding:9px 0;color:var(--muted)}.tabsr .on{color:var(--ink);font-weight:500;border-bottom:2px solid var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:6px}
.srow{display:flex;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}.srow:first-child{border-top:0}
.thumb{width:84px;height:48px;border-radius:4px;background:#0E1E38;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px}
/* menu Ajouter */
.addw{position:relative}
.menu{position:absolute;right:0;top:44px;width:350px;background:#fff;border:1px solid var(--line-2);border-radius:6px;box-shadow:0 8px 24px rgba(11,31,58,.16);padding:6px;z-index:5}
.menu .it{padding:9px 10px;border-radius:4px;display:flex;gap:12px;align-items:center}.menu .it:hover{background:var(--bg)}
.menu small{display:block;color:var(--muted);font-size:12px}.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .it.new{background:var(--sig-bg);outline:2px solid var(--signal);outline-offset:-2px}
.ic{width:20px;text-align:center;flex:none;color:var(--muted)}
/* voile, tiroirs */
.veil{position:absolute;inset:0;background:rgba(11,31,58,.38);z-index:20}
.modal{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:640px;max-width:calc(100% - 24px);background:#fff;border-radius:6px;box-shadow:0 12px 40px rgba(11,31,58,.28);z-index:30;display:flex;flex-direction:column}
.drawer{position:absolute;right:0;top:0;bottom:0;width:560px;max-width:100%;background:#fff;border-left:1px solid var(--line-2);box-shadow:-10px 0 30px rgba(11,31,58,.18);z-index:30;display:flex;flex-direction:column}
.mh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:18px;font-weight:500}.mh small{display:block;color:var(--muted)}
.x{margin-left:auto;border:1px solid var(--line-2);background:#fff;width:34px;height:34px;border-radius:4px;font-size:18px}
.mb{padding:18px 20px;overflow:auto;flex:1}
.mf{display:flex;gap:10px;padding:12px 20px;border-top:1px solid var(--line);align-items:center}.grow{flex:1}
.lead{color:var(--muted);margin:0 0 14px}
/* cartes plateformes */
.plats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf{border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px}
.pf .t{display:flex;gap:10px;align-items:center}.pi{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.pf b{font-weight:500;font-size:15px}.pf small{color:var(--muted);font-size:12.5px}
.meta{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.act{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.pf.soon{opacity:.6;background:var(--bg)}.pf.wide{grid-column:1/-1}
.addr{display:flex;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:4px;padding:5px 5px 5px 12px;background:var(--bg)}.addr .mono{flex:1;overflow:hidden;text-overflow:ellipsis}
.qr{width:74px;height:74px;border:1px solid var(--line);border-radius:4px;background:conic-gradient(var(--ink) 25%,#fff 0 50%,var(--ink) 0 75%,#fff 0) 0 0/14px 14px;flex:none}
.tip{background:var(--sig-bg);color:var(--sig-ink);border-radius:6px;padding:9px 12px;font-size:13px;margin-top:14px}
/* état vide */
.empty{text-align:center;padding:36px 20px 30px}
.empty .big{font-size:20px;font-weight:500}.empty p{color:var(--muted);margin:4px auto 18px;max-width:520px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px;margin:0 auto 18px;text-align:left}
.tile{border:1px solid var(--line);border-radius:6px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:3px}
.tile .pi{margin-bottom:4px}.tile b{font-weight:500}.tile small{color:var(--muted);font-size:12.5px}.tile .dl{margin-top:6px;color:var(--sig-ink);font-weight:500;font-size:13px}
.tile.soon{opacity:.6;background:var(--bg)}
/* assistant */
.wiz{position:absolute;inset:0;background:#fff;z-index:20;padding:34px 48px;overflow:auto}
.wiz h1{font-size:30px;font-weight:500;margin:0;text-align:center}.wiz .l2{text-align:center;color:var(--muted);margin:4px 0 22px}
.wgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;max-width:1000px;margin:0 auto}
.tv{border:6px solid #1c2b44;border-radius:8px;background:#0E1E38;height:200px;display:grid;place-items:center;color:#fff;text-align:center}
.tv .pc{display:flex;gap:6px;margin:6px 0}.tv .pc span{background:#fff;color:#0E1E38;width:28px;height:38px;border-radius:4px;display:grid;place-items:center;font-size:22px;font-weight:600}
.seg{display:flex;gap:0;margin:16px 0 10px;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;border:0;border-right:1px solid var(--line-2);background:#fff;padding:9px 6px;font-size:13.5px}.seg button:last-child{border:0}.seg .on{background:var(--ink);color:#fff;font-weight:500}
.where{border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.codeb{display:flex;gap:8px}.codeb i{flex:1;height:56px;border:1px solid var(--line-2);border-radius:4px;display:block}
/* Réglages */
.rg{max-width:820px}.rg h2{margin:0;font-size:20px;font-weight:500}.rg .ph p{color:var(--muted);margin:2px 0 14px}
.rg .box{border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:18px}
.rg .r{display:flex;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.rg .r:first-child{border-top:0}
.rg .r b{font-weight:500}.rg .r small{display:block;color:var(--muted)}
.rg .hl{outline:2px solid var(--signal);outline-offset:-2px;border-radius:6px}
/* Paramètres de l'écran */
.sec{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}.sec:first-child{margin-top:0}
.row2{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row2 b{font-weight:500}.row2 small{display:block;color:var(--muted);font-size:12.5px}
.sw2{width:36px;height:20px;border-radius:10px;background:var(--ok);position:relative;flex:none}.sw2::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.sw2.off{background:var(--line-2)}.sw2.off::after{right:auto;left:2px}
.fld label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{width:100%;height:40px;border:1px solid var(--line-2);border-radius:4px;padding:0 10px;background:#fff}
.hlbox{outline:2px solid var(--signal);outline-offset:3px;border-radius:6px}
/* Connecter un écran, rangé */
.tog{display:flex;gap:6px;margin:0 0 12px;position:relative;z-index:40}
.tog button{border:1px solid #E0B84A;background:#fff;border-radius:4px;padding:3px 12px}.tog .on{background:#6B5200;color:#fff;border-color:#6B5200}
.pair-code{height:60px;border:1px solid var(--line-2);border-radius:4px;display:grid;place-items:center;font-size:28px;letter-spacing:.45em;color:#A9B4C2;font-family:"JetBrains Mono",monospace}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sb{background:var(--bg);border-radius:6px;padding:12px 14px;margin-top:12px}
.sb .row2{border-top:0;padding:0}
.hintl{color:var(--muted);font-size:12.5px;margin:12px 0 0;display:flex;gap:8px}
.scene{display:none;position:relative}.scene.on{display:block}
.legend{max-width:900px;margin:14px auto 40px;padding:0 24px;color:#2A3B52}.legend li{margin:3px 0}
</style>
</head>
<body>
<div class="mock">
  <div class="row" id="scs">
    <button class="sc on" data-s="a1">1 · Menu latéral</button>
    <button class="sc" data-s="a3">3 · Menu Ajouter</button>
    <button class="sc" data-s="a4">4a · Écrans (aucun écran)</button>
    <button class="sc" data-s="a4b">4b · Assistant du premier écran</button>
    <button class="sc" data-s="a5">5 · Réglages</button>
    <button class="sc" data-s="a6">6 · Paramètres de l'écran</button>
    <button class="sc" data-s="dr">Le tiroir (destination)</button>
    <button class="sc" data-s="cp">Connecter un écran (rangé)</button>
  </div>
  <div id="note"></div>
</div>
<div id="root"></div>

<script>
const I={mon:'▭',prog:'☰',cont:'▣',stat:'▨',org:'⚇',gear:'⚙',dl:'⬇'};
const side=(hl)=>`<div class="side"><div class="logo">linkivi<small>Pro · v1.201.0</small></div>
<div class="nav on"><span class="ic">${I.mon}</span>Écrans<span class="chip new">1</span></div>
<div class="nav"><span class="ic">${I.prog}</span>Programmation<span class="cnt">4</span></div>
<div class="nav"><span class="ic">${I.cont}</span>Contenus<span class="cnt">14</span></div>
<div class="nav"><span class="ic">${I.stat}</span>Statistiques</div>
<div class="spacer"></div>
<div class="nav"><span class="ic">${I.org}</span>Organisation<span class="cnt">1</span></div>
<div class="nav"><span class="ic">${I.gear}</span>Réglages</div>
<div class="nav ${hl?'hl':''}"><span class="ic">${I.dl}</span>Installer le player${hl?'<span class="chip v">v1.3.1</span>':''}</div>
<div class="modeb"><span class="ic">≡</span>Mode expert<span class="sw"></span></div>
<div class="me"><div class="av">LU</div><div><b style="font-weight:500">LPR Unil</b><br><small style="color:var(--muted)">ludovicgregory.prieur@unil.ch</small></div></div></div>`;
const screens=`<div class="card"><div class="srow"><div class="thumb"></div><div><b>Salle LPR</b><br><small style="color:var(--muted)"><span class="dot"></span>Affichage en cours</small></div></div>
<div class="srow"><div class="thumb"></div><div><b>Accueil</b><br><small style="color:var(--muted)"><span class="dot"></span>Affichage en cours</small></div></div></div>`;
const head=(menu)=>`<div class="head"><div class="grow"><h1>Vos écrans</h1><p class="sub">Choisissez la liste de lecture et les widgets de chaque écran, puis publiez.</p></div>
<div class="addw"><button class="btn">+ Ajouter ▾</button>${menu?`<div class="menu">
<div class="it"><span class="ic">▭</span><span><b style="font-weight:500">Écran de diffusion</b><small>Avec le code affiché sur l'écran</small></span></div>
<div class="it"><span class="ic">☝</span><span><b style="font-weight:500">Borne interactive</b> <span class="chip new">Nouveau</span><small>Borne à écran tactile</small></span></div><hr>
<div class="it new"><span class="ic" style="color:var(--sig-ink)">⬇</span><span><b style="font-weight:500">Installer le player</b><small>Windows · Android · Navigateur</small></span></div><hr>
<div class="it"><span class="ic">▤</span><span><b style="font-weight:500">Nouveau dossier</b></span></div></div>`:''}</div></div>
<div class="tabsr"><span class="on">Tous</span><span>Écrans de diffusion</span><span>Bornes interactives</span></div>`;
const plat=(w)=>`<div class="plats">
<div class="pf"><div class="t"><div class="pi" style="background:#0078D4">⊞</div><div><b>Windows</b><br><small>PC, mini-PC, lecteur d'écran</small></div></div>
<div class="meta"><span class="chip v">v0.3.1</span><span>Installeur .msi · 51 Mo · Windows 10 / 11</span></div>
<div class="act"><button class="btn sm">⬇ Télécharger l'installeur</button></div></div>
<div class="pf"><div class="t"><div class="pi" style="background:#3DDC84;color:#0B1F3A">A</div><div><b>Android et Android TV</b><br><small>Box, TV, tablette</small></div></div>
<div class="meta"><span class="chip v">v1.3.1</span><span>Fichier .apk · 9 Mo · Android 7+</span></div>
<div class="act"><button class="btn sm">⬇ Télécharger l'APK</button><button class="btn ghost sm">Google Play</button></div></div>
<div class="pf soon"><div class="t"><div class="pi" style="background:#E95420">L</div><div><b>Linux</b> <span class="chip soon">Bientôt</span><br><small>Raspberry Pi, PC Linux</small></div></div>
<div class="meta"><span>Pas encore disponible : utilisez le navigateur en attendant.</span></div></div>
<div class="pf"><div class="t"><div class="pi" style="background:#0B1F3A">◎</div><div><b>Navigateur web</b> <span class="chip ok">Sans installation</span><br><small>Chrome, Edge, Firefox, Safari</small></div></div>
<div class="meta"><span>Hors ligne limité au cache du navigateur</span></div>
<div class="act"><button class="btn ghost sm">Ouvrir le player web ↗</button></div></div>
<div class="pf wide"><b>Adresse du player web</b><small>À saisir dans le navigateur de l'écran (TV connectée, Raspberry, kiosque…).</small>
<div style="display:flex;gap:12px;align-items:center"><div class="addr" style="flex:1"><span class="mono">https://linkivi.duckdns.org/player/</span><button class="btn ghost sm">Copier</button></div><div class="qr"></div></div></div></div>`;
const drawer=()=>`<div class="veil"></div><div class="drawer"><div class="mh"><span style="font-size:20px">⬇</span><div><h3>Installer le player</h3><small>L'application qui affiche vos contenus sur l'écran.</small></div><button class="x">×</button></div>
<div class="mb"><p class="lead">Installez le player sur l'écran : il affiche un code à 6 chiffres. Saisissez-le ensuite dans « Connecter un écran ».</p>${plat()}
<div class="tip">Un écran de test sans rien installer : ouvrez le player web dans un autre onglet.</div></div>
<div class="mf"><span class="grow" style="color:var(--muted);font-size:13px">Adresses tirées de l'adresse publique de votre espace.</span><button class="btn">Connecter un écran</button></div></div>`;
const tiles=`<div class="tiles">
<div class="tile"><div class="pi" style="background:#0078D4">⊞</div><b>Windows</b><small>PC, mini-PC · v0.3.1</small><span class="dl">⬇ Télécharger</span></div>
<div class="tile"><div class="pi" style="background:#3DDC84;color:#0B1F3A">A</div><b>Android / TV</b><small>Box, TV · v1.3.1</small><span class="dl">⬇ Télécharger l'APK</span></div>
<div class="tile"><div class="pi" style="background:#0B1F3A">◎</div><b>Navigateur</b><small>Sans installation</small><span class="dl">Ouvrir ↗</span></div>
<div class="tile soon"><div class="pi" style="background:#E95420">L</div><b>Linux</b><small>Bientôt</small></div></div>`;

const S={};
S.a1=`<div class="app">${side(true)}<div class="main">${head(false)}${screens}</div></div>`;
S.a3=`<div class="app">${side(false)}<div class="main">${head(true)}${screens}</div></div>`;
S.a4=`<div class="app">${side(false)}<div class="main"><div class="head"><div class="grow"><h1>Vos écrans</h1><p class="sub">Choisissez la liste de lecture et les widgets de chaque écran, puis publiez.</p></div><button class="btn">+ Ajouter ▾</button></div>
<div class="card"><div class="empty"><div class="big">Aucun écran connecté</div><p>Installez le player sur l'écran (TV, boîtier, PC) : il affiche un code. Saisissez ce code ici pour relier l'écran à votre organisation.</p>${tiles}<button class="btn">+ Connecter un écran</button></div></div></div></div>`;
S.a4b=`<div class="app">${side(false)}<div class="main"></div><div class="wiz"><h1>Allumez votre écran</h1><p class="l2">Il va vous montrer un code. Recopiez-le ici, c'est tout.</p>
<div class="wgrid"><div><div class="tv"><div><small style="opacity:.7">linkivi</small><div class="pc"><span>4</span><span>8</span><span>1</span><span>2</span><span>9</span><span>3</span></div><small style="opacity:.7">Ce que vous verrez sur l'écran</small></div></div>
<div class="seg"><button>Navigateur / TV connectée</button><button>TV Android</button><button class="on">PC Windows</button></div>
<div class="where"><span>Sur le PC, installez <b>Linkivi pour Windows</b> (v0.3.1, 51 Mo), puis lancez-le. Il démarre ensuite avec le PC.</span>
<div class="act"><button class="btn">⬇ Télécharger pour Windows</button><button class="btn ghost">Autres appareils…</button></div>
<small style="color:var(--muted)">Navigateur : <span class="mono">linkivi.duckdns.org/player</span> <button class="lnk">Copier</button> · QR code dans « Autres appareils ».</small></div></div>
<div><h2 style="margin:0;font-weight:500;font-size:20px">Le code de votre écran</h2><p style="color:var(--muted)">Les 6 chiffres affichés sur l'écran.</p><div class="codeb"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<p style="color:var(--muted);font-size:13px">L'écran se relie dès que le code est complet.</p><p style="font-size:13px">Pas d'écran sous la main ? <button class="lnk">Je le relierai plus tard</button>.</p></div></div></div></div>`;
S.a5=`<div class="app">${side(false)}<div class="main"><h1>Réglages</h1><p class="sub">Votre organisation, ses contenus et ses écrans.</p><div class="rg">
<div class="ph"><h2>Contenus et écrans</h2><p>Valeurs par défaut pour les contenus, les players et les nouveaux écrans.</p></div>
<div class="box"><div class="r"><div class="grow"><b>Démarrage automatique des nouveaux écrans</b><small>Le player démarre avec l'appareil.</small></div><div class="sw2"></div></div>
