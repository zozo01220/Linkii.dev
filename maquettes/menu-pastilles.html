<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Menu latéral actuel avec pastilles</title>
<style>
:root{--bg:#F5F5F7;--ink:#0B1F3A;--text:#1D1D1F;--muted:#6E7684;--line:#E3E6EB;--line-2:#D2D6DD;--brand:#0B1F3A;--signal:#3B82C4;--signal-t:rgba(59,130,196,.13);
  --red:#E5352B;--orange:#F29100;--ok:#1E8E5A;--ok-bg:#E1F0E8;--ok-ink:#155A38;--warn-bg:#FBF0DA;--warn-ink:#7A4E0C;--danger-bg:#FBE4E2;--danger-ink:#8A231C;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI","IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}button{font:inherit;color:inherit;cursor:pointer}
svg{display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mock{position:sticky;top:0;z-index:90;background:#fff;border-bottom:1px dashed var(--line-2);padding:8px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mock b{color:var(--text)}
.sim{border:1px solid var(--line-2);background:#fff;border-radius:99px;padding:4px 12px;font-size:12.5px}.sim:hover{background:#F2F4F8}
.sim.r{border-color:#f3b4af;color:#b3261e}.sim.o{border-color:#f6d19a;color:#9a5a00}
.chk{display:flex;gap:6px;align-items:center;margin-left:auto}
.lv{width:8px;height:8px;border-radius:50%;background:#1E8E5A;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.toast{position:fixed;right:24px;bottom:24px;background:#1D1D1F;color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;z-index:80;opacity:0;transform:translateY(10px);transition:.3s}.toast.on{opacity:1;transform:none}
.app{display:flex;min-height:calc(100vh - 45px)}

/* barre latérale actuelle (charte Nuit), un peu élargie pour les pastilles */
.side{width:264px;flex:none;position:sticky;top:45px;height:calc(100vh - 45px);padding:22px 14px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 24px}
.wm{font-weight:500;letter-spacing:-.03em;font-size:26px;color:var(--ink);line-height:1}.wm i{font-style:normal;color:var(--signal)}
.ver{font-size:11px;color:var(--muted);align-self:flex-end;white-space:nowrap}
.plan-tag{margin-left:auto;align-self:center;font-size:10.5px;font-weight:600;letter-spacing:.04em;border-radius:4px;padding:2px 8px;background:#EDF1F5;color:var(--muted)}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;color:var(--muted);padding:9px 12px;border-radius:4px;font:inherit;font-size:15px;transition:background .12s,color .12s}
.nav svg{width:18px;height:18px}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav.on{background:#E7EAEE;color:var(--ink);font-weight:500;box-shadow:inset 2px 0 0 var(--brand);border-radius:0 4px 4px 0}
.nav-sep{height:1px;background:var(--line);margin:8px 12px}
.sp{flex:1}
.mode-switch{justify-content:space-between;font-size:14px}
.swt{width:34px;height:20px;border-radius:10px;background:var(--brand);position:relative;flex:none}.swt::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.user-btn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;border-radius:4px;padding:8px;background:none;text-align:left;font:inherit}
.user-btn:hover{background:var(--bg)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:500;font-size:13px;flex:none}
.who{flex:1;min-width:0}.who b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-btn svg{width:16px;height:16px;color:var(--muted)}

/* pastilles */
.pl{margin-left:auto;position:relative;min-width:24px;height:20px;padding:0 7px;border-radius:10px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;display:grid;place-items:center;transition:.2s}
.pl.lt{background:#E6E9EF;color:#5A6472}
.pl.red{background:var(--red);color:#fff;box-shadow:0 1px 3px #e5352b66}
.pl.org{background:var(--orange);color:#fff;box-shadow:0 1px 3px #f2910066}
.pl.dot{min-width:10px;width:10px;height:10px;padding:0;margin-right:8px}
.pl .od{position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--orange);border:2px solid #fff}
.bump{animation:bump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(.6)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.pl.red.pulse::after{content:"";position:absolute;inset:-2px;border-radius:12px;border:2px solid var(--red);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.6);opacity:0}}
.mode{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:6px 10px 10px}
.swt{width:34px;height:20px;border-radius:10px;background:#34C759;position:relative}.swt::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004}
.foot{border-top:1px solid var(--line);padding:12px 6px 0;display:flex;align-items:center;gap:10px}
.foot .av{border-radius:50%;width:30px;height:30px;background:linear-gradient(135deg,#3B82C4,#0B1F3A)}.foot small{color:var(--muted);display:block;font-size:11.5px}
.legend{border-top:1px solid var(--line);margin-top:10px;padding:10px 10px 4px;display:grid;gap:5px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}.legend i{width:16px;height:10px;border-radius:5px;display:inline-block}

/* contenu */
main{flex:1;min-width:0;padding:22px 40px 80px;position:relative}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}.crumb{color:var(--muted);font-size:13px}
.cmdk{margin-left:auto;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--muted);min-width:240px;box-shadow:0 1px 2px #0000000a}
kbd{font:inherit;font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fafbfc;margin-left:auto}
.head{display:flex;align-items:flex-end;gap:16px;margin:10px 0 18px;flex-wrap:wrap}
.head h1{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.15}.head p{color:var(--muted);margin-top:2px;max-width:560px}.grow{flex:1}
.btn{font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:var(--brand);color:#fff;display:inline-flex;gap:8px;align-items:center;font-size:13.5px}
.tabs{display:inline-flex;background:#E8EAEE;border-radius:10px;padding:3px;margin-bottom:20px}
.tabs button{border:0;background:none;padding:6px 16px;border-radius:8px;color:var(--muted);font-weight:500}.tabs button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px #0003;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px #0b1f3a0f,0 0 0 1px #0b1f3a0f}
.scene{height:112px;display:grid;place-items:center;position:relative;color:#fff;font-weight:600;text-shadow:0 1px 8px #0005}.scene.off{filter:grayscale(1) brightness(.8)}
.badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;text-shadow:none}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink)}.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}.badge.off{background:var(--danger-bg);color:var(--danger-ink)}.badge.new{background:var(--red);color:#fff}
.cb{padding:11px 16px 13px}.cb b{font-weight:600;font-size:15px}.cb small{display:block;color:var(--muted);font-size:12.5px}
.card.nw{box-shadow:0 0 0 2px var(--red),0 8px 24px #e5352b33;animation:bump .7s cubic-bezier(.3,1.6,.5,1)}
.note{background:#fff;border:1px dashed var(--line-2);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:13px;margin-bottom:18px}


/* contenu : rendu actuel de l'application */
:root{--bg:#F5F7FA}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;font-size:15px}
main{padding:32px 40px 60px}
.head h1{font-size:28px;font-weight:500;letter-spacing:0}
.btn{border-radius:4px;border:1px solid var(--brand);font-weight:500;padding:9px 16px;box-shadow:none}
.tabs{display:flex;gap:24px;background:none;border-radius:0;padding:0;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 0;border-radius:0;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:400}
.tabs button.on{background:none;box-shadow:none;color:var(--ink);font-weight:500;border-bottom-color:var(--signal)}
.card{border-radius:10px;box-shadow:none;border:1px solid var(--line)}
.cmdk{border-radius:4px;box-shadow:none}.badge{border-radius:4px}
.note{border-radius:8px}
</style>
</head>
<body>
<div class="mock"><b>Simuler</b>
<button class="sim r" data-e="share">＋ Nouveau partage (Listes)</button>
<button class="sim r" data-e="screen">＋ Nouvel écran connecté</button>
<button class="sim o" data-e="offline">Écran hors ligne</button>
<button class="sim r" data-e="update">Nouveauté Réglages</button>
<button class="sim" data-e="reset">Tout remettre</button>
<label class="chk"><input type="checkbox" id="live" checked> <span class="lv"></span> Événements en direct (simulés)</label></div>

<div class="app">
<aside class="side" id="side"></aside>
<main id="main"></main>
</div>

<script>
const IC={
 screens:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
 grid:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 plug:'<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v5"/>',team:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6M17 5a3.5 3.5 0 0 1 0 7M22 20c0-2.5-1.5-4.5-4-5.3"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 widg:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',plus:'<path d="M12 5v14M5 12h14"/>',chev:'<path d="M6 9l6 6 6-6"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'
};
const ico=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24">${IC[n]}</svg>`;
const NAV=[
 {g:'Diffuser',items:[['screens','Écrans','#3B82C4'],['list','Listes de lecture','#5E5CE6'],['cal','Planning','#FF9F0A']]},
 {g:'Contenus',items:[['img','Médiathèque','#30B0C7'],['grid','Compositions','#BF5AF2'],['plug','Intégrations','#34C759'],['widg','Widgets','#FF9500']]},
 {g:'Organisation',items:[['team','Membres','#FF6482'],['chart','Statistiques','#64748B'],['gear','Réglages','#8E8E93']]}
];
const base={screens:6,list:8,img:214,grid:12,plug:6,team:5};
const key={screens:'screens',list:'lists',img:'media',grid:'comps',plug:'integ',team:'members'};
let S,page='screens',log=[],bumpId=null,popOpen=false;
function reset(){S={n:{screens:6,list:8,img:214,grid:12,plug:6,team:5},nw:{},off:0,sets:0};log=[];page='screens'}
reset();
const $=s=>document.querySelector(s);
function pill(id){
 if(id==='gear')return S.sets?`<span class="pl red dot pulse ${bumpId===id?'bump':''}" title="Nouveauté dans les réglages"></span>`:'';
 if(!(id in base))return '';
 const n=S.n[id],nw=S.nw[id]||0,off=id==='screens'?S.off:0;
 const cls=nw?'red pulse':off?'org':'lt';
 const t=nw?`${nw} nouveau${nw>1?'x':''}`+(off?` · ${off} hors ligne`:''):off?`${off} écran hors ligne`:`${n} éléments`;
 return `<span class="pl ${cls} ${bumpId===id?'bump':''}" title="${t}">${n}${nw&&off?'<i class="od"></i>':''}</span>`;
}
function side(){
 const row=id=>{const l=LBL[id];return `<button class="nav ${page===id?'on':''}" data-p="${id}">${ico(id,18)}<span>${l}</span>${pill(id)}</button>`};
 const sep='<div class="nav-sep" role="separator"></div>';
 $('#side').innerHTML=`<div class="brand"><span class="wm">link<i>ii</i></span><span class="ver">v1.0.42</span><span class="plan-tag">Enterprise</span></div>
 ${['screens','list','cal'].map(row).join('')}${sep}${['img','grid'].map(row).join('')}${sep}${row('team')}${sep}${['plug','widg'].map(row).join('')}${sep}${['chart','gear'].map(row).join('')}
 <div class="sp"></div>
 <button class="nav mode-switch"><span>Passer en mode simple</span><span class="swt"></span></button>
 <div class="user"><button class="user-btn"><span class="avatar">LP</span><span class="who"><b>Mon organisation</b><small>ludovic.prieur@exemple.ch</small></span><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button></div>`;
 bumpId=null;
}
const LBL={screens:'Écrans',list:'Listes de lecture',cal:'Planning',img:'Médiathèque',grid:'Compositions',team:'Membres',plug:'Intégrations',widg:'Widgets',chart:'Statistiques',gear:'Réglages'};
const unread=()=>log.filter(e=>!e.r).length;
function main(){
 const bell='';
 const t={screens:'Écrans',list:'Listes de lecture',cal:'Planning',img:'Médiathèque',grid:'Compositions',plug:'Intégrations',team:'Membres',chart:'Statistiques',gear:'Réglages'}[page];
 let body='';
 if(page==='screens'){
  const sc=[['101','ok','#B03A8E','Contenus tout personnel'],['MAX','ok','#3B6FA5','Affichage menu midi'],['Accueil RDC','ok','#2F6F5E','Bienvenue'],['Cafétéria',S.off?'off':'ok','#8A5A2B','Restaurant'],['Salle 204','warn','#555F6E',''],['Mur hall','ok','#1F3F73','Bienvenue']];
  const extra=(S.n.screens-6)>0?Array.from({length:S.n.screens-6},(_,i)=>['Nouvel écran '+(i+1),'new','#7C3AED','Première connexion']):[];
  const ST={ok:['En ligne','ok'],off:['Hors ligne','off'],warn:['À configurer','warn'],new:['Nouveau','new']};
  body=`<div class="note">Les pastilles se règlent sur ce que vous avez vu : <b>ouvrir une page éteint son rouge</b>, l'orange reste tant que l'écran est hors ligne.</div><div class="tabs"><button class="on">Mes écrans</button><button>Partagés avec moi</button><button>Toute l'organisation</button></div>
  <div class="grid">${extra.concat(sc).map(s=>`<div class="card ${s[1]==='new'?'nw':''}"><div class="scene ${s[1]==='off'?'off':''}" style="background:linear-gradient(135deg,${s[2]},${s[2]}99)"><span class="badge ${ST[s[1]][1]}"><i></i>${ST[s[1]][0]}</span>${s[3]||'—'}</div><div class="cb"><b>${s[0]}</b><small>${s[3]||'Aucune liste de lecture'}</small></div></div>`).join('')}</div>`;
 }else body=`<div class="note">Page non maquettée ici : seul le menu change. ${page==='list'&&(S.nw.list)?'<b>Un partage vient d\'arriver.</b>':''}</div>`;
 $('#main').innerHTML=`<div class="top"><span class="crumb">Mon organisation  ›  ${t}</span><div class="cmdk">${ico('search')}Rechercher<kbd>Ctrl K</kbd></div>${bell}</div>
 <div class="head"><div class="grow"><h1>${t}</h1><p>Aperçu de la page avec le menu latéral actuel et ses pastilles.</p></div><button class="btn">${ico('plus')} Ajouter</button></div>${body}`;
}
function render(){side();main()}
function ev(k){
 const add=()=>{};
 if(k==='share'){S.n.list++;S.nw.list=(S.nw.list||0)+1;bumpId='list';add('Nouveau partage','« Soirée portes ouvertes » par Martin','list','#5E5CE6')}
 if(k==='screen'){S.n.screens++;S.nw.screens=(S.nw.screens||0)+1;bumpId='screens';add('Nouvel écran connecté','Première connexion de « Nouvel écran '+(S.n.screens-6)+' »','screens','#3B82C4')}
 if(k==='offline'){S.off=S.off?0:1;bumpId='screens';if(S.off)add('Écran hors ligne','« Cafétéria » ne répond plus depuis 10 min','screens','#F29100')}
 if(k==='update'){S.sets=1;bumpId='gear';add('Nouveauté','Un nouveau réglage est disponible : alertes par type','gear','#8E8E93')}
 if(k==='reset')reset();
 render();
}
document.addEventListener('click',e=>{
 const s=e.target.closest('.sim');if(s)return ev(s.dataset.e);
 const it=e.target.closest('.it[data-p]');if(it){page=it.dataset.p;const k=page;if(S.nw[k])S.nw[k]=0;if(k==='gear')S.sets=0;return render()}
});
const SEQ=['share','screen','offline','share','update','offline','screen'];let q=0;
function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
const MSG={share:'Martin vous a partagé une liste',screen:'Un nouvel écran vient de se connecter',offline:"Un écran change d'état",update:'Une nouveauté dans les réglages'};
setInterval(()=>{if(!$('#live').checked)return;const k=SEQ[q++%SEQ.length];ev(k);toast(MSG[k])},4500);
render();
</script>
</body>
</html>
