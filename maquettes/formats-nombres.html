<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Format des nombres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--row:#EDF1F5;--tint:#EBEDF0;--signal:#3B82C4;--sig-bg:#EAF2FA;--sig-ink:#1d4f80;--ok:#1E8E5A;--ok-bg:#E1F0E8;--ok-ink:#155A38;--warn:#B7791F;--warn-bg:#FBF0DC;--bad:#C8372D;--bad-bg:#FBE4E2;--r:4px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:#fff;color:var(--ink);font-size:14px;line-height:1.45;overflow:hidden}
button,select,input{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
/* bandeau de la maquette */
.mock{position:fixed;top:0;left:0;right:0;z-index:100;background:#FFF8E1;border-bottom:1px dashed #E0B84A;padding:7px 16px;font-size:13px;color:#6B5200;display:flex;flex-direction:column;gap:5px}
.mock .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mock .sc{border:1px solid #E0B84A;background:#fff;border-radius:4px;padding:2px 10px;cursor:pointer;font-size:13px}
.mock .sc.on{background:#6B5200;border-color:#6B5200;color:#fff}
.mock .txt{line-height:1.4;max-width:1500px}
.app{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column}
/* barre du haut */
.top{height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);background:#fff}
.tb{height:34px;min-width:34px;border:0;background:none;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--bg)}
.tb svg{width:18px;height:18px;flex:none}
.sep{width:1px;height:26px;background:var(--line);margin:0 6px;flex:none}
.back{background:var(--bg);width:40px;height:40px}
.fmt{border:1px solid var(--line-2);border-radius:4px;padding:5px 10px;font-size:13px;background:#fff;white-space:nowrap}
.btn{font-weight:500;cursor:pointer;border:1px solid var(--ink);border-radius:var(--r);padding:0 16px;background:var(--ink);color:#fff;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;height:36px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;height:32px;flex:none}
.seg button{border:0;border-right:1px solid var(--line-2);background:#fff;padding:0 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff;font-weight:500}
/* corps */
.main{flex:1;display:flex;min-height:0}
.rail{width:78px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 6px;gap:2px;background:#fff}
.rail button{border:0;background:none;border-radius:6px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.rail button svg{width:22px;height:22px}
.rail button.on{background:var(--tint);color:var(--ink);font-weight:500}
.panel{width:372px;flex:none;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.pscroll{flex:1;overflow-y:auto;padding:14px 16px 24px}
.center{flex:1;position:relative;min-width:0;background:#E8ECF1;overflow:hidden}
.frame{position:absolute;box-shadow:0 2px 18px rgba(11,31,58,.16);overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#0E1E38}
.overlay{position:absolute;inset:0;pointer-events:none}
.selbox{position:absolute;border:2px solid var(--signal)}
.selbox .hd{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid var(--signal);margin:-6px 0 0 -6px;border-radius:2px}
.seltag{position:absolute;left:-2px;top:-24px;background:var(--signal);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:3px 3px 3px 0;white-space:nowrap}
.callout{position:absolute;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:6px;white-space:nowrap;pointer-events:none}
.callout::after{content:"";position:absolute;left:18px;bottom:-5px;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
/* barre contextuelle / indice */
.hintbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;border-radius:8px;padding:6px 14px;font-size:13px;color:var(--muted);box-shadow:0 2px 10px rgba(11,31,58,.08);white-space:nowrap;z-index:5}
.ctx{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(11,31,58,.14);display:flex;align-items:center;gap:4px;padding:6px 8px;z-index:5;white-space:nowrap}
.ctx select{border:1px solid var(--line-2);border-radius:4px;padding:4px 6px;background:#fff;height:32px}
.ctx .kind{font-weight:500;padding:0 8px 0 4px}
.ctx .sep{height:22px;margin:0 4px}
.ctx .num{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;height:32px}
.ctx .num button{border:0;background:var(--bg);width:26px;height:32px}.ctx .num span{width:38px;text-align:center}
.ctx .sw{width:32px;height:32px;border:1px solid var(--line-2);border-radius:4px;padding:3px;background:#fff}.ctx .sw i{display:block;width:100%;height:100%;border-radius:2px}
.ctx .muted{color:var(--muted);font-size:12.5px;padding:0 6px}
/* panneau : éléments communs */
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ph h4{margin:0;flex:1;font-size:16px;font-weight:500}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:4px;padding:0 10px;height:36px;color:var(--muted);background:#fff}
.search:focus-within{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.search input{border:0;outline:none;flex:1;min-width:0;color:var(--ink)}
.search .x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px}
.grp{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.grp small{font-weight:400;letter-spacing:0;text-transform:none;margin-left:auto}
.help{color:var(--muted);font-size:12.5px;margin:6px 0 0;line-height:1.45}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--line-2)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:17px;height:17px}
.ibtn{border:0;background:none;width:30px;height:30px;border-radius:4px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;flex:none}
.ibtn:hover{background:var(--bg);color:var(--ink)}
.ibtn svg{width:16px;height:16px}
.crumb{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:13px;display:inline-flex;gap:4px;align-items:center;margin-bottom:10px}
.crumb:hover{color:var(--ink)}
/* scène 1 : cartes de sources */
.src{display:flex;gap:11px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:10px 10px 10px 11px;margin-bottom:8px;cursor:pointer;background:#fff}
.src:hover{border-color:var(--signal)}
.src .t{flex:1;min-width:0}
.src b{font-weight:500;display:flex;gap:7px;align-items:center}
.src b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.src .use{display:inline-block;background:var(--sig-bg);color:var(--sig-ink);border-radius:3px;padding:0 6px;font-size:11.5px;margin-top:5px}
.src .chev{color:var(--muted);font-size:18px}
.src .warnl{color:#7A4F12}
.addsrc{display:flex;gap:8px;margin-top:16px}
/* scène 2 : un jeu */
.sethead{display:flex;gap:11px;align-items:center}
.sethead .t{flex:1;min-width:0}.sethead b{font-weight:500;font-size:15px;display:flex;gap:7px;align-items:center}
.sethead small{color:var(--muted);font-size:12.5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 12px}
.tile{border:1px dashed var(--line-2);border-radius:6px;padding:9px 10px;cursor:grab;background:var(--bg);display:flex;gap:9px;align-items:center;text-align:left}
.tile:hover{border-color:var(--signal);background:var(--sig-bg)}
.tile .g{width:30px;height:30px;border-radius:4px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px}
.tile b{font-weight:500;font-size:13px;display:block;line-height:1.25}.tile small{color:var(--muted);font-size:11.5px;display:block}
.rownav{display:flex;align-items:center;gap:6px;margin:12px 0 4px;font-size:12.5px;color:var(--muted)}
.rownav .pick{flex:1;min-width:0;display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;height:30px;background:#fff}
.rownav .pick button{border:0;background:none;width:28px;height:28px;cursor:pointer;color:var(--ink)}
.rownav .pick button:disabled{color:var(--line-2);cursor:default}
.rownav .pick span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;color:var(--ink);font-size:12.5px}
.rownav .pick em{font-style:normal;color:var(--muted);margin-right:5px}
.fg{border-top:1px solid var(--line);margin:0 -16px}
.fg>.fgh{display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;user-select:none}
.fg>.fgh:hover{background:var(--bg)}
.fg>.fgh .cv{width:14px;color:var(--muted);transition:transform .15s;display:inline-block}
.fg.open>.fgh .cv{transform:rotate(90deg)}
.fg>.fgh b{font-weight:500}.fg>.fgh .path{color:var(--muted);font-weight:400}
.fg>.fgh .n{margin-left:auto;color:var(--muted);font-size:12px;background:var(--row);border-radius:10px;padding:0 7px}
.fg.used>.fgh b{color:var(--sig-ink)}
.fg>.fgb{display:none;padding:0 8px 8px}
.fg.open>.fgb{display:block}
.fr{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:5px;cursor:grab;position:relative}
.fr:hover{background:var(--bg)}
.fr .ty{width:22px;height:22px;border-radius:3px;border:1px solid var(--line);display:grid;place-items:center;font-size:10.5px;color:var(--muted);flex:none;margin-top:1px;background:#fff}
.fr .fx{flex:1;min-width:0}
.fr .fl{font-weight:500;font-size:13.5px;display:flex;gap:6px;align-items:center;line-height:1.3}
.fr .fl .rn{font-weight:400;font-size:10.5px;color:var(--sig-ink);background:var(--sig-bg);border-radius:3px;padding:0 5px}
.fr .fv{font-size:13px;color:#2A3B52;margin-top:2px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.fr .fv.mono{font-size:12px}
.fr .fv .empty{color:var(--muted);font-style:italic}
.fr .fk{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:#8C99AA;margin-top:2px;display:none}
.fr:hover .fk{display:block}
.fr .fa{display:none;gap:2px;position:absolute;right:6px;top:5px;background:var(--bg)}
.fr:hover .fa{display:flex}
.fr.hid{opacity:.55}
.fr .ren{border:1px solid var(--signal);box-shadow:0 0 0 1px var(--signal);border-radius:3px;padding:2px 6px;width:100%;font-weight:500;font-size:13.5px;outline:none}
.fr mark,.tbl mark{background:#FFE9A8;color:inherit;border-radius:2px;padding:0 1px}
.pill{display:inline-block;border-radius:3px;padding:0 6px;font-size:12px;font-weight:500}
.pill.y{background:var(--ok-bg);color:var(--ok-ink)}.pill.n{background:var(--row);color:var(--muted)}
.hidden-link{display:block;margin:12px 0 0;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px;padding:0;text-align:left}
.hidden-link:hover{color:var(--ink)}
.mini{border:0;background:none;color:var(--signal);cursor:pointer;font-weight:500;font-size:12.5px;padding:0;display:inline-flex;gap:5px;align-items:center}
.res-src{display:flex;gap:8px;align-items:center;margin:14px 0 4px;font-size:12.5px;color:var(--muted)}
.res-src b{color:var(--ink);font-weight:500}
.res-row .fv .where{display:block;color:var(--muted);font-size:11.5px}
/* scène 3 : tableau en grand */
.sheet{position:absolute;inset:14px;background:#fff;border-radius:8px;box-shadow:0 10px 40px rgba(11,31,58,.25);z-index:6;display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet .sh b{font-weight:500;font-size:15px}.sheet .sh small{color:var(--muted)}
.sheet .sh .search{width:260px;margin-left:auto}
.tblwrap{flex:1;overflow:auto}
.tbl{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.tbl th,.tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--row);padding:7px 12px;text-align:left;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.tbl thead th{position:sticky;background:#fff;z-index:2}
.tbl thead tr.g th{top:0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--bg);height:30px}
.tbl thead tr.c th{top:30px;font-weight:500;cursor:grab}
.tbl thead tr.c th:hover{background:var(--sig-bg)}
.tbl thead tr.c th small{display:block;font-family:"JetBrains Mono",monospace;font-weight:400;font-size:10.5px;color:#8C99AA}
.tbl .stick{position:sticky;left:0;background:#fff;z-index:1;border-right:1px solid var(--line)}
.tbl thead .stick{z-index:3}
.tbl td.n{color:var(--muted);width:36px;text-align:right}
.tbl tr:hover td{background:#FAFBFC}
.tbl th.used{box-shadow:inset 0 -2px 0 var(--signal)}
/* scènes 5-6 : réglages de la liste */
.lhead{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.lhead .t{flex:1;min-width:0}.lhead b{font-weight:500;display:block}.lhead small{color:var(--muted);font-size:12.5px}
.cc{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:#fff}
.cc.open{border-color:#B9D3EC;box-shadow:0 0 0 1px #B9D3EC}
.cc.off{opacity:.6}
.cch{display:flex;align-items:center;gap:4px;padding:6px 6px 0 4px}
.grip{color:#A9B4C2;cursor:grab;width:18px;text-align:center;flex:none;font-size:13px;letter-spacing:-2px}
.cti{flex:1;min-width:0;border:1px solid transparent;border-radius:4px;padding:4px 7px;font-weight:500;font-size:14px;background:none}
.cti:hover{border-color:var(--line)}
.cti:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 1px var(--signal);background:#fff}
.ccs{display:flex;gap:6px;align-items:center;padding:1px 10px 8px 30px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.ccs .k{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:#8C99AA}
.ccs .tag{font-size:10.5px;border-radius:3px;padding:0 5px}
.tag.ds{background:var(--row);color:var(--muted)}.tag.here{background:#FDEBDC;color:#9A4A0E}
.ccb{border-top:1px solid var(--line);padding:10px 12px 12px 30px;display:grid;gap:11px}
.lbl{font-size:12px;color:var(--muted);margin-bottom:5px;display:block}
.ccb .seg{height:28px}.ccb .seg button{font-size:12px;padding:0 8px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35;cursor:pointer}
.chk input{margin:2px 0 0;accent-color:var(--signal)}
.chk q{quotes:"« " " »";font-family:"JetBrains Mono",monospace;font-size:11.5px;background:var(--row);border-radius:3px;padding:0 4px}
.prev{background:var(--bg);border-radius:4px;padding:7px 9px;font-size:12.5px;line-height:1.4}
.prev s{color:var(--muted)}.prev b{font-weight:500}
.map{display:grid;grid-template-columns:auto 1fr 32px;gap:6px;align-items:center;font-size:13px}
.map input[type=text]{border:1px solid var(--line-2);border-radius:4px;padding:4px 7px;min-width:0}
.map input[type=color]{width:32px;height:28px;border:1px solid var(--line-2);border-radius:4px;padding:2px;background:#fff}
.addcol{width:100%;border:1px dashed var(--line-2);background:none;border-radius:6px;padding:8px;cursor:pointer;color:var(--sig-ink);font-weight:500}
.addcol:hover{border-color:var(--signal);background:var(--sig-bg)}
.opt{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);margin:0 -16px;padding:11px 16px;cursor:pointer}
.opt:hover{background:var(--bg)}
.opt b{font-weight:500;width:84px;flex:none}.opt span{flex:1;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt i{font-style:normal;color:var(--muted)}
.opt:last-child{border-bottom:1px solid var(--line)}
.suggest{display:flex;gap:10px;align-items:flex-start;background:var(--sig-bg);color:var(--sig-ink);border-radius:6px;padding:9px 11px;font-size:12.5px;margin:10px 0 4px;line-height:1.4}
.suggest button{margin-left:auto;flex:none}
/* v2 : nom de liste, filtre, listes sur la page */
.lname{width:100%;border:1px solid var(--line-2);border-radius:4px;height:38px;padding:0 10px;font-weight:500;font-size:15px}
.lname:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.sel{border:1px solid var(--line-2);border-radius:4px;height:32px;padding:0 6px;background:#fff;min-width:0;font-size:13px}
.fil{display:grid;grid-template-columns:1fr 92px 1fr 30px;gap:6px;align-items:center}
.cnt{font-size:11.5px;color:var(--ok-ink);background:var(--ok-bg);border-radius:3px;padding:0 6px;font-weight:500;letter-spacing:0;text-transform:none}
.lst{display:flex;gap:10px;align-items:center;padding:8px;border-radius:5px;cursor:pointer}
.lst:hover{background:var(--bg)}
.lst .g{width:28px;height:28px;border-radius:4px;background:var(--sig-bg);color:var(--sig-ink);display:grid;place-items:center;flex:none}
.lst b{font-weight:500;display:block}.lst small{color:var(--muted);font-size:12px}
.lst .chev{margin-left:auto;color:var(--muted)}
.dup{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:4px;height:34px;cursor:pointer;font-weight:500;margin-top:16px}
.dup:hover{border-color:var(--signal)}
.ctx .cb{height:32px;border:1px solid transparent;background:none;border-radius:4px;padding:0 9px;cursor:pointer;white-space:nowrap}
.ctx .cb:hover,.ctx .cb.open{background:var(--bg)}
.ctx .cb.on{background:var(--sig-bg);border-color:#B9D3EC;color:var(--sig-ink);font-weight:500}
.pop{position:absolute;background:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(11,31,58,.22);padding:10px 14px 12px;z-index:8;font-size:13px}
.pop .pt{font-size:12px;color:var(--muted);margin:0 0 6px}
.pop .seg{height:28px}.pop .seg button{font-size:12px;padding:0 8px}
.prow{display:grid;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--row)}
.prow.c4{grid-template-columns:120px auto auto auto}.prow.c2{grid-template-columns:150px auto}
.prow b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow input[type=color]{width:32px;height:28px;border:1px solid var(--line-2);border-radius:4px;padding:2px;background:#fff}
/* canvas : cellule de titre modifiable */
.stage [data-h]{cursor:text}
.stage [data-h][contenteditable=true]{outline:3px solid #3B82C4;outline-offset:4px;border-radius:4px;color:#fff}
/* ===== v5 : panneau = résumé · tiroir = formulaire · fenêtre = choix des champs ===== */
.btn.wide{width:100%;justify-content:center}
.btn[disabled]{opacity:.4;cursor:default}
.lnk{border:0;background:none;color:var(--sig-ink);cursor:pointer;font-size:13px;padding:0}
.lnk:hover{text-decoration:underline}
.lnk.danger{color:var(--bad)}
.cnt{font-size:11.5px;color:var(--ok-ink);background:var(--ok-bg);border-radius:3px;padding:0 6px;font-weight:500;letter-spacing:0;text-transform:none}
.sel{border:1px solid var(--line-2);border-radius:4px;height:34px;padding:0 6px;background:#fff;min-width:0;font-size:13.5px}
.inp{width:100%;border:1px solid var(--line-2);border-radius:4px;height:38px;padding:0 10px;font-size:14px;background:#fff}
.inp:focus,.sel:focus,.cti:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.grip{color:#A9B4C2;cursor:grab;width:18px;text-align:center;flex:none;font-size:13px;letter-spacing:-2px;user-select:none}

/* --- panneau de gauche : un résumé, aucun formulaire --- */
.lcard{border:1px solid var(--line);border-radius:4px;background:#fff;margin-top:4px}
.lch{display:flex;gap:10px;align-items:center;padding:12px 12px 10px}
.lch .g{width:34px;height:34px;border-radius:4px;background:var(--sig-bg);color:var(--sig-ink);display:grid;place-items:center;flex:none;font-size:16px}
.lch small{display:block;color:var(--muted);font-size:12px}.lch b{font-weight:500;font-size:15px}
.lsrc{padding:0 12px 10px;color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center}
.lsrc b{color:var(--ink);font-weight:500}
.srow{display:grid;grid-template-columns:74px 1fr 14px;gap:8px;align-items:start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 12px;cursor:pointer}
.srow:hover{background:var(--bg)}
.srow .k{font-weight:500}
.srow .v{color:#2A3B52;font-size:13px;line-height:1.4}
.srow .v small{display:block;color:var(--muted);font-size:12px}
.srow .chev{color:var(--muted);font-size:17px;line-height:1}
.olst{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:4px;background:#fff;padding:8px 10px;cursor:pointer;margin-bottom:6px}
.olst:hover{border-color:var(--signal)}
.olst .g{width:26px;height:26px;border-radius:4px;background:var(--row);display:grid;place-items:center;flex:none;font-size:13px}
.olst b{font-weight:500;display:block}.olst small{color:var(--muted);font-size:12px}
.olst .chev{margin-left:auto;color:var(--muted)}
.tchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.tchip{background:var(--sig-bg);color:var(--sig-ink);border-radius:3px;padding:1px 8px;font-size:12.5px}

/* --- page : en-têtes cliquables, + --- */
.overlay .colhot{position:absolute;pointer-events:auto;cursor:pointer;border-radius:3px}
.overlay .colhot:hover,.overlay .colhot.on{background:rgba(59,130,196,.25);outline:1.5px solid var(--signal)}
.overlay .addhot{position:absolute;pointer-events:auto;width:28px;height:28px;border-radius:4px;background:#fff;color:var(--ink);border:1px solid var(--line-2);display:grid;place-items:center;font-size:18px;line-height:1;cursor:pointer}
.overlay .addhot:hover{border-color:var(--signal);color:var(--signal)}

/* --- tiroirs (gabarit des tiroirs de l'app) --- */
.veil{position:absolute;inset:56px 0 0 0;z-index:40;pointer-events:none}
.dr{position:absolute;top:56px;right:0;bottom:0;z-index:41;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(11,31,58,.12);display:flex;flex-direction:column;animation:drin .2s ease-out}
.dr.sub{z-index:43;box-shadow:-10px 0 30px rgba(11,31,58,.2)}
.dr-dim{position:absolute;inset:0;background:rgba(11,31,58,.18);z-index:42;cursor:pointer}
@keyframes drin{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drh{padding:16px 20px 0;border-bottom:1px solid var(--line)}
.drh .top1{display:flex;gap:12px;align-items:center}
.drh .g{width:38px;height:38px;border-radius:4px;background:var(--sig-bg);color:var(--sig-ink);display:grid;place-items:center;flex:none;font-size:18px}
.drh .nm{flex:1;min-width:0}
.drh .nm small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.drname{border:1px solid transparent;border-radius:4px;padding:2px 6px;margin-left:-7px;font-size:18px;font-weight:500;width:100%;background:none}
.drname:hover{border-color:var(--line)}
.drname:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 1px var(--signal);background:#fff}
.drh .src{color:var(--muted);font-size:13px;white-space:nowrap}
.drh .src b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:4px;margin-top:12px}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px;display:flex;gap:7px;align-items:center}
.tabs button.on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.tabs .n{font-size:11.5px;background:var(--row);color:var(--muted);border-radius:3px;padding:0 6px;font-weight:500}
.drb{flex:1;overflow:auto;padding:18px 20px 24px}
.drf{display:flex;gap:10px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);background:var(--bg)}
.drf .note{flex:1;color:var(--muted);font-size:12.5px;line-height:1.35}
.lead{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.45}
.lbl{display:block;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.lbl:first-child{margin-top:0}
.lbl .cnt{margin-left:6px}

/* onglet Colonnes : un tableau-formulaire */
.ctab{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ctr{display:grid;grid-template-columns:24px minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr) 108px;gap:10px;align-items:center;padding:8px 10px 8px 4px;border-top:1px solid var(--line);background:#fff}
.ctr:first-child{border-top:0}
.ctr.hd{background:var(--bg);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;padding-top:7px;padding-bottom:7px}
.ctr.over{box-shadow:inset 0 2px 0 var(--signal)}
.ctr.drag{opacity:.4}
.ctr.fresh{animation:fresh 1.8s ease-out}
.ctr.cur{background:var(--sig-bg)}
@keyframes fresh{0%{background:#D3E6F7}100%{background:#fff}}
.cti{width:100%;border:1px solid var(--line-2);border-radius:4px;height:34px;padding:0 8px;font-weight:500;font-size:14px;background:#fff}
.fld b{font-weight:400;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exv{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exv small{display:block;color:var(--muted);font-size:11.5px}
.ctr .act{display:flex;gap:2px;justify-content:flex-end}
.ibtn{border:0;background:none;width:30px;height:30px;border-radius:4px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;flex:none;font-size:16px}
.ibtn:hover{background:var(--bg);color:var(--ink)}
.addrow{width:100%;margin-top:10px;border:1px dashed var(--line-2);background:#fff;border-radius:4px;height:40px;cursor:pointer;color:var(--sig-ink);font-weight:500}
.addrow:hover{border-color:var(--signal);background:var(--sig-bg)}

/* tiroir d'une colonne */
.subh{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.subh .sback{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0}
.subh .sback:hover{color:var(--ink)}
.subh h3{margin:2px 0 0;font-size:17px;font-weight:500}
.fcard{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:9px 10px;background:#fff}
.fcard .ty{width:26px;height:26px;border-radius:4px;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none}
.fcard .t{flex:1;min-width:0}.fcard b{font-weight:500;display:block}.fcard small{color:#8C99AA;font-size:11.5px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.4;cursor:pointer;padding:5px 0}
.chk input{margin:3px 0 0;accent-color:var(--signal)}
.chk q{quotes:"« " " »";font-family:"JetBrains Mono",monospace;font-size:12px;background:var(--row);border-radius:3px;padding:0 4px}
.rtab{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;border:1px solid var(--line)}
.rtab th{background:var(--bg);text-align:left;font-weight:500;color:var(--muted);padding:6px 8px;font-size:11.5px}
.rtab td{padding:6px 8px;border-top:1px solid var(--line);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtab td.in{color:var(--muted)}
.rtab td.out{font-weight:500}
.opts{display:grid;gap:6px}
.opt2{display:flex;gap:10px;align-items:center;border:1px solid var(--line-2);border-radius:4px;padding:9px 11px;cursor:pointer;background:#fff;text-align:left;width:100%}
.opt2 .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
.opt2.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.opt2.on .rd{border:5px solid var(--signal)}
.opt2 b{font-weight:500;flex:1}.opt2 span{color:var(--muted);font-size:13px}
.yn{display:grid;grid-template-columns:62px 18px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.subf{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line);background:var(--bg)}

/* onglet Lignes */
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:22px}
.radio{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line-2);border-radius:4px;margin-bottom:6px;cursor:pointer;background:#fff;font-size:13.5px}
.radio input{margin:2px 0 0;accent-color:var(--signal)}
.radio.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.radio small{color:var(--muted);margin-left:4px}
.conds{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:10px;margin:2px 0 0 26px}
.cond{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr) 30px;gap:6px;align-items:center;margin-bottom:6px}
.cond .and{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin:-2px 0 2px 2px}
.rprev{border:1px solid var(--line);border-radius:4px;background:#fff;align-self:start;position:sticky;top:0}
.rprev .rh{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;display:flex;align-items:center;gap:6px}
.rprev .rh b{font-weight:500}
.rr{display:flex;gap:8px;align-items:center;padding:7px 12px;font-size:12.5px;border-top:1px solid var(--row)}
.rr:first-of-type{border-top:0}
.rr .n{width:18px;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:11.5px;flex:none}
.rr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .ty{color:var(--muted);font-size:11.5px}
.rr.out{opacity:.4}.rr.out .t{text-decoration:line-through}
.rsep{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px;border-top:1px solid var(--line);background:var(--bg)}
.dirseg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden;height:34px;flex:none}
.dirseg button{border:0;border-right:1px solid var(--line-2);background:#fff;padding:0 10px;cursor:pointer;font-size:13px}
.dirseg button:last-child{border-right:0}
.dirseg button.on{background:var(--ink);color:#fff}
.dirseg[aria-disabled=true]{opacity:.4;pointer-events:none}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px 26px;font-size:12.5px;color:var(--muted);align-items:center}
.qchip{border:1px solid var(--line-2);background:#fff;border-radius:3px;padding:2px 9px;cursor:pointer;font-size:12.5px;color:var(--ink)}
.qchip:hover{border-color:var(--signal)}
.qchip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* --- fenêtre « choisir des champs » --- */
.mback{position:absolute;inset:0;background:rgba(11,31,58,.45);z-index:60;display:grid;place-items:center}
.mdl{background:#fff;border-radius:4px;display:flex;flex-direction:column;max-height:88%;height:640px;box-shadow:0 20px 60px rgba(11,31,58,.35);overflow:hidden}
.mh{padding:18px 22px 12px}
.mh b{font-size:18px;font-weight:500;display:block}.mh small{color:var(--muted);font-size:13px}
.mtools{display:flex;gap:10px;align-items:center;padding:0 22px 12px;border-bottom:1px solid var(--line)}
.mtools .search{flex:1;height:38px}
.mtools .ex{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.mtools .ex .pick{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;height:30px}
.mtools .ex .pick button{border:0;background:none;width:26px;height:28px;cursor:pointer}
.mtools .ex .pick button:disabled{color:var(--line-2);cursor:default}
.mtools .ex .pick span{padding:0 4px;color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:12px}
.mlist{flex:1;overflow:auto;padding:4px 10px 10px}
.mg{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:14px 12px 4px}
.mr{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,.9fr);gap:12px;align-items:center;padding:7px 12px;border-radius:4px;cursor:pointer}
.mr:hover{background:var(--bg)}
.mr.on{background:var(--sig-bg)}
.mr.used{cursor:default;opacity:.55}.mr.used:hover{background:none}
.mr .bx{width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:3px;display:grid;place-items:center;font-size:12px;color:#fff;background:#fff}
.mr .bx.rd{border-radius:50%}
.mr.on .bx{background:var(--signal);border-color:var(--signal)}
.mr.on .bx.rd{background:#fff;border:5px solid var(--signal)}
.mr .nm b{font-weight:500;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr .nm small{color:#8C99AA;font-size:11px;font-family:"JetBrains Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mr .vl{font-size:12.5px;color:#2A3B52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr .vl em{font-style:normal;color:var(--muted);font-size:11.5px}
.mr mark{background:#FFE9A8;border-radius:2px;color:inherit}
.mf{display:flex;gap:10px;align-items:center;padding:12px 22px;border-top:1px solid var(--line);background:var(--bg)}
.mf .note{flex:1;color:var(--muted);font-size:12.5px}
/* ===== format des nombres ===== */
.stage .bk{position:absolute;background:rgba(255,255,255,.93);border:6px solid #D8DEE6;border-radius:6px;color:#0B1F3A;font-family:"Montserrat","IBM Plex Sans",sans-serif;overflow:hidden}
.nfmt-pre{display:flex;gap:6px;flex-wrap:wrap}
.pre{border:1px solid var(--line-2);background:#fff;border-radius:4px;padding:7px 11px;cursor:pointer;font-size:13px;text-align:left;line-height:1.25}
.pre small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.pre:hover{border-color:var(--signal)}
.pre.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal);background:var(--sig-bg)}
.ex-box{border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:10px 12px;margin-top:16px}
.ex-box .t{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin-bottom:6px}
.ex-box .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0}
.ex-box .r s{color:var(--muted);text-decoration:none;font-size:12.5px}
.ex-box .r b{font-weight:500;font-variant-numeric:tabular-nums}
.sw{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:4px;background:#fff;cursor:pointer;width:100%;text-align:left;font-size:14px}
.sw .tg{width:34px;height:20px;border-radius:10px;background:var(--line-2);position:relative;flex:none;transition:.15s}
.sw .tg::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on .tg{background:var(--signal)}.sw.on .tg::after{left:16px}
.sw small{color:var(--muted);display:block;font-size:12px}
.sw b{font-weight:500}
.hintline{color:var(--muted);font-size:12.5px;margin:6px 0 0;line-height:1.4}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;border:1px solid var(--line)}
.cmp th{background:var(--bg);text-align:left;font-weight:500;color:var(--muted);padding:6px 10px;font-size:11.5px}
.cmp td{padding:6px 10px;border-top:1px solid var(--line)}
.cmp td.b{color:var(--muted);text-decoration:line-through}
.cmp td.n{font-weight:500}
.chipf{display:inline-flex;align-items:center;gap:6px;background:var(--sig-bg);color:var(--sig-ink);border:1px solid transparent;border-radius:3px;padding:2px 4px 2px 9px;font-size:12.5px;cursor:pointer}
.chipf:hover{border-color:var(--signal)}
.chipf .f{background:#fff;color:var(--ink);border-radius:2px;padding:0 6px;font-size:11.5px;font-variant-numeric:tabular-nums}
.chipf.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.callout2{position:absolute;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:4px;white-space:nowrap;z-index:5}
</style>
</head>
<body>
<div class="mock" id="mock">

  <div class="main">
    <nav class="rail">
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg>Modèles</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>Médias</button>

      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3l5 8H3z"/><rect x="13" y="13" width="8" height="8"/><circle cx="7" cy="17" r="4"/></svg>Éléments</button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Widgets</button>
      <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Données</button>
    </nav>
    <aside class="panel"><div class="pscroll" id="panel"></div></aside>
    <section class="center" id="center">
      <div id="bar"></div>
      <div class="frame" id="frame"><div class="stage" id="stage"></div><div class="overlay" id="ov"></div></div>
    </section>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CURS = { '': '', CHF: 'CHF', EUR: '€', USD: '$' };

/* ---- les données (résultat de la requête : une ligne par établissement, puis une ligne de totaux) ---- */
const SHOPS = [['UNIL Artigus Anthropôle', 11851.9], ['UNIL Artigus Cabanane', 5585.4], ['UNIL Artigus Internef', 4771.8], ['UNIL 101 Restos La Grange', 3349.2], ['UNIL 101 Restos Batochim', 991.4]];
const NB = 5228, PANIER = 16.9097;

/* ---- le format : { dec: 'auto' | 0..3, th: true|false, cur: ''|CHF|EUR|USD, pos: 'after'|'before' } ---- */
const PRESETS = [
  ['nb', 'Nombre', '5’228', { dec: 'auto', th: true, cur: '', pos: 'after' }],
  ['int', 'Entier', '5’228', { dec: 0, th: true, cur: '', pos: 'after' }],
  ['chf', 'Montant CHF', '16,90 CHF', { dec: 2, th: true, cur: 'CHF', pos: 'after' }],
  ['eur', 'Montant €', '16,90 €', { dec: 2, th: true, cur: 'EUR', pos: 'after' }],
  ['usd', 'Montant $', '16,90 $', { dec: 2, th: true, cur: 'USD', pos: 'after' }]
];
let F = { ca: { dec: 'auto', th: true, cur: '', pos: 'after' }, nb: { dec: 'auto', th: true, cur: '', pos: 'after' }, panier: { dec: 'auto', th: true, cur: '', pos: 'after' } };
const AUTO = true;   // vrai : la colonne garde le même nombre de décimales pour toutes ses lignes (jusqu'à 2)
function fmtN(v, f, colMax) {
  let d = f.dec;
  if (d === 'auto') d = colMax != null ? colMax : (Number.isInteger(v) ? 0 : 2);
  let s = Math.abs(v).toFixed(d), [i, dec] = s.split('.');
  if (f.th) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '’');
  s = (v < 0 ? '-' : '') + i + (dec ? ',' + dec : '');
  const c = CURS[f.cur];
  return c ? (f.pos === 'before' ? c + ' ' + s : s + ' ' + c) : s;
}
const colMax = (vals, f) => f.dec === 'auto' ? (vals.every(Number.isInteger) ? 0 : 2) : null;   // une colonne avec au moins une valeur décimale : 2 décimales partout
const AVANT = { ca: SHOPS.map(s => String(s[1]).replace('.', ',')), nb: '5228', panier: '16,9097' };

/* ---- la page ---- */
let scene = 1, sel = null, drawer = null, S = 1;
function stageHtml() {
  const mx = colMax(SHOPS.map(s => s[1]), F.ca);
  let h = `<div class="bk" style="left:30px;top:20px;width:1200px;height:910px;padding:30px 36px"><div style="font:500 76px/1.1 Montserrat">CA du jour par établissement</div>
    <div style="display:flex;justify-content:space-between;margin-top:46px;color:#5A6B80;font:600 28px 'IBM Plex Sans';letter-spacing:.12em;border-bottom:2px solid #D8DEE6;padding-bottom:12px"><span>ÉTABLISSEMENT</span><span>CHIFFRE D'AFFAIRES</span></div>` +
    SHOPS.map(s => `<div style="display:flex;justify-content:space-between;align-items:center;height:128px;border-bottom:1px solid #E1E7EE;font:600 52px 'IBM Plex Sans'"><span>${esc(s[0])}</span><span style="background:#3B82C4;color:#fff;border-radius:8px;padding:2px 22px;font-size:46px;font-variant-numeric:tabular-nums">${esc(fmtN(s[1], F.ca, mx))}</span></div>`).join('') + '</div>';
  h += `<div class="bk" style="left:1290px;top:20px;width:600px;height:430px;padding:26px 30px"><div style="font:500 52px/1.1 Montserrat">Nb transactions jour</div><div style="font:700 150px/1 Montserrat;margin-top:78px;text-align:center;font-variant-numeric:tabular-nums">${esc(fmtN(NB, F.nb))}</div></div>`;
  h += `<div class="bk" style="left:1290px;top:500px;width:600px;height:430px;padding:26px 30px"><div style="font:500 52px/1.1 Montserrat">Panier moyen</div><div style="font:700 150px/1 Montserrat;margin-top:78px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap" id="pm">${esc(fmtN(PANIER, F.panier))}</div></div>`;
  return h;
}
const BOX = { list: [30, 20, 1200, 910], nb: [1290, 20, 600, 430], panier: [1290, 500, 600, 430] };
function overlay() {
  let h = '';
  if (sel) {
    const [x, y, w, hh] = BOX[sel], s = S;
    h = `<div class="selbox" style="left:${x * s - 3}px;top:${y * s - 3}px;width:${w * s + 6}px;height:${hh * s + 6}px">${[[0, 0], [50, 0], [100, 0], [0, 50], [100, 50], [0, 100], [50, 100], [100, 100]].map(([a, b]) => `<i class="hd" style="left:${a}%;top:${b}%"></i>`).join('')}<span class="seltag">${sel === 'list' ? '▦ CA du jour' : 'T Texte'}</span></div>`;
  }
  $('#ov').innerHTML = h;
}
function layout() {
  const c = $('#center'), fr = $('#frame'), dr = drawer ? DW : 0, top = drawer ? 24 : 64, avail = c.clientWidth - dr;
  const w = avail - 48, h = c.clientHeight - top - 30;
  S = Math.min(w / 1920, h / 1080);
  fr.style.width = 1920 * S + 'px'; fr.style.height = 1080 * S + 'px';
  fr.style.left = (avail - 1920 * S) / 2 + 'px'; fr.style.top = (drawer ? top : top + (h - 1080 * S) / 2) + 'px';
  $('#stage').style.transform = `scale(${S})`; $('#stage').style.background = '#0E1E38';
  $('#bar').style.display = drawer ? 'none' : '';
}
let DW = 560;
function drawStage() { $('#stage').innerHTML = stageHtml(); overlay(); }

/* ---- panneau de gauche ---- */
const sample = k => k === 'ca' ? fmtN(11851.9, F.ca, colMax(SHOPS.map(s => s[1]), F.ca)) : k === 'nb' ? fmtN(NB, F.nb) : fmtN(PANIER, F.panier);
function panel() {
  if (sel === 'list') return `<div class="ph"><h4>Données</h4></div><div class="lcard"><div class="lch"><span class="g">▦</span><div><small>Liste sélectionnée</small><b>CA du jour</b></div></div>
    <div class="lsrc">Source : <b>Ventes UNIL (base)</b></div>
    <button class="srow" data-open="cols"><span class="k">Colonnes</span><span class="v">Établissement · Chiffre d'affaires<small>2 colonnes · CA en CHF</small></span><span class="chev">›</span></button>
    <button class="srow"><span class="k">Lignes</span><span class="v">Toutes les lignes<small>5 sur 5 · par CA ↓</small></span><span class="chev">›</span></button></div>
    <button class="btn ghost wide" style="margin-top:10px">+ Ajouter des colonnes</button>`;
  if (sel === 'nb' || sel === 'panier') {
    const k = sel, name = k === 'nb' ? 'Transactions' : 'Panier moyen', txt = k === 'nb' ? 'Nb transactions jour' : 'Panier moyen';
    return `<div class="ph"><h4>Données</h4></div><div class="lcard"><div class="lch"><span class="g">T</span><div><small>Texte sélectionné</small><b>${esc(sample(k))}</b></div></div>
      <div class="srow" style="cursor:default"><span class="k">Champs</span><span class="v"><span class="chipf${drawer === 'field' ? ' on' : ''}" data-chip="${k}" title="Régler le format de ce champ">${esc(name)}<span class="f">${esc(sample(k))}</span><span>⚙</span></span><small>Cliquez le champ pour régler son format</small></span><span></span></div></div>
      <button class="btn ghost wide" style="margin-top:10px">+ Insérer un champ…</button>`;
  }
  return `<div class="ph"><h4>Données</h4></div><p class="help" style="margin:0">Sélectionnez une liste ou un texte pour voir ses données.</p>`;
}

/* ---- le bloc « Format du nombre » (le même dans la colonne et dans le champ) ---- */
function fmtBlock(k) {
  const f = F[k], same = p => p[0] !== '' && JSON.stringify(p[3]) === JSON.stringify(f);
  const pre = PRESETS.map(p => `<button class="pre${same(p) ? ' on' : ''}" data-pre="${k}:${p[0]}">${p[1]}<small>${esc(p[2])}</small></button>`).join('');
  const seg = (name, list, v) => `<span class="dirseg">${list.map(([a, b]) => `<button data-nf="${k}:${name}:${a}" class="${String(a) === String(v) ? 'on' : ''}">${b}</button>`).join('')}</span>`;
  const ex = k === 'ca' ? [['11851.9', 11851.9], ['991.4', 991.4]] : k === 'nb' ? [['5228', NB], ['12', 12]] : [['16.9097', PANIER], ['1250', 1250]];
  const mx = k === 'ca' ? colMax(SHOPS.map(s => s[1]), f) : null;
  return `<span class="lbl">Format du nombre</span><div class="nfmt-pre">${pre}</div>
    <span class="lbl">Décimales</span>${seg('dec', [['auto', 'Automatique'], [0, '0'], [1, '1'], [2, '2'], [3, '3']], f.dec)}
    <p class="hintline">${f.dec === 'auto' ? (k === 'ca' ? 'Automatique : toute la colonne a le même nombre de décimales (jusqu\'à 2), pour que les montants restent alignés.' : 'Automatique : aucune décimale pour un nombre entier, 2 sinon.') : 'Toujours ' + f.dec + ' décimale' + (f.dec > 1 ? 's' : '') + ' (arrondi).'}</p>
    <span class="lbl">Milliers</span><button class="sw${f.th ? ' on' : ''}" data-th="${k}"><span class="tg"></span><span><b>Séparer les milliers</b><small>15000 s'écrit 15’000</small></span></button>
    <span class="lbl">Monnaie</span>${seg('cur', [['', 'Aucune'], ['CHF', 'CHF'], ['EUR', 'Euro €'], ['USD', 'Dollar $']], f.cur)}
    ${f.cur ? `<div style="margin-top:8px"><span class="hintline" style="margin:0 8px 0 0">Symbole</span>${seg('pos', [['after', 'Après : 16,90 CHF'], ['before', 'Avant : CHF 16,90']], f.pos)}</div>` : ''}
    <div class="ex-box"><div class="t">Exemples</div>${ex.map(([raw, v]) => `<div class="r"><s>reçu : ${raw}</s><b>${esc(fmtN(v, f, mx))}</b></div>`).join('')}</div>`;
}

/* ---- tiroirs ---- */
function drawDrawer() {
  const box = $('#drbox'); if (!drawer) { box.innerHTML = ''; return; }
  const col = drawer === 'col', k = col ? 'ca' : sel, name = col ? 'Chiffre d\'affaires' : k === 'nb' ? 'Transactions' : 'Panier moyen';
  let h;
  if (col) {
    h = `<div class="dr" style="width:${DW}px"><div class="drh"><div class="top1"><span class="g">▦</span><div class="nm"><small>Modifier la liste</small><input class="drname" value="CA du jour"></div><span class="src">Source : <b>Ventes UNIL (base)</b></span></div>
        <div class="tabs"><button class="on">Colonnes <span class="n">2</span></button><button>Lignes <span class="n">5 sur 5</span></button></div></div>
      <div class="drb"><p class="lead">Une ligne par colonne, dans l'ordre de l'écran.</p><div class="ctab"><div class="ctr hd" style="grid-template-columns:24px minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr) 108px"><span></span><span>Titre sur l'écran</span><span>Champ de la source</span><span>Exemple sur l'écran</span><span></span></div>
        <div class="ctr" style="grid-template-columns:24px minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr) 108px"><span class="grip">⋮⋮</span><input class="cti" value="Établissement"><div class="fld"><b>Shop</b><small>texte</small></div><div class="exv"><span>UNIL Artigus Anthropôle</span><small>valeur reçue</small></div><div class="act"><button class="btn ghost sm">Régler</button><button class="ibtn">×</button></div></div>
        <div class="ctr cur" style="grid-template-columns:24px minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr) 108px"><span class="grip">⋮⋮</span><input class="cti" value="Chiffre d'affaires"><div class="fld"><b>CA</b><small>nombre</small></div><div class="exv"><span>${esc(sample('ca'))}</span><small>${esc(fmtDesc(F.ca))}</small></div><div class="act"><button class="btn ghost sm" data-sub="1">Régler</button><button class="ibtn">×</button></div></div></div></div>
      <div class="drf"><button class="btn ghost" data-x="0">Annuler</button><span class="note">La page montre déjà le résultat. Rien n'est gardé avant « Appliquer ».</span><button class="btn" data-x="1">Appliquer</button></div>
      ${subOpen ? '<div class="dr-dim" data-x="sub"></div>' : ''}</div>`;
    if (subOpen) h += `<div class="dr sub" style="width:${Math.min(460, DW - 90)}px"><div class="subh"><div style="flex:1"><button class="sback" data-x="sub">‹ Colonnes de « CA du jour »</button><h3>Colonne « Chiffre d'affaires »</h3></div></div>
      <div class="drb"><span class="lbl">Titre sur l'écran</span><input class="inp" value="Chiffre d'affaires"><span class="lbl">Champ de la source</span><div class="fcard"><span class="ty">12</span><div class="t"><b>CA</b><small class="mono">CA</small></div><button class="btn ghost sm">Changer…</button></div>${fmtBlock('ca')}
        <span class="lbl">Alignement</span><span class="dirseg"><button>Gauche</button><button>Centre</button><button class="on">Droite</button></span></div>
      <div class="subf"><button class="lnk danger">Retirer la colonne</button><span style="flex:1"></span><button class="btn" data-x="sub">OK</button></div></div>`;
  } else {
    h = `<div class="dr" style="width:${Math.min(DW, 500)}px"><div class="subh"><div style="flex:1"><button class="sback" data-x="1">‹ Retour au texte</button><h3>Format du champ « ${name} »</h3></div></div>
      <div class="drb"><div class="fcard"><span class="ty">12</span><div class="t"><b>${name}</b><small class="mono">${k === 'nb' ? 'Transactions' : 'PanierMoyen'}</small></div></div>${fmtBlock(k)}</div>
      <div class="subf"><span class="note" style="flex:1;color:var(--muted);font-size:12.5px">Ce format ne change que ce champ, dans ce texte.</span><button class="btn" data-x="1">OK</button></div></div>`;
  }
  box.innerHTML = h;
}
const fmtDesc = f => [f.dec === 'auto' ? 'décimales auto' : f.dec + ' décimale' + (f.dec > 1 ? 's' : ''), f.th ? 'milliers' : '', f.cur].filter(Boolean).join(' · ');

const TXT = {
  1: '<b>Valeurs par défaut améliorées.</b> Sans rien régler : les milliers sont séparés (15’000), et les décimales sont complétées (16,90 au lieu de 16,9). Dans une colonne, toutes les lignes ont le même nombre de décimales (11’851,90 · 991,40) pour rester alignées. Un entier reste entier (5’228). Ce qui change par rapport à avant : voir le tableau en bas du panneau. <u>Cliquez sur l\'un des trois blocs</u> pour voir comment le régler.',
  2: '<b>Colonne d\'une liste.</b> Dans le tiroir « Modifier la liste », le « Régler » d\'une colonne numérique propose un bloc <u>Format du nombre</u> : cinq formats prêts à l\'emploi (Nombre, Entier, Montant CHF, € ou $), puis le détail (décimales, milliers, monnaie, place du symbole). Un exemple avec de vraies valeurs montre le résultat, et la page le suit en direct. Cliquez « Régler » sur la colonne Chiffre d\'affaires.',
  3: '<b>Champ d\'un texte.</b> Le panneau de gauche montre les champs du texte sélectionné ; cliquer sur un champ (le petit ⚙) ouvre le même bloc dans un tiroir « Format du champ ». Le format ne concerne que ce champ, dans ce texte : le même champ peut s\'écrire « 16,90 CHF » ici et « 16,9 » ailleurs.',
  4: '<b>Le même bloc, tous les réglages visibles.</b> Choisissez un format prêt à l\'emploi, puis ajustez : Décimales (Automatique, 0 à 3), Milliers (séparés ou non), Monnaie (Aucune, CHF, Euro, Dollar) et la place du symbole (après : 16,90 CHF · avant : CHF 16,90). Essayez des combinaisons : le tableau d\'exemples et la page changent aussitôt.'
};
function avantApres() {
  const row = (n, a, b) => `<tr><td>${n}</td><td class="b">${a}</td><td class="n">${b}</td></tr>`;
  return `<div class="grp" style="margin-top:26px">Avant / maintenant</div><table class="cmp"><tr><th>Valeur</th><th>Avant</th><th>Maintenant</th></tr>${row('Panier moyen', '16,9097', fmtN(PANIER, { dec: 'auto', th: true, cur: '', pos: 'after' }))}${row('CA Anthropôle', '11’851,9', '11’851,90')}${row('CA Batochim', '991,4', '991,40')}${row('Transactions', '5’228', '5’228')}${row('Une valeur de 15000', '15’000', '15’000')}</table><p class="hintline">Le panier moyen s'affiche ici avec 2 décimales ; une monnaie s'ajoute en un clic.</p>`;
}
function render() {
  $('#panel').innerHTML = panel() + (scene === 1 ? avantApres() : '');
  layout(); drawStage(); drawDrawer();
  document.querySelectorAll('.mock .sc').forEach(b => b.classList.toggle('on', +b.dataset.s === scene));
  $('#mocktxt').innerHTML = TXT[scene]; $('#app').style.top = $('#mock').offsetHeight + 'px';
}
function go(s) {
  scene = s; drawer = null; sel = null;
  F = { ca: { dec: 'auto', th: true, cur: '', pos: 'after' }, nb: { dec: 'auto', th: true, cur: '', pos: 'after' }, panier: { dec: 'auto', th: true, cur: '', pos: 'after' } };
  if (s === 2) { sel = 'list'; drawer = 'col'; subOpen = false; }
  if (s === 3) { sel = 'panier'; drawer = 'field'; F.panier = { dec: 2, th: true, cur: 'CHF', pos: 'after' }; }
  if (s === 4) { sel = 'list'; drawer = 'col'; subOpen = true; F.ca = { dec: 2, th: true, cur: 'CHF', pos: 'after' }; }
  render();
}
let subOpen = false;
{ const a = document.createElement('div'); a.id = 'drbox'; $('#app').append(a); }
document.addEventListener('click', ev => {
  const t = ev.target, k = s => t.closest(s); let e;
  if ((e = k('.mock .sc'))) return go(+e.dataset.s);
  if ((e = k('[data-pre]'))) { const [key, id] = e.dataset.pre.split(':'); F[key] = Object.assign({}, PRESETS.find(p => p[0] === id)[3]); return render(); }
  if ((e = k('[data-nf]'))) { const [key, f, v] = e.dataset.nf.split(':'); F[key][f] = f === 'dec' && v !== 'auto' ? +v : v; return render(); }
  if ((e = k('[data-th]'))) { F[e.dataset.th].th = !F[e.dataset.th].th; return render(); }
  if ((e = k('[data-chip]'))) { drawer = 'field'; return render(); }
  if ((e = k('[data-open]'))) { drawer = 'col'; subOpen = false; return render(); }
  if ((e = k('[data-sub]'))) { subOpen = true; return render(); }
  if ((e = k('[data-x]'))) { const v = e.dataset.x; if (v === 'sub') { subOpen = false; } else { if (sel !== 'list') { drawer = null; } else { drawer = null; } } return render(); }
  if (k('#stage')) { const b = t.closest('.bk'); if (!b) return; const r = b.getBoundingClientRect(), f = $('#frame').getBoundingClientRect(), x = (r.left - f.left) / S; sel = x < 600 ? 'list' : (r.top - f.top) / S < 300 ? 'nb' : 'panier'; drawer = null; return render(); }
});
window.addEventListener('resize', render);
go(1);
</script>
</body>
</html>
