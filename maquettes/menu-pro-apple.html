<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Menu plus Apple / plus pro</title>
<style>
:root{--bg:#F5F5F7;--surface:#fff;--ink:#0B1F3A;--text:#1D1D1F;--muted:#6E7684;--line:#E3E6EB;--line-2:#D2D6DD;
  --brand:#0B1F3A;--signal:#3B82C4;--signal-t:rgba(59,130,196,.13);--ok:#1E8E5A;--ok-bg:#E1F0E8;--ok-ink:#155A38;
  --warn:#B7791F;--warn-bg:#FBF0DA;--warn-ink:#7A4E0C;--danger:#C0392B;--danger-bg:#FBE4E2;--danger-ink:#8A231C;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI","IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}button{font:inherit;color:inherit;cursor:pointer}
svg{display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* barre de maquette */
.mock{position:sticky;top:0;z-index:90;background:#fff;border-bottom:1px dashed var(--line-2);padding:8px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:#ECEEF2;border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;color:var(--muted);font-size:12.5px}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px #0002;font-weight:600}

.app{min-height:calc(100vh - 45px);display:flex}
main{flex:1;min-width:0;padding:28px 40px 80px}
.wm{font-weight:600;letter-spacing:-.03em;font-size:22px;color:var(--ink)}
.wm i{font-style:normal;color:var(--signal)}

/* ====== A · Barre latérale « macOS » ====== */
body[data-m=a] .side{width:252px;flex:none;position:sticky;top:45px;height:calc(100vh - 45px);padding:18px 12px 14px;
  background:rgba(246,247,250,.82);backdrop-filter:blur(24px) saturate(1.6);border-right:1px solid var(--line);display:flex;flex-direction:column}
body[data-m=a] .brand{display:flex;align-items:center;gap:8px;padding:2px 10px 14px}
body[data-m=a] .org{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 16px;box-shadow:0 1px 2px #0000000a}
.av{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
body[data-m=a] .org b{font-weight:600;font-size:13px;display:block;line-height:1.2}body[data-m=a] .org small{color:var(--muted);font-size:11.5px}
body[data-m=a] .grp{font-size:11px;font-weight:600;color:#9AA1AD;letter-spacing:.02em;padding:12px 10px 4px}
body[data-m=a] .it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:5px 10px;border-radius:8px;color:var(--text);font-size:13.5px;position:relative}
body[data-m=a] .it .ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff}
body[data-m=a] .it .ic svg{width:15px;height:15px;stroke-width:2}
body[data-m=a] .it:hover{background:#0000000a}
body[data-m=a] .it.on{background:var(--signal-t);font-weight:600}
body[data-m=a] .it .n{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
body[data-m=a] .it .n.r{background:var(--danger);color:#fff;border-radius:9px;padding:0 6px;font-weight:600}
body[data-m=a] .sp{flex:1}
body[data-m=a] .foot{border-top:1px solid var(--line);padding:12px 6px 0;display:flex;align-items:center;gap:10px}
body[data-m=a] .foot .av{border-radius:50%;width:30px;height:30px;background:linear-gradient(135deg,#3B82C4,#0B1F3A)}
body[data-m=a] .foot small{color:var(--muted);display:block;font-size:11.5px}
.mode{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:6px 10px 10px}
.sw{width:34px;height:20px;border-radius:10px;background:#34C759;position:relative}.sw::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004}

/* ====== B · Barre du haut « pro » ====== */
body[data-m=b] .app{flex-direction:column}
body[data-m=b] .side{position:sticky;top:45px;z-index:50;height:56px;background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 24px}
body[data-m=b] .brand{display:flex;align-items:center;gap:14px;margin-right:10px}
body[data-m=b] .org{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-weight:600;font-size:13px;background:#fff}
body[data-m=b] .org small{display:none}body[data-m=b] .org .av{width:20px;height:20px;font-size:10px;border-radius:5px}
body[data-m=b] .grp,body[data-m=b] .mode,body[data-m=b] .foot small,body[data-m=b] .it .ic,body[data-m=b] .it .n.g{display:none}
body[data-m=b] .navs{display:flex;gap:2px;align-items:center;margin-left:8px}
body[data-m=b] .it{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-size:13.5px;font-weight:500;display:flex;gap:7px;align-items:center}
body[data-m=b] .it:hover{background:#0000000a;color:var(--text)}
body[data-m=b] .it.on{color:var(--text);background:#0000000d}
body[data-m=b] .it .n.r{background:var(--danger);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-weight:600}
body[data-m=b] .it .n:not(.r){display:none}
body[data-m=b] .sp{flex:1}
body[data-m=b] .foot{display:flex;align-items:center;gap:10px}body[data-m=b] .foot div:not(.av){display:none}
body[data-m=b] .foot .av{border-radius:50%;width:30px;height:30px;background:linear-gradient(135deg,#3B82C4,#0B1F3A)}
.more{position:relative}.pop{display:none;position:absolute;top:100%;left:0;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #0b1f3a26;padding:6px;min-width:210px;z-index:60}
.more:hover .pop{display:block}
.pop .it{width:100%;text-align:left;display:flex!important;gap:10px!important}
body[data-m=b] .pop .it .ic{display:grid;width:22px;height:22px;border-radius:6px;place-items:center;color:#fff}body[data-m=b] .pop .it .ic svg{width:14px;height:14px;stroke-width:2}
body[data-m=b] main{max-width:1280px;width:100%;margin:0 auto}

/* ====== C · Rail d'icônes « dock » ====== */
body[data-m=c] .side{width:84px;flex:none;position:sticky;top:45px;height:calc(100vh - 45px);background:var(--brand);padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
body[data-m=c] .brand{margin-bottom:12px}body[data-m=c] .brand .wm{display:none}
body[data-m=c] .brand::before{content:"li";width:40px;height:40px;border-radius:11px;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:18px;letter-spacing:-.04em}
body[data-m=c] .org,body[data-m=c] .grp,body[data-m=c] .mode,body[data-m=c] .foot div:not(.av){display:none}
body[data-m=c] .it{width:64px;border:0;background:none;color:#ffffffa6;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:12px;font-size:10.5px;font-weight:500;position:relative;transition:.15s}
body[data-m=c] .it .ic{background:none!important}body[data-m=c] .it .ic svg{width:22px;height:22px}
body[data-m=c] .it:hover{background:#ffffff14;color:#fff}
body[data-m=c] .it.on{background:#ffffff24;color:#fff}
body[data-m=c] .it.on::before{content:"";position:absolute;left:-10px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
body[data-m=c] .it .n{display:none}
body[data-m=c] .it .n.r{display:block;position:absolute;top:4px;right:10px;background:#FF5A4D;color:#fff;border-radius:9px;padding:0 5px;font-size:10px;font-weight:700}
body[data-m=c] .sp{flex:1}body[data-m=c] .div{width:30px;height:1px;background:#ffffff26;margin:6px 0}
body[data-m=c] .foot .av{border-radius:50%;width:36px;height:36px;margin-top:8px;background:linear-gradient(135deg,#3B82C4,#7aa8d6)}
body[data-m=a] .div,body[data-m=b] .div{display:none}

/* ====== contenu des pages ====== */
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.crumb{color:var(--muted);font-size:13px}
.cmdk{margin-left:auto;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--muted);min-width:260px;box-shadow:0 1px 2px #0000000a}
kbd{font:inherit;font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:#fafbfc}
.cmdk kbd{margin-left:auto}
.head{display:flex;align-items:flex-end;gap:16px;margin:10px 0 18px;flex-wrap:wrap}
.head h1{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.head p{color:var(--muted);margin-top:2px;max-width:560px}.grow{flex:1}
.btn{font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;box-shadow:0 1px 2px #0b1f3a40}
.btn svg{width:16px;height:16px;stroke-width:2.2}
.btn.g{background:#fff;color:var(--text);border:1px solid var(--line-2);box-shadow:none}
.tabs{display:inline-flex;background:#E8EAEE;border-radius:10px;padding:3px;margin-bottom:20px}
.tabs button{border:0;background:none;padding:6px 16px;border-radius:8px;color:var(--muted);font-weight:500;display:flex;gap:8px;align-items:center}
.tabs button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px #0003;font-weight:600}
.cnt{font-size:11.5px;background:#0000000f;border-radius:9px;padding:0 6px}.cnt.r{background:var(--danger-bg);color:var(--danger-ink);font-weight:600}
.tb{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.search{flex:1;min-width:220px;background:#E8EAEE;border-radius:10px;padding:8px 12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.search svg{width:16px;height:16px}
.pill{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;display:inline-flex;gap:8px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok-ink)}.badge.warn{background:var(--warn-bg);color:var(--warn-ink)}.badge.off{background:var(--danger-bg);color:var(--danger-ink)}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px #0b1f3a0f,0 0 0 1px #0b1f3a0f;transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px #0b1f3a1f,0 0 0 1px #0b1f3a12}
.scene{height:128px;display:grid;place-items:center;position:relative;color:#fff;font-weight:600;font-size:15px;text-shadow:0 1px 8px #0005}
.scene.off{filter:grayscale(1) brightness(.8)}.scene .badge{position:absolute;top:10px;left:10px;text-shadow:none}
.cb{padding:12px 16px 14px}.cb .n{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.cb .m{color:var(--muted);font-size:12.5px;margin-top:2px}
.who{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:500}

.list{background:#fff;border-radius:16px;box-shadow:0 0 0 1px #0b1f3a0f;overflow:hidden}
.lr{display:grid;grid-template-columns:48px 1.6fr 1fr 1fr 130px 28px;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.lr:first-child{border-top:0}.lr.h{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:10px 18px;background:#FAFAFB}
.lr:not(.h):hover{background:#F7F9FC}
.thumb{width:48px;height:34px;border-radius:7px}.lr b{font-weight:600}.lr small{display:block;color:var(--muted);font-size:12px}
.lr .dots{color:var(--muted);letter-spacing:2px}

.fold{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.f{background:#fff;border-radius:12px;padding:10px 16px 10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 0 0 1px #0b1f3a0f;font-weight:500}
.f .fi{width:30px;height:24px;border-radius:5px 5px 6px 6px;background:linear-gradient(#7fb6e8,#3B82C4)}
.f small{color:var(--muted);font-weight:400}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.m{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px #0b1f3a0f}
.m .im{height:110px;display:grid;place-items:center;color:#fff;font-size:28px}
.m .mt{padding:8px 12px 10px;font-weight:500;font-size:13px}.m .mt small{display:block;color:var(--muted);font-weight:400}

.cal{background:#fff;border-radius:16px;box-shadow:0 0 0 1px #0b1f3a0f;overflow:hidden}
.ch{display:grid;grid-template-columns:56px repeat(7,1fr);border-bottom:1px solid var(--line)}
.ch div{padding:10px 8px;text-align:center;font-weight:600;font-size:13px}.ch div small{display:block;color:var(--muted);font-weight:400}
.ch .today{color:var(--signal)}
.cb2{display:grid;grid-template-columns:56px repeat(7,1fr);position:relative;height:340px}
.hrs{display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px;font-size:11px;color:var(--muted);text-align:right}
.col{border-left:1px solid var(--line);position:relative;background:repeating-linear-gradient(transparent 0 47px,#F0F2F5 47px 48px)}
.ev{position:absolute;left:4px;right:4px;border-radius:8px;padding:5px 8px;font-size:11.5px;font-weight:600;color:#fff;overflow:hidden;line-height:1.25}
.ev small{display:block;font-weight:400;opacity:.85}
.now{position:absolute;left:56px;right:0;height:2px;background:#FF3B30;z-index:3}.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#FF3B30}

/* palette de commandes */
.ov{display:none;position:fixed;inset:0;z-index:200;background:#0b1f3a55;backdrop-filter:blur(6px);align-items:flex-start;justify-content:center;padding-top:14vh}
.ov.on{display:flex}
.pal{width:min(560px,92vw);background:rgba(255,255,255,.95);border-radius:16px;box-shadow:0 30px 80px #0b1f3a66;overflow:hidden}
.pal .in{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px}
.pal .rs{padding:8px}.pal .rt{font-size:11px;font-weight:600;color:var(--muted);padding:6px 10px;text-transform:uppercase;letter-spacing:.04em}
.pal .r{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px}.pal .r.s{background:var(--signal);color:#fff}
.pal .r span{margin-left:auto;font-size:12px;opacity:.7}
@media(max-width:900px){main{padding:20px 16px}body[data-m=a] .side{display:none}.lr{grid-template-columns:48px 1fr 100px}.lr>*:nth-child(n+4){display:none}}
</style>
</head>
<body data-m="a">
<div class="mock"><b style="color:var(--text)">Menu</b>
<div class="seg" id="mm"><button data-m="a" class="on">A · Barre latérale macOS</button><button data-m="b">B · Barre du haut pro</button><button data-m="c">C · Rail d'icônes (dock)</button></div>
<span>Astuce : cliquez dans le menu pour changer de page, ou appuyez sur <kbd>Ctrl</kbd> <kbd>K</kbd></span></div>

<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>

<div class="ov" id="ov"><div class="pal">
  <div class="in"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span style="color:var(--muted)">Aller à un écran, une liste, un média…</span></div>
  <div class="rs"><div class="rt">Pages</div><div class="r s">Écrans<span>↵</span></div><div class="r">Listes de lecture</div><div class="r">Médiathèque</div>
  <div class="rt">Actions</div><div class="r">Connecter un écran<span>Ctrl N</span></div><div class="r">Ajouter un média<span>Ctrl U</span></div><div class="r">Publier les changements<span>Ctrl ⇧ P</span></div></div>
</div></div>

<script>
const IC={
 screens:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
 grid:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 plug:'<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v5"/>',
 team:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6M17 5a3.5 3.5 0 0 1 0 7M22 20c0-2.5-1.5-4.5-4-5.3"/>',
 chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',chev:'<path d="M6 9l6 6 6-6"/>'
};
const ico=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24">${IC[n]}</svg>`;
const NAV=[
 {g:'Diffuser',items:[['screens','Écrans','#3B82C4',{r:2}],['list','Listes de lecture','#5E5CE6',{n:8}],['cal','Planning','#FF9F0A']]},
 {g:'Contenus',items:[['img','Médiathèque','#30B0C7',{n:214}],['grid','Compositions','#BF5AF2'],['plug','Intégrations','#34C759',{n:6}]]},
 {g:'Organisation',items:[['team','Membres','#FF6482',{n:5}],['chart','Statistiques','#64748B'],['gear','Réglages','#8E8E93']]}
];
const PAGES={screens:'Écrans',list:'Listes de lecture',cal:'Planning',img:'Médiathèque'};
let m='a',page='screens';
const $=s=>document.querySelector(s);
const item=(i,cls='')=>{const[id,l,c,o={}]=i;return `<button class="it ${page===id?'on':''} ${cls}" data-p="${id}"><span class="ic" style="background:${c}">${ico(id)}</span><span>${l}</span>${o.r?`<span class="n r">${o.r}</span>`:o.n?`<span class="n">${o.n}</span>`:''}</button>`};
function side(){
 const org=`<div class="org"><div class="av">MO</div><div><b>Mon organisation</b><small>Pro · 11 écrans</small></div>${m==='a'?ico('chev',14):''}</div>`;
 const foot=`<div class="foot"><div class="av">LP</div><div><b style="font-weight:600">Ludovic Prieur</b><small>Administrateur</small></div></div>`;
 if(m==='b'){
  const all=NAV.flatMap(x=>x.items);
  $('#side').innerHTML=`<div class="brand"><span class="wm">link<i>ii</i></span>${org}</div>
  <nav class="navs">${all.slice(0,5).map(i=>item(i)).join('')}<div class="more"><button class="it" style="display:flex">Plus ${ico('chev',14)}</button><div class="pop">${all.slice(5).filter((_,k)=>k!==0||1).map(i=>item(i)).join('')}</div></div></nav>
  <div class="sp"></div><button class="btn g" style="padding:6px 12px" id="k2">${ico('screens',15)} Aperçu</button>${foot}`;
 }else if(m==='c'){
  const all=NAV.flatMap(x=>x.items);
  $('#side').innerHTML=`<div class="brand"></div>${all.slice(0,3).map(i=>item(i)).join('')}<div class="div"></div>${all.slice(3,6).map(i=>item(i)).join('')}<div class="div"></div>${all.slice(6).map(i=>item(i)).join('')}<div class="sp"></div>${foot}`;
 }else{

   `<div class="sp"></div><div class="mode"><span>Mode expert</span><span class="sw"></span></div>${foot}`;
 }

 if(page==='screens') return head('Écrans','Choisissez la liste de lecture de chaque écran, puis publiez : ils se mettent à jour indépendamment.',add('Connecter un écran'))+
 `<div class="tabs"><button class="on">Mes écrans <span class="cnt">3</span></button><button>Partagés avec moi <span class="cnt">2</span></button><button>Toute l'organisation <span class="cnt">6</span></button></div>

 if(page==='list') return head('Listes de lecture','Les séquences de contenus que vos écrans diffusent en boucle.',add('Nouvelle liste'))+
 `<div class="tabs"><button class="on">Mes listes <span class="cnt">5</span></button><button>Partagées avec moi <span class="cnt">3</span></button></div>

 ${[['Bienvenue','#ffb36b','6 contenus · 2 min 10','Accueil RDC, Mur hall','ok','Publiée'],['Affichage menu midi','#fbbf24','3 contenus · 45 s','MAX','ok','Publiée'],['Restaurant','#8A5A2B','9 contenus · 3 min','Cafétéria','ok','Publiée'],['Contenus tout personnel','#B03A8E','4 contenus · 1 min','101','warn','Brouillon'],['Soirée portes ouvertes','#5E5CE6','12 contenus · 5 min','—','warn','Brouillon']].map(r=>`<div class="lr"><div class="thumb" style="background:linear-gradient(135deg,${r[1]},${r[1]}88)"></div><div><b>${r[0]}</b><small>Modifiée il y a 2 j</small></div><span>${r[2]}</span><span>${r[3]}</span><span class="badge ${r[4]}" style="justify-self:start"><i></i>${r[5]}</span><span class="dots">···</span></div>`).join('')}</div>`;
 if(page==='img') return head('Médiathèque','Vos images, vidéos et documents, rangés en dossiers.',add('Ajouter'))+
 `<div class="tabs"><button class="on">Mes médias <span class="cnt">86</span></button><button>Partagés avec moi <span class="cnt">12</span></button></div>
 <div class="fold">${[['Menus','14'],['Événements','32'],['Logos','6'],['Vidéos','9']].map(f=>`<div class="f"><div class="fi"></div><div>${f[0]}<br><small>${f[1]} éléments</small></div></div>`).join('')}</div>
 <div class="mg">${[['#f59e0b','🍽️','Menu lundi','Image'],['#3B82C4','🏢','Facade','Image'],['#8b5cf6','🎬','Vidéo accueil','Vidéo · 0:42'],['#10b981','🌿','Journée verte','Image'],['#ef4444','🎉','Portes ouvertes','PDF'],['#06b6d4','⛅','Météo','Widget'],['#ec4899','🎂','Anniversaires','Image'],['#64748b','📄','Règlement','PDF']].map(x=>`<div class="m"><div class="im" style="background:linear-gradient(135deg,${x[0]},${x[0]}aa)">${x[1]}</div><div class="mt">${x[2]}<small>${x[3]}</small></div></div>`).join('')}</div>`;
 if(page==='cal'){
  const ev={0:[[0,70,'#3B82C4','Menu','07:30'],[110,60,'#FF9F0A','Annonces','12:00'],[220,90,'#5E5CE6','Bienvenue','16:00']],1:[[0,70,'#3B82C4','Menu','07:30'],[160,110,'#34C759','Journée verte','13:00']],2:[[0,70,'#3B82C4','Menu','07:30'],[110,60,'#FF9F0A','Annonces','12:00']],3:[[30,90,'#BF5AF2','Portes ouvertes','09:00'],[220,90,'#5E5CE6','Bienvenue','16:00']],4:[[0,70,'#3B82C4','Menu','07:30'],[110,180,'#FF6482','Vendredi cool','12:00']],5:[],6:[]};
  const days=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  return head('Planning','Programmez ce qui passe, quand et sur quels écrans.',add('Nouveau créneau'))+
  `<div class="tabs"><button class="on">Semaine</button><button>Mois</button><button>Liste</button></div>
  <div class="cal"><div class="ch"><div></div>${days.map((d,i)=>`<div class="${i===2?'today':''}">${d}<small>${20+i}</small></div>`).join('')}</div>
  <div class="cb2"><div class="hrs"><span>7 h</span><span>10 h</span><span>13 h</span><span>16 h</span><span>19 h</span></div>
  ${days.map((_,i)=>`<div class="col">${(ev[i]||[]).map(e=>`<div class="ev" style="top:${e[0]}px;height:${e[1]}px;background:${e[2]}">${e[3]}<small>${e[4]}</small></div>`).join('')}</div>`).join('')}
  <div class="now" style="top:150px"></div></div></div>`;
 }
 return head(PAGES[page]||page,'Cette page garde son contenu actuel, seul le menu change dans cette maquette.','');
}
function render(){document.body.dataset.m=m;side();$('#main').innerHTML=view()}
document.addEventListener('click',e=>{
 const mb=e.target.closest('#mm button');if(mb){m=mb.dataset.m;document.querySelectorAll('#mm button').forEach(x=>x.classList.toggle('on',x===mb));return render()}
 const it=e.target.closest('.it[data-p]');if(it){page=it.dataset.p;return render()}
 if(e.target.closest('#ck'))$('#ov').classList.add('on');
 if(e.target.id==='ov')$('#ov').classList.remove('on');
});
addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='k'){e.preventDefault();$('#ov').classList.toggle('on')}if(e.key==='Escape')$('#ov').classList.remove('on')});
render();
