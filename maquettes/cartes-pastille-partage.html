<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Pastille de partage des cartes</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--signal:#3B82C4;--ok:#1E8E5A;--orange:#F29100;
  --share:#2F6FAB;--share-bg:#E4EEF8;--share-ink:#1F5C93}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;color:var(--ink);font-size:14px;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mock{position:sticky;top:0;z-index:50;background:#FFF8E1;border-bottom:1px dashed #E0B84A;padding:8px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:#6B5200}
.seg{display:inline-flex;border:1px solid #E0B84A;border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:4px 12px;font-size:12.5px}
.seg button+button{border-left:1px solid #E0B84A}
.seg button.on{background:#6B5200;color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:26px 24px 60px}
h2{font-size:20px;font-weight:500;margin:26px 0 4px}
h2:first-child{margin-top:0}
.sub{color:var(--muted);margin:0 0 14px;font-size:13px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 0 16px}
.tabs span{padding:8px 0;color:var(--muted)}
.tabs .on{color:var(--ink);font-weight:500;border-bottom:2px solid var(--signal);margin-bottom:-1px}
.tabs .c{font-size:11.5px;background:#E8ECF1;border-radius:9px;padding:0 6px;margin-left:5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}

/* ---------- carte commune ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card:hover{border-color:var(--line-2);box-shadow:0 2px 10px rgba(11,31,58,.06)}
.cover{position:relative;height:150px;background:#E8ECF1;display:grid;place-items:center;overflow:hidden}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:12.5px}
.foot{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:24px}
.foot .grow{flex:1;min-width:0}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.warn{background:var(--orange)}

/* ---------- la pastille bleue (proposition) ---------- */
.sh{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;background:var(--share);color:#fff;font-size:12px;font-weight:500;white-space:nowrap;border:0;box-shadow:0 1px 2px rgba(47,111,171,.35)}
.sh svg{width:13px;height:13px;stroke-width:2}
.sh:hover{background:#255E95}
.sh.in{background:var(--share-bg);color:var(--share-ink);box-shadow:none}
.sh.in:hover{background:#D6E5F4}

/* écran (TV) */
.tv{width:78%;aspect-ratio:16/9;background:#0E1726;border-radius:5px;padding:4px;box-shadow:0 6px 14px rgba(11,31,58,.25);position:relative}
.tv i{display:block;width:100%;height:100%;border-radius:2px;background:linear-gradient(135deg,#5D7FA8,#2E4E77)}
.tv::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:26%;height:5px;border-radius:2px;background:#8C97A6}
.band{position:absolute;left:0;right:0;bottom:0;height:22px;background:rgba(30,142,90,.92);color:#fff;font-size:11.5px;font-weight:500;display:flex;align-items:center;gap:6px;padding:0 10px}
.band.off{background:rgba(198,40,40,.92)}
.band b{width:6px;height:6px;border-radius:50%;background:#fff}
/* liste */
.pl{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:84%}
.pl i{aspect-ratio:16/10;border-radius:4px;display:block}
/* média */
.ph{width:100%;height:100%;background:linear-gradient(160deg,#9CB6D3,#5D7FA8 55%,#2E4E77);display:grid;place-items:center;color:rgba(255,255,255,.75)}
.ph svg{width:38px;height:38px}
.ty{position:absolute;left:8px;bottom:8px;background:rgba(14,23,38,.8);color:#fff;font-size:11px;padding:1px 7px;border-radius:4px}

/* ancienne pastille (avant) */
.old{position:absolute;right:8px;bottom:8px;background:rgba(14,23,38,.85);color:#fff;border-radius:999px;font-size:12px;padding:2px 9px;display:inline-flex;gap:5px;align-items:center}
.old svg{width:13px;height:13px}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;background:#E4EEF8;color:#1F5C93;font-size:12px}
.chip svg{width:12px;height:12px}

/* bulle (survol) */
.pop{position:absolute;z-index:20;right:10px;bottom:44px;width:250px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(11,31,58,.18);padding:10px 12px;font-size:12.5px;display:none}
.card:hover .pop.show{display:block}
.pop b{display:block;font-size:13px;margin-bottom:6px}
.pop .r{display:flex;align-items:center;gap:8px;padding:3px 0}
.pop .av{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:10.5px;display:grid;place-items:center;flex:none}
.pop .r span{flex:1}
.pop small{color:var(--muted)}
.pop .lk{display:block;margin-top:6px;color:var(--signal);font-weight:500}

.notes{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:13px;line-height:1.55;margin-top:28px}
.notes h3{margin:0 0 6px;font-size:14px}
.notes ul{margin:0;padding-left:18px}
.notes li{margin-bottom:4px}
</style>
</head>
<body>
<div class="mock">
  <span>Maquette — mode simple :</span>
  <span class="seg" id="view"><button data-v="after" class="on">Après (à plat + pastille)</button><button data-v="before">Avant (onglets)</button></span>
</div>
<div class="wrap" id="root"></div>

<script>
const SV = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
const USERS = '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1.5 6 4"/>';
const SHARE = '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>';
const IMG = '<path d="M3 18l5-6 4 4 3-3 6 5"/><circle cx="16" cy="7" r="2"/><rect x="2" y="3" width="20" height="18" rx="2"/>';
let view = 'after';

/* éléments : à moi non partagé, à moi partagé (n personnes ou tous), d'un collègue */
const SCREENS = [
  { name:'Accueil — hall', meta:'Paysage · Liste « Bienvenue »', share:3, people:['Anne Dubois','Marc Keller','Sofia Rossi'], on:true },
  { name:'Cafétéria', meta:'Portrait · Liste « Menu du jour »', share:0, on:true },
  { name:'Salle de réunion 2', meta:'Paysage · Liste « Agenda »', from:'Anne Dubois', on:false },
  { name:'Showroom', meta:'Paysage · Liste « Produits »', share:'all', on:true }
];
const LISTS = [
  { name:'Bienvenue', meta:'6 contenus · 1 min 30', share:2, people:['Anne Dubois','Marc Keller'], st:'Diffusée sur 3 écrans' },
  { name:'Menu du jour', meta:'3 contenus · 45 s', share:0, st:'À publier sur 1 écran', warn:true },
  { name:'Agenda RH', meta:'4 contenus · 1 min', from:'Marc Keller', st:'Diffusée sur 1 écran' },
  { name:'Produits', meta:'12 contenus · 3 min', share:'all', st:'Diffusée sur 2 écrans' }
];
const MEDIA = [
  { name:'Affiche portes ouvertes.jpg', meta:'1920 × 1080', share:4, people:['Anne Dubois','Marc Keller','Sofia Rossi','Léo Martin'], ty:'Image' },
  { name:'Logo-blanc.png', meta:'800 × 300', share:0, ty:'Image' },
  { name:'Visite atelier.mp4', meta:'1920 × 1080 · 0:42', from:'Sofia Rossi', ty:'Vidéo' },
  { name:'Charte couleurs.jpg', meta:'1080 × 1920', share:'all', ty:'Image' }
];

function pill(it){
  if (view === 'before') return '';
  if (it.from) return `<span class="sh in" title="Partagé avec vous par ${it.from}">${SV(USERS)}De ${it.from.split(' ')[0]}</span>`;
  if (!it.share) return '';
  const txt = it.share === 'all' ? 'Toute l’organisation' : `${it.share} partage${it.share > 1 ? 's' : ''}`;
  return `<button class="sh" title="Gérer le partage">${SV(SHARE)}${txt}</button>`;
}
function pop(it){
  if (view === 'before' || !it.share) return '';
  const rows = it.share === 'all' ? `<div class="r"><span class="av">${SV(USERS).replace('<svg','<svg style="width:12px;height:12px"')}</span><span>Toute l’organisation</span><small>Peut utiliser</small></div>`
    : it.people.map(p => `<div class="r"><span class="av">${p.split(' ').map(x => x[0]).join('')}</span><span>${p}</span><small>Peut utiliser</small></div>`).join('');
  return `<div class="pop show"><b>Partagé avec</b>${rows}<span class="lk">Gérer le partage…</span></div>`;
}
function oldPill(it){
  if (view !== 'before' || !it.share) return '';
  return `<span class="old">${SV(USERS)}${it.share === 'all' ? 'Partagé · tous' : 'Partagé · ' + it.share}</span>`;
}
function owner(it){ return view === 'before' && it.from ? `<span class="chip">${SV(USERS)}${it.from.split(' ')[0]}</span>` : ''; }
const COLORS = ['#3B82C4','#E8833A','#1E8E5A','#8E5BC9','#C94F6D','#0B1F3A'];

function screenCard(s){
  return `<div class="card"><div class="cover"><div class="tv"><i></i></div><div class="band${s.on ? '' : ' off'}"><b></b>${s.on ? 'En ligne' : 'Hors ligne'}</div>${oldPill(s)}</div>
    <div class="body"><div class="name">${s.name}</div>${owner(s)}<div class="meta">${s.meta}</div>
    <div class="foot"><span class="grow"></span>${pill(s)}</div></div>${pop(s)}</div>`;
}
function listCard(l, i){
  const tiles = [0,1,2,3,4,5].map(k => `<i style="background:${COLORS[(i + k) % COLORS.length]};opacity:${.55 + (k % 3) * .15}"></i>`).join('');
  return `<div class="card"><div class="cover"><div class="pl">${tiles}</div>${oldPill(l)}</div>
    <div class="body"><div class="name">${l.name}</div>${owner(l)}<div class="meta">${l.meta}</div>
    <div class="foot"><span class="grow state"><i class="dot${l.warn ? ' warn' : ''}"></i>${l.st}</span>${pill(l)}</div></div>${pop(l)}</div>`;
}
function mediaCard(m){
  return `<div class="card"><div class="cover"><div class="ph">${SV(IMG)}</div><span class="ty">${m.ty}</span>${oldPill(m)}</div>
    <div class="body"><div class="name">${m.name}</div>${owner(m)}<div class="meta">${m.meta}</div>
    <div class="foot"><span class="grow"></span>${pill(m)}</div></div>${pop(m)}</div>`;
}
function section(title, tabsBefore, items, fn){
  const mine = items.filter(x => !x.from), shared = items.filter(x => x.from);
  const shown = view === 'before' ? mine : items;
  const tabs = view === 'before' ? `<div class="tabs"><span class="on">${tabsBefore[0]}</span><span>${tabsBefore[1]}<span class="c">${shared.length}</span></span></div>` : '';
  return `<h2>${title}</h2><p class="sub">${view === 'before' ? 'Aujourd’hui : deux onglets, le partage est une pastille sombre sur l’aperçu.' : 'Une seule liste : mes éléments et ceux partagés avec moi, côte à côte.'}</p>${tabs}<div class="grid">${shown.map(fn).join('')}</div>`;
}
function draw(){
  document.getElementById('root').innerHTML =
    section('Écrans', ['Mes écrans', 'Partagés avec moi'], SCREENS, screenCard) +
    section('Listes de diffusion', ['Mes listes', 'Partagées avec moi'], LISTS, listCard) +
    section('Médiathèque', ['Mes médias', 'Partagés avec moi'], MEDIA, mediaCard) +
    `<div class="notes"><h3>Proposition (mode simple seulement)</h3><ul>
      <li><b>Plus d’onglets</b> : mes éléments et ceux partagés avec moi dans la même liste (l’onglet « Toute l’organisation » est déjà retiré en mode simple).</li>
      <li><b>Pastille bleue</b> rectangulaire arrondie, <b>en bas à droite</b> de la carte : « 1 partage », « 3 partages », ou « Toute l’organisation ». Au survol : avec qui, et le droit ; au clic : la fenêtre de partage (propriétaire et administrateur).</li>
      <li>Rien quand l’élément n’est pas partagé.</li>
      <li><b>À valider</b> : un élément <b>partagé avec moi</b> par un collègue porte une pastille bleu clair « De Anne » à la même place, pour le distinguer des miens (elle remplace la petite étiquette avec le prénom d’aujourd’hui).</li>
      <li>La pastille sombre « Partagé · 3 » posée sur l’aperçu disparaît.</li>
      <li>Mode expert : inchangé (onglets Mes… / Partagés avec moi / Toute l’organisation).</li>
    </ul></div>`;
}
document.getElementById('view').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; view = b.dataset.v; [...ev.currentTarget.children].forEach(x => x.classList.toggle('on', x === b)); draw(); });
draw();
</script>
</body>
</html>
