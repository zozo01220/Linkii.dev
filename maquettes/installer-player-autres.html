<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Installer le player : autres propositions</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--signal:#3B82C4;--sig-bg:#EAF2FA;--dot:#CC8400;--dot-bg:#FDF3DE;--ok:#2E8B57}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.mock{position:sticky;top:0;z-index:300;background:#FFF8E1;border-bottom:1px dashed #E0B84A;padding:8px 16px;font-size:13px;color:#6B5200}
.mock .row{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.mock .sc{border:1px solid #E0B84A;background:#fff;border-radius:4px;padding:3px 10px;font-size:13px}
.mock .sc.on{background:#6B5200;border-color:#6B5200;color:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:0 16px;font-weight:500;height:38px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.sm{height:32px;padding:0 12px;font-size:13px}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}
.app{display:flex;min-height:620px}
.side{width:230px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
.wm{display:inline-flex;align-items:baseline;font-size:28px;font-weight:500;letter-spacing:-.03em;line-height:1;margin:0 0 18px 8px}
.wm .i{display:inline-block;width:.095em;height:.5em;background:currentColor;margin-left:.07em;position:relative}.wm .i+.i{margin-left:.1em}
.wm .i::before{content:"";position:absolute;left:0;top:-.2em;width:.095em;height:.095em;background:currentColor}.wm .i.s::before{background:var(--dot)}
.nav{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:6px;color:var(--muted)}.nav.on{background:var(--sig-bg);color:var(--ink);font-weight:500}.ic{width:20px;text-align:center}
.spacer{flex:1}
.main{flex:1;padding:24px 32px;min-width:0}
.head{display:flex;gap:12px}.head>div:first-child{flex:1}
h1{margin:0;font-size:28px;font-weight:500}.sub{color:var(--muted);margin:2px 0 14px}
.tabs{display:flex;align-items:center;gap:26px;border-bottom:1px solid var(--line);margin:4px 0 16px}.tabs span{padding:9px 0;color:var(--muted)}.tabs .on{color:var(--ink);font-weight:500;border-bottom:2px solid var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:6px}
.srow{display:flex;gap:14px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}.srow:first-child{border-top:0}.thumb{width:84px;height:48px;border-radius:4px;background:#0E1E38}
.bi{width:20px;height:20px;display:block}
/* C · carte fantôme dans la liste */
.ghost{margin-top:12px;border:2px dashed #E3C98F;background:var(--dot-bg);border-radius:8px;padding:16px 18px;display:flex;align-items:center;gap:18px}
.ghost .tvm{width:84px;height:48px;border-radius:4px;background:#0E1E38;display:grid;place-items:center;color:#fff;font-size:11px;flex:none;text-align:center;line-height:1.2}
.ghost .t{flex:1}.ghost b{font-weight:500;font-size:15px}.ghost small{display:block;color:var(--muted)}
.logos{display:flex;gap:8px}
.lg{width:46px;height:46px;border:1px solid var(--line-2);background:#fff;border-radius:8px;display:grid;place-items:center;position:relative}
.lg:hover{border-color:var(--dot)}.lg.off{opacity:.45}
.lg .bi{width:24px;height:24px}
/* D · bandeau Premiers pas */
.steps{display:flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px 16px;margin:0 0 16px;gap:0}
.stp{display:flex;align-items:center;gap:10px;color:var(--muted)}
.stp i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-style:normal;font-weight:600;font-size:13px;background:#fff}
.stp.now{color:var(--ink);font-weight:500}.stp.now i{background:var(--dot);border-color:var(--dot);color:#fff}
.stp.done i{background:var(--ok);border-color:var(--ok);color:#fff}.stp.done{color:var(--ink)}
.sep{flex:1;height:1px;background:var(--line-2);margin:0 14px;min-width:20px}
.steps .btn{margin-left:18px;background:var(--dot);border-color:var(--dot)}
/* E · pastille dans la rangée d'onglets */
.pill{margin-left:auto;align-self:center;display:inline-flex;gap:8px;align-items:center;border:1px solid #E3C98F;background:var(--dot-bg);border-radius:20px;padding:4px 6px 4px 12px;font-size:13px}
.pill .bi{width:16px;height:16px}.pill .logos{gap:4px}.pill .mini{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--line-2);display:grid;place-items:center}
.scene{display:none}.scene.on{display:block}
</style>
</head>
<body>
<div class="mock"><div class="row" id="scs">
  <button class="sc on" data-s="c">C · Une carte « écran à connecter » dans la liste</button>
  <button class="sc" data-s="d">D · Bandeau « Premiers pas » en 3 étapes</button>
  <button class="sc" data-s="e">E · Pastille dans la rangée d'onglets</button></div>
  <div id="note"></div></div>
<div id="root"></div>
<script>
const ic=(n,c)=>`<img class="bi" alt="" src="https://cdn.simpleicons.org/${n}/${c}">`;
const WIN=`<svg class="bi" viewBox="0 0 24 24"><path fill="#0078D4" d="M2 4.6 10.3 3.5v7.7H2zM11.5 3.3 22 1.8v9.4H11.5zM2 12.4h8.3v7.8L2 19.1zM11.5 12.4H22v9.8l-10.5-1.5z"/></svg>`;
const AND=ic('android','3DDC84'),LIN=ic('linux','0B1F3A'),WEB=ic('googlechrome','4285F4');
const side=`<div class="side"><span class="wm">link<span class="i"></span>v<span class="i s"></span></span><div class="nav on"><span class="ic">▭</span>Écrans</div><div class="nav"><span class="ic">☰</span>Programmation</div><div class="nav"><span class="ic">▣</span>Contenus</div><div class="nav"><span class="ic">▨</span>Statistiques</div><div class="spacer"></div><div class="nav"><span class="ic">⚙</span>Réglages</div></div>`;
const head=`<div class="head"><div><h1>Vos écrans</h1><p class="sub">Choisissez la liste de lecture et les widgets de chaque écran, puis publiez.</p></div><div><button class="btn">+ Ajouter ▾</button></div></div>`;
const tabs=(extra='')=>`<div class="tabs"><span class="on">Tous</span><span>Écrans de diffusion</span><span>Bornes interactives</span>${extra}</div>`;
const rows=`<div class="card"><div class="srow"><div class="thumb"></div><div><b>Salle LPR</b><br><small style="color:var(--muted)">Affichage en cours</small></div></div><div class="srow"><div class="thumb"></div><div><b>Accueil</b><br><small style="color:var(--muted)">Affichage en cours</small></div></div></div>`;
const S={
c:`<div class="app">${side}<div class="main">${head}${tabs()}${rows}
<div class="ghost"><div class="tvm">Votre prochain<br>écran</div><div class="t"><b>Un nouvel écran à connecter ?</b><small>Installez le player dessus, puis saisissez le code qu'il affiche.</small></div>
<div class="logos"><button class="lg" title="Windows">${WIN}</button><button class="lg" title="Android / TV">${AND}</button><button class="lg" title="Navigateur">${WEB}</button><button class="lg off" title="Linux (bientôt)">${LIN}</button></div></div></div></div>`,
d:`<div class="app">${side}<div class="main">${head}
<div class="steps"><div class="stp now"><i>1</i>Installer le player</div><div class="sep"></div><div class="stp"><i>2</i>Saisir le code</div><div class="sep"></div><div class="stp"><i>3</i>Publier une liste</div><button class="btn">⬇ Installer le player</button></div>
${tabs()}${rows}</div></div>`,
e:`<div class="app">${side}<div class="main">${head}${tabs(`<span class="pill">Installer le player <span class="logos"><span class="mini">${WIN}</span><span class="mini">${AND}</span><span class="mini">${WEB}</span></span></span>`)}${rows}</div></div>`};
const N={
c:"<b>C · Une carte dans la liste.</b> Une carte en pointillés orange pâle, à la suite des écrans, comme un écran « fantôme » : « Un nouvel écran à connecter ? » avec les quatre logos cliquables (Windows, Android, Navigateur, Linux grisé). Elle est là au bon endroit, au moment où l'on regarde ses écrans, et reste discrète. Elle disparaît si l'on a déjà plus de 3 écrans.",
d:"<b>D · Premiers pas.</b> Un bandeau de trois étapes sous le titre de la page Écrans : 1 Installer le player (étape en cours, bouton orange), 2 Saisir le code, 3 Publier une liste. Les étapes se cochent seules. Il disparaît quand les trois sont faites.",
e:"<b>E · Pastille d'onglets.</b> À droite de la rangée Tous / Écrans de diffusion / Bornes, une pastille « Installer le player » avec les trois logos. Toujours visible, jamais envahissante, sans disparaître."};
root.innerHTML=Object.keys(S).map(k=>`<div class="scene" id="${k}">${S[k]}</div>`).join('');
function show(s){document.querySelectorAll('.scene').forEach(e=>e.classList.toggle('on',e.id===s));document.querySelectorAll('#scs .sc').forEach(b=>b.classList.toggle('on',b.dataset.s===s));note.innerHTML=N[s]}
document.querySelectorAll('#scs .sc').forEach(b=>b.onclick=()=>show(b.dataset.s));show('c');
</script>
</body>
</html>
