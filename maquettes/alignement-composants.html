<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Alignement et espacement</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--signal:#3B82C4;--orange:#E8833A;--pink:#E0457B}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;color:var(--ink);font-size:14px;line-height:1.45;background:#fff;overflow:hidden}
button,select,input{font:inherit;color:inherit}
.mock{position:fixed;top:0;left:0;right:0;height:44px;z-index:100;background:#FFF8E1;border-bottom:1px dashed #E0B84A;padding:0 16px;font-size:13px;color:#6B5200;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow-x:auto}
.mock button{border:1px solid #E0B84A;background:#fff;border-radius:4px;padding:3px 11px;cursor:pointer;font-size:13px}
.mock button.on{background:#6B5200;color:#fff}
.mock .sp{flex:1}
.app{position:fixed;top:44px;left:0;right:0;bottom:0;display:flex}
.work{flex:1;display:flex;flex-direction:column;background:#E6EAF0;min-width:0}
.tbar{height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 14px;flex:none}
.tbar b{font-weight:500;margin-right:10px}
.tg{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:4px;background:#fff;cursor:pointer;font-size:13px;color:var(--muted)}
.tg.on{border-color:var(--signal);color:var(--signal);background:#EEF5FC}
.tg svg{width:16px;height:16px}
.tbar .sp{flex:1}
.tbar small{color:var(--muted);font-size:12px}
.wrap{flex:1;position:relative;overflow:hidden}
#stage{position:absolute;box-shadow:0 6px 24px rgba(11,31,58,.18);touch-action:none}
.el{position:absolute;user-select:none;cursor:move;overflow:hidden}
.el.sel{outline:2px solid var(--signal);outline-offset:0;z-index:2}
.el.hov{outline:1px solid var(--signal)}
.el.t{white-space:nowrap;font-family:Montserrat,sans-serif;font-weight:700;display:flex;align-items:center;line-height:1}
.el.t.sub{font-family:"IBM Plex Sans";font-weight:400}
.el.img{background:linear-gradient(160deg,#9CB6D3 0%,#5D7FA8 55%,#2E4E77 100%);border-radius:.3em;display:grid;place-items:center;color:rgba(255,255,255,.8)}
.el.img svg{width:22%;height:22%}
.el.card{background:#fff;border-radius:.5em;padding:.9em 1em;display:flex;flex-direction:column;gap:.3em;box-shadow:0 .1em .4em rgba(0,0,0,.15)}
.el.card .ic{width:1.8em;height:1.8em;color:var(--signal)}
.el.card small{color:var(--muted);font-size:.9em}
.el.card strong{font-size:2em;font-weight:600;line-height:1.1}
.el.chart .bars{flex:1;display:flex;align-items:flex-end;gap:.4em}
.el.chart .bars i{flex:1;background:var(--signal);border-radius:.15em .15em 0 0;opacity:.85}
.el.logo{border:1.5px dashed rgba(255,255,255,.6);border-radius:.3em;display:grid;place-items:center;color:rgba(255,255,255,.85);font-family:Montserrat;font-weight:800;letter-spacing:.1em}
.el.logo.dk{border-color:var(--line-2);color:var(--muted)}
.el.btn{background:var(--ink);color:#fff;border-radius:.6em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;font-weight:500;font-size:1em}
.el.btn svg{width:2.4em;height:2.4em;opacity:.9}
.el.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line-2);flex-direction:row}
.el.btn.alt svg{width:1.4em;height:1.4em}
.el.glass{background:rgba(11,31,58,.62);color:#fff;border-radius:.5em;padding:.7em 1em;display:flex;align-items:center;gap:.7em;backdrop-filter:blur(4px)}
.el.glass .ic{width:2.4em;height:2.4em;flex:none}
.el.glass strong{font-size:1.9em;font-weight:600;line-height:1}
.el.glass small{opacity:.8;font-size:.85em;display:block}
.el.qr{background:#fff;border-radius:.3em;padding:.6em;display:grid;place-items:center}
.el.qr svg{width:100%;height:100%}
.el.ticker{background:var(--orange);color:#fff;display:flex;align-items:center;padding:0 1em;gap:1em;white-space:nowrap;font-weight:500}
.el.ticker em{font-style:normal;background:rgba(0,0,0,.18);padding:.15em .6em;border-radius:.2em;font-size:.85em}
.hd{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;background:#fff;border:1.5px solid var(--signal);border-radius:2px;z-index:5}
.gp{position:absolute;z-index:6;transform:translate(-50%,-50%);background:var(--orange);color:#fff;font-size:11px;font-weight:600;border-radius:9px;padding:1px 7px;cursor:ew-resize;box-shadow:0 1px 3px rgba(0,0,0,.25);white-space:nowrap;user-select:none}
.gp.v{cursor:ns-resize}
.gp:hover{background:#D06F28}
.bbox{position:absolute;border:1px dashed var(--signal);pointer-events:none;z-index:4}
.band{position:absolute;border:1px solid var(--signal);background:rgba(59,130,196,.08);pointer-events:none;z-index:7}
#ov{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:8}
#ov text{font:600 11px "IBM Plex Sans",sans-serif}
.float{position:absolute;z-index:20;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(11,31,58,.22);display:flex;align-items:center;padding:4px;gap:2px;white-space:nowrap}
.float button{width:32px;height:32px;border:0;background:none;border-radius:5px;cursor:pointer;display:grid;place-items:center;color:var(--ink);position:relative}
.float button:hover{background:var(--tint,#EBEDF0)}
.float button:disabled{opacity:.3;cursor:default;background:none}
.float button svg{width:18px;height:18px}
.float .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.float .gapf{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:0 4px}
.float .gapf input{width:54px;height:28px;border:1px solid var(--line-2);border-radius:4px;padding:0 6px;font-size:13px;color:var(--ink)}
.float .lbl{font-size:12px;color:var(--muted);padding:0 6px 0 4px}
.tip{position:absolute;z-index:30;background:var(--ink);color:#fff;font-size:12px;padding:3px 8px;border-radius:4px;pointer-events:none;white-space:nowrap;display:none}
.side{width:330px;flex:none;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:18px 20px 30px}
.side h2{font-size:16px;font-weight:600;margin:0 0 4px}
.side h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.side p{margin:0 0 8px;color:var(--muted);font-size:13px}
.side ol{margin:0;padding-left:20px;font-size:13px}.side ol li{margin-bottom:7px}
.lg{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-bottom:8px}
.lg i{flex:none;width:26px;height:14px;margin-top:3px;display:grid;place-items:center}
.kbd{display:inline-block;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:0 5px;font-size:11px;background:#F7F9FB;margin-right:4px}
.kb{font-size:13px;margin-bottom:6px}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}
.pos span{background:var(--bg);border-radius:4px;padding:4px 8px}.pos span b{font-weight:500;color:var(--muted);margin-right:6px}
.cmp{font-size:13px;border-collapse:collapse;width:100%}
.cmp td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
.cmp td:first-child{color:var(--muted);width:42%}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="mock">
  <span>Maquette — alignement et espacement :</span>
  <button data-sc="compo" class="on">Créateur de composition</button>
  <button data-sc="ilist">Créateur de liste interactive</button>
  <button data-sc="screen">Widgets sur un écran</button>
  <span class="sp"></span>
  <button id="reset">Remettre en désordre</button>
</div>
<div class="app">
  <div class="work">
    <div class="tbar">
      <b id="title">Composition</b>
      <button class="tg on" id="tgSnap" title="Aimanter aux autres composants (maintenir Alt pour désactiver un instant)"></button>
      <button class="tg" id="tgDist" title="Montrer les distances jusqu'aux voisins"></button>
      <button class="tg" id="undo" title="Annuler (Ctrl+Z)"></button>
      <span class="sp"></span>
      <small id="hint">Glissez, redimensionnez, sélectionnez plusieurs composants (Maj+clic ou cadre)</small>
    </div>
    <div class="wrap" id="wrap">
      <div id="stage"></div>
      <div class="float" id="float" style="display:none"></div>
      <div class="tip" id="tip"></div>
    </div>
  </div>
  <aside class="side" id="side"></aside>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const SV = (p, f) => `<svg viewBox="0 0 24 24" fill="${f ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  al:'<path d="M4 3v18"/><rect x="7" y="6" width="12" height="4" rx="1"/><rect x="7" y="14" width="7" height="4" rx="1"/>',
  ac:'<path d="M12 3v18"/><rect x="5" y="6" width="14" height="4" rx="1"/><rect x="8" y="14" width="8" height="4" rx="1"/>',
  ar:'<path d="M20 3v18"/><rect x="5" y="6" width="12" height="4" rx="1"/><rect x="10" y="14" width="7" height="4" rx="1"/>',
  at:'<path d="M3 4h18"/><rect x="6" y="7" width="4" height="12" rx="1"/><rect x="14" y="7" width="4" height="7" rx="1"/>',
  am:'<path d="M3 12h18"/><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="8" width="4" height="8" rx="1"/>',
  ab:'<path d="M3 20h18"/><rect x="6" y="5" width="4" height="12" rx="1"/><rect x="14" y="10" width="4" height="7" rx="1"/>',
  dh:'<path d="M3 3v18M21 3v18"/><rect x="7" y="7" width="3" height="10" rx="1"/><rect x="14" y="7" width="3" height="10" rx="1"/>',
  dv:'<path d="M3 3h18M3 21h18"/><rect x="7" y="7" width="10" height="3" rx="1"/><rect x="7" y="14" width="10" height="3" rx="1"/>',
  sw:'<path d="M4 12h16M4 12l3-3M4 12l3 3M20 12l-3-3M20 12l-3 3"/>',
  sh:'<path d="M12 4v16M12 4l-3 3M12 4l3 3M12 20l-3-3M12 20l3-3"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',
  magnet:'<path d="M6 3v8a6 6 0 0 0 12 0V3h-4v8a2 2 0 0 1-4 0V3z"/><path d="M6 7h4M14 7h4"/>',
  ruler:'<path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  img:'<path d="M3 18l5-6 4 4 3-3 6 5"/><circle cx="16" cy="7" r="2"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  food:'<path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M16 3c-2 2-2 6 0 8v10"/>',
  wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r=".5"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  group:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1.5 6 4"/>'
};
const QR = (() => { let s = '<svg viewBox="0 0 21 21" shape-rendering="crispEdges">'; const f = (x, y) => s += `<rect x="${x}" y="${y}" width="1" height="1" fill="#0B1F3A"/>`;
  const eye = (x, y) => { for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) if (i == 0 || j == 0 || i == 6 || j == 6 || (i > 1 && i < 5 && j > 1 && j < 5)) f(x + i, y + j); };
  eye(0, 0); eye(14, 0); eye(0, 14); let r = 7; for (let i = 0; i < 21; i++) for (let j = 0; j < 21; j++) { if ((i < 8 && j < 8) || (i > 12 && j < 8) || (i < 8 && j > 12)) continue; r = (r * 9301 + 49297) % 233280; if (r / 233280 > .55) f(i, j); } return s + '</svg>'; })();

/* ---------- scènes ---------- */
const SCENES = {
  compo: { name: 'Composition', W: 1920, H: 1080, bg: 'linear-gradient(135deg,#0B1F3A,#1C3D66)', els: [
    { id: 't1', k: 'text', x: 120, y: 84, w: 980, h: 110, label: 'Bienvenue chez Atelier Nord', col: '#fff' },
    { id: 's1', k: 'sub', x: 126, y: 206, w: 640, h: 50, label: 'Les chiffres de la semaine', col: '#AFC3DA' },
    { id: 'im', k: 'image', x: 120, y: 300, w: 780, h: 560 },
    { id: 'k1', k: 'card', x: 980, y: 300, w: 380, h: 250, label: 'Ventes', val: '12 480 CHF', ic: 'chart' },
    { id: 'k2', k: 'card', x: 1418, y: 318, w: 352, h: 250, label: 'Visiteurs', val: '3 214', ic: 'user' },
    { id: 'k3', k: 'card', x: 992, y: 612, w: 350, h: 236, label: 'Satisfaction', val: '94 %', ic: 'star' },
    { id: 'ch', k: 'chart', x: 1404, y: 624, w: 396, h: 240, label: 'Tendance' },
    { id: 'lg', k: 'logo', x: 1590, y: 96, w: 210, h: 92, label: 'LOGO' } ],
    tests: [
      'Glissez <b>Visiteurs</b> vers le haut : il s’aligne sur le haut de <b>Ventes</b>, une ligne rose relie les deux.',
      'Glissez <b>Satisfaction</b> sous <b>Ventes</b> : ses bords gauche, centre et droit s’aimantent aux siens.',
      'Glissez <b>Visiteurs</b> à droite de <b>Ventes</b> : quand l’écart à gauche égale celui de la rangée du dessous, deux traits orange s’affichent avec la valeur.',
      'Tirez la poignée droite de <b>Satisfaction</b> : le bord s’aimante au bord de <b>Ventes</b>, et « = L 380 » s’affiche quand les largeurs sont égales.',
      'Sélectionnez les 4 cartes (cadre autour), puis <b>Ranger en grille</b> : écarts identiques partout.',
      'Sélectionnez <b>Ventes</b> et <b>Visiteurs</b> puis tirez la pastille orange entre eux : l’écart change.'
    ] },
  ilist: { name: 'Liste interactive', W: 1080, H: 1920, bg: '#F5F7FA', els: [
    { id: 'h', k: 'text', x: 90, y: 130, w: 900, h: 110, label: 'Que cherchez-vous ?', col: '#0B1F3A' },
    { id: 'b1', k: 'btn', x: 90, y: 330, w: 420, h: 300, label: 'Plan du site', ic: 'map' },
    { id: 'b2', k: 'btn', x: 588, y: 346, w: 400, h: 300, label: 'Horaires', ic: 'clock' },
    { id: 'b3', k: 'btn', x: 104, y: 690, w: 410, h: 290, label: 'Restaurant', ic: 'food' },
    { id: 'b4', k: 'btn', x: 566, y: 702, w: 424, h: 300, label: 'Événements', ic: 'cal' },
    { id: 'b5', k: 'btn', x: 90, y: 1068, w: 400, h: 300, label: 'Wi-Fi', ic: 'wifi' },
    { id: 'b6', k: 'btn', x: 556, y: 1040, w: 434, h: 312, label: 'Nous contacter', ic: 'info' },
    { id: 'bk', k: 'btnalt', x: 90, y: 1700, w: 300, h: 110, label: 'Retour', ic: 'back' },
    { id: 'lg', k: 'logodk', x: 780, y: 1714, w: 210, h: 90, label: 'LOGO' } ],
    tests: [
      'Glissez <b>Horaires</b> vers la gauche : il s’aligne sur le haut de <b>Plan du site</b> et sur le bord droit du titre.',
      'Glissez <b>Restaurant</b> : il s’aligne sur la colonne de <b>Plan du site</b> ; l’écart vertical s’aimante quand il égale celui d’à côté (orange).',
      'Tirez le bas de <b>Wi-Fi</b> : il s’aimante sur le bas de <b>Nous contacter</b>, « = H » quand les hauteurs sont égales.',
      'Sélectionnez les 6 boutons, puis <b>Même largeur</b>, <b>Même hauteur</b> et <b>Ranger en grille</b>.',
      'Avec les 6 boutons rangés, changez <b>Écart</b> (ex. 60) : toute la grille se resserre ou s’écarte.',
      'Sélectionnez un seul bouton et cliquez <b>Centrer</b> : il se centre sur la page.'
    ] },
  screen: { name: 'Widgets sur un écran', W: 1920, H: 1080, bg: 'radial-gradient(circle at 30% 40%,#7FA6C9 0%,#3E6690 45%,#1B3557 100%)', els: [
    { id: 'lg', k: 'logo', x: 60, y: 56, w: 230, h: 100, label: 'LOGO' },
    { id: 'cp', k: 'glass', x: 1150, y: 60, w: 330, h: 150, label: 'Visiteurs aujourd’hui', val: '418', ic: 'group' },
    { id: 'mt', k: 'glass', x: 1520, y: 72, w: 340, h: 150, label: 'Genève · Ensoleillé', val: '21°', ic: 'sun' },
    { id: 'hr', k: 'glass', x: 1534, y: 262, w: 326, h: 130, label: 'Mercredi 5 novembre', val: '14:32', ic: 'clock' },
    { id: 'qr', k: 'qr', x: 1650, y: 740, w: 200, h: 200 },
    { id: 'tk', k: 'ticker', x: 60, y: 960, w: 1520, h: 74, label: 'Portes ouvertes samedi de 10 h à 16 h — Inscriptions à l’accueil' } ],
    tests: [
      'Glissez <b>Heure</b> : son bord droit et son centre s’aimantent à ceux de <b>Météo</b>.',
      'Glissez <b>Visiteurs</b> sur la même ligne que <b>Météo</b> : haut, milieu ou bas alignés.',
      'Glissez le <b>QR code</b> vers le bas : il s’aligne sur le bas du bandeau, et sa droite sur celle des widgets du dessus.',
      'Tirez la poignée droite du <b>bandeau</b> : elle s’aimante au bord gauche du QR code ; l’écart s’affiche en orange s’il égale un autre.',
      'Sélectionnez <b>Visiteurs</b>, <b>Météo</b> et <b>Logo</b>, puis <b>Aligner en haut</b> et <b>Répartir</b>.',
      'Sélectionnez <b>Météo</b> et <b>Heure</b> : tirez la pastille orange pour régler l’écart vertical.'
    ] }
};

/* ---------- état ---------- */
let scKey = 'compo', W, H, els, sel = [], z = 1, drag = null, live = null, snapOn = true, distOn = false, hist = [], hover = null, offX = 0, offY = 0;
function load(k) { scKey = k; const s = SCENES[k]; W = s.W; H = s.H; els = JSON.parse(JSON.stringify(s.els)); sel = []; hist = []; live = null;
  document.querySelectorAll('.mock [data-sc]').forEach(b => b.classList.toggle('on', b.dataset.sc === k)); $('#title').textContent = s.name; fit(); side(); }
const byId = id => els.find(e => e.id === id);
const selEls = () => sel.map(byId).filter(Boolean);
const bbox = L => { const x = Math.min(...L.map(o => o.x)), y = Math.min(...L.map(o => o.y)); return { x, y, w: Math.max(...L.map(o => o.x + o.w)) - x, h: Math.max(...L.map(o => o.y + o.h)) - y }; };
const R = v => Math.round(v);
function pushHist() { hist.push(JSON.stringify(els)); if (hist.length > 60) hist.shift(); }
function undo() { if (!hist.length) return toast('Rien à annuler'); els = JSON.parse(hist.pop()); render(); }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1600); }

  <div class="lg"><i><svg width="26" height="14"><line x1="0" y1="7" x2="26" y2="7" stroke="#E0457B" stroke-width="1.5"/><path d="M10 4l6 6M16 4l-6 6" stroke="#E0457B" stroke-width="1.4"/></svg></i><span><b>Ligne rose</b> : alignement avec un autre composant (bord ou centre). Elle relie seulement les composants concernés.</span></div>
  <div class="lg"><i><svg width="26" height="14"><line x1="0" y1="7" x2="26" y2="7" stroke="#E0457B" stroke-dasharray="5 4" stroke-width="1.5"/></svg></i><span><b>Pointillé rose</b> : bord ou milieu de la page.</span></div>
  <div class="lg"><i><svg width="26" height="14"><line x1="2" y1="7" x2="24" y2="7" stroke="#E8833A" stroke-width="1.5"/><line x1="2" y1="2" x2="2" y2="12" stroke="#E8833A" stroke-width="1.5"/><line x1="24" y1="2" x2="24" y2="12" stroke="#E8833A" stroke-width="1.5"/></svg></i><span><b>Trait orange</b> : écarts égaux, avec leur valeur en px (centré entre deux voisins, ou même écart qu’ailleurs).</span></div>
  <div class="lg"><i><svg width="26" height="14"><rect x="0" y="0" width="26" height="14" rx="4" fill="#E0457B"/><text x="13" y="10.5" text-anchor="middle" fill="#fff" font-size="8" font-family="sans-serif">= L</text></svg></i><span><b>= L / = H</b> : même largeur ou même hauteur qu’un autre composant (en redimensionnant).</span></div>
  <div class="lg"><i><svg width="26" height="14"><rect x="2" y="1" width="22" height="12" rx="6" fill="#E8833A"/><text x="13" y="10" text-anchor="middle" fill="#fff" font-size="8" font-family="sans-serif">40</text></svg></i><span><b>Pastille orange</b> entre composants sélectionnés en rangée ou en colonne : tirez-la pour changer tous les écarts d’un coup.</span></div>
  <h3>Raccourcis</h3>
  <div class="kb"><span class="kbd">Alt</span> pendant le geste : sans aimantation</div>
  <div class="kb"><span class="kbd">Maj</span> en glissant : déplacement droit (horizontal ou vertical)</div>
  <div class="kb"><span class="kbd">Maj</span>+clic : ajouter à la sélection</div>
  <div class="kb"><span class="kbd">←↑→↓</span> 1 px · <span class="kbd">Maj</span>+flèche 10 px</div>
  <div class="kb"><span class="kbd">Ctrl</span><span class="kbd">Z</span> annuler</div>
  <h3>Sélection</h3><div id="posbox"></div>
  <h3>Par rapport à aujourd’hui</h3>
  <table class="cmp"><tr><td>Composition</td><td>aimante déjà sur les autres en déplacement ; ajoute le redimensionnement, les écarts égaux et les outils de sélection</td></tr>
  <tr><td>Liste interactive</td><td>seulement le milieu et les bords de page → mêmes aides que la composition</td></tr>
  <tr><td>Widgets d’un écran</td><td>mêmes aides, widgets alignables entre eux</td></tr></table>`;
  posInfo(); }

/* ---------- gestes ---------- */
const pt = ev => { const r = $('#stage').getBoundingClientRect(); return { x: (ev.clientX - r.left) / z, y: (ev.clientY - r.top) / z }; };
$('#stage').addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return; const p = pt(ev), hd = ev.target.closest('.hd'), gp = ev.target.closest('.gp'), el = ev.target.closest('.el');
  const wr = $('#wrap').getBoundingClientRect(), base = { sx: p.x, sy: p.y, cx: ev.clientX - wr.left, cy: ev.clientY - wr.top, moved: false };
  if (hd) { const e = selEls()[0]; drag = { ...base, mode: 'r', dir: hd.dataset.d, o: { ...e } }; }
  else if (gp) { const ar = arrange(selEls()); drag = { ...base, mode: 'gap', A: ar.A, items: ar.items, g0: ar.gaps[+gp.dataset.i] }; }
  else if (el) { const id = el.dataset.id;
    if (ev.shiftKey) { sel = sel.includes(id) ? sel.filter(s => s !== id) : [...sel, id]; if (!sel.includes(id)) { render(); return; } }
    else if (!sel.includes(id)) sel = [id];
    const L = selEls(); drag = { ...base, mode: 'm', os: L.map(o => ({ id: o.id, x: o.x, y: o.y })), bb: bbox(L) }; }
  else { drag = { ...base, mode: 'band', base: ev.shiftKey ? [...sel] : [] }; if (!ev.shiftKey) sel = []; }
  render();
});
window.addEventListener('pointermove', ev => {
  if (!drag) { const el = ev.target.closest && ev.target.closest('#stage .el'), h2 = el ? el.dataset.id : null; if (h2 !== hover) { hover = h2; render(); } return; }
  const p = pt(ev), wr = $('#wrap').getBoundingClientRect(); let dx = p.x - drag.sx, dy = p.y - drag.sy; drag.cx = ev.clientX - wr.left; drag.cy = ev.clientY - wr.top;
  if (!drag.moved) { if (Math.hypot(dx, dy) * z < 3) return; drag.moved = true; if (drag.mode !== 'band') pushHist(); }
  const snapping = snapOn && !ev.altKey;
  if (drag.mode === 'm') {
    let lock = null; if (ev.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) { dy = 0; lock = false; } else { dx = 0; lock = true; } }
    const b = { x: drag.bb.x + dx, y: drag.bb.y + dy, w: drag.bb.w, h: drag.bb.h }, ign = new Set(drag.os.map(o => o.id)), os = els.filter(o => !ign.has(o.id));
    if (snapping) snapMove(b, os, lock); else { b.x = R(b.x); b.y = R(b.y); }
    const mx = b.x - drag.bb.x, my = b.y - drag.bb.y; drag.os.forEach(o => { const e = byId(o.id); e.x = o.x + mx; e.y = o.y + my; });
    live = snapping ? guidesFor(b, os, false) : null; drag.info = `X ${b.x} · Y ${b.y}`;
  } else if (drag.mode === 'r') {
    const o = drag.o, d = drag.dir, b = { ...o }, min = 30;
    if (d.includes('e')) b.w = o.w + dx; if (d.includes('s')) b.h = o.h + dy;
    if (d.includes('w')) { b.x = o.x + dx; b.w = o.w - dx; } if (d.includes('n')) { b.y = o.y + dy; b.h = o.h - dy; }
    const os = els.filter(x => x.id !== o.id);
    if (snapping) snapResize(b, d, os); else { b.x = R(b.x); b.y = R(b.y); b.w = R(b.w); b.h = R(b.h); }
    if (b.w < min) { if (d.includes('w')) b.x = o.x + o.w - min; b.w = min; } if (b.h < min) { if (d.includes('n')) b.y = o.y + o.h - min; b.h = min; }
    Object.assign(byId(o.id), { x: b.x, y: b.y, w: b.w, h: b.h });
    live = snapping ? guidesFor(b, os, true) : null; drag.info = `${b.w} × ${b.h}`;
  } else if (drag.mode === 'gap') {
    let g = drag.g0 + (drag.A ? dx : dy); if (ev.shiftKey) g = Math.round(g / 10) * 10; g = Math.max(0, R(g));
    setGap(drag.items, drag.A, g); live = null; drag.info = `Écart ${g} px`;
  } else if (drag.mode === 'band') {
    const r = { x: Math.min(drag.sx, p.x), y: Math.min(drag.sy, p.y), w: Math.abs(dx), h: Math.abs(dy) }; drag.r = r;
    const hits = els.filter(o => o.x < r.x + r.w && o.x + o.w > r.x && o.y < r.y + r.h && o.y + o.h > r.y).map(o => o.id);
    sel = [...new Set([...drag.base, ...hits])];
  }
  render();
});
window.addEventListener('pointerup', () => { if (!drag) return; drag = null; live = null; render(); });
window.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(); return; }
  const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key]; if (!k || !sel.length) return;
  ev.preventDefault(); if (!ev.repeat) pushHist(); const s = ev.shiftKey ? 10 : 1; selEls().forEach(o => { o.x += k[0] * s; o.y += k[1] * s; }); render();
});

/* ---------- barre d'outils ---------- */
$('#tgSnap').innerHTML = SV(IC.magnet) + 'Aimantation'; $('#tgDist').innerHTML = SV(IC.ruler) + 'Distances'; $('#undo').innerHTML = SV(IC.undo) + 'Annuler';
$('#tgSnap').onclick = () => { snapOn = !snapOn; $('#tgSnap').classList.toggle('on', snapOn); toast(snapOn ? 'Aimantation activée' : 'Aimantation désactivée'); };
$('#tgDist').onclick = () => { distOn = !distOn; $('#tgDist').classList.toggle('on', distOn); render(); };
$('#undo').onclick = undo;
document.querySelectorAll('.mock [data-sc]').forEach(b => b.onclick = () => load(b.dataset.sc));
$('#reset').onclick = () => load(scKey);
window.addEventListener('resize', fit);
load('compo');
</script>
