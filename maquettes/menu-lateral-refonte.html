<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Refonte des items du menu latéral</title>
<style>
:root{--bg:#F3F5F8;--surface:#fff;--ink:#0B1F3A;--text:#1B2433;--muted:#6B7686;--line:#E1E5EB;--line-2:#CDD3DC;--row:#F0F2F6;
  --brand:#0B1F3A;--signal:#3B82C4;--signal-t:rgba(59,130,196,.12);--orange:#E8751A;
  --ok:#1E8E5A;--warn:#B7791F;--warn-bg:#FBF0DA;--warn-ink:#7A4E0C;--danger:#C0392B;
  --sans:"IBM Plex Sans","Segoe UI Variable","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}button{font:inherit;color:inherit;cursor:pointer}
svg{display:block;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.mock{position:sticky;top:0;z-index:90;background:#fff;border-bottom:1px dashed var(--line-2);padding:8px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:#E8EBF0;border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;color:var(--muted);font-size:12.5px}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px #0002;font-weight:600}

.stage{display:grid;grid-template-columns:auto 1fr;gap:0;min-height:calc(100vh - 45px)}
.notes{padding:34px 44px 80px;max-width:820px}
.notes h1{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin-bottom:6px}
.notes .lead{color:var(--muted);margin-bottom:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:14px}
.card h3{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px;letter-spacing:.01em}
.card ul{margin:0;padding-left:18px;color:#3b4658}.card li{margin:3px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:1px 7px;border-radius:4px;background:var(--row);color:var(--muted)}
.tag.ok{background:#E1F0E8;color:#155A38}.tag.ko{background:#FBE4E2;color:#8A231C}
.count{display:flex;gap:26px;margin:4px 0 2px}.count div b{display:block;font-size:26px;font-weight:600;color:var(--ink);line-height:1.1}.count div span{font-size:12px;color:var(--muted)}
.hubdemo{margin-top:6px;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}
.hubdemo .tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);background:#FAFBFC}
.hubdemo .tabs span{padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.hubdemo .tabs span.on{color:var(--ink);font-weight:600;border-color:var(--signal)}
.hubdemo .body{height:54px;background:repeating-linear-gradient(0deg,#fff 0 12px,#F6F7F9 12px 14px);}

/* ---------- le menu ---------- */
.side{width:256px;height:calc(100vh - 45px);position:sticky;top:45px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px 10px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 12px}
.brand img{height:26px;width:auto}
.brand .meta{display:flex;align-items:center;gap:6px;margin-left:2px}
.plan{font-size:10.5px;font-weight:600;letter-spacing:.04em;border-radius:3px;padding:1px 7px;background:var(--row);color:var(--muted)}
.plan.pro{background:var(--warn-bg);color:var(--warn-ink)}
.ver{font-size:11px;color:var(--muted)}
.fold{margin-left:auto;border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:5px;display:grid;place-items:center}
.fold:hover{background:var(--row)}.fold svg{width:16px;height:16px}

.nav-scroll{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.sp{flex:1;min-height:8px}
.grp{font-size:10.5px;font-weight:600;letter-spacing:.07em;color:#8E98A8;padding:14px 10px 4px;text-transform:uppercase}
.sep{height:1px;background:var(--line);margin:8px 10px}
.it{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:5px;color:var(--text);font-size:14px;position:relative}
.it svg{width:18px;height:18px;color:#5A6678}
.it:hover{background:var(--row)}
.it.on{background:var(--signal-t);font-weight:600;color:var(--ink)}
.it.on svg{color:var(--signal)}
.it.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
.it .n{margin-left:auto;font-size:11.5px;min-width:20px;text-align:center;border-radius:9px;padding:0 6px;background:var(--row);color:var(--muted);font-variant-numeric:tabular-nums}
.it .n.warn{background:var(--orange);color:#fff;font-weight:600}
.it .n.new{background:var(--danger);color:#fff;font-weight:600}
.it .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.it .chev{margin-left:auto;width:14px;height:14px;color:#9AA3B0;transition:transform .15s}
.it.exp-only .xo{margin-left:6px;font-size:9.5px;letter-spacing:.05em;font-weight:600;color:var(--signal);background:var(--signal-t);border-radius:3px;padding:0 5px}
.it.hero{font-weight:600;color:var(--ink)}
.it.hero svg{color:var(--ink)}
.sub{margin:1px 0 2px 21px;padding-left:10px;border-left:1px solid var(--line)}
.sub .it{padding:5px 10px;font-size:13.5px}
.sub .it svg{width:16px;height:16px}
.grpbtn{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:14px 10px 4px;font-size:10.5px;font-weight:600;letter-spacing:.07em;color:#8E98A8;text-transform:uppercase;text-align:left}
.grpbtn svg{width:12px;height:12px;margin-left:auto;transition:transform .15s}
.grpbtn.shut svg{transform:rotate(-90deg)}

.mode{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:5px;font-size:13.5px;color:var(--muted);text-align:left}
.mode svg{width:18px;height:18px}
.mode .sw{margin-left:auto;width:32px;height:18px;border-radius:9px;background:#CDD3DC;position:relative;transition:.15s}
.mode .sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0004;transition:.15s}
.mode.on .sw{background:var(--signal)}.mode.on .sw::after{left:16px}
.user{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:6px;padding:10px 8px 2px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.who{min-width:0;line-height:1.25}.who b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user .up{margin-left:auto;width:16px;height:16px;color:#9AA3B0}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
@media(max-width:820px){.stage{grid-template-columns:1fr}.side{position:static;height:auto;width:100%}.notes{padding:20px 16px}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="mock">
  <b style="color:var(--ink)">Menu latéral — refonte des items</b>
  <span class="seg" id="vSeg">
    <button data-v="0" class="on">Aujourd’hui</button>
    <button data-v="1">A · Par tâche</button>
    <button data-v="2">B · Groupes repliables</button>
    <button data-v="3">C · Pages « hub »</button>
  </span>
  <span class="seg" id="mSeg">
    <button data-m="0">Mode simple</button>
    <button data-m="1" class="on">Mode expert</button>
  </span>
  <span>Maquette seule — rien n’est codé.</span>
</div>

<div class="stage">
  <aside class="side" id="side"></aside>
  <section class="notes" id="notes"></section>
</div>

<script>
const I = {
  screens:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  lists:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  plan:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  media:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  compo:'<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="5" rx="1"/><rect x="13" y="11" width="8" height="10" rx="1"/><rect x="3" y="14" width="8" height="7" rx="1"/>',
  widgets:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  integ:'<path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v5"/>',
  stats:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/>',
  team:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 1.8 4 4.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  bars:'<path d="M4 7h16M4 12h16M4 17h10"/>',
  fold:'<path d="M15 6l-6 6 6 6"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  up:'<path d="M6 15l6-6 6 6"/>',
  cloud:'<path d="M7 18a4 4 0 0 1-.6-7.9A6 6 0 0 1 18 9.5 4.3 4.3 0 0 1 17.5 18z"/>'
};
const ic = k => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;

// it(clé, libellé, {x:expert seulement, n:pastille, kind:warn|new|dot, hero})
const it=(k,l,o={})=>({k,l,...o});
const ITEMS={
  screens:it('screens','Écrans',{n:'12',nk:'',extra:{n:'1',nk:'warn'},hero:1}),
  lists:it('lists','Listes de lecture',{n:'8'}),
  plan:it('plan','Planning',{x:1}),
  media:it('media','Médiathèque',{n:'2',nk:'new'}),
  compo:it('compo','Compositions',{n:'3'}),
  widgets:it('widgets','Widgets'),
  integ:it('integ','Intégrations',{dot:1}),
  stats:it('stats','Statistiques',{x:1}),
  team:it('team','Organisation',{x:1,n:'6'}),
  gear:it('gear','Réglages')
};
const S=(k,o)=>({...ITEMS[k],...o});

// ---------- structures par variante ----------
function struct(v,expert){
  const keep=a=>a.filter(i=>!i.x||expert);
  if(v==0){ // Aujourd'hui : liste plate, séparateurs, bas du menu
    const top=keep([S('screens',{label:'Écrans',hero:0}),S('lists'),S('plan'),'sep',S('media',{l:'Médiathèque'}),S('compo')]);
    const bot=keep([ ...(expert?[S('team',{l:'Membres'}),'sep']:['sep']),S('integ'),S('widgets'),'sep',S('stats'),S('gear')]);
    return {blocks:[{items:top},'sp',{items:bot}]};
  }
  if(v==1){
    return {blocks:[
      {grp:'Diffuser',items:keep([S('screens',{hero:0}),S('lists'),S('plan')])},
      {grp:'Contenus',items:keep([S('media'),S('compo'),S('widgets'),S('integ')])},
      {grp:'Suivre',items:keep([S('stats')]),hide:!expert},
      'sp',
      {grp:'Administration',items:keep([S('team'),S('gear')])}
    ]};
  }
  if(v==2){
    return {blocks:[
      {items:keep([S('screens',{hero:0}),S('lists'),S('plan')])},
      {fold:'contenus',grp:'Contenus',items:keep([S('media'),S('compo'),S('widgets'),S('integ')])},
      {items:keep([S('stats')]),hide:!expert},
      'sp',
      {fold:'admin',grp:'Administration',items:keep([S('team'),S('gear')])}
    ]};
  }
  // C : hubs
  return {blocks:[
    {items:[S('screens',{hero:0})]},
    {items:[{k:'lists',l:'Programmation',n:'8'}]},
    {items:[{k:'media',l:'Contenus',n:'2',nk:'new',dot:0}]},
    {items:keep([S('stats')])},
    'sp',
    {items:keep([S('team',{l:'Organisation'}),S('gear')])}
  ]};
}

const state={v:0,m:1,sel:'screens',shut:{contenus:false,admin:true}};
const tipsExpertOnly=(v)=>v>0;

function renderItem(i,v){
  const on=state.sel===i.k+'|'+i.l;
  let right='';
  if(i.dot) right='<span class="dot" title="Une intégration est en erreur"></span>';
  else if(i.extra&&v<3) right=`<span class="n ${i.extra.nk}" title="Écran hors ligne">${i.extra.n}</span>`;
  else if(i.n) right=`<span class="n ${i.nk||''}">${i.n}</span>`;
  if(i.k==='screens'&&v===3) right='<span class="n warn" title="Écran hors ligne">1</span>';
  return `<button class="it ${on?'on':''} ${i.hero?'hero':''}" data-sel="${i.k}|${i.l}">${ic(i.k)}<span>${i.l}</span>${right}</button>`;
}
function renderSide(){
  const v=state.v, ex=!!state.m, st=struct(v,ex);
  let h=`<div class="brand"><img src="../Linkii.Poc/wwwroot/brand/logo-long.png" alt="Linkivi" onerror="this.outerHTML='<b style=&quot;font-size:18px;color:#0B1F3A&quot;>Linkivi</b>'"><span class="meta"><span class="plan">Essential</span><span class="ver">v1.27</span></span><button class="fold" title="Replier le menu">${ic('fold')}</button></div>`;
  h+='<div class="nav-scroll">';
  st.blocks.forEach((b,bi)=>{
    if(b==='sp'){h+='<div class="sp"></div>';return}
    if(b.hide||!b.items.length)return;
    if(v===0&&bi>0&&b.items[0]!=='sep'&&bi!==2) h+='';
    if(b.fold){
      const shut=state.shut[b.fold];
      h+=`<button class="grpbtn ${shut?'shut':''}" data-fold="${b.fold}">${b.grp}${ic('chev')}</button>`;
      if(!shut) h+=b.items.map(i=>renderItem(i,v)).join('');
    } else {
      if(b.grp) h+=`<div class="grp">${b.grp}</div>`;
      h+=b.items.map(i=>i==='sep'?'<div class="sep"></div>':renderItem(i,v)).join('');
    }
    if(v>=2&&!b.fold&&b.items.length&&bi<st.blocks.length-1&&st.blocks[bi+1]!=='sp'&&!(st.blocks[bi+1].hide)) h+=v===2?'':'<div class="sep"></div>';
  });
  h+='</div>';
  h+=`<button class="mode ${ex?'on':''}" id="modeBtn">${ic('bars')}<span>Mode expert</span><span class="sw"></span></button>`;
  h+=`<div class="user"><span class="avatar">LP</span><span class="who"><b>Université de Lausanne</b><small>ludovic.prieur@unil.ch</small></span><span class="up">${ic('up')}</span></div>`;
  document.getElementById('side').innerHTML=h;
}

const NOTES=[
 {t:'Aujourd’hui',
  d:'Liste plate, regroupée par séparateurs sans titre ; deux blocs (haut / bas) dont le sens est à deviner.',
  pro:['Rien à changer'],con:['« Widgets » et « Intégrations » sont loin de « Médiathèque » alors qu’ils servent à créer du contenu','« Membres » seul dans le bas, « Réglages » séparé de l’administration','Les séparateurs n’expliquent pas leur logique','Un mode expert qui ajoute des entrées à 3 endroits différents']},
 {t:'A · Par tâche',
  d:'Quatre rubriques nommées selon ce que fait l’utilisateur : Diffuser → Contenus → Suivre → Administration. Les titres de rubrique sont discrets (petites capitales grises).',
  pro:['Lecture immédiate : on sait où chercher','Widgets et Intégrations rejoignent les contenus','« Membres » devient « Organisation » (aires, zones, membres) avec Réglages','Mode simple : seulement Diffuser + Contenus + Réglages'],con:['Un peu plus haut (+3 titres)','12 entrées visibles en expert, comme aujourd’hui'],
  cnt:[9,10,'—']},
 {t:'B · Groupes repliables',
  d:'Comme A, mais « Contenus » et « Administration » se replient (état mémorisé). Le quotidien reste en haut, sans titre : Écrans, Listes, Planning, Statistiques.',
  pro:['Menu court par défaut (Administration repliée)','Le plus utilisé reste à un clic','Cohérent avec le pliage déjà présent dans l’en-tête'],con:['Un clic de plus pour atteindre Intégrations si le groupe est replié','Pastilles masquées dans un groupe fermé → le point rouge remonte sur le titre du groupe (à prévoir)'],
  cnt:[9,10,'—']},
 {t:'C · Pages « hub »',
  d:'Six entrées au maximum. Chaque hub est une page à onglets : Programmation = Listes de lecture + Planning ; Contenus = Médiathèque + Compositions + Widgets + Intégrations ; Organisation = Membres + Zones + Aires.',
  pro:['Menu minimal, très lisible, même en expert','Facile à rendre sur mobile (barre du bas : 4 entrées)','Tout le contenu de A/B reste accessible'],con:['Une navigation de plus (onglets) dans chaque page','Chantier plus lourd : routes, pastilles par onglet, droits de partage','Les pages actuelles seraient à regrouper'],
  cnt:[5,6,'—'],hub:1}
];
function renderNotes(){
  const n=NOTES[state.v], ex=!!state.m;
  const count=struct(state.v,ex).blocks.filter(b=>b!=='sp'&&!b.hide).flatMap(b=>b.items).filter(i=>i!=='sep');
  const total=state.v===2?count.length:count.length;
  const hubs=state.v===3?`<div class="card"><h3>Ce que contient chaque hub</h3>
   <div class="hubdemo"><div class="tabs"><span class="on">Médiathèque</span><span>Compositions</span><span>Widgets</span><span>Intégrations</span></div><div class="body"></div></div>
   <p style="margin-top:8px;color:var(--muted);font-size:12.5px">Exemple : page « Contenus ». « Programmation » : Listes de lecture | Planning. « Organisation » : Membres | Zones.</p></div>`:'';
  document.getElementById('notes').innerHTML=`
   <h1>${n.t}</h1><p class="lead">${n.d}</p>
   <div class="card"><div class="count"><div><b>${total}</b><span>entrées de premier niveau (${ex?'expert':'simple'})</span></div><div><b>${state.v===0?'3':state.v===1?'4':state.v===2?'2 repliables':'—'}</b><span>${state.v===0?'blocs sans titre':state.v===3?'onglets internes':'rubriques'}</span></div></div></div>
   ${hubs}
   <div class="cols"><div class="card"><h3><span class="tag ok">POUR</span></h3><ul>${n.pro.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div class="card"><h3><span class="tag ko">CONTRE</span></h3><ul>${n.con.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
   <div class="card"><h3>Conservé à l’identique</h3><ul><li>Logo en haut, plan (Essential / Pro…) et version, bouton de pliage</li><li>Interrupteur « Mode expert » au-dessus du compte</li><li>Compte en bas (initiales, organisation, e-mail ; le menu s’ouvre vers le haut)</li><li>Pastilles : nombre (gris), nouveau (rouge), hors ligne (orange), erreur (point rouge)</li></ul>
   <div class="legend"><span><i style="background:var(--orange)"></i>hors ligne</span><span><i style="background:var(--danger)"></i>nouveau / erreur</span></div></div>
   <div class="card"><h3>Ce que la refonte propose aussi</h3><ul><li><b>Média</b>thèque, Compositions, Widgets, Intégrations réunis : ce sont les briques d’un écran</li><li>« Membres » → « Organisation » (la page fait déjà aires, zones, membres, rôles)</li><li>« Réglages » rejoint l’administration, plus de séparateur orphelin</li></ul></div>`;
}
function render(){renderSide();renderNotes();
  document.querySelectorAll('#vSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.v===state.v));
  document.querySelectorAll('#mSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.m===state.m));
}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-sel]'); if(s){state.sel=s.dataset.sel;renderSide();return}
  const f=e.target.closest('[data-fold]'); if(f){state.shut[f.dataset.fold]=!state.shut[f.dataset.fold];renderSide();return}
  if(e.target.closest('#modeBtn')){state.m=state.m?0:1;render();return}
  const v=e.target.closest('#vSeg button'); if(v){state.v=+v.dataset.v;render();return}
  const m=e.target.closest('#mSeg button'); if(m){state.m=+m.dataset.m;render()}
});
render();
</script>
</body>
</html>
