<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Salles : réservé ou libre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--row:#EDF1F5;--tint:#EBEDF0;--signal:#3B82C4;--sig-bg:#EAF2FA;--sig-ink:#1d4f80;--ok:#1E8E5A;--ok-bg:#E1F0E8;--ok-ink:#155A38;--warn:#B7791F;--bad:#C8372D;--r:4px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:#fff;color:var(--ink);font-size:14px;line-height:1.45;overflow:hidden}
button,select,input{font:inherit;color:inherit}
.mock{position:fixed;top:0;left:0;right:0;z-index:100;background:#FFF8E1;border-bottom:1px dashed #E0B84A;padding:7px 16px;font-size:13px;color:#6B5200;display:flex;flex-direction:column;gap:5px}
.mock .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mock .sc{border:1px solid #E0B84A;background:#fff;border-radius:4px;padding:2px 10px;cursor:pointer;font-size:13px}
.mock .sc.on{background:#6B5200;border-color:#6B5200;color:#fff}
.mock .txt{line-height:1.4;max-width:1500px}
.app{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column}
.top{height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);background:#fff}
.tb{height:34px;min-width:34px;border:0;background:none;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--bg)}
.sep{width:1px;height:26px;background:var(--line);margin:0 6px;flex:none}
.back{background:var(--bg);width:40px;height:40px}
.fmt{border:1px solid var(--line-2);border-radius:4px;padding:5px 10px;font-size:13px;background:#fff;white-space:nowrap}
.btn{font-weight:500;cursor:pointer;border:1px solid var(--ink);border-radius:var(--r);padding:0 16px;background:var(--ink);color:#fff;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;height:36px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}
.btn.wide{width:100%;justify-content:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;height:32px;flex:none}
.seg button{border:0;border-right:1px solid var(--line-2);background:#fff;padding:0 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff;font-weight:500}
.main{flex:1;display:flex;min-height:0}
.rail{width:78px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:8px 6px;gap:2px;background:#fff}
.rail button{border:0;background:none;border-radius:6px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.rail button svg{width:22px;height:22px}
.rail button.on{background:var(--tint);color:var(--ink);font-weight:500}
.rail button.exp{position:relative}
.rail button.exp::after{content:"Expert";position:absolute;top:2px;right:0;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:3px;padding:0 3px;line-height:13px}
.panel{width:372px;flex:none;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.pscroll{flex:1;overflow-y:auto;padding:14px 16px 24px}
.center{flex:1;position:relative;min-width:0;background:#E8ECF1;overflow:hidden}
.frame{position:absolute;box-shadow:0 2px 18px rgba(11,31,58,.16);overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#0E1E38;color:#fff}
.stage .el{position:absolute}
.overlay{position:absolute;inset:0;pointer-events:none}
.overlay .hot{position:absolute;pointer-events:auto;cursor:pointer}
.selbox{position:absolute;border:2px solid var(--signal)}
.selbox .hd{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid var(--signal);border-radius:2px}
.seltag{position:absolute;left:-2px;top:-24px;background:var(--signal);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:3px 3px 3px 0;white-space:nowrap}
.dropz{position:absolute;border:2px dashed #7FB2E0;background:rgba(59,130,196,.16);display:grid;place-items:center;color:#cfe3f7;font-size:13px;border-radius:4px}
.callout{position:absolute;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:9}
.ctx{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(11,31,58,.14);display:flex;align-items:center;gap:4px;padding:6px 8px;z-index:5;white-space:nowrap}
.ctx .kind{font-weight:500;padding:0 8px 0 4px}
.ctx .cb{height:32px;border:1px solid transparent;background:none;border-radius:4px;padding:0 9px;cursor:pointer;white-space:nowrap}
.ctx .cb:hover{background:var(--bg)}
.ctx .sep{height:22px;margin:0 4px}
.hintbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;border-radius:8px;padding:6px 14px;font-size:13px;color:var(--muted);box-shadow:0 2px 10px rgba(11,31,58,.08);white-space:nowrap;z-index:5}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ph h4{margin:0;flex:1;font-size:16px;font-weight:500}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:4px;padding:0 10px;height:36px;color:var(--muted);background:#fff}
.search input{border:0;outline:none;flex:1;min-width:0;color:var(--ink)}
.grp{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.grp small{font-weight:400;letter-spacing:0;text-transform:none;margin-left:auto}
.help{color:var(--muted);font-size:12.5px;margin:6px 0 0;line-height:1.45}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--line-2)}.dot.ok{background:var(--ok)}
.ibtn{border:0;background:none;width:30px;height:30px;border-radius:4px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;flex:none;font-size:16px}
.ibtn:hover{background:var(--bg);color:var(--ink)}
.lnk{border:0;background:none;color:var(--sig-ink);cursor:pointer;font-size:13px;padding:0}.lnk:hover{text-decoration:underline}
.cnt{font-size:11.5px;color:var(--ok-ink);background:var(--ok-bg);border-radius:3px;padding:0 6px;font-weight:500;letter-spacing:0;text-transform:none}
/* galerie de types */
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ty{border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px 8px 9px;cursor:grab;text-align:left;display:block}
.ty:hover{border-color:var(--signal);background:var(--sig-bg)}
.ty.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.ty .pv{height:62px;border-radius:4px;background:#0E1E38;display:grid;place-items:center;margin-bottom:7px;overflow:hidden}
.ty .pv svg{width:100%;height:100%}
.ty b{font-weight:500;font-size:13px;display:block;line-height:1.25}.ty small{color:var(--muted);font-size:11.5px;display:block;line-height:1.3}
.tips{display:flex;gap:10px;align-items:flex-start;background:var(--sig-bg);color:var(--sig-ink);border-radius:6px;padding:9px 11px;font-size:12.5px;margin:14px 0 0;line-height:1.4}
.lst{display:flex;gap:10px;align-items:center;padding:8px;border-radius:5px;cursor:pointer}
.lst:hover{background:var(--bg)}
.lst .g{width:28px;height:28px;border-radius:4px;background:var(--sig-bg);color:var(--sig-ink);display:grid;place-items:center;flex:none}
.lst b{font-weight:500;display:block}.lst small{color:var(--muted);font-size:12px}
.lst.cur{background:var(--sig-bg)}
/* panneau résumé */
.lcard{border:1px solid var(--line);border-radius:4px;background:#fff;margin-top:4px}
.lch{display:flex;gap:10px;align-items:center;padding:12px 12px 10px}
.lch .g{width:34px;height:34px;border-radius:4px;background:var(--sig-bg);color:var(--sig-ink);display:grid;place-items:center;flex:none}
.lch small{display:block;color:var(--muted);font-size:12px}.lch b{font-weight:500;font-size:15px}
.lsrc{padding:0 12px 10px;color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center}.lsrc b{color:var(--ink);font-weight:500}
.srow{display:grid;grid-template-columns:74px 1fr 14px;gap:8px;align-items:start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 12px;cursor:pointer}
.srow:hover{background:var(--bg)}.srow .k{font-weight:500}.srow .v{color:#2A3B52;font-size:13px;line-height:1.4}.srow .v small{display:block;color:var(--muted);font-size:12px}.srow .chev{color:var(--muted);font-size:17px;line-height:1}
.lname{width:100%;border:1px solid var(--line-2);border-radius:4px;height:38px;padding:0 10px;font-weight:500;font-size:15px}
.tmini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.tmini button{border:1px solid var(--line);background:#fff;border-radius:5px;height:44px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.tmini button:hover{border-color:var(--signal)}.tmini button.on{border-color:var(--signal);background:var(--sig-bg);color:var(--sig-ink)}
.tmini svg{width:24px;height:24px}
/* tiroir */
.dr{position:absolute;top:56px;right:0;bottom:0;width:580px;z-index:41;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(11,31,58,.12);display:flex;flex-direction:column;animation:drin .2s ease-out}
@keyframes drin{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drh{padding:16px 20px 0;border-bottom:1px solid var(--line)}
.drh .top1{display:flex;gap:12px;align-items:center}
.drh .g{width:38px;height:38px;border-radius:4px;background:var(--sig-bg);color:var(--sig-ink);display:grid;place-items:center;flex:none}
.drh .nm{flex:1;min-width:0}.drh .nm small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.drname{border:1px solid transparent;border-radius:4px;padding:2px 6px;margin-left:-7px;font-size:18px;font-weight:500;width:100%;background:none}
.drname:hover{border-color:var(--line)}
.tabs{display:flex;gap:4px;margin-top:12px}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.tabs button.on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.drb{flex:1;overflow:auto;padding:18px 20px 24px}
.drf{display:flex;gap:10px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);background:var(--bg)}
.drf .note{flex:1;color:var(--muted);font-size:12.5px;line-height:1.35}
.lead{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.45}
.lbl{display:block;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}.lbl:first-child{margin-top:0}
.sel{border:1px solid var(--line-2);border-radius:4px;height:36px;padding:0 8px;background:#fff;min-width:0;font-size:13.5px;width:100%}
.inp{width:100%;border:1px solid var(--line-2);border-radius:4px;height:38px;padding:0 10px;font-size:14px;background:#fff}
.inp:focus,.sel:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field small{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.ser{display:grid;grid-template-columns:18px 26px minmax(0,1.2fr) minmax(0,1fr) 30px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:8px 8px 8px 4px;margin-bottom:6px;background:#fff}
.grip{color:#A9B4C2;cursor:grab;text-align:center;font-size:13px;letter-spacing:-2px}
.sw{width:24px;height:24px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}
.addrow{width:100%;margin-top:6px;border:1px dashed var(--line-2);background:#fff;border-radius:4px;height:38px;cursor:pointer;color:var(--sig-ink);font-weight:500}
.addrow:hover{border-color:var(--signal);background:var(--sig-bg)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.4;cursor:pointer;padding:6px 0}
.chk input{margin:3px 0 0;accent-color:var(--signal)}
.fil{display:grid;grid-template-columns:1fr 100px 1fr 30px;gap:6px;align-items:center}
.rtab{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid var(--line)}
.rtab th{background:var(--bg);text-align:left;font-weight:500;color:var(--muted);padding:6px 8px;font-size:11.5px}
.rtab td{padding:6px 8px;border-top:1px solid var(--line)}.rtab td.r,.rtab th.r{text-align:right}
.rtab .bar{display:inline-block;height:8px;border-radius:2px;background:var(--signal);vertical-align:middle;margin-right:6px}
.opts{display:grid;gap:6px}
.opt2{display:flex;gap:10px;align-items:center;border:1px solid var(--line-2);border-radius:4px;padding:9px 11px;cursor:pointer;background:#fff;text-align:left;width:100%}
.opt2 .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
.opt2.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}.opt2.on .rd{border:5px solid var(--signal)}
.opt2 b{font-weight:500;flex:1}.opt2 span{color:var(--muted);font-size:13px}
.pal{display:grid;gap:8px}
.palr{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:4px;padding:8px 10px;cursor:pointer;background:#fff}
.palr.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}
.palr i{width:22px;height:22px;border-radius:50%;display:inline-block;margin-right:-8px;border:2px solid #fff}
.palr b{font-weight:500;margin-left:16px}
.side{display:flex;gap:18px;color:var(--muted);font-size:12.5px;margin-top:6px}
</style>
</head>
<body>
<div class="mock" id="mock">
  <div class="row"><b style="margin-right:6px">Maquette — Salles : réservé ou libre</b>
    <button class="sc" data-s="1">1 · Calendrier : section Salle</button><button class="sc" data-s="2">2 · Écran : calendrier de la salle</button><button class="sc" data-s="3">3 · Éditeur sans calendrier</button><button class="sc" data-s="4">4 · Porte de salle (tablette)</button><button class="sc" data-s="5">5 · Plan des salles</button><button class="sc" data-s="6">6 · Tableau d’étage</button>
    <span style="margin-left:auto;font-size:12px">Rien n’est codé · tout est cliquable</span></div>
  <div class="txt" id="mocktxt"></div>
</div>

<div class="app" id="app">
  <div class="top">
    <button class="tb back" title="Retour">←</button>
    <span style="font-weight:500;padding:0 10px">Porte de salle · Léman</span>
    <span class="fmt">▭ 16:10 · 1280 × 800 (tablette)</span><span class="sep"></span>
    <button class="tb">↶</button><button class="tb" style="color:var(--line-2)">↷</button><span class="sep"></span>
    <button class="tb">−</button><span style="font-size:13px">100 %</span><button class="tb">+</button><span class="sep"></span>
    <button class="tb"><span class="dot" style="width:16px;height:16px;background:#0E1E38"></span>&nbsp;Fond</button><button class="tb">◇ Calques</button>
    <span style="flex:1"></span>
    <span class="seg"><button class="on">Données réelles</button><button>Noms des champs</button></span>
    <span style="color:var(--muted);font-size:12.5px;padding:0 8px">Enregistré</span>
    <button class="btn ghost">◉ Aperçu</button><button class="btn ghost" style="color:var(--muted)">Annuler</button><button class="btn">Enregistrer</button>
  </div>
  <div class="main">
    <nav class="rail" id="rail"></nav>
    <aside class="panel"><div class="pscroll" id="panel"></div></aside>
    <section class="center" id="center">
      <div id="bar"></div>
      <div class="frame" id="frame"><div class="stage" id="stage"></div><div class="overlay" id="ov"></div></div>
    </section>
  </div>
  <div id="drawer"></div>
</div>

<style>
#page{position:fixed;left:0;right:0;bottom:0;display:none;background:#fff}
#page.on{display:flex}
.pnav{width:220px;flex:none;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;background:#fff}
.pnav b{font-size:18px;font-weight:600;padding:4px 10px 14px;letter-spacing:-.01em}
.pnav span{padding:8px 10px;border-radius:5px;color:var(--muted);font-size:14px}
.pnav span.on{background:var(--tint);color:var(--ink);font-weight:500}
.pmain{flex:1;min-width:0;overflow:auto;padding:26px 34px;position:relative}
.pmain h2{margin:0 0 4px;font-size:22px;font-weight:500}
.pmain .sub{color:var(--muted);margin:0 0 20px;max-width:720px}
.empty{border:1px dashed var(--line-2);border-radius:8px;padding:34px;text-align:center;max-width:720px;background:var(--bg)}
.empty h3{margin:10px 0 6px;font-weight:500;font-size:18px}.empty p{color:var(--muted);margin:0 auto 18px;max-width:520px}
.provs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.prov{border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:8px 14px;font-size:13px;display:flex;gap:8px;align-items:center}
.tbl{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tbl th{background:var(--bg);text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px}
.tbl td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.row{cursor:pointer}.tbl tr.row:hover td{background:var(--bg)}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:500}
.st i{width:10px;height:10px;border-radius:50%;display:inline-block}
.free i{background:#1E8E5A}.busy i{background:#C8372D}.soon i{background:#D9822B}.off i{background:#9aa6b4}
.pill2{font-size:12px;background:var(--tint);border-radius:10px;padding:1px 9px;color:var(--muted)}
.tw{background:#FFF4E5;border:1px solid #F0D9B0;color:#7A4A00;border-radius:6px;padding:10px 14px;font-size:13px;margin:0 0 16px;max-width:760px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t2{border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px;cursor:grab;text-align:left}
.t2:hover{border-color:var(--signal);background:var(--sig-bg)}
.t2 .pv{height:62px;border-radius:4px;margin-bottom:6px;display:grid;place-items:center;overflow:hidden}
.t2 b{font-weight:500;font-size:13px;display:block}.t2 small{color:var(--muted);font-size:11.5px;display:block;line-height:1.3}
.rrow{display:flex;gap:10px;align-items:center;padding:8px;border-radius:5px;cursor:pointer}.rrow:hover{background:var(--bg)}.rrow.cur{background:var(--sig-bg)}.rrow b{font-weight:500;display:block}.rrow small{color:var(--muted);font-size:12px}
.simbar{position:absolute;left:calc(78px + 372px + 16px);bottom:14px;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(11,31,58,.12);padding:6px 10px;display:flex;gap:10px;align-items:center;font-size:12.5px;z-index:5}
.dr2{position:absolute;top:0;right:0;bottom:0;width:520px;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(11,31,58,.12);display:flex;flex-direction:column;z-index:5}
.dr2 .drh{padding:16px 20px 12px}.dr2 .drb{flex:1;overflow:auto;padding:4px 20px 20px}
.mini-rail{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}.mr{border:1px solid var(--line-2);border-radius:5px;padding:3px 9px;font-size:12px;background:#fff}.mr.no{opacity:.45;text-decoration:line-through}
.swt{width:42px;height:24px;border-radius:12px;background:#C5CED9;position:relative;display:inline-block;flex:none;cursor:pointer}.swt i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}.swt.on{background:#1E8E5A}.swt.on i{left:21px}
.sect{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--bg);margin-top:20px}
</style>
<div id="page">

/* ---------- compositions (scènes 4 à 6) : page de tablette 1280 × 800 ---------- */
const DW = 1280, DH = 800;
function doorHTML(r, s) {
  if (s === 'none') return `<div class="el" style="left:0;top:0;width:${DW}px;height:${DH}px;background:#7A8696"></div><div class="el" style="left:70px;top:250px;font-size:96px;font-weight:800;line-height:1.05">SALLE<br>NON CHOISIE</div><div class="el" style="left:74px;top:520px;font-size:36px;opacity:.9">Associez un calendrier à cet écran<br>(configuration de l’écran › Calendrier de la salle)</div>`;

  const nx = s === 'busy' ? r.next : r.next;

}
function planHTML() {

  };

  if (sc === 4) h += box(0, 0, DW, DH, 'Porte de salle · Léman');
  if (sc === 5) { const b = PLANBOX[state.planSel]; h += box(b[0], b[1], b[2], b[3], 'Forme · ' + rm(state.planSel).n); Object.entries(PLANBOX).forEach(([id, b2]) => h += `<div class="hot" data-plan="${id}" style="left:${b2[0] * K}px;top:${b2[1] * K}px;width:${b2[2] * K}px;height:${b2[3] * K}px"></div>`); }
  if (sc === 6) h += box(70, 150, 1140, 56 + 84 * 5, 'Tableau · Salles');

function barHTML() {

  if (sc === 5) { const r = rm(state.planSel); return `<div class="ctx"><span class="kind">Forme · ${r.n}</span><span class="sep"></span><button class="cb">Calendrier : ${r.cal.split(' · ')[0]} ▾</button><span class="sep"></span><button class="cb"><span class="dot" style="background:${GREEN}"></span> Libre</button><button class="cb"><span class="dot" style="background:${AMBER}"></span> Bientôt</button><button class="cb"><span class="dot" style="background:${RED}"></span> Occupé</button><button class="cb on">Nom et état</button><span class="sep"></span><button class="cb">⧉</button><button class="cb">🗑</button></div>`; }

  const dot = c => `<svg viewBox="0 0 92 56" width="100%" height="100%"><circle cx="46" cy="28" r="14" fill="${c}"/><circle cx="46" cy="28" r="22" fill="${c}" opacity=".25"/></svg>`;
  const doorPv = `<svg viewBox="0 0 92 56" width="100%" height="100%"><rect width="92" height="56" fill="${RED}"/><text x="46" y="34" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">OCCUPÉ</text></svg>`;
  const planPv = `<svg viewBox="0 0 92 56" width="100%" height="100%"><rect width="92" height="56" fill="#EEF2F7"/><rect x="8" y="8" width="24" height="18" fill="${RED}cc" stroke="${RED}"/><rect x="36" y="8" width="20" height="18" fill="${GREEN}cc" stroke="${GREEN}"/><rect x="60" y="8" width="24" height="18" fill="${AMBER}cc" stroke="${AMBER}"/><rect x="8" y="32" width="34" height="16" fill="${GREEN}cc" stroke="${GREEN}"/></svg>`;
  const tabPv = `<svg viewBox="0 0 92 56" width="100%" height="100%"><rect width="92" height="56" fill="#0E1E38"/>${[0, 1, 2].map(i => `<circle cx="14" cy="${14 + i * 14}" r="4" fill="${[RED, GREEN, AMBER][i]}"/><rect x="26" y="${11 + i * 14}" width="${[50, 40, 46][i]}" height="6" rx="2" fill="#fff" opacity=".7"/>`).join('')}</svg>`;
  return `<div class="ph"><h4>Salles</h4></div><div class="search">⌕<input placeholder="Chercher une salle…"></div>
    <div class="grp">Ajouter <small>4 modèles</small></div>
    <div class="tiles2">${tile(RED, doorPv, 'Porte de salle', 'Plein écran tablette : Libre / Occupé. Lit le calendrier de l’écran')}${tile('#0E1E38', dot(GREEN), 'Pastille d’état', 'Une pastille verte, orange ou rouge pour une salle')}${tile('#EEF2F7', planPv, 'Forme sur un plan', 'Rectangle, cercle ou pastille qui change de couleur sur votre plan')}${tile('#0E1E38', tabPv, 'Tableau d’étage', 'Plusieurs salles : état, jusqu’à, ensuite')}</div>
    <div class="tips">ℹ Une seule composition « Porte de salle » sert toutes les tablettes : chaque écran lit son propre calendrier (réglage « Calendrier de la salle » dans la configuration de l’écran). Pour un plan : posez l’image du plan en fond, puis une forme par salle.</div>
    <div class="grp">Salles utilisables <small>${ROOMS.length}</small></div>
    ${ROOMS.map(r => `<div class="rrow ${(sc === 5 && state.planSel === r.id) ? 'cur' : ''}" data-plan="${r.id}"><span class="st ${r.st}"><i></i></span><div><b>${r.n}</b><small>Calendrier ${r.cal}</small></div></div>`).join('')}
    <p class="help">Ce sont vos calendriers utilisés comme salle. <a class="lnk" style="font-size:12.5px">Gérer dans Mes intégrations ›</a></p>`;
}
function simHTML() {
  const sc = state.scene; let h = '';
  if (sc === 4) h += `<div class="simbar"><b style="font-weight:500">Simuler</b><select class="sel" style="width:150px;height:28px"><option>Salle Léman</option><option>Salle Jura</option><option>Salle Alpes</option></select><span class="seg" style="height:28px"><button class="${state.sim === 'free' ? 'on' : ''}" data-sim="free">Libre</button><button class="${state.sim === 'soon' ? 'on' : ''}" data-sim="soon">Bientôt</button><button class="${state.sim === 'busy' ? 'on' : ''}" data-sim="busy">Occupé</button><button class="${state.sim === 'none' ? 'on' : ''}" data-sim="none">Non choisie</button></span><span style="color:var(--muted)">éditeur seulement</span></div>`;
  if (sc === 6 && state.pop) h += `<div class="pop" style="left:calc(78px + 372px + 200px);top:112px;transform:none;width:300px"><h5>Salles du tableau</h5><label class="chk"><input type="checkbox" checked><span><b style="font-weight:500">Toutes les salles</b> (y compris les futures)</span></label><hr style="border:0;border-top:1px solid var(--line)">${ROOMS.map(r => `<label class="chk"><input type="checkbox" ${state.tabRooms.includes(r.id) ? 'checked' : ''}><span>${r.n}<small style="display:block;color:var(--muted);font-size:12px">${r.cal}</small></span></label>`).join('')}<p class="help">Cochez « Toutes » pour que chaque nouvelle salle apparaisse toute seule.</p></div>`;
  return h;
}
const TXT_S = {
  1: '<b>Configuration d’un calendrier</b> (Mes intégrations) — nouvelle section <b>« Utiliser dans les compositions réservation de salle »</b> avec un interrupteur. Activé, le calendrier devient une salle : nom, capacité, ce qui compte comme occupé, délai « bientôt occupé », confidentialité. Cliquez l’interrupteur pour voir la section se déplier.',
  2: '<b>Configuration d’un écran</b> — champ <b>« Calendrier de la salle »</b> (liste des calendriers utilisés comme salle) : la tablette lit directement son calendrier, pas de nom à faire correspondre. Il faut donc d’abord connecter les calendriers, mais on peut créer l’écran avant : « à choisir » en attendant. Le champ n’existe que s’il y a au moins un calendrier-salle.',
  3: '<b>Éditeur sans calendrier-salle</b> — le menu <b>Salles</b> n’existe pas (ni dans le rail, ni ailleurs). Rien de lié aux salles n’est visible.',
  4: '<b>Porte de salle · tablette en paysage (1280 × 800)</b> — menu Salles du rail, visible parce qu’un calendrier est utilisé comme salle. Fond <b>rouge</b> « OCCUPÉ » si un rendez-vous est en cours, <b>vert</b> « LIBRE » sinon, <b>orange</b> dans les 10 minutes avant. Une seule composition pour toutes les tablettes (« Salle : celle de cet écran »). « Simuler » (éditeur seulement) montre chaque cas, dont « Salle non choisie » en gris.',
  5: '<b>Plan des salles</b> — une forme (rectangle, cercle ou pastille) par salle, liée à un calendrier, sur l’image du plan. Cliquez une forme ou une salle de la liste pour changer son calendrier ; la barre règle couleurs et étiquette.',
  6: '<b>Tableau d’étage</b> — plusieurs salles : état, jusqu’à, ensuite. Le bouton « Salles » choisit lesquelles (ou « Toutes », y compris les futures).'
};
function setScene(n) { state.scene = n; state.pop = n === 6; render(); }
function render() {
  const sc = state.scene, page = sc <= 2;
  document.querySelectorAll('.sc').forEach(b => b.classList.toggle('on', +b.dataset.s === sc));
  $('#mocktxt').innerHTML = TXT_S[sc];
  const top = $('#mock').offsetHeight;
  $('#app').style.display = page ? 'none' : ''; $('#app').style.top = top + 'px';
  const pg = $('#page'); pg.classList.toggle('on', page); pg.style.top = top + 'px';
  if (page) { $('.pnav').innerHTML = '<b>Linkii</b>' + navHTML(); $('#pmain').innerHTML = pageHTML(); return; }
  $('#rail').innerHTML = RAIL.filter(r => sc !== 3 || r[0] !== 'Salles').map(r => `<button class="${(sc === 3 ? r[0] === 'Widgets' : r[0] === 'Salles') ? 'on' : ''} ${r[2] === 'exp' ? 'exp' : ''}">${r[1]}${r[0]}</button>`).join('');
  $('#panel').innerHTML = panelHTML();
  $('#bar').innerHTML = barHTML();
  $('#stage').innerHTML = stageHTML();
  layoutFrame();
  $('#ov').innerHTML = overlayHTML();
  $('#drawer').innerHTML = simHTML();
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-s],[data-room],[data-sim],[data-plan],[data-priv-toggle],[data-roomsw],[data-scr],[data-poptog]'); if (!t) return;
  if (t.dataset.s) return setScene(+t.dataset.s);
  if (t.dataset.room !== undefined) { state.drawerRoom = t.dataset.room || state.drawerRoom; return render(); }
  if (t.dataset.roomsw) { state.roomOn = !state.roomOn; return render(); }
  if (t.dataset.scr !== undefined) { state.scr = +t.dataset.scr; return render(); }
  if (t.dataset.sim) { state.sim = t.dataset.sim; return render(); }
  if (t.dataset.poptog) { state.pop = !state.pop; return render(); }
  if (t.dataset.plan) { state.planSel = t.dataset.plan; return render(); }
  if (t.dataset.privToggle) { state.priv = !state.priv; return render(); }
});
window.addEventListener('resize', render);
document.fonts && document.fonts.ready.then(() => setScene(state.scene));
setScene(1);
</script>
