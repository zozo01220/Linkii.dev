<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Attirer l'œil sur Installer le player</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--signal:#3B82C4;--sig-bg:#EAF2FA;--dot:#CC8400;--dot-lt:#F2A81D;--dot-bg:#FDF3DE}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
.mock{position:sticky;top:0;z-index:300;background:#FFF8E1;border-bottom:1px dashed #E0B84A;padding:8px 16px;font-size:13px;color:#6B5200}
.mock .row{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.mock .sc{border:1px solid #E0B84A;background:#fff;border-radius:4px;padding:3px 10px;font-size:13px}
.mock .sc.on{background:#6B5200;border-color:#6B5200;color:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:0 16px;font-weight:500;height:38px;display:inline-flex;align-items:center;gap:8px}
.app{display:flex;min-height:600px;position:relative;overflow:hidden}
.side{width:250px;flex:none;background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
.brand{display:flex;align-items:baseline;gap:6px;margin:0 0 18px 8px}
.wm{display:inline-flex;align-items:baseline;font-size:28px;font-weight:500;letter-spacing:-.03em;line-height:1}
.wm .i{display:inline-block;width:.095em;height:.5em;background:currentColor;margin-left:.07em;position:relative}
.wm .i+.i{margin-left:.1em}.wm .i::before{content:"";position:absolute;left:0;top:-.2em;width:.095em;height:.095em;background:currentColor}
.wm .i.s::before{background:var(--dot)}
.nav{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:6px;color:var(--muted)}
.nav.on{background:var(--sig-bg);color:var(--ink);font-weight:500}.ic{width:20px;text-align:center}
.spacer{flex:1;min-height:30px}
.modeb{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border-radius:6px;margin-top:8px}
.modeb i{margin-left:auto;width:34px;height:20px;border-radius:10px;background:var(--ink);position:relative}.modeb i::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.me{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--line);margin-top:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.main{flex:1;padding:24px 32px}
.main h1{margin:0;font-size:28px;font-weight:500}.sub{color:var(--muted);margin:2px 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:40px 20px;text-align:center}
.card .big{font-size:20px;font-weight:500}.card p{color:var(--muted);max-width:480px;margin:4px auto 16px}
/* A · entrée du menu qui respire */
.nav.call{position:relative;color:var(--ink);font-weight:500;background:var(--dot-bg);border:1px solid #F0D79E}
.nav.call .ic{color:var(--dot);position:relative}
.nav.call .ic::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--dot-lt);animation:ring 2s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.tag{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--dot);color:#fff;border-radius:3px;padding:1px 6px}
.hint{margin:6px 0 0 8px;font-size:12px;color:var(--muted)}
/* carte rappel au-dessus de « Mode expert » */
.tip{margin-top:8px;border:1px solid #F0D79E;background:var(--dot-bg);border-radius:8px;padding:12px;position:relative}
.tip b{font-weight:500;display:block}.tip small{color:var(--muted);display:block;margin:2px 0 8px}
.tv{height:46px;border-radius:5px;background:#0E1E38;display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:10px;position:relative}
.tv span{width:16px;height:22px;background:#fff;color:#0E1E38;border-radius:3px;font-size:13px;font-weight:600;display:grid;place-items:center}
.tv::after{content:"";position:absolute;right:8px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--dot-lt);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.tip .x{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--muted);font-size:16px}
.btn.or{background:var(--dot);border-color:var(--dot);height:32px;font-size:13px;width:100%;justify-content:center}
/* B · le point orange du logo */
.dotcall{position:relative;display:inline-flex}
.dotcall .pulse{position:absolute;left:calc(100% - .095em - 2px);top:-.1em;width:.35em;height:.35em;margin-left:-.12em;border-radius:50%;border:2px solid var(--dot-lt);animation:ring 2s ease-out infinite;pointer-events:none}
.bubble{position:absolute;left:150px;top:6px;z-index:5;background:var(--ink);color:#fff;border-radius:8px;padding:10px 12px;width:260px;font-size:13px;box-shadow:0 8px 24px rgba(11,31,58,.25)}
.bubble::before{content:"";position:absolute;left:-6px;top:14px;width:12px;height:12px;background:var(--ink);transform:rotate(45deg)}
.bubble b{display:block;font-weight:500;margin-bottom:2px}.bubble small{color:#B9CDE3;display:block;margin-bottom:8px}
.bubble .btn{height:30px;font-size:13px;background:var(--dot-lt);border-color:var(--dot-lt);color:var(--ink)}
.bubble .later{border:0;background:none;color:#B9CDE3;margin-left:10px;font-size:12px;text-decoration:underline}
.scene{display:none}.scene.on{display:block}
.legend{max-width:1000px;margin:12px auto;padding:0 24px;color:#2A3B52;font-size:13px}
</style>
</head>
<body>
<div class="mock"><div class="row" id="scs">
  <button class="sc on" data-s="a">A · Le menu s'anime et se justifie</button>
  <button class="sc" data-s="b">B · Un endroit original : le point orange du logo</button></div>
  <div id="note"></div></div>
<div id="root"></div>
<script>
const nav=(inner)=>`<div class="nav on"><span class="ic">▭</span>Écrans</div><div class="nav"><span class="ic">☰</span>Programmation</div><div class="nav"><span class="ic">▣</span>Contenus</div><div class="nav"><span class="ic">▨</span>Statistiques</div>`;
const foot=`<div class="modeb"><span class="ic">≡</span>Mode expert<i></i></div><div class="me"><div class="av">LU</div><div><b style="font-weight:500">LPR Unil</b><br><small style="color:var(--muted)">ludovicgregory.prieur@unil.ch</small></div></div>`;
const wm=(pulse)=>`<div class="brand"><span class="dotcall"><span class="wm">link<span class="i"></span>v<span class="i s"></span></span>${pulse?'<span class="pulse" style="font-size:28px"></span>':''}</span></div>`;
const main=`<div class="main"><h1>Vos écrans</h1><p class="sub">Choisissez la liste de lecture et les widgets de chaque écran, puis publiez.</p>
<div class="card"><div class="big">Aucun écran connecté</div><p>Installez le player sur l'écran (TV, boîtier, PC) : il affiche un code. Saisissez ce code ici.</p><button class="btn">+ Connecter un écran</button></div></div>`;
const S={
a:`<div class="app"><div class="side">${wm(false)}${nav()}<div class="spacer"></div>
<div class="nav"><span class="ic">⚇</span>Organisation</div><div class="nav"><span class="ic">⚙</span>Réglages</div>
<div class="nav call"><span class="ic">⬇</span>Installer le player<span class="tag">À faire</span></div>
<div class="tip"><button class="x">×</button><div class="tv"><span>4</span><span>8</span><span>1</span><span>2</span><span>9</span><span>3</span></div><b>Votre écran attend le player</b><small>Installez-le, l'écran affiche un code : c'est tout.</small><button class="btn or">⬇ Installer le player</button></div>
${foot}</div>${main}</div>`,
b:`<div class="app"><div class="side">${wm(true)}${nav()}<div class="spacer"></div>
<div class="nav"><span class="ic">⚇</span>Organisation</div><div class="nav"><span class="ic">⚙</span>Réglages</div>
<div class="nav"><span class="ic">⬇</span>Installer le player</div>${foot}
<div class="bubble"><b>Un écran à connecter ?</b><small>Le point orange vous montre la marche à suivre : installez le player sur l'écran.</small><button class="btn">Installer le player</button><button class="later">Plus tard</button></div></div>${main}</div>`};
const N={
a:"<b>A · Le menu.</b> Tant qu'aucun écran n'est connecté : l'entrée prend le fond orange pâle du logo, son icône émet un anneau qui respire, avec l'étiquette « À faire ». Dessous, une carte-rappel avec une mini-TV qui affiche un code (le point orange clignote). La carte se ferme avec ×. Dès le premier écran connecté, tout redevient une entrée normale.",
b:"<b>B · Un endroit original.</b> Le point orange du dernier « i » du logo devient l'invitation : il émet un anneau, et une bulle sombre sort du logo (« Un écran à connecter ? » + bouton). « Plus tard » la ferme, le point cesse de pulser. Une seule fois, jamais quand un écran est déjà connecté."};
root.innerHTML=Object.keys(S).map(k=>`<div class="scene" id="${k}">${S[k]}</div>`).join('');
function show(s){document.querySelectorAll('.scene').forEach(e=>e.classList.toggle('on',e.id===s));document.querySelectorAll('#scs .sc').forEach(b=>b.classList.toggle('on',b.dataset.s===s));note.innerHTML=N[s]}
document.querySelectorAll('#scs .sc').forEach(b=>b.onclick=()=>show(b.dataset.s));show('a');
</script>
</body>
</html>
