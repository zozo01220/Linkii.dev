<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Dossiers dans la médiathèque</title>
<style>
:root{--bg:#F5F7FA;--ink:#0B1F3A;--muted:#5A6B80;--line:#DDE3EA;--line-2:#C5CED9;--row:#EDF1F5;--brand:#0B1F3A;--brand-tint:#EBEDF0;--signal:#3B82C4;--signal-bg:#E4EFF9;--ok:#1E8E5A;--ok-bg:#E1F0E8;--ok-ink:#155A38;--warn-bg:#FBF0DC;--warn-ink:#7A4F12;--radius:4px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3,h4,p{margin:0;font-weight:500}p{font-weight:400}b{font-weight:500}button,select,input{font:inherit;color:inherit}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.note{background:#FFF8E1;border-bottom:1px dashed #E0B84A;padding:10px 24px;font-size:13px;color:#6B5200}
.steps{display:flex;gap:6px;flex-wrap:wrap;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.steps button{border:1px solid var(--line-2);background:#fff;border-radius:var(--radius);padding:6px 12px;cursor:pointer;font-size:14px;color:var(--muted)}
.steps button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.steps button i{font-style:normal;font-weight:600;margin-right:6px}
.shell{display:flex;min-height:700px;position:relative}
.sidebar{width:236px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;flex:none;display:flex;flex-direction:column}
.sidebar .wm{font-size:26px;font-weight:500;letter-spacing:-.03em;padding:0 10px 14px}
.area-btn{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin:0 0 12px;font-size:14px;background:var(--bg)}
.area-btn small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.nav{display:flex;gap:10px;align-items:center;padding:8px 12px;color:var(--muted);font-size:15px;border-radius:0 4px 4px 0}
.nav.active{background:var(--brand-tint);color:var(--ink);font-weight:500;box-shadow:inset 2px 0 0 var(--brand)}
.sep{border-top:1px solid var(--line);margin:8px 6px}.spacer{flex:1}
.user{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid var(--line);margin-top:10px;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.av.sm{width:22px;height:22px;font-size:10px}.av.b{background:var(--signal)}.av.g{background:#6B7C93}.av.o{background:#C2851F}
.user small{display:block;color:var(--muted);font-size:12px}
main{flex:1;padding:28px 36px 60px;min-width:0;position:relative}
.head{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.head h1{font-size:28px;line-height:1.2}.head .sub{color:var(--muted);margin-top:4px;max-width:680px}
.btn{font-weight:500;cursor:pointer;border:1px solid var(--brand);border-radius:var(--radius);padding:8px 16px;background:var(--brand);color:#fff;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2)}.btn.sm{padding:4px 10px;font-size:13.5px}.btn.off{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px}
.pill{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;border-radius:var(--radius);padding:1px 9px;background:var(--brand-tint)}
.pill svg{width:13px;height:13px}
.pill.dark{background:var(--brand);color:#fff}.pill.blue{background:var(--signal-bg);color:#1F5C93}.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.muted{color:var(--muted)}
/* médiathèque */
.lib{display:grid;grid-template-columns:236px 1fr;gap:18px;align-items:start}
.ftree{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 8px}
.ftree h5{margin:10px 8px 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center}
.ftree h5:first-child{margin-top:2px}
.ftree h5 a{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;color:var(--signal);cursor:pointer;font-size:12.5px}
.fn{display:flex;gap:7px;align-items:center;padding:5px 8px;border-radius:4px;font-size:14px;cursor:pointer}
.fn svg{width:16px;height:16px;color:var(--muted)}
.fn.on{background:var(--brand-tint);font-weight:500}.fn.on svg{color:var(--ink)}
.fn small{margin-left:auto;color:var(--muted);font-size:12px}
.fn .ic{margin-left:auto;display:flex;gap:4px;color:var(--muted)}.fn .ic svg{width:13px;height:13px}
.fn.l1{margin-left:16px}.fn.l2{margin-left:32px}
.fn.drop{outline:2px dashed var(--signal);background:var(--signal-bg)}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;background:#fff}
.seg span{padding:5px 12px;font-size:14px;color:var(--muted)}.seg span.on{background:var(--brand);color:#fff}
.search{flex:1;min-width:160px;border:1px solid var(--line-2);border-radius:var(--radius);padding:7px 10px;background:#fff;color:var(--muted);display:flex;gap:8px;align-items:center}
.crumb{display:flex;gap:6px;align-items:center;font-size:14px;margin-bottom:12px;color:var(--muted);flex-wrap:wrap}
.crumb b{color:var(--ink)}
.banner{display:flex;gap:10px;align-items:center;border-radius:8px;padding:9px 14px;font-size:14px;margin-bottom:12px;background:var(--signal-bg);color:#1F4E7A}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink)}.banner.ok{background:var(--ok-bg);color:var(--ok-ink)}
.banner .grow{flex:1}
.zone-h{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.fold{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.fold>svg{width:30px;height:30px;color:var(--signal)}
.fold b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold small{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fold .grow{min-width:0;flex:1}.fold.private>svg{color:var(--muted)}
.fold.lockd{background:#FAFBFC}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
.th{height:104px;background:linear-gradient(135deg,#17345C,#3B82C4);position:relative}
.th.b{background:linear-gradient(135deg,#6A4A1F,#E0A94A)}.th.c{background:linear-gradient(135deg,#1C5A45,#62C49A)}.th.d{background:linear-gradient(135deg,#4A2F6E,#A68AD6)}.th.e{background:linear-gradient(135deg,#5A1F2F,#D6657F)}
.th .ty{position:absolute;left:8px;bottom:8px;background:rgba(11,31,58,.7);color:#fff;border-radius:4px;padding:2px 5px;display:flex}
.th .ty svg{width:14px;height:14px}
.th .ck{position:absolute;left:8px;top:8px;width:17px;height:17px;border-radius:3px;background:#fff;border:1px solid var(--line-2)}
.card .bd{padding:8px 12px;display:flex;align-items:center;gap:8px}.card .bd b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bd small{color:var(--muted);font-size:12.5px}.card .bd .grow{min-width:0;flex:1}
.card .lock{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.92);border-radius:4px;padding:2px 4px;display:flex;color:var(--muted)}
.card .lock svg{width:14px;height:14px}
.card.dim{opacity:.55}
.dots{color:var(--muted);font-size:18px;letter-spacing:1px}
.dragghost{position:absolute;z-index:4;left:150px;top:300px;background:#fff;border:1px solid var(--line-2);border-radius:6px;box-shadow:0 8px 24px rgba(11,31,58,.25);padding:6px 10px;font-size:13.5px;display:flex;gap:8px;align-items:center}
/* tables */
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tbl th{background:var(--row);text-align:left;padding:9px 14px;font-size:12.5px;color:var(--muted);font-weight:600}
.tbl td{padding:10px 14px;border-top:1px solid var(--row);vertical-align:middle;font-size:14.5px}
.tbl td small{color:var(--muted);font-size:12.5px}
.tbl.mx th,.tbl.mx td{text-align:center}.tbl.mx th:first-child,.tbl.mx td:first-child{text-align:left}
.y{color:var(--ok);font-weight:600}.n{color:#B0BAC6}.p{color:var(--warn-ink);font-weight:500;font-size:13px}
.who{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs a{padding:9px 16px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs a.on{color:var(--ink);font-weight:500;border-color:var(--brand)}
/* modales */
.veil{position:absolute;inset:0;background:rgba(11,31,58,.38);display:flex;align-items:flex-start;justify-content:center;padding:28px 20px;overflow:auto;z-index:3}
.modal{background:#fff;border-radius:10px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(11,31,58,.28)}
.modal.w{max-width:900px}
.mh{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.mh h3{font-size:19px}.mh .x{color:var(--muted);font-size:20px}
.mb{padding:18px 22px}.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--bg);border-radius:0 0 10px 10px}
.lbl{display:block;font-size:13px;color:var(--muted);font-weight:500;margin:0 0 5px}
input[type=text],select{width:100%;border:1px solid var(--line-2);border-radius:var(--radius);padding:8px 10px;background:#fff}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
.sh-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--row)}
.sh-row:first-of-type{border-top:0}
.sh-row .grow{flex:1;min-width:0}.sh-row small{color:var(--muted);font-size:12.5px;display:block}
.sh-row select{width:auto;padding:5px 8px;font-size:14px}
.sh-add{display:flex;gap:8px;margin:10px 0 4px}.sh-add .search{margin:0}
.sugg{border:1px solid var(--line);border-radius:6px;margin:-2px 0 10px;overflow:hidden;font-size:14px;background:#fff}
.sugg div{padding:7px 12px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--row)}.sugg div:first-child{border-top:0}
.sugg small{color:var(--muted);margin-left:auto;font-size:12.5px}.sugg .off{opacity:.5}
/* éditeur de niveau */
.sec{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px;background:#fff}
.sec>h4{margin:0;padding:10px 14px;background:var(--row);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.sec>h4 i{font-style:normal;background:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink)}
.sec>h4 .new{margin-left:auto;font-size:10px;font-weight:600;background:var(--signal-bg);color:#1F5C93;border-radius:var(--radius);padding:0 6px;letter-spacing:.04em}
.sec .in{padding:8px 14px 12px}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0}
.chk input{width:17px;height:17px;accent-color:var(--brand);margin:0;flex:none}
.chk small{color:var(--muted);margin-left:auto;font-size:12.5px}
.rad{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.rad span{border:1px solid var(--line-2);border-radius:var(--radius);padding:5px 12px;font-size:14px;color:var(--muted);background:#fff}
.rad span.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ftl{border:1px solid var(--line);border-radius:6px;margin-top:6px}
.ftl .r{display:flex;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--row);font-size:14px}.ftl .r:first-child{border-top:0}
.ftl .r svg{width:15px;height:15px;color:var(--muted)}
.ftl .r .m{margin-left:auto;display:flex;gap:4px}
.ftl .r .m span{font-size:12.5px;border:1px solid var(--line-2);border-radius:3px;padding:1px 8px;color:var(--muted)}
.ftl .r .m span.on{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok-ink);font-weight:500}
.ftl .r .m span.on.r2{background:var(--signal-bg);border-color:var(--signal-bg);color:#1F5C93}
.l1{margin-left:16px}.l2{margin-left:32px}
.annot{position:absolute;right:16px;top:12px;max-width:250px;background:#FFF8E1;border:1px dashed #E0B84A;border-radius:6px;padding:10px 12px;font-size:12.5px;color:#6B5200;z-index:2}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.rules{display:grid;gap:10px;margin-top:6px}.rules li{margin-left:18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:16px}
.panel h3{font-size:17px;margin-bottom:8px}.panel ul{margin:6px 0 0;padding-left:20px}.panel li{margin:3px 0}
.hide{display:none}
@media(max-width:1000px){.sidebar{display:none}main{padding:20px 16px}.lib,.cols{grid-template-columns:1fr}.annot{position:static;max-width:none;margin-bottom:12px}}
</style>
</head>
<body>
<div class="note">Maquette d'analyse (DEV-POC §49). Rien n'est codé. Choisissez une vue ci-dessous. Exemple suivi partout : <b>Alice</b> (membre, niveau « Utilisateur »), <b>Marc</b> (membre, niveau « Éditeur »), <b>Camille</b> (administratrice).</div>
<div class="steps" id="steps">
  <button data-v="rules" class="on"><i>1</i>Principe et règles</button>
  <button data-v="lib"><i>2</i>Médiathèque d'Alice</button>
  <button data-v="share"><i>3</i>Partager un dossier</button>
  <button data-v="shared"><i>4</i>Partagé avec moi</button>
  <button data-v="admin"><i>5</i>Vue administratrice</button>
  <button data-v="level"><i>6</i>Niveaux de droits</button>
  <button data-v="plist"><i>7</i>Listes de lecture</button>
</div>
<div class="shell"><aside class="sidebar" id="sidebar"></aside><main id="stage"></main></div>

<script>
const I={
 folder:'<svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>',
 share:'<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.600 13.500l6.800 4M15.400 6.500l-6.800 4"/></svg>',
 lock:'<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
 eye:'<svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>',
 img:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.500" cy="8.500" r="1.500"/><path d="M21 15l-5-5L5 21"/></svg>',
 vid:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M22 7l-6 5 6 5z"/></svg>',
 search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.300-4.300"/></svg>',
 pin:'<svg viewBox="0 0 24 24"><path d="M12 22s7-6.200 7-12a7 7 0 0 0-14 0c0 5.800 7 12 7 12z"/><circle cx="12" cy="10" r="2.500"/></svg>',
 scr:'<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.300"/></svg>',
 plug:'<svg viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v5"/></svg>',
 plan:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'
};
const nav=(ic,t,on)=>`<div class="nav ${on?'active':''}">${I[ic]}${t}</div>`;
function sidebar(who){
 const adm=who==='camille';
 const u=adm?['CA','Camille Aubry','Administratrice']:who==='marc'?['MD','Marc Dupont','Éditeur']:['AM','Alice Martin','Utilisateur'];
 return `<div class="wm">linkii</div><div class="area-btn">${I.pin}<span><b>Siège</b><small>Aire de gestion</small></span></div>
 ${nav('scr','Écrans')}${nav('list','Listes de lecture')}${adm||who==='marc'?nav('plan','Planning'):''}<div class="sep"></div>${nav('img','Médiathèque',1)}
 <div class="spacer"></div>${adm?`<div class="sep"></div>${nav('users','Membres')}`:''}<div class="sep"></div>${nav('plug','Intégrations')}
 <div class="user"><span class="av ${adm?'':who==='marc'?'b':'g'}">${u[0]}</span><span><b>${u[1]}</b><small>${u[2]}</small></span></div>`;
}
const md=(t,c='')=>`<span class="pill ${c}">${t}</span>`;
const pRead=md(I.eye+'Lecture','blue'),pWrite=md(I.edit+'Écriture','ok'),pOwn=md(I.folder+'Propriétaire','dark'),pPriv=md(I.lock+'Privé');
const th=(c,t='img')=>`<div class="th ${c}"><span class="ty">${I[t]}</span></div>`;
const file=(c,n,s,o={})=>`<div class="card ${o.dim?'dim':''}"><div class="th ${c}"><span class="ty">${I[o.t||'img']}</span>${o.ck?'<span class="ck"></span>':''}${o.lock?`<span class="lock" title="Lecture seule">${I.lock}</span>`:''}</div><div class="bd"><div class="grow"><b>${n}</b><small>${s}</small></div><span class="dots">⋮</span></div></div>`;
const fold=(n,sub,o={})=>`<div class="fold ${o.priv?'private':''} ${o.lockd?'lockd':''}">${I.folder}<div class="grow"><b>${n}</b><small>${sub}</small></div><span class="dots">⋮</span></div>`;

/* arbre de dossiers (colonne de gauche) */
function tree(o){
 const on=k=>o.on===k?'on':'';
 const bl=o.admin?`<h5>Tous les dossiers</h5>
   <div class="fn ${on('all')}">${I.users}Par propriétaire</div>
   <div class="fn l1">${I.folder}Alice Martin<small>3</small></div>
   <div class="fn l1">${I.folder}Marc Dupont<small>2</small></div>
   <div class="fn l1">${I.folder}Camille Aubry<small>1</small></div>`
 :`<h5>Mes dossiers<a>+ Nouveau</a></h5>
   <div class="fn ${on('promo')}">${I.folder}Promotions<span class="ic">${I.share}</span></div>
   <div class="fn l1 ${on('ete')}">${I.folder}Été 2026</div>
   <div class="fn l1">${I.folder}Soldes</div>
   <div class="fn">${I.folder}Brouillons<span class="ic">${I.lock}</span></div>
   <h5>Partagés avec moi</h5>
   <div class="fn ${on('s1')}">${I.folder}Identité visuelle<span class="ic">${I.eye}</span></div>
   <div class="fn ${on('s2')}">${I.folder}Événements<span class="ic">${I.edit}</span></div>`;
 return `<div class="ftree"><div class="fn ${on('root')}">${I.img}Médiathèque de l'aire<small>24</small></div>${bl}<div class="fn" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">${I.folder}Sources Drive<small>12</small></div></div>`;
}
const tools=(extra='')=>`<div class="tools"><div class="seg"><span class="on">Tous</span><span>Images</span><span>Vidéos</span></div><div class="search">${I.search}Rechercher dans ce dossier</div>${extra}</div>`;

const V={};

V.rules=()=>`
<div class="head"><div><h1>Dossiers dans la médiathèque</h1><p class="sub">Chaque membre range ses fichiers dans des dossiers, et choisit avec qui les partager. L'administrateur voit et gère tout.</p></div></div>
<div class="cols">
<div class="panel"><h3>Le principe</h3><ul>
<li><b>La médiathèque de l'aire</b> reste telle qu'aujourd'hui : fichiers communs, visibles de tous ceux qui ont l'aire. Rien ne change pour qui ne crée pas de dossier.</li>
<li><b>Un dossier</b> appartient à son créateur et à une aire. Il est <b>privé</b> tant qu'il n'est pas partagé.</li>
<li><b>Partager</b> = ajouter une personne ou un niveau de droits, en <b>Lecture</b> ou en <b>Écriture</b>. Le partage descend dans les sous-dossiers.</li>
<li><b>L'administrateur</b> voit tous les dossiers en écriture, partage, déplace, supprime, reprend la propriété.</li>
<li>Dans <b>Niveaux de droits</b>, une section « Dossiers » donne à tout un niveau : créer des dossiers, ou accès à des dossiers choisis (même donnée que le partage).</li>
</ul></div>
<div class="panel"><h3>Ce que chacun peut faire</h3>
<table class="tbl mx"><tr><th>Action</th><th>Admin</th><th>Proprio</th><th>Écriture</th><th>Lecture</th></tr>
<tr><td>Voir et lire les fichiers</td><td class="y">✓</td><td class="y">✓</td><td class="y">✓</td><td class="y">✓</td></tr>
<tr><td>Utiliser dans une liste</td><td class="y">✓</td><td class="y">✓</td><td class="y">✓</td><td class="y">✓</td></tr>
<tr><td>Téléverser, renommer, déplacer, supprimer des fichiers</td><td class="y">✓</td><td class="y">✓</td><td class="y">✓</td><td class="n">—</td></tr>
<tr><td>Créer un sous-dossier</td><td class="y">✓</td><td class="y">✓</td><td class="y">✓</td><td class="n">—</td></tr>
<tr><td>Renommer / supprimer le dossier</td><td class="y">✓</td><td class="y">✓</td><td class="n">—</td><td class="n">—</td></tr>
<tr><td>Gérer le partage</td><td class="y">✓</td><td class="y">✓</td><td class="n">—</td><td class="n">—</td></tr>
<tr><td>Reprendre la propriété</td><td class="y">✓</td><td class="n">—</td><td class="n">—</td><td class="n">—</td></tr></table></div></div>
<div class="panel"><h3>Règles qui se croisent</h3><ul>
<li><b>Niveau en lecture seule</b> : plafonne tout à « Lecture », même un partage en écriture ; aucun dossier à créer.</li>
<li><b>Plusieurs partages</b> (personne + niveau + dossier parent) : le droit le plus fort s'applique, sauf le plafond ci-dessus.</li>
<li><b>Page Médiathèque</b> : sans elle, aucun dossier visible. Le partage la signale dans la liste.</li>
<li><b>Aire</b> : un dossier vit dans une aire ; on ne partage qu'avec les membres qui voient cette aire (les autres sont grisés avec la raison).</li>
<li><b>Fichier utilisé dans une liste</b> : reste diffusé même si le dossier est retiré à quelqu'un ; la liste le signale (vue 7).</li>
<li><b>Membre désactivé</b> : ses dossiers passent à l'administrateur qui le désactive ; les partages restent.</li>
<li><b>Niveau supprimé</b> : ses partages de dossier disparaissent (avertissement avec le nombre).</li>
<li><b>Fichiers des Drives</b> : restent dans « Sources Drive », communs, non déplaçables en dossier.</li>
<li><b>Option</b> : fonction du mode expert, activable dans Réglages (« Dossiers dans la médiathèque »), éteinte par défaut.</li></ul></div>`;

const stage=document.getElementById('stage'),sb=document.getElementById('sidebar');
const who={rules:'alice',lib:'alice',share:'alice',shared:'alice',admin:'camille',level:'camille',plist:'alice'};
function show(v){
 document.querySelectorAll('#steps button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 stage.innerHTML=V[v](); sb.innerHTML=sidebar(who[v]); window.scrollTo({top:0});
}
document.getElementById('steps').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)});
show('rules');
</script>
