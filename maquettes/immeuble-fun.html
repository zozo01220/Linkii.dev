<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linkii · Immeuble (maquette fun)</title>
<style>
  :root{--ink:#2a2118;--paper:#f4ecdf;--mute:#8a7b68;--orange:#ff7a2f;--bad:#e5384b;--ok:#2f9e5f}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;font:14px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--ink);overflow-x:hidden;
    background:linear-gradient(var(--sky1),var(--sky2));transition:background 1s;--sky1:#9fd3f5;--sky2:#e8f4fb}
  body.night{--sky1:#0d1433;--sky2:#2b2d63}
  .sun,.moon{position:fixed;top:90px;width:70px;height:70px;border-radius:50%;transition:all 1s;z-index:0}
  .sun{left:8%;background:#ffd45c;box-shadow:0 0 60px #ffd45c}
  .moon{right:8%;background:#f3f1e0;box-shadow:0 0 40px #f3f1e0;opacity:0;transform:translateY(60px)}
  body.night .sun{opacity:0;transform:translateY(60px)} body.night .moon{opacity:1;transform:none}
  .cloud{position:fixed;height:26px;width:90px;background:#fff;border-radius:99px;opacity:.85;z-index:0;animation:drift 60s linear infinite}
  body.night .cloud{opacity:.12}
  @keyframes drift{from{left:-120px}to{left:110%}}
  header{position:relative;z-index:3;display:flex;align-items:center;gap:18px;padding:14px 26px}
  .logo{font-weight:800;font-size:21px;letter-spacing:-.5px}.logo i{color:var(--orange);font-style:normal}
  body.night header{color:#fff}
  .pill{background:rgba(255,255,255,.75);border-radius:99px;padding:6px 16px;backdrop-filter:blur(6px);color:var(--ink)}
  .sp{margin-left:auto}

  .wrap{position:relative;z-index:2;display:flex;justify-content:center;padding:10px 20px 150px}
  .building{width:min(880px,100%);position:relative}
  .roof{height:46px;background:#b9553a;clip-path:polygon(4% 100%,12% 0,88% 0,96% 100%);margin:0 -4px}
  .roof::after{content:"";}
  .sign{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--paper);padding:2px 18px;border-radius:6px;font-weight:700;font-size:13px;box-shadow:0 2px 0 #0003}
  .floor{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:0;background:#d9c9ae;border-left:12px solid #8a6e55;border-right:12px solid #8a6e55;border-bottom:10px solid #8a6e55;position:relative;height:150px}
  .floor .lvl{position:absolute;left:-76px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--paper);padding:3px 8px;border-radius:6px;white-space:nowrap}
  body.night .floor .lvl{background:#ffffff22;color:#fff}
  .room{position:relative;border-right:4px solid #8a6e55;background:var(--wall,#f1e4c9);overflow:hidden;cursor:pointer;transition:filter .5s}
  .room:last-child{border-right:0}
  .room::before{content:"";position:absolute;inset:0;background:#0b1030;opacity:var(--dark,0);transition:opacity 1s;pointer-events:none;z-index:4}
  body.night .room{--dark:.55}
  .room:hover{filter:brightness(1.06)} .room.sel{outline:4px solid var(--orange);outline-offset:-4px;z-index:5}
  .room .name{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:600;color:#5a4a38;z-index:3}
  .floorline{position:absolute;left:0;right:0;bottom:0;height:16px;background:#a98b6c}
  .tv{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:62%;height:62px;border-radius:5px;border:4px solid #1b1b1f;display:grid;place-items:center;font-size:30px;z-index:5;transition:background .6s;box-shadow:0 0 22px var(--g,transparent)}
  .tv.off{background:#202026!important;box-shadow:none}
  .tv.off::after{content:"";position:absolute;right:-9px;top:-9px;width:14px;height:14px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .tv .scan{position:absolute;inset:0;background:linear-gradient(transparent 50%,#0001 50%);background-size:100% 4px;pointer-events:none}
  .deco{position:absolute;bottom:16px;font-size:24px;z-index:2}
  .dude{position:absolute;bottom:16px;font-size:22px;z-index:3;animation:walk var(--d) linear infinite alternate}
  @keyframes walk{from{left:4%}to{left:80%}}
  .ground{height:30px;background:#6aa84f;margin:0 -30px;border-radius:0 0 10px 10px}
  body.night .ground{background:#2f5a2e}

  aside{position:fixed;z-index:8;top:0;right:0;bottom:0;width:320px;background:var(--paper);padding:26px 22px;box-shadow:-10px 0 40px #0004;transform:translateX(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1);overflow:auto}
  aside.open{transform:none}
  aside h2{font-size:22px}.x{position:absolute;right:16px;top:12px;cursor:pointer;font-size:18px;color:var(--mute)}
  .chip{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}.chip.ok{background:#d3f0de;color:var(--ok)}.chip.bad{background:#fbd5da;color:var(--bad)}
  .shot{height:140px;border-radius:10px;margin:14px 0;display:grid;place-items:center;font-size:52px;border:4px solid #1b1b1f}
  .slot{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--mute)}
  .slot.now{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 0 #0002}
  .btn{display:block;text-align:center;margin-top:12px;padding:10px;border-radius:10px;background:var(--orange);color:#fff;font-weight:700;cursor:pointer}
  .btn.g{background:transparent;color:var(--ink);border:2px solid #0002}

  .clock{position:fixed;z-index:6;left:50%;bottom:22px;transform:translateX(-50%);width:min(640px,92vw);background:var(--paper);border-radius:22px;padding:14px 22px 12px;box-shadow:0 10px 30px #0004}
  .clock .top{display:flex;justify-content:space-between;align-items:baseline}
  .clock b{font-size:26px;font-variant-numeric:tabular-nums}
  .clock small{color:var(--mute)}
  input[type=range]{width:100%;accent-color:var(--orange);margin-top:6px}
  .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
</style>
</head>
<body>
<div class="sun"></div><div class="moon"></div>
<div class="cloud" style="top:120px"></div><div class="cloud" style="top:200px;animation-delay:-30px;width:130px"></div>

<header>
  <div class="logo">link<i>ii</i></div>
  <div class="pill">🏢 Mon organisation · 11 écrans · <b style="color:var(--bad)">2 hors ligne</b></div>
  <div class="pill sp">🔍 Chercher…</div>
</header>

<div class="wrap"><div class="building" id="b">
  <div class="roof"></div><div class="sign">MON ORGANISATION</div>
</div></div>

<aside id="panel"></aside>

<div class="clock">
  <div class="top"><b id="time">12:00</b><small id="per">Voyagez dans la journée : chaque écran change selon son planning</small></div>
  <input type="range" id="h" min="6" max="22" step="0.25" value="12">
  <div class="ticks"><span>6 h</span><span>9 h</span><span>12 h</span><span>15 h</span><span>18 h</span><span>22 h</span></div>
</div>

<script>
/* contenu par créneau : [matin, midi, après-midi, soir] */
const C={
 acc:["👋","🎬","📰","🌙"], menu:["☕","🍽️","🍰","🔒"], meteo:["⛅","☀️","🌧️","🌙"],
 plan:["📅","📅","📅","🧹"], ann:["📢","🎂","📢","👋"], alerte:["🚨","🚨","🚨","🚨"]
};
const COL={"👋":"#ffb36b","🎬":"#c084fc","📰":"#7dd3fc","🌙":"#334","☕":"#d6a46b","🍽️":"#fbbf24","🍰":"#f9a8d4","🔒":"#556",
 "⛅":"#7dd3fc","☀️":"#fcd34d","🌧️":"#94a3b8","📅":"#67e8f9","🧹":"#a3e635","📢":"#d8b4fe","🎂":"#fda4af","🚨":"#ff6b6b"};
const LABEL={"👋":"Bienvenue","🎬":"Vidéo d'accueil","📰":"Actualités","🌙":"Écran de veille","☕":"Petit-déjeuner","🍽️":"Menu du jour","🍰":"Goûter","🔒":"Fermé",
 "⛅":"Météo","☀️":"Météo","🌧️":"Météo","📅":"Planning des salles","🧹":"Nettoyage","📢":"Annonces","🎂":"Anniversaires","🚨":"Alerte"};
const floors=[
 {lvl:"Étage 2",rooms:[["Salle Mercure","plan",1,"🪴"],["Open space","ann",1,"🖥️"],["Salle Vénus","plan",1,"🪴"],["Détente","ann",0,"🛋️"]]},
 {lvl:"Étage 1",rooms:[["Couloir","acc",1,"🚪"],["Atelier","ann",1,"🛠️"],["Bureau 12","meteo",1,"🌱"]]},
 {lvl:"Rez",rooms:[["Hall d'entrée","acc",1,"🪴"],["Cafétéria","menu",1,"🥐"],["Terrasse","meteo",1,"⛱️"],["Vitrine","acc",0,"🛍️"]]}
];
const b=document.getElementById('b');const tvs=[];
floors.forEach(f=>{
  const el=document.createElement('div');el.className='floor';el.style.setProperty('--n',f.rooms.length);
  el.innerHTML='<span class="lvl">'+f.lvl+'</span>';
  f.rooms.forEach(([n,k,on,deco])=>{
    const r=document.createElement('div');r.className='room';
    r.style.setProperty('--wall',['#f4e6c8','#e9dcc3','#f1e0d0','#e2e8d4'][Math.floor(Math.random()*4)]);
    r.innerHTML='<div class="tv"><span class="ic"></span><i class="scan"></i></div><div class="deco" style="right:10px">'+deco+'</div>'+
     (on?'<div class="dude" style="--d:'+(8+Math.random()*10)+'s;animation-delay:-'+Math.random()*8+'s">'+['🚶','🧑‍💼','🚶‍♀️','🧑‍🍳'][Math.floor(Math.random()*4)]+'</div>':'')+
     '<div class="floorline"></div><span class="name">'+n+'</span>';
    r.onclick=()=>open({n,k,on},r);
    el.appendChild(r);tvs.push({tv:r.querySelector('.tv'),ic:r.querySelector('.ic'),k,on,n});
  });
  b.appendChild(el);
});
b.insertAdjacentHTML('beforeend','<div class="ground"></div>');

const slot=h=>h<11?0:h<14?1:h<18?2:3;
const SLOTN=["Matin · 6 h–11 h","Midi · 11 h–14 h","Après-midi · 14 h–18 h","Soirée · dès 18 h"];
function cur(k,h){return C[k][slot(h)]}
function render(){
  const h=+document.getElementById('h').value;
  document.getElementById('time').textContent=String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)).padStart(2,'0');
  document.getElementById('per').textContent=SLOTN[slot(h)];
  document.body.classList.toggle('night',h<7||h>=19);
  tvs.forEach(o=>{
    const c=cur(o.k,h);o.ic.textContent=o.on?c:'';
    o.tv.classList.toggle('off',!o.on);
    if(o.on){o.tv.style.background=COL[c];o.tv.style.setProperty('--g',COL[c])}
  });
  if(sel)fill(sel.d,h);
}
let sel=null;
function open(d,r){document.querySelectorAll('.room.sel').forEach(x=>x.classList.remove('sel'));r.classList.add('sel');sel={d,r};fill(d,+document.getElementById('h').value);document.getElementById('panel').classList.add('open')}
function fill(d,h){
  const c=cur(d.k,h),s=slot(h);
  document.getElementById('panel').innerHTML='<span class="x" onclick="panel.classList.remove(\'open\');sel&&sel.r.classList.remove(\'sel\');sel=null">✕</span>'+
  '<span class="chip '+(d.on?'ok':'bad')+'">'+(d.on?'● En ligne':'● Hors ligne')+'</span><h2>'+d.n+'</h2>'+
  '<div class="shot" style="background:'+(d.on?COL[c]:'#202026')+'">'+(d.on?c:'📵')+'</div>'+
  '<div style="color:var(--mute);margin-bottom:6px">Planning de la journée</div>'+
  C[d.k].map((x,i)=>'<div class="slot'+(i==s?' now':'')+'"><span>'+SLOTN[i].split(' · ')[0]+'</span><span>'+x+' '+LABEL[x]+'</span></div>').join('')+
  '<div class="btn">Modifier le planning</div><div class="btn g">Paramètres de l’écran</div>';
}
document.getElementById('h').oninput=render;render();
</script>
</body>
</html>
