show_message:
  target:
    entity:
      integration: linkivi
    device:
      integration: linkivi
  fields:
    title:
      example: "Un visiteur est à l'accueil"
      selector:
        text:
    message:
      example: "Merci d'aller l'accueillir"
      selector:
        text:
          multiline: true
    look:
      default: information
      selector:
        select:
          translation_key: look
          options:
            - information
            - attention
    duration:
      default: 30
      selector:
        number:
          min: 5
          max: 3600
          unit_of_measurement: s
          mode: box
    wake:
      default: false
      selector:
        boolean:
    place:
      default: full
      selector:
        select:
          translation_key: place
          options:
            - full
            - banner

clear_display:
  target:
    entity:
      integration: linkivi
    device:
      integration: linkivi
