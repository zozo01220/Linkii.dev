<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkivi</title>
<style>
  html,body{margin:0;height:100%;background:linear-gradient(135deg,#0B1F3A,#12305A);color:#fff;font-family:"IBM Plex Sans","Segoe UI",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vw;text-align:center}
  .wm{display:inline-flex;align-items:baseline;line-height:1;font-size:5vw;font-weight:500;letter-spacing:-.03em}
  .wm .i{display:inline-block;width:.095em;height:.5em;background:currentColor;margin-left:.07em;position:relative}
  .wm .i+.i{margin-left:.1em}
  .wm .i::before{content:"";position:absolute;left:0;top:-.2em;width:.095em;height:.095em;background:currentColor}
  .wm .i.s::before{background:#F2A81D}
  p{margin:0;font-size:2vw;color:#B9CDE3}
  .spin{width:3vw;height:3vw;border:.4vw solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;margin-top:1vw}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="wm" aria-label="Linkivi">link<span class="i"></span>v<span class="i s"></span></div>
  <p>Connexion au serveur impossible. Nouvelle tentative automatique…</p>
  <div class="spin"></div>
</body>
</html>
