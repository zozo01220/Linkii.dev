<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu du plan</title>
<style>
  /* Aperçu de l'éditeur du plan du bâtiment (§196) : le moteur de l'écran (building-view.js) en pleine page, avec le plan non enregistré.
     L'éditeur envoie les données par postMessage ({ type: 'hpl-preview', data }) ; même forme que /api/data pour le widget. */
  html, body { margin: 0; height: 100%; background: #0B1F3A; color: #DDE3EA; font-family: "IBM Plex Sans", system-ui, sans-serif; overflow: hidden; }
  #app { position: absolute; inset: 0; font-size: 16px; }
  .ha-i { flex: none; width: 1.25em; height: 1.25em; fill: none; stroke: #9AAABD; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .wait { position: absolute; inset: 0; display: grid; place-items: center; color: #9AAABD; }
</style>
<link rel="stylesheet" href="haplan.css?v=206">
</head>
<body>
<div id="app" class="widget p-full"><div class="wait">Préparation de l'aperçu…</div></div>
<script src="ha-format.js?v=206"></script>
<script src="building-view.js?v=206"></script>
<script>
(function () {
  'use strict';
  var el = document.getElementById('app'), vb = null;
  window.addEventListener('message', function (ev) {
    if (ev.origin !== location.origin || !ev.data || ev.data.type !== 'hpl-preview') return;
    // une nouvelle forme du plan (options d'affichage comprises) : la vue repart de zéro ; l'aperçu ne commande rien
    if (vb) vb.destroy();
    el.className = 'widget p-full';
    vb = window.LinkiiBuilding.mount(el, { mode: 'signage' });
    vb.setData(ev.data.data);
  });
  if (window.parent !== window) window.parent.postMessage({ type: 'hpl-preview-ready' }, location.origin);
})();
</script>
</body>
</html>
